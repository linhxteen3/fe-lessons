<script type="application/json" id="quiz-data">[{"d": "med", "ans": 5, "q": "Công ty A vận hành trang EC trên **PaaS của công ty B** (dùng DBMS và application server trên PaaS của B) và thuê **công ty C** phát triển/vận hành ứng dụng Web (hợp đồng quy định C xử lý lỗ hổng ứng dụng Web). Công ty D kiểm tra bảo mật chỉ ra 3 lỗi:\n(1) OS của application server có lỗ hổng.\n(2) Ứng dụng web có lỗ hổng XSS.\n(3) DBMS có lỗ hổng.\nChọn tổ hợp đơn vị chịu trách nhiệm xử lý cho (1), (2), (3).", "qJa": "A社のECサイト（B社のPaaS上でDBMS・APサーバを利用、Webアプリ開発運用と脆弱性対策はC社へ委託）で、(1)APサーバOSの脆弱性、(2)XSS脆弱性、(3)DBMSの脆弱性に対処する組織の組合せを選べ。", "opts": ["1: A社 / 2: A社 / 3: A社", "1: A社 / 2: A社 / 3: C社", "1: A社 / 2: B社 / 3: B社", "1: B社 / 2: B社 / 3: B社", "1: B社 / 2: B社 / 3: C社", "1: B社 / 2: C社 / 3: B社", "1: B社 / 2: C社 / 3: C社", "1: C社 / 2: B社 / 3: B社", "1: C社 / 2: B社 / 3: C社", "1: C社 / 2: C社 / 3: B社"], "optsJa": ["1: A社 ／ 2: A社 ／ 3: A社", "1: A社 ／ 2: A社 ／ 3: C社", "1: A社 ／ 2: B社 ／ 3: B社", "1: B社 ／ 2: B社 ／ 3: B社", "1: B社 ／ 2: B社 ／ 3: C社", "1: B社 ／ 2: C社 ／ 3: B社", "1: B社 ／ 2: C社 ／ 3: C社", "1: C社 ／ 2: B社 ／ 3: B社", "1: C社 ／ 2: B社 ／ 3: C社", "1: C社 ／ 2: C社 ／ 3: B社"], "why": "Theo mô hình trách nhiệm chung của **PaaS**: nhà cung cấp PaaS (**B社**) quản lý OS của app server (1) và DBMS (3); phần ứng dụng Web (lỗ hổng XSS ở mục 2) thuộc bên phát triển theo hợp đồng ủy thác (**C社**) → **B社, C社, B社**.", "whyJa": "PaaS の責任共有モデルより、OS（項番1）と DBMS（項番3）は PaaS 提供者の **B社**、Web アプリの XSS 対策（項番2）は委託契約に基づき **C社** が対処します。", "ref": "科目B · 情報セキュリティ（クラウド・PaaS責任共有モデル）", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問17", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "med", "ans": 3, "q": "Công ty A (1.000 nhân viên, 90% phòng phát triển làm việc tại site khách hàng, trước đây chỉ dùng PC chung tại văn phòng A; VPN chỉ cấp cho 50 nhân viên kinh doanh dùng PC công ty) dự định cho phép nhân viên phát triển tại site khách hàng dùng **PC cá nhân (BYOD) kết nối VPN** vào mạng nội bộ. Hai rủi ro nào sau đây sẽ tăng lên hoặc phát sinh mới?\n(一) Lưu lượng VPN tăng mạnh làm suy giảm tính sẵn sàng.\n(二) Nhân viên phát triển làm mất PC của công ty A.\n(三) Nhân viên bấm link phishing làm PC cá nhân nhiễm mã độc.\n(四) Nhân viên hành chính dùng PC cá nhân kết nối VPN.\n(五) PC cá nhân nhiễm mã độc kết nối VPN làm lây lan mã độc vào mạng nội bộ.", "qJa": "客先常駐開発部員に個人所有PC（BYOD）からのVPN接続を許可した場合に増加または新たに生じるリスク二つの組合せを選べ。\n(一) VPN接続増による可用性低下  (二) A社PC紛失  (三) フィッシング感染  (四) 総務部員の個人PC接続  (五) 感染した個人PCから社内NWへ拡散", "opts": ["(一)，(二)", "(一)，(三)", "(一)，(四)", "(一)，(五)", "(二)，(三)", "(二)，(四)", "(二)，(五)", "(三)，(四)", "(三)，(五)", "(四)，(五)"], "optsJa": ["(一)，(二)", "(一)，(三)", "(一)，(四)", "(一)，(五)", "(二)，(三)", "(二)，(四)", "(二)，(五)", "(三)，(四)", "(三)，(五)", "(四)，(五)"], "why": "• (一) Đúng: từ 50 người tăng thêm ~810 người dùng VPN → quá tải, ảnh hưởng **tính sẵn sàng (可用性)**.\n• (五) Đúng: PC cá nhân không do công ty kiểm soát bảo mật kết nối VPN trực tiếp vào mạng nội bộ → nguy cơ **phát tán malware**.\n• (二) Sai vì nhóm này không được cấp A社PC; (三) vốn đã tồn tại trước khi cấp VPN; (四) không cấp quyền cho tổng vụ.", "whyJa": "接続人数が急増する **(一) 可用性の低下** と、管理外の個人PC経由で社内へ感染が広がる **(五) マルウェア拡散リスク** が該当します。", "ref": "科目B · 情報セキュリティ（BYOD・VPNリスク分析）", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問18", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "med", "ans": 3, "q": "Phòng bán hàng Z ủy thác phần nhập đơn hàng sản phẩm Z cho công ty B trên hệ thống J:\n- Chính sách: người nhập và người phê duyệt phải khác nhau; Trưởng phòng Z xem được toàn bộ nghiệp vụ phòng Z.\n- Yêu cầu mới: Nhân viên B nhập đơn → A phê duyệt; Trưởng nhóm B chỉ **xem** kết quả nhập của nhân viên B để báo miệng yêu cầu sửa nếu có lỗi (không nhập, không duyệt).\nTrong bảng phân quyền: hàng `[a1]` chỉ có quyền **Xem (○)**; hàng `[a2]` có quyền **Xem (○) + Nhập (○)**. Chọn `[a1]` và `[a2]` đúng.", "qJa": "Jシステムの操作権限表で、閲覧のみ（○）の [a1] と、閲覧・入力（○・○）の [a2] に該当する利用者の組合せを選べ。", "opts": ["a1: Trưởng phòng bán hàng Z / a2: Trưởng nhóm bán hàng công ty B", "a1: Trưởng phòng bán hàng Z / a2: Nhân viên bán hàng công ty B", "a1: Trưởng nhóm bán hàng công ty B / a2: Trưởng phòng bán hàng Z", "a1: Trưởng nhóm bán hàng công ty B / a2: Nhân viên bán hàng công ty B", "a1: Nhân viên bán hàng công ty B / a2: Trưởng nhóm bán hàng công ty B"], "optsJa": ["a1: Z販売課の販売責任者 ／ a2: 商品ZのB社販売責任者", "a1: Z販売課の販売責任者 ／ a2: 商品ZのB社販売担当者", "a1: 商品ZのB社販売責任者 ／ a2: Z販売課の販売責任者", "a1: 商品ZのB社販売責任者 ／ a2: 商品ZのB社販売担当者", "a1: 商品ZのB社販売担当者 ／ a2: 商品ZのB社販売責任者"], "why": "Nguyên tắc **quyền tối thiểu (最小権限)**:\n• `[a1]` chỉ có quyền Xem → **Trưởng nhóm bán hàng công ty B (商品ZのB社販売責任者)** (chỉ xem kết quả nhập để kiểm tra).\n• `[a2]` có quyền Xem + Nhập (không có Phê duyệt) → **Nhân viên bán hàng công ty B (商品ZのB社販売担当者)**.", "whyJa": "閲覧のみ必要なのが **B社販売責任者 [a1]**、閲覧と入力が必要なのが **B社販売担当者 [a2]**（承認は A社）です。", "ref": "科目B · 情報セキュリティ（アクセス制御・最小権限）", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問19", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "med", "ans": 5, "q": "Nhóm vận hành tường lửa (FW) có 6 nhân viên, hiện cả 6 người đều có toàn quyền (sửa rule FW, xem log thao tác, phê duyệt thao tác) nên **người sửa rule tự kiểm tra và tự phê duyệt luôn**. Kiểm toán nội bộ chỉ ra: \"Chưa phân tách nhiệm vụ phù hợp (職務が適切に分離されていない)\". Biện pháp cải thiện phù hợp nhất để ngăn sửa nhầm rule FW là gì?", "qJa": "FWの運用で「職務が適切に分離されていない」という内部監査の指摘に対し、FWルールの誤った変更を防ぐ最も適切な改善策を選べ。", "opts": ["Cài EDR trên console để tăng cường giám sát", "Thay mật khẩu bằng xác thực đa yếu tố (MFA) khi đăng nhập FW", "Chia nhân viên thành nhóm đăng nhập qua console và nhóm đăng nhập từ xa", "Giới hạn chỉ còn 1 nhân viên vận hành FW duy nhất", "Tách một số nhân viên chỉ có quyền xem log thao tác", "Chia nhân viên thành người sửa rule FW và người kiểm tra log + phê duyệt thao tác, mỗi nhóm chỉ cấp quyền tối thiểu cần thiết", "Phân công nhân viên vận hành theo từng ngày trong tuần"], "optsJa": ["EDRをコンソールに導入し，監視を強化する。", "パスワード認証の代わりに多要素認証を導入する。", "コンソールログイン者とリモートログイン者に分ける。", "FWの運用担当者を1人に限定する。", "一部を操作ログの確認権限だけの者とする。", "FWルールの編集を行う者と，操作ログを確認し操作承認をする者に分け，それぞれに必要最小限の権限を付与する。", "作業を行う運用担当者を曜日ごとに割り当てる。"], "why": "Để thực hiện **Phân tách nhiệm vụ (職務の分離 / Segregation of Duties)** đúng chuẩn, phải tách người thực thi (sửa rule FW) khỏi người kiểm tra & phê duyệt (xem log + phê duyệt thao tác) và chỉ cấp **quyền tối thiểu cần thiết** cho từng vai trò.", "whyJa": "職務分離の基本は「実行者（ルール編集）」と「検証・承認者（ログ確認・操作承認）」を分離し、それぞれに最小権限のみを付与することです。", "ref": "科目B · 情報セキュリティ（内部統制・職務の分離）", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問20", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "med", "ans": 4, "q": "Trang EC của công ty A chạy trên **PaaS của công ty B** (dùng DBMS và app server của B), thuê **công ty C** phát triển & vá lỗ hổng ứng dụng Web. Kiểm tra bảo mật phát hiện 3 lỗi:\n(一) DBMS có lỗ hổng.\n(二) OS của app server có lỗ hổng.\n(三) Chức năng đăng nhập có lỗ hổng lộ dữ liệu thành viên.\nChọn tổ hợp đơn vị xử lý cho (一), (二), (三).", "qJa": "B社のPaaS上で稼働しC社へWebアプリ開発・脆弱性対策を委託するA社ECサイトで、(一)DBMS脆弱性、(二)APサーバOS脆弱性、(三)ログイン機能脆弱性に対処する組織の組合せを選べ。", "opts": ["(一) A社 / (二) A社 / (三) A社", "(一) A社 / (二) A社 / (三) C社", "(一) A社 / (二) B社 / (三) B社", "(一) B社 / (二) B社 / (三) B社", "(一) B社 / (二) B社 / (三) C社", "(一) B社 / (二) C社 / (三) B社", "(一) B社 / (二) C社 / (三) C社", "(一) C社 / (二) B社 / (三) B社", "(一) C社 / (二) B社 / (三) C社", "(一) C社 / (二) C社 / (三) B社"], "optsJa": ["(一) A社 ／ (二) A社 ／ (三) A社", "(一) A社 ／ (二) A社 ／ (三) C社", "(一) A社 ／ (二) B社 ／ (三) B社", "(一) B社 ／ (二) B社 ／ (三) B社", "(一) B社 ／ (二) B社 ／ (三) C社", "(一) B社 ／ (二) C社 ／ (三) B社", "(一) B社 ／ (二) C社 ／ (三) C社", "(一) C社 ／ (二) B社 ／ (三) B社", "(一) C社 ／ (二) B社 ／ (三) C社", "(一) C社 ／ (二) C社 ／ (三) B社"], "why": "Với mô hình **PaaS**: nhà cung cấp PaaS (**B社**) quản lý nền tảng gồm DBMS `(一)` và OS của app server `(二)`. Còn chức năng đăng nhập `(三)` thuộc mã nguồn ứng dụng Web nên do bên được ủy thác (**C社**) xử lý → **B社, B社, C社**.", "whyJa": "PaaS の責任共有モデルより、DBMS（一）と OS（二）は PaaS 提供者の **B社**、Web アプリのログイン機能（三）は開発委託先の **C社** が対応します。", "ref": "科目B · 情報セキュリティ（PaaS責任共有）", "source": "IPA 科目B サンプル問題 (2022-04-25) · 問6", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/ps6vr7000000oett-att/fe_kamoku_b_sample.pdf"}, {"d": "med", "ans": 0, "q": "Công ty A thuê công ty C scan hồ sơ ứng viên bằng máy đa chức năng. Khi file PDF lớn, máy tự lưu lên server B (cần ID/mật khẩu nhân viên) và gửi email chứa đường link tới nhân viên vừa scan. Kiểm tra phát hiện máy scan để **mặc định (初期設定)** địa chỉ người gửi, tiêu đề, nội dung email (thông tin mặc định này được hãng công khai trên web). Rủi ro bảo mật nào khiến công ty A yêu cầu phải đổi cài đặt mặc định?", "qJa": "複合機のスキャン通知メールの差出人・件名・本文がベンダー公開の初期設定のままであることについて、A社が対策が必要と評価した情報セキュリティリスクはどれか。", "opts": ["Nhân viên phụ trách nghiệp vụ B tin nhầm email giả mạo từ kẻ tấn công là email của máy scan, bấm vào URL bị dẫn tới trang phishing → lộ tài khoản/thông tin cá nhân ứng viên của công ty A.", "Nhân viên nhầm email máy scan là spam rồi xóa mất → phải scan lại gây chậm tiến độ.", "Kẻ tấn công nghe lén email, mã hóa file đính kèm đòi tiền chuộc ransomware.", "Kẻ tấn công nghe lén email rồi dùng trực tiếp URL trong email truy cập vào server B lấy dữ liệu."], "optsJa": ["従業員が攻撃者からの電子メールを複合機からのものと信じてURLをクリックし、フィッシングサイトに誘導され、A社の採用予定者の個人情報が漏えいする。", "従業員が複合機からのメールをスパムと誤認して削除し、業務が遅延する。", "攻撃者がメールを盗聴して添付ファイルを暗号化し、身代金を要求する。", "攻撃者がメールを盗聴し、本文のURLを使ってBサーバにアクセスし個人情報が漏えいする。"], "why": "Vì mẫu email mặc định được công khai trên web của hãng, kẻ tấn công dễ dàng gửi email **giả mạo giống hệt máy scan** có gắn link phishing để đánh lừa nhân viên C nhập ID/mật khẩu server B → rò rỉ dữ liệu ứng viên của A! (Đáp án D sai vì server B ở mạng nội bộ và cần ID/mật khẩu riêng).", "whyJa": "初期設定が公開されているため攻撃者が複合機になりすましたフィッシングメールを容易に作成でき、URLクリックによる認証情報・個人情報漏えいにつながるリスク（ア）が最も適切です。", "ref": "科目B · 情報セキュリティ（フィッシング・初期設定変更）", "source": "IPA 令和5年度 (2023) 科目B 公開問題 · 問6", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/t6hhco0000003zx0-att/2023r05_fe_kamoku_b_qs.pdf"}, {"d": "med", "ans": 2, "q": "Công ty A dùng 2 dịch vụ SaaS (groupware & họp online), trước đây chỉ cho phép đăng nhập bằng ID/mật khẩu từ mạng nội bộ (nhân viên làm việc tại nhà phải remote desktop vào PC công ty). Do mạng công ty bị nghẽn, công ty đổi cấu hình cho phép nhân viên làm việc từ xa **kết nối thẳng ra SaaS từ bên ngoài** không qua mạng nội bộ. Để giảm rủi ro truy cập trái phép vào SaaS tăng lên, biện pháp nào phù hợp nhất?", "qJa": "テレワーク時に社内NWを介さずクラウドサービスへ直接接続できるように変更する際、不正アクセスリスクを低減する最も適切な対策はどれか。", "opts": ["Giám sát lưu lượng từ mạng nội bộ công ty A tới dịch vụ đám mây.", "Giới hạn tốc độ mạng giữa mạng nội bộ và dịch vụ đám mây.", "Áp dụng xác thực 2 yếu tố (2FA) khi đăng nhập dịch vụ đám mây từ bên ngoài công ty A.", "Chỉ cho phép kết nối trực tiếp tới riêng groupware.", "Tắt tính năng cấm lưu file của phần mềm remote desktop."], "optsJa": ["A社の社内ネットワークからクラウドサービスへの通信を監視する。", "社内ネットワークとクラウドサービス間の通信速度を制限する。", "クラウドサービスにA社外から接続する際の認証に2要素認証を導入する。", "グループウェアだけを直接接続の対象とする。", "専用アプリの保存禁止機能を無効にする。"], "why": "Trước đây SaaS có thêm lớp bảo vệ là \"chỉ cho phép truy cập từ IP mạng nội bộ công ty\". Khi gỡ bỏ giới hạn IP để nhân viên truy cập thẳng từ Internet mà chỉ dùng ID + mật khẩu thì rất dễ bị tấn công dò/đánh cắp mật khẩu → cần bổ sung **xác thực 2 yếu tố (2FA / 2要素認証)** khi kết nối từ bên ngoài!", "whyJa": "社内ネットワーク限定というアクセス制限を外すことで外部からの不正ログインリスクが高まるため、社外接続時に **2要素認証を導入する（ウ）** のが適切です。", "ref": "科目B · 情報セキュリティ（テレワーク・SaaS認証強化）", "source": "IPA 令和6年度 (2024) 科目B 公開問題 · 問6", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/eid2eo0000007g1d-att/2024r06_fe_kamoku_b_qs.pdf"}, {"d": "hard", "ans": 7, "q": "File server của công ty A backup băng từ: **Full backup** lúc 2:00 sáng Thứ 7 (restore mất **4 giờ**), **Incremental backup (tăng dần)** lúc 2:00 sáng Thứ 3 và Thứ 5 (mỗi bản restore mất **0.25 giờ**). Yêu cầu **RPO = 72 giờ**, RTO = 120 giờ. Hệ thống ISMS do **CISO** đứng đầu.\nĐiền 3 mục báo cáo kiểm toán:\n• `[a1]`: Nếu sự cố xảy ra trưa Thứ 6 (12:00), ít nhất phải khôi phục được dữ liệu tại thời điểm nào (theo RPO 72h)?\n• `[a2]`: Nếu sự cố xảy ra trưa Thứ 5 mất toàn bộ dữ liệu, tổng thời gian restore dự kiến là bao nhiêu giờ?\n• `[a3]`: Ai là người phê duyệt kế hoạch duy trì ICT?", "qJa": "RPO 72時間、土曜フル（リストア4h）・火木増分（各0.25h）のバックアップ運用とISMS体制について、[a1] 金曜正午障害時の最低復元時点、[a2] 木曜正午全消失時のリストア時間、[a3] ICT継続計画書の承認者の組合せを選べ。", "opts": ["a1: Trưa Thứ 2 / a2: 4.25h / a3: CISO", "a1: Trưa Thứ 2 / a2: 4.25h / a3: Nhân viên IT", "a1: Trưa Thứ 2 / a2: 4.25h / a3: Trưởng kiểm toán nội bộ", "a1: Trưa Thứ 2 / a2: 4.50h / a3: CISO", "a1: Trưa Thứ 2 / a2: 4.50h / a3: Nhân viên IT", "a1: Trưa Thứ 3 / a2: 4.25h / a3: Nhân viên IT", "a1: Trưa Thứ 3 / a2: 4.25h / a3: Trưởng kiểm toán nội bộ", "a1: Trưa Thứ 3 / a2: 4.50h / a3: CISO", "a1: Trưa Thứ 3 / a2: 4.50h / a3: Nhân viên IT", "a1: Trưa Thứ 3 / a2: 4.50h / a3: Trưởng kiểm toán nội bộ"], "optsJa": ["a1: 月曜日の正午 ／ a2: 4.25 ／ a3: CISO", "a1: 月曜日の正午 ／ a2: 4.25 ／ a3: 情報システム部の担当者", "a1: 月曜日の正午 ／ a2: 4.25 ／ a3: 内部監査室長", "a1: 月曜日の正午 ／ a2: 4.50 ／ a3: CISO", "a1: 月曜日の正午 ／ a2: 4.50 ／ a3: 情報システム部の担当者", "a1: 火曜日の正午 ／ a2: 4.25 ／ a3: 情報システム部の担当者", "a1: 火曜日の正午 ／ a2: 4.25 ／ a3: 内部監査室長", "a1: 火曜日の正午 ／ a2: 4.50 ／ a3: CISO", "a1: 火曜日の正午 ／ a2: 4.50 ／ a3: 情報システム部の担当者", "a1: 火曜日の正午 ／ a2: 4.50 ／ a3: 内部監査室長"], "why": "• `[a1]`: RPO = 72 giờ = đúng **3 ngày**. Lùi 3 ngày từ trưa Thứ 6 → **Trưa Thứ 3 (火曜日の正午)**.\n• `[a2]`: Trưa Thứ 5 mất hết dữ liệu → cần khôi phục bản Full Thứ 7 (**4h**) + Tăng dần Thứ 3 (**0.25h**) + Tăng dần sáng Thứ 5 (**0.25h**) = **`4.50` giờ**.\n• `[a3]`: Người có thẩm quyền phê duyệt kế hoạch duy trì ICT trong ISMS là **CISO** (không phải nhân viên vận hành hay kiểm toán viên nội bộ).", "whyJa": "①金曜正午の72時間(3日)前は **火曜日の正午**、②木曜正午障害時はフル(4h)＋火曜増分(0.25h)＋木曜増分(0.25h)＝ **4.50時間**、③計画書の承認者は **CISO** です。", "ref": "科目B · 情報セキュリティ（BCP・RPO・増分バックアップ・ISMS）", "source": "IPA 令和7年度 (2025) 科目B 公開問題 · 問6", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/tbl5kb0000005r9r-att/2025r07_fe_kamoku_b_qs.pdf"}, {"d": "med", "ans": 8, "q": "Phòng kinh doanh dùng file server nội bộ **Y** (mọi nhân viên kinh doanh đều sửa được mọi file trên Y) và dịch vụ đám mây **Z**. Quy tắc quản lý log **Điều 3 (Quản lý truy cập log)** quy định:\n- Chỉ người phụ trách vận hành mới được truy cập log.\n- Nếu export log ra file server phòng ban thì chỉ người phụ trách vận hành mới được truy cập.\n- Phải có **nhiều người** (từ 2 trở lên) phụ trách vận hành.\n- Đăng nhập quản trị dùng 2FA.\nTrong 4 tình trạng vi phạm sau, **những mục nào vi phạm Điều 3**?\n(一) Log tự ghi đè khi đầy dung lượng.\n(二) Trước có 2 người vận hành (C và D), D vừa nghỉ việc nên hiện chỉ còn mình C.\n(三) Thời gian log ghi theo múi giờ UTC (không phải JST).\n(四) Cuối tháng export toàn bộ log lưu lên server Y (nơi mọi nhân viên kinh doanh đều truy cập/sửa được).", "qJa": "クラウドサービスのログ管理ルール「3. ログのアクセス管理」（運用担当者のみアクセス可・ファイルサーバ保管時も運用担当者のみ・運用担当者は複数名・2要素認証）に違反している運用だけを全て挙げた組合せを選べ。\n(一) 空き容量不足で上書き  (二) 運用担当者がC主任1名のみ  (三) UTC記録  (四) 全営業部員が編集可能なYサーバにログ保管", "opts": ["(一)，(二)", "(一)，(二)，(三)", "(一)，(二)，(四)", "(一)，(三)", "(一)，(三)，(四)", "(一)，(四)", "(二)，(三)", "(二)，(三)，(四)", "(二)，(四)", "(三)，(四)"], "optsJa": ["(一)，(二)", "(一)，(二)，(三)", "(一)，(二)，(四)", "(一)，(三)", "(一)，(三)，(四)", "(一)，(四)", "(二)，(三)", "(二)，(三)，(四)", "(二)，(四)", "(三)，(四)"], "why": "Đối chiếu từng mục với **Điều 3 (Quản lý truy cập log)**:\n• `(一)` vi phạm Điều 4 (thời gian lưu 1 năm), không phải Điều 3.\n• `(二)` **Vi phạm Điều 3** (chỉ còn 1 người vận hành thay vì nhiều người).\n• `(三)` vi phạm Điều 2 (mục ghi log phải là giờ JST), không phải Điều 3.\n• `(四)` **Vi phạm Điều 3** (lưu log lên server Y mà mọi nhân viên kinh doanh đều xem/sửa được, trái quy định \"chỉ người phụ trách vận hành được truy cập\").\nVậy đáp án đúng là **`(二), (四)`**.", "whyJa": "(一)はルール4（保存期間）、(三)はルール2（ログ項目）の違反。ルール3（アクセス管理）違反は、単独運用になっている **(二)** と一般社員も編集可能なYサーバに保管している **(四)** です。", "ref": "科目B · 情報セキュリティ（クラウドログ管理・アクセス制御）", "source": "IPA 令和8年度 (2026) 科目B 公開問題 · 問6", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/rcu1hd0000012qj6-att/2026r08_fe_kamoku_b_qs.pdf"}]</script>
