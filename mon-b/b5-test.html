 と、閲覧・入力（○・○）の [a2] に該当する利用者の組合せを選べ。", "opts": ["a1: Trưởng phòng bán hàng Z / a2: Trưởng nhóm bán hàng công ty B", "a1: Trưởng phòng bán hàng Z / a2: Nhân viên bán hàng công ty B", "a1: Trưởng nhóm bán hàng công ty B / a2: Trưởng phòng bán hàng Z", "a1: Trưởng nhóm bán hàng công ty B / a2: Nhân viên bán hàng công ty B", "a1: Nhân viên bán hàng công ty B / a2: Trưởng nhóm bán hàng công ty B"], "optsJa": ["a1: Z販売課の販売責任者 ／ a2: 商品ZのB社販売責任者", "a1: Z販売課の販売責任者 ／ a2: 商品ZのB社販売担当者", "a1: 商品ZのB社販売責任者 ／ a2: Z販売課の販売責任者", "a1: 商品ZのB社販売責任者 ／ a2: 商品ZのB社販売担当者", "a1: 商品ZのB社販売担当者 ／ a2: 商品ZのB社販売責任者"], "why": "Nguyên tắc **quyền tối thiểu (最小権限)**:\n• `[a1]` chỉ có quyền Xem → **Trưởng nhóm bán hàng công ty B (商品ZのB社販売責任者)** (chỉ xem kết quả nhập để kiểm tra).\n• `[a2]` có quyền Xem + Nhập (không có Phê duyệt) → **Nhân viên bán hàng công ty B (商品ZのB社販売担当者)**.", "whyJa": "閲覧のみ必要なのが **B社販売責任者 [a1]**、閲覧と入力が必要なのが **B社販売担当者 [a2]**（承認は A社）です。", "ref": "科目B · 情報セキュリティ（アクセス制御・最小権限）", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問19", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "med", "ans": 5, "q": "Nhóm vận hành tường lửa (FW) có 6 nhân viên, hiện cả 6 người đều có toàn quyền (sửa rule FW, xem log thao tác, phê duyệt thao tác) nên **người sửa rule tự kiểm tra và tự phê duyệt luôn**. Kiểm toán nội bộ chỉ ra: \"Chưa phân tách nhiệm vụ phù hợp (職務が適切に分離されていない)\". Biện pháp cải thiện phù hợp nhất để ngăn sửa nhầm rule FW là gì?", "qJa": "FWの運用で「職務が適切に分離されていない」という内部監査の指摘に対し、FWルールの誤った変更を防ぐ最も適切な改善策を選べ。", "opts": ["Cài EDR trên console để tăng cường giám sát", "Thay mật khẩu bằng xác thực đa yếu tố (MFA) khi đăng nhập FW", "Chia nhân viên thành nhóm đăng nhập qua console và nhóm đăng nhập từ xa", "Giới hạn chỉ còn 1 nhân viên vận hành FW duy nhất", "Tách một số nhân viên chỉ có quyền xem log thao tác", "Chia nhân viên thành người sửa rule FW và người kiểm tra log + phê duyệt thao tác, mỗi nhóm chỉ cấp quyền tối thiểu cần thiết", "Phân công nhân viên vận hành theo từng ngày trong tuần"], "optsJa": ["EDRをコンソールに導入し，監視を強化する。", "パスワード認証の代わりに多要素認証を導入する。", "コンソールログイン者とリモートログイン者に分ける。", "FWの運用担当者を1人に限定する。", "一部を操作ログの確認権限だけの者とする。", "FWルールの編集を行う者と，操作ログを確認し操作承認をする者に分け，それぞれに必要最小限の権限を付与する。", "作業を行う運用担当者を曜日ごとに割り当てる。"], "why": "Để thực hiện **Phân tách nhiệm vụ (職務の分離 / Segregation of Duties)** đúng chuẩn, phải tách người thực thi (sửa rule FW) khỏi người kiểm tra & phê duyệt (xem log + phê duyệt thao tác) và chỉ cấp **quyền tối thiểu cần thiết** cho từng vai trò.", "whyJa": "職務分離の基本は「実行者（ルール編集）」と「検証・承認者（ログ確認・操作承認）」を分離し、それぞれに最小権限のみを付与することです。", "ref": "科目B · 情報セキュリティ（内部統制・職務の分離）", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問20", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}]</script>
