けを実行します。15 のような 3 と 5 の公倍数を正しく判定するため、最初に **[a] = 3 と 5** を判定する必要があります。", "ref": "科目B · 選択処理（if / elseif の評価順序）", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問2", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "easy", "ans": 3, "q": "Hàm `gcd(num1, num2)` tìm ước chung lớn nhất bằng cách lặp trừ số nhỏ hơn khỏi số lớn hơn cho đến khi `x = y`. Chọn tổ hợp đúng cho `[a]`, `[b]`, `[c]`.", "qJa": "最大公約数を求める関数 gcd のプログラム中の [a] ～ [c] に入れる正しい組合せを選べ。", "code": "○整数型: gcd(整数型: num1, 整数型: num2)\n  整数型: x ← num1\n  整数型: y ← num2\n  [a]\n    if ([b])\n      x ← x － y\n    else\n      y ← y － x\n    endif\n  [c]\n  return x", "opts": ["a: if (x ≠ y) / b: x ＜ y / c: endif", "a: if (x ≠ y) / b: x ＞ y / c: endif", "a: while (x ≠ y) / b: x ＜ y / c: endwhile", "a: while (x ≠ y) / b: x ＞ y / c: endwhile"], "optsJa": ["a: if (x ≠ y) ／ b: x ＜ y ／ c: endif", "a: if (x ≠ y) ／ b: x ＞ y ／ c: endif", "a: while (x ≠ y) ／ b: x ＜ y ／ c: endwhile", "a: while (x ≠ y) ／ b: x ＞ y ／ c: endwhile"], "why": "Cần lặp đến khi `x = y` nên `[a] = while (x ≠ y)` và `[c] = endwhile`. Trong nhánh `if ([b])` thực hiện `x ← x - y`, nên phải là khi `x > y` → **[b] = x ＞ y**.", "whyJa": "x と y が等しくなるまで繰り返すため while (x ≠ y) 〜 endwhile を使います。x ← x − y を実行する条件は **x ＞ y** です。", "ref": "科目B · 繰返し処理（while）・ユークリッドの互除法", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問4", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "easy", "ans": 4, "q": "Hàm `calc(x, y)` nhận 2 số thực dương `x, y` và trả về căn bậc hai √(x² + y²), sử dụng hàm `pow(a, b)` (tính lũy thừa aᵇ). Chọn biểu thức điền vào `[a]`.", "qJa": "正の実数 x と y から √(x²＋y²) を返す関数 calc の [a] に入れる正しい式を選べ（pow(a, b) は a の b 乗）。", "code": "○実数型: calc(実数型: x, 実数型: y)\n  return [a]", "opts": ["(pow(x, 2) ＋ pow(y, 2)) ÷ pow(2, 0.5)", "(pow(x, 2) ＋ pow(y, 2)) ÷ pow(x, y)", "pow(2, pow(x, 0.5)) ＋ pow(2, pow(y, 0.5))", "pow(pow(pow(2, x), y), 0.5)", "pow(pow(x, 2) ＋ pow(y, 2), 0.5)", "pow(x, 2) × pow(y, 2) ÷ pow(x, y)", "pow(x, y) ÷ pow(2, 0.5)"], "optsJa": ["(pow(x, 2) ＋ pow(y, 2)) ÷ pow(2, 0.5)", "(pow(x, 2) ＋ pow(y, 2)) ÷ pow(x, y)", "pow(2, pow(x, 0.5)) ＋ pow(2, pow(y, 0.5))", "pow(pow(pow(2, x), y), 0.5)", "pow(pow(x, 2) ＋ pow(y, 2), 0.5)", "pow(x, 2) × pow(y, 2) ÷ pow(x, y)", "pow(x, y) ÷ pow(2, 0.5)"], "why": "Chia nhỏ biểu thức √(x² + y²) thành 3 bước dùng hàm `pow(cơ_số, số_mũ)`:\n• Bước 1: `x²` viết là `pow(x, 2)` và `y²` viết là `pow(y, 2)`.\n• Bước 2: Cộng hai bình phương lại: `pow(x, 2) ＋ pow(y, 2)`.\n• Bước 3: Lấy căn bậc hai của một số chính là mũ `0.5` (vì √A = A^(1/2) = A^0.5, ví dụ: 9^0.5 = 3).\nGhép lại ta được: **`pow(pow(x, 2) ＋ pow(y, 2), 0.5)`**.", "whyJa": "平方根は 0.5 乗（1/2乗）なので、x² + y² = pow(x, 2) ＋ pow(y, 2) の 0.5 乗をとる **pow(pow(x, 2) ＋ pow(y, 2), 0.5)** が正解です。", "ref": "科目B · 関数の呼出しと数式表現", "source": "IPA 科目B サンプル問題（20問）セット (2022-12-26) · 問5", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/henkou/2022/gmcbt80000007cfs-att/fe_kamoku_b_set_sample_qs.pdf"}, {"d": "easy", "ans": 5, "q": "Giá vé vào cổng: 0–3 tuổi là 100 yên, 4–9 tuổi là 300 yên, từ 10 tuổi trở lên là 500 yên. Chọn điều kiện điền vào `[a]` trong hàm `fee(age)`.", "qJa": "入場料（0〜3歳：100円、4〜9歳：300円、10歳以上：500円）を返す関数 fee の [a] に入れる正しい条件を選べ。", "code": "○整数型: fee(整数型: age)\n  整数型: ret\n  if (age が 3 以下)\n    ret ← 100\n  elseif ([a])\n    ret ← 300\n  else\n    ret ← 500\n  endif\n  return ret", "opts": ["(age ≥ 4) and (age < 9)", "(age = 4) or (age = 9)", "(age > 4) and (age ≤ 9)", "age ≥ 4", "age > 4", "age ≤ 9", "age < 9"], "optsJa": ["(age が 4 以上) and (age が 9 より小さい)", "(age が 4 と等しい) or (age が 9 と等しい)", "(age が 4 より大きい) and (age が 9 以下)", "age が 4 以上", "age が 4 より大きい", "age が 9 以下", "age が 9 より小さい"], "why": "Nhánh `if (age ≤ 3)` đã lọc hết 0–3 tuổi rồi. Khi chạy xuống `elseif`, chắc chắn `age ≥ 4`. Vì vậy chỉ cần kiểm tra thêm `age ≤ 9` là bao phủ trọn vẹn 4–9 tuổi!", "details": ["Mẹo: A bỏ sót 9 tuổi (vì `< 9`), C bỏ sót 4 tuổi (vì `> 4`), D sẽ gom luôn cả 10 tuổi trở lên vào 300 yên."], "whyJa": "最初の if で 3 歳以下は処理済みなので、elseif では 4 歳以上が確定しています。よって **age が 9 以下** だけで 4〜9 歳を表せます。", "ref": "科目B · 選択処理（境界条件）", "source": "IPA 科目B サンプル問題 (2022-04-25) · 問1", "sourceUrl": "https://www.ipa.go.jp/shiken/syllabus/ps6vr7000000oett-att/fe_kamoku_b_sample.pdf"}, {"d": "easy", "ans": 7, "q": "Khi gọi thủ tục `proc2()` trong đoạn chương trình dưới đây, các ký tự được xuất ra theo thứ tự nào?", "qJa": "次のプログラムにおいて，手続 proc2 を呼び出したときの出力順を選べ。", "code": "○proc1()\n  \"A\" を出力する\n  proc3()\n\n○proc2()\n  proc3()\n  \"B\" を出力する\n  proc1()\n\n○proc3()\n  \"C\" を出力する", "opts": ["“A”，“B”，“B”，“C”", "“A”，“C”", "“A”，“C”，“B”，“C”", "“B”，“A”，“B”，“C”", "“B”，“C”，“B”，“A”", "“C”，“B”", "“C”，“B”，“A”", "“C”，“B”，“A”，“C”"], "optsJa": ["“A”，“B”，“B”，“C”", "“A”，“C”", "“A”，“C”，“B”，“C”", "“B”，“A”，“B”，“C”", "“B”，“C”，“B”，“A”", "“C”，“B”", "“C”，“B”，“A”", "“C”，“B”，“A”，“C”"], "why": "Lần theo từng bước từ `proc2()`:\n1. Gọi `proc3()` → xuất **\"C\"**.\n2. Xuất **\"B\"**.\n3. Gọi `proc1()` → xuất **\"A\"**, rồi gọi `proc3()` → xuất **\"C\"**.\nKết quả đầy đủ: **\"C\", \"B\", \"A\", \"C\"**.", "whyJa": "proc2 → proc3(C出力) → B出力 → proc1(A出力 → proc3(C出力)) の順に実行されるため **“C”，“B”，“A”，“C”** です。", "ref": "科目B · 手続の呼出しトレース", "source": "IPA 令和5年度 (2023) 科目B 公開問題 · 問2", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/t6hhco0000003zx0-att/2023r05_fe_kamoku_b_qs.pdf"}, {"d": "easy", "ans": 1, "q": "Hàm `maximum(x, y, z)` nhận 3 số nguyên khác nhau và trả về số lớn nhất. Chọn điều kiện điền vào `[a]`.", "qJa": "異なる三つの整数 x, y, z の最大値を返す関数 maximum の [a] に入れる正しい条件を選べ。", "code": "○整数型: maximum(整数型: x, 整数型: y, 整数型: z)\n  if ([a])\n    return x\n  elseif (y ＞ z)\n    return y\n  else\n    return z\n  endif", "opts": ["x ＞ y", "x ＞ y and x ＞ z", "x ＞ y and y ＞ z", "x ＞ z", "x ＞ z and z ＞ y", "z ＞ y"], "optsJa": ["x ＞ y", "x ＞ y and x ＞ z", "x ＞ y and y ＞ z", "x ＞ z", "x ＞ z and z ＞ y", "z ＞ y"], "why": "Để trả về `x` ngay ở nhánh `if`, `x` phải lớn hơn **cả `y` lẫn `z`** → **`x ＞ y and x ＞ z`**. (Nếu chỉ viết `x > y` thì khi `x=5, y=2, z=9` sẽ trả sai là 5; còn nếu `x` không phải lớn nhất thì nhánh `elseif (y > z)` so sánh hai số còn lại `y` và `z` là đủ).", "whyJa": "x が最大である条件は y と z の両方より大きいこと、つまり **x ＞ y and x ＞ z** です。", "ref": "科目B · 論理演算と最大値判定", "source": "IPA 令和6年度 (2024) 科目B 公開問題 · 問1", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/eid2eo0000007g1d-att/2024r06_fe_kamoku_b_qs.pdf"}, {"d": "easy", "ans": 3, "q": "Hàm `convDecimal(binary)` đổi chuỗi nhị phân không dấu (vd: `\"10010\"`) sang số nguyên hệ 10 (`18`). Hàm `int(c)` đổi ký tự `'0'`/`'1'` thành số `0`/`1`. Chọn biểu thức điền vào `[a]`.", "qJa": "2進文字列を10進整数に変換する関数 convDecimal（例：\"10010\" → 18）の [a] に入れる式を選べ。", "code": "○整数型: convDecimal(文字列型: binary)\n  整数型: i, length, result ← 0\n  length ← binaryの文字数\n  for (i を 1 から length まで 1 ずつ増やす)\n    result ← [a]\n  endfor\n  return result", "opts": ["result ＋ int(ký tự thứ (length － i ＋ 1) của binary)", "result ＋ int(ký tự thứ i của binary)", "result × 2 ＋ int(ký tự thứ (length － i ＋ 1) của binary)", "result × 2 ＋ int(ký tự thứ i của binary)"], "optsJa": ["result ＋ int(binary の (length － i ＋ 1)文字目の文字)", "result ＋ int(binary の i文字目の文字)", "result × 2 ＋ int(binary の (length － i ＋ 1)文字目の文字)", "result × 2 ＋ int(binary の i文字目の文字)"], "why": "Đọc từ trái sang phải (từ bit lớn nhất tới bit nhỏ nhất, tức ký tự thứ `i`): mỗi lần thêm 1 bit bên phải, giá trị hiện tại nhân đôi rồi cộng bit mới!\nThử với `\"10010\"`:\n• i=1 ('1'): `0×2 + 1 = 1`\n• i=2 ('0'): `1×2 + 0 = 2`\n• i=3 ('0'): `2×2 + 0 = 4`\n• i=4 ('1'): `4×2 + 1 = 9`\n• i=5 ('0'): `9×2 + 0 = 18` (khớp hoàn toàn!).", "whyJa": "上位桁（1文字目）から順に `result × 2 ＋ int(i文字目)` を繰り返すホーナー法で 10進数へ変換できます。", "ref": "科目B · 基数変換のアルゴリズム", "source": "IPA 令和6年度 (2024) 科目B 公開問題 · 問2", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/eid2eo0000007g1d-att/2024r06_fe_kamoku_b_qs.pdf"}, {"d": "med", "ans": 5, "q": "Hàm `function1(n, m)` đếm số bội của 4 từ `n` đến `m` bằng cách kiểm tra từng số một. Hàm `function2(n, m)` tối ưu hơn: trước tiên tìm bội của 4 đầu tiên `tempN ≥ n`, rồi nhảy bước 4 để đếm. Chọn tổ hợp đúng cho `[a]` và `[b]`.", "qJa": "n から m までの 4 の倍数の個数を数える function1 と同じ結果を返す function2 の [a] と [b] の組合せを選べ。", "code": "○整数型: function2(整数型: n, 整数型: m)\n  整数型: count ← 0, tempN ← n, i, j\n  for ([a])\n    if ((tempN mod 4) が 0 と等しい)\n      繰返し処理を終了する\n    endif\n    tempN ← tempN ＋ 1\n  endfor\n  for ([b])\n    count ← count ＋ 1\n  endfor\n  return count", "opts": ["a: i từ 1 đến 2 (tăng 1) / b: j từ n, không quá m, tăng tempN", "a: i từ 1 đến 2 (tăng 1) / b: j từ tempN đến m (tăng 1)", "a: i từ 1 đến 2 (tăng 1) / b: j từ tempN, không quá m, tăng 4", "a: i từ 1 đến 3 (tăng 1) / b: j từ n, không quá m, tăng tempN", "a: i từ 1 đến 3 (tăng 1) / b: j từ tempN đến m (tăng 1)", "a: i từ 1 đến 3 (tăng 1) / b: j từ tempN, không quá m, tăng 4"], "optsJa": ["a: iを1から2まで1ずつ増やす ／ b: jをnから始めてmを超えない範囲でtempNずつ増やす", "a: iを1から2まで1ずつ増やす ／ b: jをtempNからmまで1ずつ増やす", "a: iを1から2まで1ずつ増やす ／ b: jをtempNから始めてmを超えない範囲で4ずつ増やす", "a: iを1から3まで1ずつ増やす ／ b: jをnから始めてmを超えない範囲でtempNずつ増やす", "a: iを1から3まで1ずつ増やす ／ b: jをtempNからmまで1ずつ増やす", "a: iを1から3まで1ずつ増やす ／ b: jをtempNから始めてmを超えない範囲で4ずつ増やす"], "why": "• Từ một số bất kỳ `n`, nếu `n mod 4 = 1` (vd: `n = 5`) thì cần cộng thêm **tối đa 3 lần** (`5 → 6 → 7 → 8`) mới tới bội của 4 đầu tiên! Nên vòng `[a]` phải chạy **từ 1 đến 3**.\n• Khi `tempN` đã là bội của 4, chỉ cần đếm `j` bắt đầu từ `tempN`, không vượt quá `m`, mỗi bước **tăng 4**.", "whyJa": "n が 4で割って1余るとき最大3回 +1 する必要があるため a は 1〜3、その後は tempN から m 以下まで **4ずつ** 増やします。", "ref": "科目B · ループの最適化と剰余", "source": "IPA 令和7年度 (2025) 科目B 公開問題 · 問1", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/tbl5kb0000005r9r-att/2025r07_fe_kamoku_b_qs.pdf"}, {"d": "easy", "ans": 0, "q": "Hàm `change(n)` đếm số cách dùng đồng 1 yên, 5 yên, 10 yên tạo thành đúng `n` yên (`n > 10`). Mỗi vòng lặp trừ bớt 10 yên (tăng thêm 1 đồng 10 yên) và cộng thêm số cách tạo số tiền còn lại `rest` bằng đồng 1 và 5 yên là `(rest ÷ 5 の商) + 1`. Chọn điều kiện dừng vòng lặp `[a]`.", "qJa": "1円・5円・10円玉でちょうど n 円にする組合せ数を返す関数 change の [a] に入れる条件を選べ。", "code": "○整数型: change(整数型: n)\n  整数型: count ← 0\n  整数型: rest ← n\n  while ([a])\n    count ← count ＋ (rest ÷ 5 の商) ＋ 1\n    rest ← rest － 10\n  endwhile\n  return count", "opts": ["rest ≧ 0", "rest ≧ 5", "rest ≧ 10", "rest ＞ 0", "rest ＞ 5", "rest ＞ 10"], "optsJa": ["rest ≧ 0", "rest ≧ 5", "rest ≧ 10", "rest ＞ 0", "rest ＞ 5", "rest ＞ 10"], "why": "Thử trường hợp biên `n = 20`: có thể dùng 2 đồng 10 yên (lúc đó số tiền còn lại `rest = 0`, vẫn tính là **1 cách** hợp lệ vì `(0 ÷ 5) + 1 = 1`!). Nếu viết `rest > 0` sẽ bỏ sót trường hợp dùng toàn đồng 10 yên. Do đó phải là **`rest ≧ 0`**.", "whyJa": "n = 20 のように 10 円玉だけでちょうど支払える場合（rest = 0）も 1 通りとして数える必要があるため **rest ≧ 0** が正解です。", "ref": "科目B · 境界条件（0を含む判定）", "source": "IPA 令和7年度 (2025) 科目B 公開問題 · 問2", "sourceUrl": "https://www.ipa.go.jp/shiken/mondai-kaiotu/sg_fe/koukai/tbl5kb0000005r9r-att/2025r07_fe_kamoku_b_qs.pdf"}]</script>
