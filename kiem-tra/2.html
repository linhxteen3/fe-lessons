110", "101010", "110010", "100100"], "ans": 0, "why": "38÷2=19余0, 19÷2=9余1, 9÷2=4余1, 4÷2=2余0, 2÷2=1余0, 1÷2=0余1. Đảo ngược: 100110. Kiểm: 32+4+2=38.", "details": ["B: 101010₂=42.", "C: 110010₂=50.", "D: 100100₂=36."], "ref": "基礎理論 / 10進→2進", "qJa": "10進数「38」を2進数に変換した結果はどれか。", "optsJa": ["100110", "101010", "110010", "100100"], "whyJa": "38÷2=19残り0, 19÷2=9残り1, 9÷2=4残り1, 4÷2=2残り0, 2÷2=1残り0, 1÷2=0残り1. 反転: 100110. チェック: 32+4+2=38.", "detailsJa": ["B: 101010₂=42.", "C: 110010₂=50.", "D: 100100₂=36."]}, {"d": "med", "q": "Định nghĩa nào về 桁の重み (trọng số chữ số) là chính xác nhất?", "jp": "次のうち、桁の重みの定義として最も適切なものはどれか。", "opts": ["各桁ごとに掛ける係数で、基数のべき乗で表される", "桁数そのものの値", "左端の数字の値", "小数点の右にある数の合計"], "ans": 0, "why": "Yasashii: 桁の重みとは位のこと, 各桁ごとに重みをかけて合計することで数の大きさを表現する. Cơ số mũ tương ứng vị trí.", "details": ["B: Đó là số lượng chữ số (桁数), không phải重み.", "C: Chỉ là chữ số riêng lẻ.", "D: Không liên quan định nghĩa."], "ref": "基礎理論 / 桁の重み", "qJa": "次のうち、桁の重みの定義として最も適切なものはどれか。", "optsJa": ["各桁ごとに掛ける係数で、基数のべき乗で表される", "桁数そのものの値", "左端の数字の値", "小数点の右にある数の合計"], "whyJa": "教材「Yasashii」: 桁の重みとは位のこと、各桁ごとに重みをかけて合計することで数位を表現する。指数の底は位置に対応します。", "detailsJa": ["B: それは重みではなく桁数です。", "C: 個々の数字だけです。", "D: 定義は関係ありません。"]}, {"d": "med", "q": "Ở n進số, khi chữ số dịch sang trái 1 vị trí, số mũ của trọng số thay đổi thế nào?", "jp": "n進数の桁の重みについて、桁が左に1つ上がると指数はどうなるか。", "opts": ["1つ増える", "1つ減る", "2倍になる", "変わらない"], "ans": 0, "why": "Yasashii: n進数では桁が左に1つ上がるごとに桁の重みの指数が1つ増える, ngược lại sang phải giảm 1.", "details": ["B: Đó là khi dịch sang phải.", "C: Tăng cấp 2 chỉ đúng cho cơ số 2, không phải quy luật chung.", "D: Có thay đổi."], "ref": "基礎理論 / n進数の重み", "qJa": "n進数の桁の重みについて、桁が左に1つ上がると指数はどうなるか。", "optsJa": ["1つ増える", "1つ減る", "2倍になる", "変わらない"], "whyJa": "教材「Yasashii」: n進数では桁が左に1つ上がるごとに桁の重みの指数が1つ増え、逆に右に行くと減少する1.", "detailsJa": ["B: それは右にシフトしたときです。", "C: 2 のアップグレードはベース 2, に対してのみ有効であり、一般的な規則ではありません。", "D: 変更があります。"]}, {"d": "med", "q": "Để đổi 10進 → 8進/16進, slide khuyên cách nào đơn giản nhất?", "jp": "基数変換で 10進 28125", "2005.13", "1989.125", "2013.125"], "whyJa": "教材「Yasashii」: 3×8³+7×8²+2×8¹+5×8⁰ + 1×8⁻¹+0×8⁻²+4×8⁻³ = 1536+448+16+5 + 0.125+0+0.0078125 = 2005.1328125.", "detailsJa": ["B: 丸めが早すぎます。", "C: 4×8⁻³ 省略。", "D: 3×8³の計算が間違っています。"]}, {"d": "hard", "q": "[Heisei 31] Kết quả 7÷32 (10進) viết ở 2進 là?", "jp": "【平成31年度】10進数の演算式 7÷32 の結果を2進数で表したものはどれか。", "opts": ["0.00111", "0.001011", "0.001101", "0.0111"], "ans": 0, "why": "Yasashii / Slide 練習(1): 7÷32=0.21875. 0.21875×2=0.4375(0); 0.4375×2=0.875(0); 0.875×2=1.75(1); 0.75×2=1.5(1); 0.5×2=1.0(1). → 0.00111.", "details": ["B: Bỏ sót hoặc thêm bit nhầm.", "C: Đảo lộn thứ tự bit lấy ra.", "D: Tính nhầm 7÷32 thành ~0.4375."], "ref": "基礎理論 / 平成31年・春期 問1", "qJa": "【平成31年度】10進数の演算式 7÷32 の結果を2進数で表したものはどれか。", "optsJa": ["0.00111", "0.001011", "0.001101", "0.0111"], "whyJa": "Slide 練習(1): 7÷32=0.21875. 0.21875×2=0.4375(0); 0.4375×2=0.875(0); 0.875×2=1.75(1); 0.75×2=1.5(1); 0.5×2=1.0(1). → 0.00111.", "detailsJa": ["B: 誤ってビットを省略または追加しました。", "C: 取り出したビットの順序を逆にします。", "D: 7÷32 を ~0.4375. と誤って計算しました"]}, {"d": "hard", "q": "[H26 thu] 1/32 viết ở 16進 là?", "jp": "【平成26年度・秋期】1/32 を16進数で表したものはどれか。", "opts": ["0.08", "0.8", "0.10", "0.20"], "ans": 0, "why": "Slide 第2回 練習(2): 1/32 = 2⁻⁵. Ở 2進 = 0.00001. Nhóm 4 bit từ dấu chấm: 0000.0000 1000 → 0.08₁₆.", "details": ["B: 0.8₁₆ = 0.5.", "C: 0.10₁₆ = 1/16 = 0.0625.", "D: 0.20₁₆ = 2/16 = 0.125."], "ref": "基礎理論 / 平成26年・秋期 問1", "qJa": "【平成26年度・秋期】1/32 を16進数で表したものはどれか。", "optsJa": ["0.08", "0.8", "0.10", "0.20"], "whyJa": "スライド第 2 回練習(2): 1/32 = 2⁻⁵。 2 進 = 0.00001. ドットからのグループ 4 ビット: 0000.0000 1000 → 0.08₁₆。", "detailsJa": ["B: 0.8₁₆ = 0.5.", "C: 0.10₁₆ = 1/16 = 0.0625.", "D: 0.20₁₆ = 2/16 = 0.125."]}, {"d": "hard", "q": "[H30 thu] Đổi 16進 \"0.248\" sang 10進?", "jp": "【平成30年度・秋期】16進数の 0.248 を10進数に変換した結果はどれか。", "opts": ["73/512", "73/256", "73/1024", "2/8+4/16+8/24"], "ans": 0, "why": "Slide 練習(3): 2/16 + 4/16² + 8/16³ = (2×16²+4×16+8)/16³ = (512+64+8)/4096 = 584/4096. Rút gọn: 584/4096 = 73/512.", "det
