iển hình của supervised learning. Slide 1 第10回 ví dụ: 「教師あり学習：不動産価格の予測」 — input = đặc trưng nhà (vị trí, diện tích, số tầng...), 正解 = giá thuê thực tế. Máy học mô hình dự đoán.", "details": ["B. Unsupervised learning không phù hợp khi đã có nhãn (giá thật).", "C. RL phù hợp với bài toán liên tục có reward (game, control), không phải dự đoán tĩnh.", "D. Sai — giá nhà phụ thuộc nhiều biến phi tuyến, công thức cố định không đủ chính xác."], "ref": "FE Syllabus — 基礎理論 / 教師あり学習 / 回帰問題", "qJa": "あなたには、10.000 の住宅データ (家賃価格 + 特性) に基づいて **住宅賃貸価格を予測する**という問題が与えられています。どのタイプの機械学習が最適ですか?", "optsJa": ["教師あり学習 — 各家に正解データ（実際の賃貸価格）があるため", "教師なし学習 — 顧客をグループ化する必要があるため", "強化学習 — 現実の市場での試行錯誤が必要なため", "機械学習は不要、固定式を使用"], "whyJa": "これは教師あり学習の典型的な回帰問題です。スライド 1 第 10 例: 「教師あり学習：不動産価格の予測」 — 入力 = 住宅の特徴 (場所、面積、階数など)、正解 = 実際の賃貸価格。機械学習の予測モデリング。", "detailsJa": ["B. ラベル（実質価格）がある場合、教師なし学習は適していません。", "C. RL は、静的な予測ではなく、継続的な報酬 (ゲーム、コントロール) を伴う問題に適しています。", "D. 不正解 — 住宅価格は多くの非線形変数に依存しており、固定式は十分に正確ではありません。"]}, {"d": "med", "q": "**ビッグデータ (Big Data)** được đặc trưng bởi 3 yếu tố (3V) nào theo Slide 1?", "jp": "ビッグデータの3つの特徴はどれか。", "opts": ["Volume (lớn) / Velocity (tốc độ cao) / Vector (hướng)", "**Volume (量: 大量) / Variety (種類: 多様) / Velocity (頻度: 高頻度)**", "Validity / Visualization / Value", "Vision / Voice / Video"], "ans": 1, "why": "Slide 1: 「3つの特徴を満たすデータのこと：大量 (Volume), 多様 (Variety), 高頻度 (Velocity)」. AI học từ Big Data → đưa ra dự đoán chính xác cao (vd: lịch sử xem video → đề xuất video phù hợp).", "details": ["A. Vector không thuộc 3V.", "C. Đó là 3V mở rộng nhưng không phải 3V chuẩn theo Slide.", "D. Hoàn toàn không liên quan đến 3V của Big Data."], "ref": "FE Syllabus — 基礎理論 / ビッグデータ / 3V", "qJa": "**ビッグデータ (Big Data)** は、スライド 1 によると、3 (3V) のどの要素によって特徴付けられますか?", "optsJa": ["音量(大) / 速度(高速) / ベクトル(方向)", "Variety (種類: 多様) / Velocity (頻度: 高頻度)**", "妥当性 / 可視化 / 価値", "視覚 / 音声 / 映像"], "whyJa": "スライド 1: 「3 の特徴を満たすデータのこと： 大量 (Volume)、多様 (Variety)、高頻度 (Velocity)」。 AIがビッグデータから学習→精度の高い予測を行う（例：動画視聴履歴→適切な動画をおすすめ）。", "detailsJa": ["A. Vector は 3V の一部ではありません。", "C. スライドによると、これは拡張 3V ですが、標準 3V ではありません。", "D. ビッグデータの3Vとは全く関係ありません。"]}, {"d": "hard", "q": "Đặc trưng nào sau đây của **ディープラーニング** so với 機械学習 cổ điển là **đúng nhất**?", "jp": "ディープラーニングが従来の機械学習に対して優れている点はどれか。", "opts": ["Không cần dữ liệu để học", "**Có thể tự thiết kế đặc trưng (特徴量) và học mô hình cùng lúc — trong khi machine learning cổ điển yêu cầu con người thiết kế đặc trưng**", "Luôn cho kết quả 100% chính xác", "Không thể áp dụng cho dữ liệu hình ảnh"], "ans": 1, "why": "Theo Slide 1 第10回: Trong ML cổ điển, đặc trưng (特徴量) phải do con người thiết kế (vd: tự chọn vị trí, diện tích nhà...) — 「人が設定するので、不十分なケースがある」. Deep learning có thể **tự học đặc trưng từ dữ liệu thô** (vd: ảnh) đồng thời với việc học mô hình → mạnh hơn cho dữ liệu phi cấu trúc như ảnh, âm thanh.", "details": ["A. Sai — deep learning cần RẤT NHIỀU dữ liệu để học hiệu quả.", "C. Sai — không có mô hình ML nào đảm bảo 100%.", "D. Sai — deep learning đặc biệt mạnh với dữ liệu hình ảnh (CNN)."], "ref": "FE Syllabus — 基礎理論 / ディープラーニング / 特徴量設計", "qJa": "ディープラーニングが従来の機械学習に対して優れている点はどれか。", "optsJa": ["学習にデータは必要ありません", "**特徴量 (特徴量) の設計とモデルの学習を同時に行うことができます。一方、古典的な機械学習では人間が特徴量を設計する必要があります**", "常に正確な 100% の結果が得られます", "画像データには適用できません"], "whyJa": "スライド 1 第 10 回によると、古典的な ML では、特徴量 (特徴量) は人間によって設計されなければなりません (例: 場所、家の面積の選択など) — 「人が設定するので、危険ながある」。ディープラーニングは、モデルの学習と同時に**生データ** (画像など) から特徴を自己学習できます。→ 画像や音声などの非構造化データに対してより強力です。", "detailsJa": ["A. 誤り — 深層学習を効果的に学習するには大量のデータが必要です。", "C. 不正解 — 100% を保証する ML モデルはありません。", "D. 誤り — 深層学習は画像データ (CNN) に特に強力です。"]}, {"d": "hard", "q": "Tình huống nào sau đây phù hợp với **教師なし学習 (unsupervised learning)** hơn cả?", "jp": "教師なし学習に最適なシナリオはどれか。", "opts": ["Phân loại email là spam / không spam (đã có nhãn)", "Dự đoán doanh số tháng sau dựa trên doanh số quá khứ có sẵn", "**Phân nhóm 1 triệu khách hàng thành các cụm để cá nhân hoá marketing — KHÔNG có nhãn cụm trước**", "Dạy AI chơi cờ vua để thắng kiện tướng"], "ans": 2, "why": "Slide 1 第10回 ví dụ tiêu biểu: 「教師なし学習：顧客データの分類 — 顧客データを読み込ませてコンピュータに学習させることで、属性毎にグルーピングをする」. Không có nhãn cụm trước → máy tự phát hiện pattern → là bài toán clustering.", "details": ["A. Có nhãn spam/không spam → supervised learning.", "B. Có 正解データ (doanh số quá khứ) → supervised regression.", "D. Có reward (thắng/thua) → reinforcement learning."], "ref": "FE Syllabus — 基礎理論 / 教師なし学習 / クラスタリング", "qJa": "教師なし学習に最適なシナリオはどれか。", "optsJa": ["電子メールをスパム/非スパムとして分類 (ラベル付き)", "入手可能な過去の売上に基づいて来月の売上を予測します", "**1 百万人の顧客をクラスターにグループ化し、マーケティングのパーソナライゼーションを実現 — クラスター前のラベルなし **", "AI にチェスのプレイを教えてグランドマスターに勝つ"], "whyJa": "スライド 1 第 10 回 典型的な例: 「教師なし学習：顧客データの分類 — 顧客データを読み込んでコンピュータに学習させることで、毎にプロパティ グルーピングをする」。以前のクラスター ラベルがない → マシンが自動的にパターンを検出 → これはクラスター化の問題です。", "detailsJa": ["A. スパム/スパムではないというラベルが付けられました → 教師あり学習。", "B. はい 正解データ (過去の売上) → 教師あり回帰。", "D. 報酬（勝ち負け）→強化学習あり。"]}, {"d": "easy", "q": "**確率 (xác suất)** trong toán học được biểu diễn bằng giá trị trong khoảng nào?", "jp": "確率の値が取り得る範囲はどれか。", "opts": ["Bất kỳ giá trị nào", "**0 ≤ P ≤ 1** (hoặc 0% ~ 100%)", "-1 ≤ P ≤ 1", "0 ≤ P ≤ 100 (chỉ phần trăm, không dùng tỉ lệ)"], "ans": 1, "why": "Slide 1 第10回: 「確率とは物事の起こりやすさを 0〜1 の数値で表現したもの」. Tính chất: P=0 nghĩa là không bao giờ xảy ra, P=1 nghĩa là chắc chắn xảy ra.", "details": ["A. Sai — xác suất bị chặn trong [0,1].", "C. Sai — xác suất không âm.", "D. % chỉ là cách biểu diễn khác; định nghĩa toán học là [0,1]."], "ref": "FE Syllabus — 基礎理論 / 確率の基本", "qJa": "確率の値が取り得る範囲はどれか。", "optsJa": ["任意の値", "**0 ≤ P ≤ 1** (または 0% ～ 100%)", "-1 ≤ P ≤ 1", "0 ≤ P ≤ 100 (比率ではなくパーセンテージのみ)"], "whyJa": "スライド 1 第 10 回: 「確率とはまったくの相対的な容易さを 0〜1 の数値で表現したもの」。プロパティ: P=0 は決して起こらないことを意味し、P=1 は必ず起こることを意味します。", "detailsJa": ["A. 不正解 — [0,1] でブロックされる可能性。", "C. 不正解 – 非負の確率。", "D. % は単なる別の表現です。数学的定義は [0,1] です。"]}, {"d": "easy", "q": "Công thức tính xác suất cơ bản theo Slide 1 第10回 là gì?", "jp": "確率の計算方法はどれか。", "opts": ["P = số trường hợp thuận lợi × số trường hợp toàn bộ", "**P = (số trường hợp sự kiện xảy ra / ある事象が起こる場合の数) ÷ (tổng số trường hợp có thể / 起こり得る事象の全ての場合の数)**", "P = (tổng số trường hợp) - (số trường hợp xảy ra)", "P = 1 / (tổng số sự kiện)"], "ans": 1, "why": "Slide 1 第10回: 「確率は『ある事象が起こる場合の数 / 起こり得る事象の全ての場合の数』で算出できる」. Ví dụ: xác suất xúc xắc ra mặt 1 = 1 (cách ra mặt 1) / 6 (số mặt) = 1/6.", "details": ["A. Nhân thay vì chia — sai.", "C. Trừ — sai công thức.", "D. Chỉ đúng khi tất cả sự kiện đồng xác suất — không phải định nghĩa tổng quát."], "ref": "FE Syllabus — 基礎理論 / 確率の計算", "qJa": "スライド 1 第 10 回による基本確率の計算式は何ですか?", "optsJa": ["P = 有利なケースの数 × 合計ケースの数", "**P = (イベントが発生するケースの数 / ある事象が起こる場合の数) ÷ (起こり得るケースの総数 / 万が一起こる事象の全ての場合の数)**", "P = (ケースの総数) - (発生したケースの数)", "P = 1 / (イベントの総数)"], "whyJa": "スライド 1 第 10 回: 「確率は『ある事象が起こった場合の数 / 既存事象の全ての場合の数』で計算できる」。例: 1 を示すサイコロの確率 = 1 (面の数 1) / 6 (面の数) = 1/6.", "detailsJa": ["A. 割る代わりに掛ける - 間違っています。", "C. 減算 — 間違った式。", "D. すべてのイベントの確率が等しい場合にのみ真になります。一般的な定義ではありません。"]}, {"d": "easy", "q": "Tung 1 con xúc xắc 6 mặt (sai số đều). Xác suất ra mặt **chẵn** (2, 4, 6) là bao nhiêu?", "jp": "サイコロを1回振って偶数の目が出る確率はいくらか。", "opts": ["1/6", "1/3", "**1/2**", "2/3"], "ans": 2, "why": "Số mặt chẵn = 3 (mặt 2, 4, 6). Tổng số mặt = 6. P(chẵn) = 3/6 = **1/2** = 50%.", "details": ["A. 1/6 là xác suất ra MỘT mặt cụ thể, vd P(=1).", "B. 1/3 = 2/6, không tương ứng với số mặt chẵn.", "D. 2/3 = 4/6, vượt quá số mặt chẵn."], "ref": "FE Syllabus — 基礎理論 / 確率の計算 / サイコロ", "qJa": "1 のサイコロを振って 6 の面をします (偶数エラー)。 **偶数** (2, 4, 6) を獲得する確率はどれくらいですか?", "optsJa": ["1/6", "1/3", "**1/2**", "2/3"], "whyJa": "偶数面 = 3 (面 2, 4, 6)。面の合計数 = 6. P(偶数) = 3/6 = **1/2** = 50%。", "detailsJa": ["A. 1/6 は、特定の顔を 1 つ取得する確率です。例: P(=1)。", "B. 1/3 = 2/6, は偶数の面に対応しません。", "D. 2/3 = 4/6, が偶数面を超えています。"]}, {"d": "med", "q": "Một hộp có **5 viên bi đỏ và 3 viên bi xanh**. Rút ngẫu nhiên **1 viên không hoàn lại, rồi rút tiếp 1 viên nữa**. Xác suất cả 2 viên đều là viên ĐỎ là?", "jp": "赤玉5個と青玉3個の中から、非復元で2個取り出すとき、2個とも赤玉である確率はいくらか。", "opts": ["25/64", "**5/14**", "1/4", "10/56"], "ans": 1, "why": "Lần 1: 5 đỏ / 8 tổng = 5/8.\nLần 2 (sau khi đã rút 1 đỏ, không hoàn): còn 4 đỏ / 7 tổng = 4/7.\nXác suất chung = 5/8 × 4/7 = 20/56 = **5/14**.", "details": ["A. 25/64 = (5/8)² — đó là rút CÓ HOÀN LẠI, không phải bài này.", "C. 1/4 không khớp với phép tính.", "D. 10/56 sai — đáp án đúng phải là 20/56 = 5/14, không phải 10/56."], "ref": "FE Syllabus — 基礎理論 / 確率の計算 / 非復元抽出", "qJa": "ボックスには **5 の赤いビー玉と 3 の青いビー玉**が入っています。ランダムに **1 返金不可の錠剤を引き、次に別の 1 錠剤**を引きます。 2 タブレットが両方とも RED タブレットである確率はどれくらいですか?", "optsJa": ["25/64", "**5/14**", "1/4", "10/56"], "whyJa": "1 の回数: 赤 5 / 8 合計 = 5/8.\n時間 2 (赤い 1 を引き出した後、返金不可): 残りの赤い 4 / 7 合計 = 4/7.\n結合確率 = 5/8 × 4/7 = 20/56 = **5/14**。", "detailsJa": ["A. 25/64 = (5/8)² — これは返金可能なドローであり、このハンドではありません。", "C. 1/4 が計算と一致しません。", "D. 10/56 は間違っています。正しい答えは、10/56. ではなく、20/56 = 5/14, である必要があります。"]}, {"d": "med", "q": "Tung 2 đồng xu cân đối. Xác suất được **ít nhất một mặt ngửa** (head) là?", "jp": "コインを2枚投げたとき、少なくとも1枚が表である確率はいくらか。", "opts": ["1/4", "1/2", "**3/4**", "1"], "ans": 2, "why": "Không gian mẫu: {HH, HT, TH, TT}, 4 khả năng đồng xác suất.\nSự kiện \"ít nhất 1 ngửa\" = tất cả TRỪ {TT} = 3 khả năng.\nP = 3/4.\nCách khác: P(ít nhất 1H) = 1 - P(không H nào) = 1 - (1/2)² = 1 - 1/4 = 3/4.", "details": ["A. 1/4 là P(cả 2 đều ngửa) = HH.", "B. 1/2 là P(đúng 1 ngửa).", "D. 1 nghĩa là chắc chắn — không đúng vì có khả năng TT."], "ref": "FE Syllabus — 基礎理論 / 確率 / 余事象", "qJa": "コインを2枚投げたとき、少なくとも1枚が表である確率はいくらか。", "optsJa": ["1/4", "1/2", "**3/4**", "1"], "whyJa": "サンプル空間: {HH, HT, TH, TT}、4 の共確率。\nイベント「少なくとも 1 の頭」 = {TT} を除くすべて = 3 の可能性。\nP = 3/4.\nあるいは: P(少なくとも 1H) = 1 - P(H なし) = 1 - (1/2)² = 1 - 1/4 = 3/4.", "detailsJa": ["A. 1/4はP(2ともにヘッド)=HHとなります。", "B. 1/2 は P です (正しくは 1 がヘッズアップです)。", "D. 1 は間違いなく - TT の可能性があるため不正確を意味します。"]}, {"d": "hard", "q": "Có 3 xưởng sản xuất bóng đèn: A, B, C. A sản xuất 50% lượng đèn nhưng có 2% bị lỗi; B sản xuất 30% với 3% lỗi; C sản xuất 20% với 5% lỗi. Tỉ lệ đèn lỗi trong toàn bộ sản phẩm là bao nhiêu?", "jp": "A,B,C工場の生産比率と不良率から、全体の不良率を求めよ。", "opts": ["2%", "**2.9%**", "3.3%", "5%"], "ans": 1, "why": "Sử dụng công thức xác suất toàn phần (全確率の公式):\nP(lỗi) = P(A)×P(lỗi|A) + P(B)×P(lỗi|B) + P(C)×P(lỗi|C)\n= 0.5×0.02 + 0.3×0.03 + 0.2×0.05\n= 0.010 + 0.009 + 0.010\n= 0.029 = **2.9%**.", "details": ["A. 2% là tỉ lệ lỗi chỉ của xưởng A.", "C. 3.3% sai trong tính toán (có thể nhầm trung bình đơn).", "D. 5% là tỉ lệ lỗi chỉ của xưởng C."], "ref": "FE Syllabus — 基礎理論 / 確率 / 全確率の公式 / 過去問風", "qJa": "3 の電球工場: A、B、C があります。A は 50% のランプを生産していますが、2% は欠陥品です。 B は 30% を生成し、エラー 3% が発生します。 C では 20% が生成され、エラー 5% が発生します。製品全体に占める不良ランプの割合は何％ですか?", "optsJa": ["2%", "**2.9%**", "3.3%", "5%"], "whyJa": "合計確率の公式 (全確率の公式) を使用すると、次のようになります。\nP(エラー) = P(A)×P(エラー|A) + P(B)×P(エラー|B) + P(C)×P(エラー|C)\n= 0.5×0.02 + 0.3×0.03 + 0.2×0.05\n= 0.010 + 0.009 + 0.010\n= 0.029 = **2.9%**。", "detailsJa": ["A. 2%はA工場の糸不良率です。", "C. 計算における 3.3% の誤差 (単純平均誤差の可能性)。", "D. 5% は工場 C の糸不良率です。"]}, {"d": "hard", "q": "3 đặc trưng cơ bản của xác suất (Slide 1 第10回) **KHÔNG bao gồm** đặc trưng nào sau đây?", "jp": "確率の3つの性質に含まれないものはどれか。", "opts": ["P(sự kiện chắc chắn) = 1", "P(sự kiện không xảy ra) = 0", "0 ≤ P(bất kỳ sự kiện nào) ≤ 1", "**P(sự kiện bất kỳ) luôn = 1/2**"], "ans": 3, "why": "3 tính chất cơ bản của xác suất (確率の3つの性質):\n1. 0 ≤ P(A) ≤ 1 cho mọi sự kiện A.\n2. P(sự kiện chắc chắn / 全事象) = 1.\n3. P(sự kiện không thể / 空事象) = 0.\nKhông có quy tắc \"P luôn = 1/2\" — đó là vô lý.", "details": ["A. Đúng — là 1 trong 3 tính chất.", "B. Đúng — là 1 trong 3 tính chất.", "C. Đúng — là 1 trong 3 tính chất."], "ref": "FE Syllabus — 基礎理論 / 確率の3つの性質", "qJa": "3 確率の基本特性 (スライド 1 第 10 回) **含まれない** 次の特性のうちどれですか?", "optsJa": ["P(ある出来事) = 1", "P(イベントは発生しませんでした) = 0", "0 ≤ P(任意のイベント) ≤ 1", "**P(任意のイベント) = 1/2**"], "whyJa": "3 確率の基本特性 (確率の3の性質):\nすべてのイベント A の 1. 0 ≤ P(A) ≤ 1。\n2. P(ある出来事/全事象) = 1.\n3. P(不可能事象 / 空事象) = 0.\n「常に P = 1/2」というルールはありません。それは不合理です。", "detailsJa": ["A. 正解です。プロパティ 3 の 1 です。", "B. 正解 — プロパティ 3 の 1 です。", "C. 正解 — プロパティ 3 の 1 です。"]}, {"d": "med", "q": "Một sự kiện A có P(A) = 0.3. Sự kiện đối (余事象) của A — ký hiệu Ā — có xác suất bao nhiêu?", "jp": "P(A) = 0.3 のとき、余事象 P(Ā) はいくらか。", "opts": ["0.3", "**0.7**", "0", "1"], "ans": 1, "why": "Sự kiện đối Ā = \"A KHÔNG xảy ra\". Vì A xảy ra hoặc không xảy ra là 2 sự kiện loại trừ phủ kín không gian mẫu:\nP(A) + P(Ā) = 1\n→ P(Ā) = 1 - 0.3 = **0.7**.", "details": ["A. Đó là P(A), không phải P(Ā).", "C. P(Ā) = 0 chỉ khi A chắc chắn xảy ra (P(A)=1).", "D. P(Ā) = 1 chỉ khi A không bao giờ xảy ra (P(A)=0)."], "ref": "FE Syllabus — 基礎理論 / 確率 / 余事象", "qJa": "P(A) = 0.3 のとき、余事象 P(Ā) はいくらか。", "optsJa": ["0.3", "**0.7**", "0", "1"], "whyJa": "Ā のイベント = 「A は発生しません」。 A が発生するか発生しないため、除外イベント 2 はサンプル空間をカバーします。\nP(A) + P(Ā) = 1\n→ P(Ā) = 1 - 0.3 = **0.7**。", "detailsJa": ["A. それは P(Ā) ではなく P(A) です。", "C. A が確実に発生する場合のみ、P(Ā) = 0 (P(A)=1)。", "D. A がまったく発生しない場合のみ、P(Ā) = 1 (P(A)=0)。"]}, {"d": "easy", "q": "Sự khác biệt cơ bản giữa **順列 (hoán vị, permutation)** và **組合せ (tổ hợp, combination)** là gì?", "jp": "順列と組合せの違いは何か。", "opts": ["Không có khác biệt; 2 thuật ngữ đồng nghĩa", "**順列: 取り出して並べる (lấy ra VÀ sắp xếp — thứ tự quan trọng); 組合せ: 取り出すだけ (chỉ lấy ra — không xét thứ tự)**", "順列 chỉ áp dụng cho số; 組合せ chỉ áp dụng cho chữ", "順列 dành cho dữ liệu nhỏ; 組合せ dành cho dữ liệu lớn"], "ans": 1, "why": "Slide 1 第10回:\n• 「n個の中からr個取り出して並べる場合は順列の公式」 — hoán vị xét THỨ TỰ.\n• 「n個の中からr個取り出すだけの場合は組み合わせの公式」 — tổ hợp KHÔNG xét thứ tự.\nVD: chọn 3 người trong 5 — nếu chỉ lập đội = tổ hợp; nếu sắp chủ tịch/phó/thư ký = hoán vị.", "details": ["A. Sai — 2 khái niệm rất khác nhau.", "C. Sai — cả 2 đều có thể áp dụng cho số/chữ/bất kỳ phần tử nào.", "D. Sai — không có quy ước theo kích thước."], "ref": "FE Syllabus — 基礎理論 / 順列と組合せ / 違い", "qJa": "順列と組合せの違いは何か。", "optsJa": ["違いはありません。 2の同義語", "**順列: 取り出して並べる (取り出して並べる — 順序が重要です)。 考え: 取り出すだけ (取り出すだけ — 順序は考慮されません)**", "順列は数字にのみ適用されます。 考えは単語にのみ適用されます", "順列は小さなデータ用です。 考えはビッグデータ用です"], "whyJa": "1 第 10 回スライド:\n• 「n個の中からr個取り出して並べる場合は順列の公式」 — ORDERを考慮した順列。\n• 「n個の中からr個取り出すだけの場合は組み合わせの公式」 — 順序を考慮しない組み合わせ。\n例: 5 の 3 人を選択します — チーム = 組み合わせを作成する場合のみ。大統領/副/秘書 = 順列の場合。", "detailsJa": ["A. 不正解 — 2 のコンセプトは大きく異なります。", "C. 不正解 — 2 はどちらも数字/文字/任意の要素に適用できます。", "D. 不正解 — サイズに関する決まりはありません。"]}, {"d": "easy", "q": "Công thức tính số hoán vị **chọn r từ n** (nPr) là gì?", "jp": "順列の公式 nPr はどれか。", "opts": ["nPr = n + r", "**nPr = n! / (n-r)!** = n × (n-1) × ... × (n-r+1)", "nPr = n! / (r! × (n-r)!)", "nPr = n × r"], "ans": 1, "why": "Công thức 順列 (hoán vị): nPr = n!/(n-r)! = n × (n-1) × (n-2) × ... × (n-r+1).\nĐếm số cách CHỌN r phần tử từ n và SẮP XẾP chúng theo thứ tự.\nVD: P(5,3) = 5×4×3 = 60.", "details": ["A. Cộng — sai hoàn toàn.", "C. Đó là công thức TỔ HỢP nCr = n!/(r!(n-r)!), không phải hoán vị.", "D. n × r là sai — không phản ánh đếm trật tự."], "ref": "FE Syllabus — 基礎理論 / 順列 / nPr 公式", "qJa": "順列の公式 nPr はどれか。", "optsJa": ["nPr = n + r", "**nPr = n! / (n-r)!** = n × (n-1) × ... × (n-r+1)", "nPr = n! / (r! × (n-r)!)", "nPr = n × r"], "whyJa": "順列公式（順列）: nPr = n!/(n-r)! = n × (n-1) × (n-2) × ... × (n-r+1)。\nn から r 個の要素を選択し、順番に並べ替える方法の数を数えます。\n例: P(5,3) = 5×4×3 = 60.", "detailsJa": ["A. 追加 — 完全に間違っています。", "C. これは組み合わせの公式 nCr = n!/(r!(n-r)!) であり、順列ではありません。", "D. n × r は間違っています — 順序立てた数え方を反映していません。"]}, {"d": "easy", "q": "Công thức tính số tổ hợp **chọn r từ n** (nCr / C(n,r)) là gì?", "jp": "組合せの公式 nCr はどれか。", "opts": ["nCr = n!/(n-r)!", "**nCr = n! / (r! × (n-r)!) = nPr / r!**", "nCr = n × r", "nCr = n - r"], "ans": 1, "why": "Công thức 組合せ (tổ hợp): nCr = n!/(r!(n-r)!) = nPr / r!.\nVì tổ hợp không xét thứ tự, ta lấy hoán vị nPr và chia cho r! (số cách sắp r phần tử).\nVD: C(5,3) = 5!/(3!×2!) = 120/(6×2) = 10.", "details": ["A. Đó là công thức HOÁN VỊ nPr, không phải tổ hợp.", "C. Sai cấu trúc.", "D. Trừ — sai hoàn toàn."], "ref": "FE Syllabus — 基礎理論 / 組合せ / nCr 公式", "qJa": "組合せの公式 nCr はどれか。", "optsJa": ["nCr = n!/(n-r)!", "**nCr = n! / (r! × (n-r)!) = nPr / r!**", "nCr = n × r", "nCr = n - r"], "whyJa": "考察公式 (組み合わせ): nCr = n!/(r!(n-r)!) = nPr / r!。\nこの組み合わせでは順序が考慮されないため、順列 nPr を取得し、r で割ります。 (r 個の要素を配置する方法の数)。\n例: C(5,3) = 5!/(3!×2!) = 120/(6×2) = 10.", "detailsJa": ["A. それは nPr PERFORMANCE の式であり、組み合わせではありません。", "C. 構造が間違っています。", "D. マイナス — 完全に間違っています。"]}, {"d": "med", "q": "Có **5 quyển sách khác nhau** và 3 ngăn giá. Có bao nhiêu cách **chọn 3 quyển và xếp** vào 3 ngăn (mỗi ngăn 1 quyển)?", "jp": "5冊の本から3冊を選んで本棚の3つの位置に並べる方法は何通りか。", "opts": ["10", "15", "**60**", "120"], "ans": 2, "why": "Vì 「chọn VÀ xếp」 = thứ tự quan trọng → dùng HOÁN VỊ.\nP(5,3) = 5!/(5-3)! = 5×4×3 = **60** cách.\nGiải thích trực quan: ngăn 1 có 5 lựa chọn, ngăn 2 có 4 lựa chọn còn lại, ngăn 3 có 3 lựa chọn → 5×4×3 = 60.", "details": ["A. 10 = C(5,3) — đó là chỉ CHỌN không xếp.", "B. 15 không khớp công thức nào.", "D. 120 = 5! — đó là sắp tất cả 5 quyển, không chọn ra 3."], "ref": "FE Syllabus — 基礎理論 / 順列 / 計算問題", "qJa": "**5 別の本** と 3 の棚があります。 **3 の本を選択して 3 コンパートメントに入れる**方法は何通りありますか (各コンパートメントには 1 の本があります)。", "optsJa": ["10", "15", "**60**", "120"], "whyJa": "「選択して並べ替え」=順序が重要なので、PERFORMANCEを使用します。\nP(5,3) = 5!/(5-3)! = 5×4×3 = **60** の方法。\n直感的な説明: コンパートメント 1 には 5 の選択があり、コンパートメント 2 には残りの 4 の選択があり、コンパートメント 3 には 3 の選択があります → 5×4×3 = 60.", "detailsJa": ["A. 10 = C(5,3) — これはソートなしの単なる SELECT です。", "B. 15 はどの式とも一致しません。", "D. 120 = 5! — これは、3. を除く、ほぼすべての 5 ボリュームです。"]}, {"d": "med", "q": "Một lớp có **10 học sinh**. Có bao nhiêu cách **chọn 3 học sinh** để lập một nhóm thuyết trình (không phân vai)?", "jp": "10人の中から3人を選んで発表チームを作る方法は何通りか。", "opts": ["30", "**120**", "720", "1000"], "ans": 1, "why": "「Chọn nhóm không phân vai」 = không xét thứ tự → TỔ HỢP.\nC(10,3) = 10!/(3!×7!) = (10×9×8)/(3×2×1) = 720/6 = **120**.", "details": ["A. 30 sai phép tính.", "C. 720 = P(10,3) — đó là CHỌN VÀ XẾP (có phân vai).", "D. 1000 không khớp công thức."], "ref": "FE Syllabus — 基礎理論 / 組合せ / 計算問題", "qJa": "10人の中から3人を選んで発表チームを作る方法は何通りか。", "optsJa": ["30", "**120**", "720", "1000"], "whyJa": "「役割を割り当てずにグループを選択」 = 順序は考慮されません → 組み合わせ。\nC(10,3) = 10!/(3!×7!) = (10×9×8)/(3×2×1) = 720/6 = **120**。", "detailsJa": ["A. 30 の計算が間違っています。", "C. 720 = P(10,3) — つまり、SELECT AND PLACE (役割の割り当てあり)。", "D. 1000 は式と一致しません。"]}, {"d": "med", "q": "Trường hợp **複数事象が組み合わさっている** (nhiều sự kiện kết hợp), Slide 1 第10回 hướng dẫn dùng phép toán nào?", "jp": "複数事象が組み合わさっている場合の数の計算で使う演算はどれか。", "opts": ["Chỉ phép cộng", "Chỉ phép nhân", "**Phép nhân nếu các sự kiện xảy ra ĐỒNG THỜI / TUẦN TỰ (AND); phép cộng nếu chỉ một trong các sự kiện xảy ra (OR / 排他事象)**", "Phép trừ"], "ans": 2, "why": "Slide 1: 「複数事象が組み合わさっている場合、掛け算・もしくは足し算で場合の数を計算する」.\n• Nhân (AND): \"chọn món chính VÀ món tráng miệng\" → cách × cách.\n• Cộng (OR loại trừ): \"đi tàu HOẶC đi xe buýt\" → cách + cách.\nQuy tắc: AND → ×, OR (loại trừ) → +.", "details": ["A. Không đủ — thiếu trường hợp AND.", "B. Không đủ — thiếu trường hợp OR.", "D. Phép trừ chỉ dùng trong tính 余事象 (sự kiện đối), không phải trong phép kết hợp cơ bản."], "ref": "FE Syllabus — 基礎理論 / 場合の数 / 掛け算と足し算", "qJa": "**複数の現象が組み合わさっている** (多くの組み合わせたイベント) の場合、どの数学演算を使用するかについての指示を 1 第 10 回スライドしてください。", "optsJa": ["加算のみ", "乗算を示します", "**イベントが同時/順次に発生する場合の乗算 (AND);イベントの 1 つだけが発生した場合は追加 (OR / 排他事象)**", "引き算"], "whyJa": "スライド 1: 「複数の事象が組み合わさっている場合、掛け算・あるいは足し算で場合の数を計算する」。\n• 詰め方（AND）：「メインディッシュとデザートを選択」→方法×方法。\n• 加法 (OR 排他的): 「電車に乗る OR バスに乗る」 → ウェイ + ウェイ。\nルール: AND → ×、OR (消去) → +。", "detailsJa": ["A. 十分ではありません — AND ケースがありません。", "B. 不十分 — OR ケースが欠落しています。", "D. 引き算は余事象（反対の事実）を計算する場合にのみ使用され、基本的な組み合わせでは使用されません。"]}, {"d": "hard", "q": "Một thực đơn nhà hàng có: 3 món khai vị, 5 món chính, 4 món tráng miệng. Khách chọn **1 món từ mỗi nhóm** để có một bữa ăn đầy đủ. Có bao nhiêu thực đơn khả dĩ?", "jp": "前菜3種、メイン5種、デザート4種から各1品ずつ選ぶ場合、組合せは何通りか。", "opts": ["12 (= 3+5+4)", "**60 (= 3×5×4)**", "120", "720"], "ans": 1, "why": "Đây là kết hợp 3 lựa chọn ĐỒNG THỜI (AND) → nhân: 3 × 5 × 4 = **60** thực đơn.\nSlide 1 第10回 ví dụ 「掛け算で場合の数を算出」.", "details": ["A. 12 = cộng — chỉ đúng khi \"chọn HOẶC khai vị HOẶC món chính HOẶC tráng miệng\" (loại trừ).", "C. 120 = 5! không khớp.", "D. 720 = 6! không khớp."], "ref": "FE Syllabus — 基礎理論 / 場合の数 / 掛け算の法則", "qJa": "前菜3種、メイン5種、デザート4種から各1品ずつ選ぶ場合、組合せは何通りか。", "optsJa": ["12 (= 3+5+4)", "**60 (= 3×5×4)**", "120", "720"], "whyJa": "これは、3 同時選択 (AND) → 乗算: 3 × 5 × 4 = **60** メニューです。\nたとえば「掛け算で場合の数を計算」のように、1 第 10 をスライドさせます。", "detailsJa": ["A. 12 = プラス — 「前菜、メインコース、またはデザートのいずれかを選択する」場合にのみ修正します (除外)。", "C. 120 = 5!一致しません。", "D. 720 = 6!一致しません。"]}, {"d": "hard", "q": "Có 4 chữ cái A, B, C, D. Có bao nhiêu cách **sắp xếp tất cả 4 chữ cái thành dãy** sao cho **A đứng trước B** (không nhất thiết liền kề)?", "jp": "A,B,C,Dの4文字を並べるとき、AがBより前に来る並べ方は何通りか。", "opts": ["6", "**12**", "24", "16"], "ans": 1, "why": "Tổng số hoán vị 4 chữ = 4! = 24.\nVới mỗi cặp vị trí của A và B, có 2 thứ tự (A trước B HOẶC B trước A) — đối xứng. Vậy số dãy mà A trước B = 24/2 = **12**.\nKiểm tra: P(A trước B) = 1/2 vì 2 hoán vị tương đương về vị trí A,B.", "details": ["A. 6 = 3! — không khớp.", "C. 24 = tổng hoán vị, không có ràng buộc.", "D. 16 không khớp công thức."], "ref": "FE Syllabus — 基礎理論 / 順列 / 条件付き並び替え", "qJa": "A,B,C,Dの4文字を並べるとき、AがBより前に来る並べ方は何通りか。", "optsJa": ["6", "**12**", "24", "16"], "whyJa": "順列の合計 4 文字 = 4! = 24.\nA と B の位置のペアごとに、2 の順序 (A が B の前、または B が A の前) があり、対称的です。したがって、A が B の前にあるシーケンスの数 = 24/2 = **12**。\nチェック: P(B の前の A) = 1/2 です。これは、2 が位置 A、B での等価な置換であるためです。", "detailsJa": ["A. 6 = 3! — 一致しません。", "C. 24 = 合計置換、制約なし。", "D. 16 は式と一致しません。"]}, {"d": "hard", "q": "Một ủy ban gồm **2 nam và 3 nữ** sẽ được chọn từ nhóm **5 nam + 4 nữ**. Có bao nhiêu cách?", "jp": "男性5人と女性4人から、男性2人と女性3人の委員会を作る方法は何通りか。", "opts": ["20", "**40**", "60", "120"], "ans": 1, "why": "Chọn 2 nam từ 5 nam: C(5,2) = 5!/(2!×3!) = 10.\nChọn 3 nữ từ 4 nữ: C(4,3) = 4!/(3!×1!) = 4.\nKết hợp 2 sự kiện độc lập (AND) → nhân: 10 × 4 = **40** cách.", "details": ["A. 20 sai phép tính.", "C. 60 không khớp.", "D. 120 không khớp."], "ref": "FE Syllabus — 基礎理論 / 組合せ + 掛け算の法則", "qJa": "男性5人と女性4人から、男性2人と女性3人の委員会を作る方法は何通りか。", "optsJa": ["20", "**40**", "60", "120"], "whyJa": "男性 5 から男性 2 を選択: C(5,2) = 5!/(2!×3!) = 10.\nメス 4 からメス 3 を選択: C(4,3) = 4!/(3!×1!) = 4.\n2 の独立したイベントを結合 (AND) → 乗算: 10 × 4 = **40** の方法。", "detailsJa": ["A. 20の計算が間違っています。", "C. 60 が一致しません。", "D. 120 が一致しません。"]}, {"d": "med", "q": "Có **n chữ số khác nhau** và cần **xếp tất cả n chữ số thành một dãy**. Số cách xếp là?", "jp": "異なるn個を全て並べる場合の数はいくつか。", "opts": ["n", "n²", "**n!** (= n × (n-1) × (n-2) × ... × 1)", "2^n"], "ans": 2, "why": "Xếp toàn bộ n phần tử = P(n,n) = n!/(n-n)! = n!/0! = n!.\nVị trí 1 có n lựa chọn, vị trí 2 có (n-1) lựa chọn (còn lại), ..., vị trí cuối có 1 lựa chọn → n!.\nVD: n=3 → 3! = 6 hoán vị.", "details": ["A. n chỉ là số phần tử, không phải số cách xếp.", "B. n² là đếm cặp có lặp (như tích Descartes).", "D. 2^n là đếm tập con, không phải hoán vị."], "ref": "FE Syllabus — 基礎理論 / 順列 / 全並べ", "qJa": "異なるn個を全て並べる場合の数はいくつか。", "optsJa": ["n", "n²", "**n!** (= n × (n-1) × (n-2) × ... × 1)", "2^n"], "whyJa": "すべての n 要素をソート = P(n,n) = n!/(n-n)! = n!/0! = ん!。\nポジション 1 には n 個の選択肢があり、ポジション 2 には (n-1) 個の選択肢があります (残り)、...、最後のポジションには 1 の選択肢があります → n!。\n例: n=3 → 3! = 6 順列。", "detailsJa": ["A. n は要素の数であり、配置の数ではありません。", "B. n² は、(デカルト積のように) 繰り返しのあるペアを数えます。", "D. 2^n は順列ではなくサブセットを数えます。"]}, {"d": "easy", "q": "**期待値 (giá trị kỳ vọng / expected value)** trong xác suất là gì?", "jp": "期待値の定義として正しいものはどれか。", "opts": ["Giá trị lớn nhất có thể đạt được", "Giá trị nhỏ nhất có thể đạt được", "**Giá trị trung bình thu được trong 1 lần thử (1回の試行で得られる値の平均値) — tính bằng 確率的に決まる平均値**", "Giá trị mà người chơi mong muốn nhất"], "ans": 2, "why": "Yasashii 20-03: 「期待値とは、文字どおり『期待される値』であり、確率的に決まる平均値です」.\nSlide 1: 「期待値とは1回の試行で得られる値の平均値のこと」.\nCông thức: E = Σ(値 × 確率) — tổng của (giá trị × xác suất tương ứng).", "details": ["A. Đó là giá trị MAX, không phải kỳ vọng.", "B. Đó là giá trị MIN, không phải kỳ vọng.", "D. Đó là khái niệm \"mong muốn\" không có công thức toán học."], "ref": "FE Syllabus — 基礎理論 / 期待値の定義", "qJa": "期待値の定義として正しいものはどれか。", "optsJa": ["達成可能な最大値", "達成可能な最小値", "**1 回の試行で得られる平均値 (1 回の試行で得られる値の平均値) — 確率的に決まる平均値**", "プレイヤーが最も望む価値"], "whyJa": "教材「Yasashii」20-03: 「期待値とは、文字どおり『期待される値』であり、確率的に決まる平均値です」。\nスライド 1: 「期待値とは1回の試行で得られる値の平均値のこと」。\n式: E = Σ(値 × 確率) — (値 × 対応する確率) の合計。", "detailsJa": ["A. 期待値ではなくMAX値です。", "B. これは最小値であり、期待値ではありません。", "D. 数式のない「欲望」の概念です。"]}, {"d": "easy", "q": "Công thức tính **期待値** E[X] khi X có thể nhận các giá trị x₁, x₂, ..., xₙ với xác suất tương ứng p₁, p₂, ..., pₙ là?", "jp": "期待値の計算式はどれか。", "opts": ["E[X] = x₁ + x₂ + ... + xₙ", "**E[X] = (x₁ × p₁) + (x₂ × p₂) + ... + (xₙ × pₙ) = Σ(値 × 確率)**", "E[X] = (p₁ + p₂ + ... + pₙ) / n", "E[X] = x₁ × x₂ × ... × xₙ"], "ans": 1, "why": "Yasashii: 「期待値は『値』と『確率』をかけ算し、その後、すべての組み合わせを合計して求めます」.\nE[X] = Σ xᵢ × pᵢ.\nVD: xúc xắc 6 mặt: E = 1×(1/6) + 2×(1/6) + ... + 6×(1/6) = 21/6 = **3.5**.", "details": ["A. Tổng giá trị mà không có trọng số xác suất — sai.", "C. Trung bình xác suất — vô nghĩa (p tổng phải = 1).", "D. Tích giá trị — sai hoàn toàn."], "ref": "FE Syllabus — 基礎理論 / 期待値の公式", "qJa": "期待値の計算式はどれか。", "optsJa": ["E[X] = x₁ + x₂ + ... + xₙ", "**E[X] = (x₁ × p₁) + (x₂ × p₂) + ... + (xₙ × pₙ) = Σ(値 × 確率)**", "E[X] = (p₁ + p₂ + ... + pₙ) / n", "E[X] = x₁ × x₂ × ... × xₙ"], "whyJa": "教材「Yasashii」: 「期待値は『値』と『確率』をかけ算し、その後、すべての組み合わせを合計して求めます。」\nE[X] = Σ xᵢ × pᵢ。\n例: 6 サイコロ面: E = 1×(1/6) + 2×(1/6) + ... + 6×(1/6) = 21/6 = **3.5**。", "detailsJa": ["A. 確率重み付けなしの合計値 — 間違っています。", "C. 確率平均 — 意味がありません (p の合計 = 1 でなければなりません)。", "D. 製品の価値 — 完全に間違っています。"]}, {"d": "easy", "q": "Tung 1 con xúc xắc 6 mặt. Giá trị kỳ vọng của số mặt là bao nhiêu? (Ví dụ tiêu biểu trong Yasashii 20-03)", "jp": "サイコロを1回振ったとき、出る目の期待値はいくつか。", "opts": ["3", "**3.5**", "4", "6"], "ans": 1, "why": "E = 1×(1/6) + 2×(1/6) + 3×(1/6) + 4×(1/6) + 5×(1/6) + 6×(1/6)\n= (1+2+3+4+5+6)/6\n= 21/6\n= **3.5**.\nĐây là ví dụ kinh điển trong Yasashii 20-03.", "details": ["A. 3 là số mặt nằm giữa 1 và 6 nhưng không phải kỳ vọng chính xác.", "C. 4 sai phép tính.", "D. 6 là giá trị MAX, không phải kỳ vọng."], "ref": "FE Syllabus — 基礎理論 / 期待値 / サイコロの例", "qJa": "1 のサイコロを振って 6 の面を出します。面の数の期待値はいくらですか? （やさしい20-03の代表例）", "optsJa": ["3", "**3.5**", "4", "6"], "whyJa": "E = 1×(1/6) + 2×(1/6) + 3×(1/6) + 4×(1/6) + 5×(1/6) + 6×(1/6)\n= (1+2+3+4+5+6)/6\n= 21/6\n= **3.5**。\nこれは「やさしい 20-03.」の典型的な例です。", "detailsJa": ["A. 3 は 1 と 6 の間の番号ですが、正確な予想ではありません。", "C. 4 の計算が間違っています。", "D. 6 は MAX 値であり、期待値ではありません。"]}, {"d": "med", "q": "Một xổ số có 3 giải:\n• Giải 1: 1.000.000円, xác suất 0.001\n• Giải 2: 10.000円, xác suất 0.01\n• Giải 3: 100円, xác suất 0.1\n(Còn lại không trúng = 0円)\nGiá trị kỳ vọng của 1 vé là?", "jp": "宝くじ1枚の期待値はいくらか。", "opts": ["1.000円", "**1.110円**", "10.000円", "11.100円"], "ans": 1, "why": "E = 1.000.000 × 0.001 + 10.000 × 0.01 + 100 × 0.1 + 0 × P(không trúng)\n= 1.000 + 100 + 10 + 0\n= **1.110円**.\nNếu vé bán giá > 1.110円, người chơi lỗ trung bình.", "details": ["A. 1.000円 chỉ là đóng góp của giải 1, thiếu các giải khác.", "C. 10.000円 = giải 2, không phải kỳ vọng.", "D. 11.100円 sai phép tính (có thể nhân 10 lần)."], "ref": "FE Syllabus — 基礎理論 / 期待値 / 計算問題", "qJa": "賞金付きの宝くじ 3:\n• 解 1: 1.000.000円、確率 0.001\n• 解 2: 10.000円、確率 0.01\n• 解 3: 100円、確率 0.1\n(残りは当選しませんでした = 0円)\nチケット 1 の期待値はいくらですか?", "optsJa": ["1.000円", "**1.110円**", "10.000円", "11.100円"], "whyJa": "E = 1.000.000 × 0.001 + 10.000 × 0.01 + 100 × 0.1 + 0 × P(ヒットしない)\n= 1.000 + 100 + 10 + 0\n= **1.110円**。\nチケットが 1.110 円を超えて売れた場合、プレイヤーは平均して負けます。", "detailsJa": ["A. 1.000円は1,賞の寄付のみで、他の賞品はありません。", "C. 10.000円 = 賞金 2, は期待できません。", "D. 11.100円の計算が間違っています（10倍になる可能性があります）。"]}, {"d": "med", "q": "Slide 1 第10回 đưa ví dụ trò chơi: trả 300円 để chơi, kỳ vọng thu lại 350円. Kết luận gì?", "jp": "300円払えば平均350円入手できるゲームの判定はどれか。", "opts": ["Người chơi nên TRÁNH chơi vì luôn thua", "**Trung bình LỜI 50円/lần, người chơi nên CHƠI (kỳ vọng > chi phí)**", "Không đủ thông tin để quyết định", "Phải chơi ít nhất 100 lần mới có lời"], "ans": 1, "why": "Slide 1: 「300円払えば平均350円入手できるので得をする確率が高い」.\nLợi nhuận kỳ vọng = 350 - 300 = +50円. Trung bình mỗi lần chơi sẽ LỜI 50円 → quyết định rationale là CHƠI.\nLưu ý: kỳ vọng là dài hạn — ngắn hạn có thể thua.", "details": ["A. Sai — kỳ vọng cao hơn chi phí.", "C. Đã đủ thông tin để tính.", "D. Không có quy tắc \"phải 100 lần\"; ngay cả 1 lần cũng có giá trị kỳ vọng dương."], "ref": "FE Syllabus — 基礎理論 / 期待値の応用 / 意思決定", "qJa": "スライド 1 第 10 回では、ゲームの例を示します。プレイするには 300 円を支払い、350 円が戻ってくることを期待します。結論は何ですか?", "optsJa": ["プレイヤーは常に負けるのでプレイを避けるべきです", "**平均ワード 50 円/回、プレーヤーはプレイする必要があります (期待値 &gt; コスト)**", "判断するには情報が不十分です", "利益を得るには少なくとも 100 回プレイする必要があります"], "whyJa": "スライド 1: 「300円払えば平均350円入手できるので得をする確率が高い」。\n予想利益 = 350 - 300 = +50円。平均して、プレイするたびに、50円と言う→その根拠がPLAYであると判断します。\n注: 期待は長期的なものであり、短期的には失われる可能性があります。", "detailsJa": ["A. 不正解 — 期待はコストよりも高いです。", "C. 計算するには十分な情報。", "D. 「100 倍でなければならない」というルールはありません。 1回でも期待値はプラスです。"]}, {"d": "med", "q": "Tung 2 đồng xu cân đối. Đặt X = số mặt ngửa (head). Giá trị kỳ vọng E[X] là?", "jp": "コインを2枚投げたとき、表の枚数の期待値はいくつか。", "opts": ["0.5", "**1**", "1.5", "2"], "ans": 1, "why": "X có thể nhận giá trị 0, 1, 2:\n• P(X=0) = 1/4 (cả 2 ngửa)\n• P(X=1) = 2/4 = 1/2 (1 ngửa, 1 sấp)\n• P(X=2) = 1/4 (cả 2 ngửa)\nE[X] = 0×(1/4) + 1×(1/2) + 2×(1/4) = 0 + 0.5 + 0.5 = **1**.\nCách trực quan: mỗi đồng xu có E = 0.5 ngửa, 2 đồng → E tổng = 1.", "details": ["A. 0.5 là kỳ vọng của 1 đồng xu.", "C. 1.5 sai phép tính.", "D. 2 là giá trị max, không phải kỳ vọng."], "ref": "FE Syllabus — 基礎理論 / 期待値 / コイン", "qJa": "コインを2枚投げたとき、表の枚数の期待値はいくつか。", "optsJa": ["0.5", "**1**", "1.5", "2"], "whyJa": "X は 0, 1, 2 の値を取ることができます。\n• P(X=0) = 1/4 (両方の 2 がヘッドアップ)\n• P(X=1) = 2/4 = 1/2 (1 が表、1 が裏)\n• P(X=2) = 1/4 (両方の 2 がヘッドアップ)\nE[X] = 0×(1/4) + 1×(1/2) + 2×(1/4) = 0 + 0.5 + 0.5 = **1**。\n視覚的に: 各コインの表は E = 0.5、表は 2 → E 合計 = 1.", "detailsJa": ["A. 0.5 は 1 コインの期待値です。", "C. 1.5 の計算が間違っています。", "D. 2 は最大値であり、期待値ではありません。"]}, {"d": "hard", "q": "**Bài toán Yasashii 20-12 (平成30年度 過去問)**: Lợi nhuận mỗi sản phẩm = 1.000円; lỗ phế thải mỗi sản phẩm không bán được = 300円. Bảng xác suất bán được (販売個数 hàng / 仕入個数 cột):\n  仕入4: 100% bán 4\n  仕入5: 30% bán 4, 70% bán 5\n  仕入6: 30% bán 4, 30% bán 5, 40% bán 6\n  仕入7: 30% bán 4, 30% bán 5, 30% bán 6, 10% bán 7\n仕入個数 nào cho **kỳ vọng lợi nhuận MAX**?", "jp": "利益の期待値が最大になる仕入個数はどれか。（平成30年度）", "opts": ["4 cái", "5 cái", "**6 cái**", "7 cái"], "ans": 2, "why": "Lợi nhuận = 1.000 × (bán được) - 300 × (không bán được = nhập - bán).\n仕入4: bán chắc 4 → LN = 4×1000 = 4.000円.\n仕入5: E = 0.3×(4×1000-1×300) + 0.7×(5×1000) = 0.3×3700 + 0.7×5000 = 1110+3500 = 4.610.\n仕入6: E = 0.3×(4000-600) + 0.3×(5000-300) + 0.4×6000 = 0.3×3400 + 0.3×4700 + 0.4×6000 = 1020+1410+2400 = 4.830.\n仕入7: E = 0.3×(4000-900)+0.3×(5000-600)+0.3×(6000-300)+0.1×7000 = 0.3×3100+0.3×4400+0.3×5700+0.1×7000 = 930+1320+1710+700 = 4.660.\nMax là **仕入6 (4.830円)**.", "details": ["A. 4 cái LN cố định = 4.000円, thấp nhất.", "B. 5 cái LN kỳ vọng = 4.610円, không max.", "D. 7 cái LN kỳ vọng = 4.660円, kém 6 cái."], "ref": "FE Syllabus — 基礎理論 / 期待値 / Yasashii 20-12 / 平成30年度", "qJa": "**やさしい問題 20-12 (平成30年度過去問)**: 製品あたりの利益 = 1.000円;売れ残った商品あたりの廃棄ロス = 300円。販売確率表(販売個数行/仕入個数列):\n  仕入4: 100% 販売 4\n  仕入5: 30% 販売 4, 70% 販売 5\n  仕入6: 30% 販売 4, 30% 販売 5, 40% 販売 6\n  仕入7: 30% 販売 4, 30% 販売 5, 30% 販売 6, 10% 販売 7\n**最大の利益期待**を与える仕入個数はどれですか?", "optsJa": ["4 作品", "5 作品", "**6 1つ**", "7 作品"], "whyJa": "利益 = 1.000 × (販売) - 300 × (売れ残り = 輸入 - 販売)。\n仕入4: 堅実販売 4 → LN = 4×1000 = 4.000円。\n仕入5: E = 0.3×(4×1000-1×300) + 0.7×(5×1000) = 0.3×3700 + 0.7×5000 = 1110+3500 = 4.610.\n仕入6: E = 0.3×(4000-600) + 0.3×(5000-300) + 0.4×6000 = 0.3×3400 + 0.3×4700 + 0.4×6000 = 1020+1410+2400 = 4.830.\n仕入7: E = 0.3×(4000-900)+0.3×(5000-600)+0.3×(6000-300)+0.1×7000 = 0.3×3100+0.3×4400+0.3×5700+0.1×7000 = 930+1320+1710+700 = 4.660.\nマックスは**仕入6 (4.830円)**です。", "detailsJa": ["A. 4 の確定利益 = 4.000 円、最低。", "B. 5 予想利益 = 4.610円、最大値ではありません。", "D. 7 予想利益 = 4.660円、6 未満。"]}, {"d": "hard", "q": "Một sòng bài có trò chơi: đặt cược 1.000円, có xác suất 0.4 thắng và nhận về 2.500円 (lãi 1.500円), xác suất 0.6 thua (mất 1.000円). Giá trị kỳ vọng của LỢI NHUẬN ròng mỗi ván là?", "jp": "カジノのゲームでの1回の純利益の期待値はいくらか。", "opts": ["+600円 (có lời)", "**0円 (hoà vốn — fair game)**", "-200円 (lỗ)", "+1.500円 (luôn lời)"], "ans": 1, "why": "Lợi nhuận ròng:\n• Thắng: +1.500円 với P = 0.4\n• Thua: -1.000円 với P = 0.6\nE[LN] = 0.4×(+1.500) + 0.6×(-1.000) = 600 - 600 = **0円**.\nĐây là FAIR GAME — về dài hạn, người chơi không lời không lỗ.", "details": ["A. 600円 chỉ là phần lợi từ trường hợp thắng, chưa trừ phần lỗ.", "C. -200円 sai phép tính.", "D. +1.500円 là lợi nhuận TỪNG VÁN THẮNG, không phải kỳ vọng."], "ref": "FE Syllabus — 基礎理論 / 期待値 / 公正なゲーム", "qJa": "カジノにはゲームがあります: 1.000円を賭け、確率で0.4が勝ち、2.500円を受け取り(利益1.500円)、確率で0.6が負けます(損失1.000円)。 1試合あたりの純利益の期待値はいくらですか?", "optsJa": ["+600円(歌詞付き)", "**0円 (損益分岐点 — フェアゲーム)**", "-200円（損失）", "+1.500円 (すべての単語)"], "whyJa": "純利益:\n• 勝利: +1.500円、P = 0.4\n• 損失: -1.000円、P = 0.6\nE[LN] = 0.4×(+1.500) + 0.6×(-1.000) = 600 - 600 = **0円**。\nこれは公平なゲームです。長期的には、プレイヤーには利益も損失もありません。", "detailsJa": ["A. 600円は損失を​​除いた勝ちの利益のみです。", "C. -200円の計算が間違っています。", "D. +1.500円は期待値ではなく、1勝あたりの利益です。"]}, {"d": "hard", "q": "Một sản phẩm bán ra có 3 trạng thái: (1) bình thường — không tốn chi phí, xác suất 0.85; (2) bảo hành nhỏ — tốn 5.000円, xác suất 0.12; (3) bảo hành lớn — tốn 50.000円, xác suất 0.03. Để duy trì lợi nhuận, công ty cần cộng thêm bao nhiêu vào giá bán (mỗi sản phẩm) để **bù đắp chi phí bảo hành kỳ vọng**?", "jp": "製品1個あたりの保証費用の期待値はいくらか。", "opts": ["0円", "1.500円", "**2.100円**", "5.500円"], "ans": 2, "why": "E[chi phí bảo hành] = 0×0.85 + 5.000×0.12 + 50.000×0.03\n= 0 + 600 + 1.500\n= **2.100円**.\nĐể bù đắp, cần cộng tối thiểu 2.100円 vào giá bán mỗi sản phẩm.", "details": ["A. 0円 chỉ đúng nếu không có bảo hành.", "B. 1.500円 = chi phí kỳ vọng từ chỉ trường hợp bảo hành lớn, thiếu trường hợp nhỏ.", "D. 5.500円 = tổng đơn thuần của 2 chi phí (5.000+500), không có trọng số."], "ref": "FE Syllabus — 基礎理論 / 期待値 / ビジネス応用", "qJa": "ステータス 3 で販売される製品: (1) 通常 — 無料、確率 0.85; (2) 少額保証 — 価格 5.000円、確率 0.12; (3) 多額の保証 — コスト 50.000 円、確率 0.03. 利益を維持するには、**予想される保証コスト**を相殺するために、販売価格 (製品あたり) にいくら追加する必要がありますか?", "optsJa": ["0円", "1.500円", "**2.100円**", "5.500円"], "whyJa": "E[保証費用] = 0×0.85 + 5.000×0.12 + 50.000×0.03\n= 0 + 600 + 1.500\n= **2.100円**。\n補填には各商品の販売価格に少なくとも2.100円を加算する必要がございます。", "detailsJa": ["A. 保証書がない場合のみ0円が正しいです。", "B. 1.500円 = 保証対象の大型ケースのみからの予想コスト、小型ケースは含まれていません。", "D. 5.500円 = 加重なしの 2 コストの単純合計 (5.000+500)。"]}, {"d": "hard", "q": "Phát biểu nào về quan hệ giữa **xác suất / kỳ vọng** và **AI / machine learning** là ĐÚNG nhất?", "jp": "確率・期待値と AI・機械学習の関係について、最も適切な記述はどれか。", "opts": ["AI không liên quan đến xác suất; AI chỉ dùng logic if-then", "**Nhiều mô hình AI (đặc biệt machine learning) đưa ra dự đoán dưới dạng xác suất; trong huấn luyện và đánh giá mô hình, các đại lượng kỳ vọng / xác suất là nền tảng quan trọng**", "Xác suất và kỳ vọng chỉ dùng trong xổ số, không dùng trong AI", "AI luôn cho kết quả tất định, không có yếu tố xác suất"], "ans": 1, "why": "Phần lớn các mô hình ML hiện đại (logistic regression, neural network, naive Bayes, random forest, deep learning...) đều output **xác suất** thuộc lớp nào (vd: \"email này 92% là spam\"). Các metric như cross-entropy loss, MSE, EM algorithm... đều là kỳ vọng. Xác suất + thống kê là nền móng toán học của AI hiện đại — không thể tách rời.", "details": ["A. Sai — AI hiện đại dựa nhiều vào xác suất; if-then là AI cổ điển (rule-based).", "C. Sai — xác suất là công cụ toán học rộng, không giới hạn xổ số.", "D. Sai — phần lớn AI hiện đại có yếu tố ngẫu nhiên / xác suất (xác suất phân lớp, dropout, sampling...)."], "ref": "FE Syllabus — 基礎理論 / AI と 確率 の関連性", "qJa": "確率・期待値と AI・機械学習の関係について、最も適切な記述はどれか。", "optsJa": ["AI は確率を重視するものではありません。 AI は if-then ロジックのみを使用します", "**多くの AI モデル (特に機械学習) は確率の形で予測を行います。モデルのトレーニングと評価では、期待値/確率は重要な基盤です**", "確率と期待値は宝くじでのみ使用され、AI では使用されません", "AI は確率の要素を排除し、常に決定的な結果をもたらします"], "whyJa": "最新の ML モデル (ロジスティック回帰、ニューラル ネットワーク、単純ベイズ、ランダム フォレスト、深層学習など) は、どのクラスに属するかの **確率** を出力します (例: 「このメール 92% はスパムです」)。クロスエントロピー損失、MSE、EM アルゴリズムなどの指標はすべて予想です。確率と統計は現代の AI の数学的基礎であり、切り離すことはできません。", "detailsJa": ["A. 誤り — 現代の AI は確率に大きく依存しています。 if-then は古典的な (ルールベースの) AI です。", "C. 不正解 — 確率は宝くじに限定されない、広範な数学ツールです。", "D. 不正解 — ほとんどの最新の AI には、ランダム/確率的な要素 (分類確率、ドロップアウト、サンプリングなど) が含まれています。"]}]</script>
