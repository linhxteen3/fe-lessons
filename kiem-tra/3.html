1111111 (8 bit signed)?", "jp": "符号付8ビットで「10000000 + 11111111」を計算した結果はどれか（オーバーフロー無視）。", "opts": ["01111111 (=+127)", "11111111 (=−1)", "00000000", "10000001"], "ans": 0, "why": "10000000 + 11111111 = 1 01111111 (9 bit). Bỏ carry → 01111111 = +127. Về logic: −128 + (−1) = −129, nhưng vượt phạm vi → kết quả tràn về +127 (オーバーフロー).", "details": ["B: 11111111 không phải kết quả phép cộng này.", "C: Cộng sai.", "D: Sai."], "ref": "基礎理論 / オーバーフロー", "qJa": "符号付8ビットで「10000000 + 11111111」を計算した結果はどれか（オーバーフロー無視）。", "optsJa": ["01111111 (=+127)", "11111111 (=−1)", "00000000", "10000001"], "whyJa": "10000000 + 11111111 = 1 01111111 (9 ビット)。キャリーを削除 → 01111111 = +127. 論理的に: −128 + (−1) = −129, が範囲外 → 結果は +127 にオーバーフローします (オーバーフロー)。", "detailsJa": ["B: 11111111 はこの加算の結果ではありません。", "C: 追加が間違っています。", "D: 違います。"]}, {"d": "hard", "q": "So sánh trị tuyệt đối max và min của bù 2 (n bit)?", "jp": "次のうち、2の補数表現の「最大値」と「最小値」を絶対値で比較したものはどれか（n ビット）。", "opts": ["|最小値| = |最大値| + 1", "|最小値| = |最大値|", "|最大値| = |最小値| + 1", "両者は0"], "ans": 0, "why": "n bit signed: max = +2ⁿ⁻¹−1, min = −2ⁿ⁻¹. |min| − |max| = 1. VD 8 bit: |−128| − |+127| = 1.", "details": ["B: Sai, lệch 1 do biểu diễn 0 chỉ có 1 cách (chiếm 1 slot dương).", "C: Ngược chiều.", "D: Sai hoàn toàn."], "ref": "基礎理論 / 2の補数範囲", "qJa": "次のうち、2の補数表現の「最大値」と「最小値」を絶対値で比較したものはどれか（n ビット）。", "optsJa": ["|最小値| = |最大値| + 1", "|最小値| = |最大値|", "|最大値| = |最小値| + 1", "両者は0"], "whyJa": "n ビット 符号付き: 最大 = +2ⁿ⁻¹ −1, 最小 = −2ⁿ⁻¹。 |分| − |最大| = 1. 例: 8 ビット: |−128| − |+127| = 1.", "detailsJa": ["B: 間違っています、間違った 1 です。代表 0 には 1 ウェイしかありません (正のスロット 1 を占有します)。", "C: 反対方向。", "D: 完全に間違っています。"]}, {"d": "hard", "q": "Bù 2 (8 bit) của 23 (= 00010111)?", "jp": "2進数「00010111」（=23）の8ビット2の補数表現はどれか。", "opts": ["11101001", "11101000", "00010111", "00010110"], "ans": 0, "why": "Đảo bit: 11101000 (= 1の補数), +1 → 11101001 = −23.", "details": ["B: Đó là 1の補数, chưa +1.", "C: Số gốc.", "D: Số gốc −1, không phải bù."], "ref": "基礎理論 / bù 2 ví dụ", "qJa": "2進数「00010111」（=23）の8ビット2の補数表現はどれか。", "optsJa": ["11101001", "11101000", "00010111", "00010110"], "whyJa": "ビット反転: 11101000 (= 1の補数)、+1 → 11101001 = −23.", "detailsJa": ["B: それは +1. ではなく、1 の補数です", "C: 元の番号。", "D: オリジナル番号 −1, は補正する必要はありません。"]}, {"d": "hard", "q": "11101000 (8 bit, bù 2) = ?", "jp": "符号付8ビット2進数「11101000」は10進数でいくつか（2の補数表現）。", "opts": ["−24", "232", "−23", "−40"], "ans": 0, "why": "Slide ví dụ: 11101000 = −24. Kiểm: đảo bit 00010111 +1 = 00011000 = 24, nên 11101000 = −24.", "details": ["B: 232 là cách hiểu unsigned.", "C: Tính nhầm.", "D: 40 = 00101000, không phải."], "ref": "基礎理論 / −24 Slide", "qJa": "符号付8ビット2進数「11101000」は10進数でいくつか（2の補数表現）。", "optsJa": ["−24", "232", "−23", "−40"], "whyJa": "スライド例: 11101000 = −24. チェック: 逆ビット 00010111 +1 = 00011000 = 24, したがって、11101000 = −24.", "detailsJa": ["B: 232 は符号なしの解釈です。", "C: 計算違いです。", "D: 40 = 00101000, ではありません。"]}, {"d": "hard", "q": "Nhược điểm của 1の補数 (vì sao máy tính chọn bù 2)?", "jp": "次のうち、1の補数表現の欠点として正しいものはどれか。", "opts": ["+0 と −0 の 2 つの表現が存在する", "負の数を表現できない", "桁あふれしやすい", "計算速度が遅い"], "ans": 0, "why": "1の補数: 00000000 = +0, 11111111 = −0 → 2 biểu diễn cho 0 → gây mơ hồ. Bù 2 khắc phục: chỉ 1 cách biểu diễn 0.", "details": ["B: Có thể biểu diễn được.", "C: Không phải nhược điểm cốt lõi.", "D: Tốc độ không phải lý do chính."], "ref": "基礎理論 / 1の補数 vs 2の補数", "qJa": "1の補数の欠点（なぜコンピュータは2の補数を選択するのでしょうか）？", "optsJa": ["+0 と −0 の 2 つの表現が存在する", "負の数を表現できない", "桁あふれしやすい", "計算速度が遅い"], "whyJa": "1の補数: 00000000 = +0, 11111111 = −0 → 2 は 0 を表します → 曖昧さの原因となります。補正 2 修正: 1 のみ 0. の表現方法", "detailsJa": ["B: 実行できます。", "C: 主要な弱点ではありません。", "D: 速度は主な理由ではありません。"]}, {"d": "hard", "q": "Cộng 0101 + 0100 (signed 4 bit), có tràn không?", "jp": "符号付4ビット2進数で「0101 + 0100」を計算した結果はどれか。算術的にオーバーフローかどうかも判断せよ。", "opts": ["1001、オーバーフロー発生（+9 は 4 bit signed 範囲 −8〜+7 を超える）", "1001、オーバーフロー無し", "0110、正常", "オーバーフロー、結果なし"], "ans": 0, "why": "5 + 4 = 9. Ở 4 bit signed (−8~+7), 9 vượt phạm vi → kết quả nhị phân 1001 nhưng theo signed = −7 (sai). Đây là オーバーフロー điển hình khi cộng 2 số dương ra bit dấu = 1.", "details": ["B: Có tràn, không phải không.", "C: Tính nhầm.", "D: Vẫn có kết quả bit, chỉ là sai về mặt signed."], "ref": "基礎理論 / オーバーフロー判定", "qJa": "符号付4ビット2進数で「0101 + 0100」を計算した結果はどれか。算術的にオーバーフローかどうかも判断せよ。", "optsJa": ["1001、オーバーフロー発生（+9 は 4 bit signed 範囲 −8〜+7 を超える）", "1001、オーバーフロー無し", "0110、正常", "オーバーフロー、結果なし"], "whyJa": "5 + 4 = 9. 4 符号付きビット (−8〜+7) で、9 が範囲外 → バイナリ結果 1001 ですが符号あり = −7 (false)。これは、2 の正の数値を符号ビット = 1. に加算する場合の典型的なオーバーフローです。", "detailsJa": ["B: はい、オーバーフロー、いいえ、いいえ。", "C: 計算違いです。", "D: ビット結果がまだ残っていますが、署名が間違っているだけです。"]}, {"d": "hard", "q": "Vì sao phải bỏ carry cuối trong phép trừ bằng bù?", "jp": "次のうち、補数を使った引き算で「最後のキャリー（桁上がり）」を捨てる必要がある理由として正しいものはどれか。", "opts": ["補数を作ったとき桁上がりが既に組み込まれているため、結果のキャリーは余分になる", "計算速度を上げるため", "符号ビットを反転させるため", "ゼロを表現するため"], "ans": 0, "why": "Bù 2 = 2ⁿ − x. Khi cộng (a + (2ⁿ−b)) = a−b+2ⁿ. Phần 2ⁿ chính là bit carry tràn ra ngoài → phải bỏ để lấy đúng a−b.", "details": ["B: Không liên quan tốc độ.", "C: Không phải mục đích.", "D: Sai."], "ref": "基礎理論 / Carry trong bù 2", "qJa": "次のうち、補数を使った引き算で「最後のキャリー（桁上がり）」を捨てる必要がある理由として正しいものはどれか。", "optsJa": ["補数を作ったとき桁上がりが既に組み込まれているため、結果のキャリーは余分になる", "計算速度を上げるため", "符号ビットを反転させるため", "ゼロを表現するため"], "whyJa": "2の補数 = 2ⁿ − x。 (a + (2ⁿ−b)) = a−b+2ⁿを加算する場合。 2ⁿ の部分はオーバーフローするキャリー ビットです → 正しい a-b を取得するには破棄する必要があります。", "detailsJa": ["B: 速度とは関係ありません。", "C: 故意ではありません。", "D: 違います。"]}, {"d": "hard", "q": "Cộng +100 + +50 (8 bit signed)?", "jp": "符号付8ビット2進数で +100 と +50 を加算した結果はどれか。オーバーフローも考慮せよ。", "opts": ["10010110、オーバーフロー（+150 は範囲 +127 を超える）", "10010110、正常", "01100100、正常", "11111111、エラー"], "ans": 0, "why": "100 = 01100100, 50 = 00110010. Cộng = 10010110 (=150 unsigned). 150 > 127 → vượt phạm vi signed 8 bit → オーバーフロー. Bit dấu thành 1 dù 2 số dương.", "details": ["B: Có tràn, không phải không.", "C: Tổng sai.", "D: Sai."], "ref": "基礎理論 / オーバーフロー dấu", "qJa": "符号付8ビット2進数で +100 と +50 を加算した結果はどれか。オーバーフローも考慮せよ。", "optsJa": ["10010110、オーバーフロー（+150 は範囲 +127 を超える）", "10010110、正常", "01100100、正常", "11111111、エラー"], "whyJa": "100 = 01100100, 50 = 00110010. 加算 = 10010110 (=150 符号なし)。 150 &gt; 127 → 符号付き範囲を超える 8 ビット → オーバーフロー。 2 が正であっても、符号ビットは 1 になります。", "detailsJa": ["B: はい、オーバーフロー、いいえ、いいえ。", "C: 合計が間違っています。", "D: 違います。"]}, {"d": "hard", "q": "4 bit 1000 hiểu theo bù 2 và unsigned khác nhau bao nhiêu?", "jp": "4ビットの2進数 1000 を「2の補数」と解釈した場合と「符号無」と解釈した場合の差はいくつか。", "opts": ["差は 16（unsigned 8, signed −8）", "差は 0", "差は 1", "差は 8"], "ans": 0, "why": "4 bit unsigned: 1000 = 8. 4 bit signed (bù 2): 1000 = −8. Hiệu = 8 − (−8) = 16 = 2⁴. Tổng quát n bit: hiệu = 2ⁿ khi bit dấu = 1.", "details": ["B: Khác nhau.", "C: Quá nhỏ.", "D: Tính nhầm dấu."], "ref": "基礎理論 / unsigned vs signed", "qJa": "4ビットの2進数 1000 を「2の補数」と解釈した場合と「符号無」と解釈した場合の差はいくつか。", "optsJa": ["差は 16（unsigned 8, signed −8）", "差は 0", "差は 1", "差は 8"], "whyJa": "4 ビット 符号なし: 1000 = 8. 4 ビット 符号付き (2 の補数): 1000 = −8. 効果 = 8 − (−8) = 16 = 2⁴。一般 n ビット: 差分 = 2ⁿ (シンボルビット = 1. の場合)", "detailsJa": ["B: 違います。", "C: 小さすぎます。", "D: 符号の計算が間違っています。"]}]</script>
