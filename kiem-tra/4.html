optsJa": ["1", "2", "3", "0"], "whyJa": "スライド: はみ出た分は割り算の余り。 73 = 18×4 + 1. 流出は 01₂ = 1.", "detailsJa": ["B: 計算が間違っています。", "C: 違います。", "D: 73 は 4. で割り切れません"]}, {"d": "med", "q": "−24 (=11101000) sau 2-bit arithmetic right shift = ?", "jp": "符号付8ビット2進数で「11101000」 (= −24) を2ビット算術右シフトした結果はどれか。", "opts": ["11111010 (= −6)", "00111010", "11101000", "11000000"], "ans": 0, "why": "Slide: 11101000 → 11111010. Bit dấu =1 nên 2 chỗ trống trái điền 1. Kết quả = −6. −24÷4=−6 ✓.", "details": ["B: Điền 0 (đó là 論理右シフト).", "C: Không shift.", "D: Sai biểu diễn."], "ref": "基礎理論 / 算術右シフト ví dụ Slide", "qJa": "符号付8ビット2進数で「11101000」 (= −24) を2ビット算術右シフトした結果はどれか。", "optsJa": ["11111010 (= −6)", "00111010", "11101000", "11000000"], "whyJa": "スライド: 11101000 → 11111010. 符号ビット =1 なので、2 は空白のままにして、1. を埋めます。 結果 = −6. −24÷4=−6 ✓.", "detailsJa": ["B: 0 (論理右シフトです) と入力します。", "C: シフトなし。", "D: 表現が間違っています。"]}, {"d": "med", "q": "−24 sau 2-bit arithmetic left shift = ?", "jp": "符号付8ビット2進数で「11101000」 (= −24) を2ビット算術左シフトした結果（10進数）はどれか。", "opts": ["−96", "−6", "96", "−128"], "ans": 0, "why": "Slide: 11101000 → 10100000 = −96. −24×4=−96 ✓. Khác bit dấu không trào ra → không overflow.", "details": ["B: Đó là dịch phải.", "C: Mất dấu.", "D: Sai."], "ref": "基礎理論 / 算術左シフト Slide", "qJa": "符号付8ビット2進数で「11101000」 (= −24) を2ビット算術左シフトした結果（10進数）はどれか。", "optsJa": ["−96", "−6", "96", "−128"], "whyJa": "スライド: 11101000 → 10100000 = −96. −24×4=−96 ✓.それ以外の場合、符号ビットはオーバーフローしません → オーバーフローしません。", "detailsJa": ["B: それは正しい翻訳です。", "C: 道に迷った。", "D: 違います。"]}, {"d": "med", "q": "Điều kiện overflow của 算術左シフト?", "jp": "算術左シフトでオーバーフローが起こる条件として正しいものはどれか。", "opts": ["符号ビットと異なる値がはみ出たとき", "1がはみ出たとき", "0がはみ出たとき", "シフト幅が大きすぎるとき"], "ans": 0, "why": "Slide: 算術シフトの場合は符号ビットと異なる値がはみ出たらオーバーフロー.", "details": ["B: Đó là 論理シフト.", "C: Trào 0 chỉ overflow nếu khác bit dấu (số âm).", "D: Không phải vấn đề chính."], "ref": "基礎理論 / 算術OF", "qJa": "算術左シフトでオーバーフローが起こる条件として正しいものはどれか。", "optsJa": ["符号ビットと異なる値がはみ出たとき", "1がはみ出たとき", "0がはみ出たとき", "シフト幅が大きすぎるとき"], "whyJa": "Slide: 算術シフトの場合は符号ビットと異なる値がはみ出たらオーバーフロー.", "detailsJa": ["B: それは論理シフトです。", "C: オーバーフロー 0 は、符号ビットが異なる (負の数) 場合にのみオーバーフローします。", "D: 主要な問題ではありません。"]}, {"d": "med", "q": "Phân tích x × 7 bằng shift?", "jp": "x × 7 をシフト演算と加算で計算する正しい分解はどれか。", "opts": ["(x << 2) + (x << 1) + x", "(x << 3) − x", "(x << 7)", "(x << 2) × 7"], "ans": 0, "why": "Slide: 7 = 4+2+1 = 2²+2¹+2⁰. x×7 = x×2² + x×2¹ + x×2⁰ = (x<<2) + (x<<1) + x.", "details": ["B: Đúng về mặt toán (8x-x) nhưng không phải cách Slide trình bày.", "C: x<<7 = x×128, sai hoàn toàn.", "D: Trộn shift với nhân thường."], "ref": "基礎理論 / シフト × 7", "qJa": "x × 7 をシフト演算と加算で計算する正しい分解はどれか。", "optsJa": ["(x &lt;&lt; 2) + (x &lt;&lt; 1) + x", "(x &lt;&lt; 3) − x", "(x &lt;&lt; 7)", "(x &lt;&lt; 2) × 7"], "whyJa": "スライド: 7 = 4+2+1 = 2²+2¹+2⁰。 x×7 = x×2² + x×2¹ + x×2⁰ = (x&lt;&lt;2) + (x&lt;&lt;1) + x。", "detailsJa": ["B: 数学的には正しいですが (8x-x)、スライドの表示方法は正しくありません。", "C: x&lt;&lt;7 = x×128, は完全に間違いです。", "D: 通常の乗算​​を使用したミックスシフト。"]}, {"d": "med", "q": "5 dịch trái 2 bit = ?", "jp": "10進数 5 (= 00000101) を2ビット左シフトしたあとの値はいくつか。", "opts": ["20", "10", "2", "40"], "ans": 0, "why": "5 × 2² = 5 × 4 = 20. 00000101 → 00010100 = 20.", "details": ["B: Mới shift 1 bit.", "C: Đó là dịch phải 1 bit.", "D: Tính nhầm ×8."], "ref": "基礎理論 / 左シフト tính", "qJa": "10進数 5 (= 00000101) を2ビット左シフトしたあとの値はいくつか。", "optsJa": ["20", "10", "2", "40"], "whyJa": "5 × 2² = 5 × 4 = 20. 00000101 → 00010100 = 20.", "detailsJa": ["B: 新しいシフト 1 ビット。", "C: それは右シフト 1 ビットです。", "D: 計算違い ×8."]}, {"d": "med", "q": "論理右シフト có thể cho kết quả sai với loại số nào?", "jp": "論理右シフトで「正の数」と「負の数」を比較した場合、どちらが間違った結果になりやすいか。", "opts": ["負の数 (số âm)", "正の数", "ゼロ", "奇数"], "ans": 0, "why": "論理右シフト điền 0 vào chỗ trống trái, khiến bit dấu bị mất. Số âm bị hiểu thành số dương rất lớn. Đó là lý do số âm cần 算術右シフト.", "details": ["B: Số dương vẫn đúng vì bit dấu=0 vẫn là 0.", "C: Zero shift cho 0.", "D: Không liên quan chẵn lẻ."], "ref": "基礎理論 / 論理 vs 算術 右", "qJa": "論理右シフトで「正の数」と「負の数」を比較した場合、どちらが間違った結果になりやすいか。", "optsJa": ["負の数（負の数）", "正の数", "ゼロ", "奇数"], "whyJa": "論理右シフトは左側の空白 0 を埋めるため、符号ビットが失われます。負の数は非常に大きな正の数として解釈されます。だからこそ負の数には算術右シフトが必要なのです。", "detailsJa": ["B: 符号ビット=0 は依然として 0. であるため、正の数は依然として正しいです", "C: 0. のゼロシフト", "D: パリティとは関係ありません。"]}, {"d": "med", "q": "Tính 1111 + 0001 (4 bit)?", "jp": "2進数「1111」と「0001」を足した結果は何か。", "opts": ["10000 (5 bit, có carry)", "1110", "0000", "1111"], "ans": 0, "why": "1+1=10 (c1); 1+0+1=10 (c1); ... → 10000. Trong 4 bit cố định nếu bỏ carry trào ra → 0000. Ngữ cảnh signed 4 bit: 1111=−1, 0001=+1, tổng=0 ✓.", "details": ["B: Sai phép cộng.", "C: Đó là kết quả khi bỏ carry trong ngữ cảnh 4 bit cố định.", "D: Không cộng."], "ref": "基礎理論 / 加算 carry", "qJa": "1111 + 0001 (4 ビット) を計算しますか?", "optsJa": ["10000 (5 ビット、キャリー付き)", "1110", "0000", "1111"], "whyJa": "1+1=10 (c1); 1+0+1=10 (c1); ... → 10000. 桁上げオーバーフローを削除する場合の 4 固定ビット → 0000. 符号付きコンテキスト 4 ビット: 1111=−1, 0001=+1, total=0 ✓.", "detailsJa": ["B: 加算が間違っています。", "C: 固定ビットコンテキスト 4 のキャリーを削除した結果です。", "D: 追加なし。"]}, {"d": "med", "q": "101.1₂ = ?", "jp": "2進数「101.1」を10進数に変換するといくつか。", "opts": ["5.5", "5.1", "11.0", "2.5"], "ans": 0, "why": "1×4 + 0×2 + 1×1 + 1×0.5 = 5.5.", "details": ["B: Hiểu .1 là 0.1 (sai cơ số).", "C: Bỏ dấu chấm.", "D: Tính nhầm."], "ref": "基礎理論 / 2進→10進 thập phân", "qJa": "2進数「101.1」を10進数に変換するといくつか。", "optsJa": ["5.5", "5.1", "11.0", "2.5"], "whyJa": "1×4 + 0×2 + 1×1 + 1×0.5 = 5.5.", "detailsJa": ["B: .1 は 0.1 (間違ったベース) であることを理解してください。", "C: ピリオドを削除します。", "D: 計算違いです。"]}, {"d": "med", "q": "算術左シフト chỗ trống điền gì?", "jp": "算術左シフトで空いたスペースには何を入れるか。", "opts": ["0", "符号ビット", "1", "直前のビット"], "ans": 0, "why": "Slide: 算術左シフトも空いたスペースに0を詰める. Chỉ có 算術右シフト mới điền bit dấu.", "details": ["B: Chỉ đúng cho 算術右シフト.", "C: Sai.", "D: Không có quy tắc đó."], "ref": "基礎理論 / 算術左シフト", "qJa": "算術左シフトで空いたスペースには何を入れるか。", "optsJa": ["0", "符号ビット", "1", "直前のビット"], "whyJa": "スライド: 算術左シフトも空いたスペースに0を詰める。算術右シフトのみが符号ビットを埋めます。", "detailsJa": ["B: 算術右シフトのみ正解。", "C: 違います。", "D: そのようなルールはありません。"]}, {"d": "med", "q": "50 dịch trái 2 bit = ?", "jp": "10進数 50 を2ビット左シフトすると何になるか。", "opts": ["200", "100", "12", "25"], "ans": 0, "why": "50 × 2² = 50 × 4 = 200.", "details": ["B: Mới 1 bit.", "C: Dịch phải 2 bit.", "D: Dịch phải 1 bit."], "ref": "基礎理論 / 左シフト tính", "qJa": "10進数 50 を2ビット左シフトすると何になるか。", "optsJa": ["200", "100", "12", "25"], "whyJa": "50 × 2² = 50 × 4 = 200.", "detailsJa": ["B: 新しい 1 ビット。", "C: 2 ビットを右シフトします。", "D: 1 ビットを右シフトします。"]}, {"d": "med", "q": "Ưu điểm của shift là gì?", "jp": "次のうち、シフト演算の利点として正しいものはどれか。", "opts": ["かけ算/割り算より高速にできる", "符号を変更できる", "小数の精度を上げる", "オーバーフローを防げる"], "ans": 0, "why": "Shift chỉ cần dịch bit (1 chu kỳ CPU), nhanh hơn nhiều so với phép nhân/chia thông thường. Slide giới thiệu shift như cách \"tối ưu\".", "details": ["B: Shift không đổi dấu (trừ overflow).", "C: Không liên quan precision.", "D: Ngược lại, shift có thể gây overflow."], "ref": "基礎理論 / シフトの利点", "qJa": "次のうち、シフト演算の利点として正しいものはどれか。", "optsJa": ["かけ算/割り算より高速にできる", "符号を変更できる", "小数の精度を上げる", "オーバーフローを防げる"], "whyJa": "シフトにはビット シフト (1 CPU サイクル) のみが必要で、通常の乗算​​/除算よりもはるかに高速です。スライドでは、「最適な」方法としてシフトを紹介しています。", "detailsJa": ["B: シフトは符号を変更しません (オーバーフローを除く)。", "C: 精度とは関係ありません。", "D: 逆に、シフトはオーバーフローを引き起こす可能性があります。"]}, {"d": "med", "q": "−128 sau 1-bit arithmetic left shift?", "jp": "符号付8ビットで「10000000」 (= −128) を1ビット算術左シフトすると何が起きるか。", "opts": ["オーバーフロー (符号ビットと異なる0がはみ出る)", "−256", "0", "−64"], "ans": 0, "why": "−128 × 2 = −256, vượt phạm vi 8 bit signed (−128~+127). Theo Slide: bit khác bit dấu (=0) trào ra → overflow.", "details": ["B: Vượt phạm vi, không thể biểu diễn.", "C: Sai tính toán.", "D: Đó là dịch phải."], "ref": "基礎理論 / 算術左OF", "qJa": "符号付8ビットで「10000000」 (= −128) を1ビット算術左シフトすると何が起きるか。", "optsJa": ["オーバーフロー (符号ビットと異なる0がはみ出る)", "−256", "0", "−64"], "whyJa": "−128 × 2 = −256, は、8 の符号付きビット (−128 ～ +127) の範囲を超えています。スライドによると、符号ビット(=0)以外のビットがオーバーフロー→オーバーフロー。", "detailsJa": ["B: 範囲外のため、実行できません。", "C: 計算が間違っています。", "D: それは正しい翻訳です。"]}, {"d": "hard", "q": "−34 (=11011110) sau 2-bit
