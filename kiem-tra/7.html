れが一番簡単な書き方だから", "**逆ポーランド表記法は、内部コンピュータ (コンピュータ内部) が実際に式を処理する方法であるため、スタックの仕組み (mechanismスタック) と組み合わせて使用されます**", "日本で発明されたものだから", "スペースはいらないから(スペース)"], "whyJa": "Yasashii もう少し詳しく: 「基本情報技術者試験で『逆ポーランド表記法』が出題される理由は、この記法がコンピュータ内部で使われている表記法だからです。コンピュータは、下図のように『逆ポーランド表記法』と『スタックの仕組み』（p.81）を組み合わせて計算を行っています」.", "detailsJa": ["A. 間違っています — 手書きで書くのが最も簡単です。", "C. Sai — ポーランドの論理学者ヤン・ウカシェヴィチによって発明されました。", "D. False — 逆ポーランドでは数字を区切るためのスペースが必要です。"]}, {"d": "easy", "q": "Trong cả 前置記法 và 後置記法, **vì sao cần dấu スペース (khoảng trắng)** giữa các số?", "jp": "前置/後置記法でスペースが必要な理由はどれか。", "opts": ["Vì đẹp mắt hơn", "**Vì nếu không có スペース, 「1」 và 「2」 sẽ dính nhau thành 「12」 — không phân biệt được**", "Vì máy tính yêu cầu cú pháp như vậy", "Vì là quy ước tiếng Nhật"], "ans": 1, "why": "Yasashii (trong phần 前置記法): 「前置記法では、数と数をスペースで区切ります。スペースがなければ『1』と『2』がくっついて『12』と読めてしまうからです」.\nVD: 「+ 1 2」 nếu thiếu スペース thành 「+12」 không thể phân biệt là 「+ 1 2」 hay 「+ 12」 hay 「+ 1 2」.", "details": ["A. Không phải lý do thẩm mỹ.", "C. Không có yêu cầu cú pháp hệ điều hành.", "D. Không liên quan đến quy ước ngôn ngữ."], "ref": "FE Syllabus — 基礎理論 / 表記法 / スペース", "qJa": "前置/後置記法でスペースが必要な理由はどれか。", "optsJa": ["ヴィ ジャップ メット ホン", "**スペースがないと、「1」と「2」がくっついて「12」になり、区別がつきません**", "コンピューターにはこのような構文が必要なため", "日本の大会だから"], "whyJa": "教材「Yasashii」（前置記法の項）：「1」と『2』がくっついて『12』と読んでしまうからです」。\n例：スペースなしの「+ 1 2」は「+12」となり、「+ 1 2」または「+ 12」または「+ 1 2」と区別できません。", "detailsJa": ["A. 美的理由ではありません。", "C. オペレーティング システムの構文要件はありません。", "D. 言語慣習は関係ありません。"]}, {"d": "med", "q": "Bảng tổng kết (Yasashii 表記法のまとめ): biểu thức 「**1 + 2**」 được viết trong 3 cách lần lượt là?", "jp": "「1+2」の3つの表記の組合せはどれか。", "opts": ["中置: +1 2 / 前置: 1+2 / 後置: 1 2+", "**中置: 1+2 / 前置: +1 2 / 後置: 1 2+**", "中置: 1 2+ / 前置: 1+2 / 後置: +1 2", "Tất cả đều là 1+2"], "ans": 1, "why": "Theo bảng 表記法のまとめ trong Yasashii 02-03:\n• 中置記法: 「1+2」 (toán tử giữa, dùng hàng ngày).\n• 前置記法 (ポーランド表記法): 「+1 2」.\n• 後置記法 (逆ポーランド表記法): 「1 2+」.", "details": ["A. Sai vị trí của 中置 và 前置.", "C. Hoán đổi sai cả 3 cách.", "D. Sai — 3 cách biểu diễn KHÁC NHAU."], "ref": "FE Syllabus — 基礎理論 / 表記法のまとめ", "qJa": "「1+2」の3つの表記の組合せはどれか。", "optsJa": ["前置: 1+2 / 後置: 1 2+", "前置: +1 2 / 後置: 1 2+**", "前置: 1+2 / 後置: +1 2", "すべて1+2です"], "whyJa": "やさしい02-03の表表記法まとめによると：\n• 中置記法: 「1+2」 (中間演算子、毎日使用)。\n• 前置記法 (ポーランド表記法): 「+1 2」。\n• 後置記法 (逆表記ポーランド法): 「1 2+」。", "detailsJa": ["A. 中置と前置の位置が間違っています。", "C. 3 の両方の方法で間違ったスワップ。", "D. 間違っています — 3 異なる演奏方法。"]}, {"d": "easy", "q": "**別名 (tên gọi khác)** của 前置記法 và 後置記法 trong Yasashii là gì?", "jp": "前置記法と後置記法の別名はどれか。", "opts": ["前置 = 上位記法 / 後置 = 下位記法", "**前置 = ポーランド表記法 / 後置 = 逆ポーランド表記法**", "前置 = ヨーロッパ式 / 後置 = アメリカ式", "2 cách không có tên gọi khác"], "ans": 1, "why": "Yasashii bảng tổng kết:\n• 前置記法 → 別名: **ポーランド表記法 (Polish Notation)** — đặt theo tên nhà toán học Ba Lan ヤン・ウカシェヴィチ.\n• 後置記法 → 別名: **逆ポーランド表記法 (Reverse Polish Notation / RPN)** — vì viết ngược với ポーランド表記法.", "details": ["A. Không có thuật ngữ \"上位/下位記法\".", "C. Không có sự phân chia theo địa lý.", "D. Sai — đều có tên gọi khác."], "ref": "FE Syllabus — 基礎理論 / 別名", "qJa": "前置記法と後置記法の別名はどれか。", "optsJa": ["後置 = 下位記法", "後置 = 逆ポーランド表記法**", "後置 = アメリカ式", "2 他名のない方法"], "whyJa": "教材「Yasashii」まとめ：\n• 前置記法 → 別名: **ポーランド表記法 (Polish Notation)** — ポーランドの数学者ヤン・ウカシェヴィチにちなんで命名されました。\n• 後置記法 → 別名: **逆ポーランド表記法 (Reverse Polish Notation / RPN)** — ポーランド表記法を逆にして書かれているため。", "detailsJa": ["A. 「上位・下位記法」という用語はありません。", "C. 地理的な区分はありません。", "D. 不正解 — どちらも別の名前があります。"]}, {"d": "med", "q": "Theo Yasashii (mở đầu Lesson 02-03), 「**ポーランド表記法**」 được phát minh bởi ai?", "jp": "ポーランド表記法を考案した人物はどれか。", "opts": ["アラン・チューリング (Alan Turing)", "**ヤン・ウカシェヴィチ (Jan Łukasiewicz) — nhà logic học Ba Lan**", "クロード・シャノン (Claude Shannon)", "ジョン・フォン・ノイマン (John von Neumann)"], "ans": 1, "why": "Yasashii 02-03 ghi: 「ヤン・ウカシェヴィチが考案した計算式『ポーランド表記法』には、発案者の名前ではなく、彼の出生国の国名が付けられました」.\nJan Łukasiewicz (1878-1956) — nhà logic học người Ba Lan. Cách biểu diễn được đặt tên theo QUỐC GIA (Ba Lan) thay vì tên ông.", "details": ["A. Turing là cha đẻ của 計算理論 / Turing machine, không phải Polish notation.", "C. Shannon là cha đẻ của 情報理論.", "D. Von Neumann nổi tiếng với 「ノイマン型コンピュータ」, không liên quan."], "ref": "FE Syllabus — 基礎理論 / ポーランド表記法 / 歴史", "qJa": "やさしいさん（02-03の冒頭）によると、「**ポーランド表記法**」は誰が発明したのですか？", "optsJa": ["アラン・チューリング (Alan Turing)", "**ヤン・ウカシェヴィチ (Jan Łukasiewicz) — ポーランドの論理学者**", "クロード・シャノン (Claude Shannon)", "ジョン・フォン・ノイマン (John von Neumann)"], "whyJa": "教材「Yasashii」 02-03 さんは、「ヤン・ウカシェヴィチが考案した計算式『ポーランド表記法』には、見た人の名前ではなく、彼の出生国の名前が付けられました」と書いています。\nJan Łukasiewicz (1878-1956) — ポーランドの論理学者。公演名は彼の名前ではなく国（ポーランド）にちなんで名付けられました。", "detailsJa": ["A. チューリングは計算理論/チューリングマシンの父であり、ポーランド語表記ではありません。", "C. シャノンは情報理論の父です。", "D. Von Neumann は「ノイマン型コンピューター」で有名ですが、関係ありません。"]}, {"d": "easy", "q": "Chuyển biểu thức 「**3 + 4**」 sang 逆ポーランド表記法 (後置記法)?", "jp": "「3+4」を逆ポーランド表記法で表せ。", "opts": ["**3 4 +**", "+ 3 4", "3 + 4", "4 3 +"], "ans": 0, "why": "Quy tắc: đặt toán tử SAU 2 toán hạng, GIỮ NGUYÊN thứ tự toán hạng.\n3 + 4 → **3 4 +**.\nĐọc: \"đem 3, đem 4, cộng lại\".", "details": ["B. Đó là 前置記法.", "C. Đó là 中置記法 ban đầu.", "D. Sai thứ tự toán hạng — phải giữ 3 trước 4 vì phép cộng có giao hoán nhưng quy ước chuyển vẫn giữ thứ tự ban đầu."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド変換 / 基本", "qJa": "「3+4」を逆ポーランド表記法で表せ。", "optsJa": ["**3 4 +**", "+ 3 4", "3 + 4", "4 3 +"], "whyJa": "ルール: 演算子を 2 オペランドの後に配置し、オペランドの順序を維持します。\n3 + 4 → **3 4 +**。\n「3, と 4, を一緒に追加する」と読みます。", "detailsJa": ["B. それが前置記法です。", "C. それが本来の中置記法です。", "D. オペランドの順序が間違っています。加算は可換ですが、変換規則では元の順序が維持されるため、3 を 4 より前に置く必要があります。"]}, {"d": "easy", "q": "Chuyển biểu thức 「**5 - 2**」 sang 逆ポーランド表記法?", "jp": "「5-2」を逆ポーランド表記法で表せ。", "opts": ["- 5 2", "**5 2 -**", "2 5 -", "5 - 2"], "ans": 1, "why": "Phép trừ KHÔNG có tính giao hoán, nên thứ tự RẤT QUAN TRỌNG.\n5 - 2 → **5 2 -**.\nKiểm tra: pop 2 trước (top), pop 5 sau, tính \"5 - 2\" = 3 (số dưới TRỪ số trên).", "details": ["A. Đó là 前置記法.", "C. Đảo ngược thứ tự → \"2-5\" = -3, không phải kết quả mong muốn.", "D. Đó là 中置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 順序の重要性", "qJa": "「5-2」を逆ポーランド表記法で表せ。", "optsJa": ["- 5 2", "**5 2 -**", "2 5 -", "5 - 2"], "whyJa": "減算は可換ではないため、順序が非常に重要です。\n5 - 2 → **5 2 -**。\nチェック: 2 を最初にポップし (トップ)、後で 5 をポップし、「5 - 2」= 3 (ボトム番号 マイナストップ番号) を計算します。", "detailsJa": ["A. 前置記法です。", "C. 逆順 → 「2-5」 = -3, は予期した結果ではありません。", "D. それが中置記法です。"]}, {"d": "med", "q": "Chuyển biểu thức 「**(1 + 2) × 3**」 sang 逆ポーランド表記法 (theo ví dụ Yasashii):", "jp": "「(1+2)×3」を逆ポーランド表記法で表せ。", "opts": ["1 + 2 × 3", "**1 2 + 3 ×**", "1 2 3 + ×", "× + 1 2 3"], "ans": 1, "why": "Quy tắc convert:\n1. Tính 「1+2」 trước (do dấu ngoặc) → \"1 2 +\" (kết quả ngầm = 3).\n2. Lấy kết quả nhân với 3 → \"(1 2 +) 3 ×\" → **「1 2 + 3 ×」**.\nĐây là VÍ DỤ trong Yasashii 02-03 (もう少し詳しく box).", "details": ["A. Đó vẫn là 中置記法.", "C. Sai thứ tự — phải tính (1+2) trước rồi mới × 3.", "D. Đó là 前置記法 sai cú pháp."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド変換 / Yasashii 02-03 例", "qJa": "「(1+2)×3」を逆ポーランド表記法で表せ。", "optsJa": ["1 + 2 × 3", "**1 2 + 3 ×**", "1 2 3 + ×", "× + 1 2 3"], "whyJa": "変換ルール:\n1. 最初に「1+2」を計算します（括弧のため）→「1 2 +」（暗黙の結果 = 3）。\n2. 3を掛けた結果を取得 → 「(1 2 +) 3 ×」 → **「1 2 + 3 ×」**\nこれはやさしい02-03（もう少し詳しくボックス）の例です。", "detailsJa": ["A. それはまだ中置記法です。", "C. 間違った順序 — 最初に (1+2) × 3. を計算する必要があります", "D. それは前置記法であり、構文が間違っています。"]}, {"d": "med", "q": "Chuyển biểu thức 「**A × (B + C)**」 sang 逆ポーランド表記法?", "jp": "「A×(B+C)」を逆ポーランド表記法で表せ。", "opts": ["A B C + ×", "**A B C + ×** (toán hạng A, B, C giữ thứ tự; tính B+C trước rồi × A)", "A + B × C", "× A + B C"], "ans": 1, "why": "Bước 1: B + C → 「B C +」.\nBước 2: A × (B+C) → 「A (B C +) ×」 → **「A B C + ×」**.\nKiểm tra bằng stack: push A, push B, push C, gặp + → pop C, B → push (B+C); push thực ra không, gặp × → pop (B+C), A → push (A × (B+C)).", "details": ["A. Đúng — nhưng A đáp án đã ghi giống B (cùng đáp án).", "C. Đó là 中置記法.", "D. Đó là 前置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 括弧の処理", "qJa": "「A×(B+C)」を逆ポーランド表記法で表せ。", "optsJa": ["A B C + ×", "**A B C + ×** (オペランド A、B、C は順序を維持します。最初に B+C を計算してから × A)", "A + B × C", "× A + B C"], "whyJa": "ステップ 1: B + C → 「B C +」。\n手順 2: A × (B+C) → 「A (B C +) ×」 → **「A B C + ×」**。\nスタックで確認：プッシュA、プッシュB、プッシュC、ミート+→ポップC、B→プッシュ(B+C);実際にはプッシュは行われず、×→ポップ（B+C）、A→プッシュ（A×（B+C））に遭遇します。", "detailsJa": ["A. 正解 — ただし、A の書面による回答は B の回答と同じです (同じ回答)。", "C. それが中置記法です。", "D. それが前置記法です。"]}, {"d": "med", "q": "Chuyển biểu thức 「**A + B × C**」 (không có dấu ngoặc) sang 逆ポーランド表記法 — chú ý 演算子の優先順位 (× > +):", "jp": "「A+B×C」を逆ポーランド表記法で表せ。（×が+より優先）", "opts": ["A B C × +", "**A B C × +**", "A B + C ×", "A + B × C"], "ans": 1, "why": "Quy tắc 優先順位 (ưu tiên): **括弧 > かけ算・わり算 > たし算・ひき算**.\nDo × ưu tiên hơn +, ta tính 「B×C」 trước:\n• B × C → 「B C ×」\n• A + (B×C) → 「A (B C ×) +」 → **「A B C × +」**.", "details": ["A. Cùng đáp án với B.", "C. Sai — đây là cách tính nếu (A+B)×C, KHÔNG phải A+B×C.", "D. Đó là 中置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 演算子の優先順位", "qJa": "「A+B×C」を逆ポーランド表記法で表せ。（×が+より優先）", "optsJa": ["A B C × +", "**A B C × +**", "A B + C ×", "A + B × C"], "whyJa": "優先順位ルール: **括弧 &gt; かけ算・わり算 &gt; たし算・ひき算**。\n+よりも×が優先されるため、まず「B×C」を計算します。\n・B × C → 「B C ×」\n• A + (B×C) → 「A (B C ×) +」 → **「A B C × +」**。", "detailsJa": ["A. B と同じ答えです。", "C. 不正解 — これは (A+B)×C の場合の計算であり、A+B×C ではありません。", "D. それが中置記法です。"]}, {"d": "hard", "q": "**過去問 平成24年度 Yasashii 問題2-8**: Chuyển 「**Y = (A + B) × (C - D ÷ E)**」 sang 逆ポーランド表記法 (chú ý 「=」 cũng là toán tử và đặt ở cuối cùng):", "jp": "「Y=(A+B)×(C-D÷E)」を後置記法で表せ。", "opts": ["Y A B + C - D E ÷ × =", "**Y A B + C D E ÷ - × =**", "Y A + B × C - D ÷ E =", "Y A B + C D - E ÷ × ="], "ans": 1, "why": "Phương pháp Yasashii: chuyển từng phép theo thứ tự ưu tiên — 括弧 > × ÷ > + - > = (= ở cuối):\n1. D ÷ E → 「D E ÷」\n2. C - (D÷E) → 「C D E ÷ -」\n3. A + B → 「A B +」\n4. (A+B) × (C-D÷E) → 「(A B +) (C D E ÷ -) ×」 → 「A B + C D E ÷ - ×」\n5. Y = ... → 「Y (...) =」 → **「Y A B + C D E ÷ - × =」**.\nĐây là 平成24年度 問題2-8 trong Yasashii 02-03.", "details": ["A. Sai vị trí - và DE÷ — phải là 「C D E ÷ -」 chứ không phải 「C - D E ÷」.", "C. Đó là 中置記法.", "D. Sai — không phải 「C D - E ÷」 mà phải tính D÷E trước rồi C trừ kết quả."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / Yasashii 問題2-8 平成24年度", "qJa": "**過去問平成24年度 やさしい問題2-8**: 「**Y = (A + B) × (C - D ÷ E)**」を逆ポーランド表記法に変換します（「=」も演算子であり最後に置かれることに注意してください）：", "optsJa": ["Y A B + C - D E ÷ × =", "**Y A B + C D E ÷ - × =**", "Y A + B × C - D ÷ E =", "Y A B + C D - E ÷ × ="], "whyJa": "教材「Yasashii」方法: 各呪文を優先順位に従って移動します — 括 &gt; × 弧 ÷ &gt; + - &gt; = (= は最後に):\n1. D ÷ E → 「D E ÷」\n2. C - (D÷E) → 「C D E ÷ -」\n3. A+B → 「A B+」\n4. (A+B) × (C-D÷E) → 「(A B +) (C D E ÷ -) ×」 → 「A B + C D E ÷ - ×」\n5. Y = ... → 「Y (...) =」 → **「Y A B + C D E ÷ - × =」**。\nこれは平成24年度問題2-8のやさしい02-03.です", "detailsJa": ["A. 間違った位置 - と DE÷ - 「C - D E ÷」ではなく、「C D E ÷ -」とすべきです。", "C. それが中置記法です。", "D. 間違い — 「C D - E ÷」ではなく、最初に D÷E を計算し、次に C で結果を減算する必要があります。"]}, {"d": "med", "q": "Chuyển biểu thức 「**(A - B) × (C + D)**」 sang 逆ポーランド表記法?", "jp": "「(A-B)×(C+D)」を後置記法で表せ。", "opts": ["A - B × C + D", "**A B - C D + ×**", "A B - × C D +", "× - A B + C D"], "ans": 1, "why": "Tính từng vế trong dấu ngoặc trước:\n1. A - B → 「A B -」\n2. C + D → 「C D +」\n3. (A-B) × (C+D) → 「(A B -) (C D +) ×」 → **「A B - C D + ×」**.", "details": ["A. Đó là 中置記法.", "C. Sai thứ tự — × phải đặt CUỐI CÙNG sau khi cả 2 vế đã sẵn sàng.", "D. Đó là 前置記法 sai cú pháp."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 2つの括弧", "qJa": "「(A-B)×(C+D)」を後置記法で表せ。", "optsJa": ["A - B × C + D", "**A B - C D + ×**", "A B - × C D +", "× - A B + C D"], "whyJa": "まず括弧内の各節を計算します。\n1. A - B → 「A B -」\n2. C+D→「CD+」\n3. (A-B) × (C+D) → 「(A B -) (C D +) ×」 → **「A B - C D + ×」**。", "detailsJa": ["A. それは中置記法です。", "C. 間違った順序 — × は、2 の両方の側が準備ができた後に最後に配置する必要があります。", "D. それは前置記法であり、構文が間違っています。"]}, {"d": "hard", "q": "Chuyển biểu thức 「**A + B × C - D ÷ E**」 (không có ngoặc) sang 逆ポーランド?", "jp": "「A+B×C-D÷E」を後置記法で表せ。", "opts": ["A B C + × D E ÷ -", "**A B C × + D E ÷ -**", "A B + C × D - E ÷", "A + B × C - D ÷ E"], "ans": 1, "why": "Ưu tiên: × và ÷ trước, sau đó + và -:\n1. B × C → 「B C ×」\n2. A + (B×C) → 「A B C × +」\n3. D ÷ E → 「D E ÷」\n4. (A+B×C) - (D÷E) → 「(A B C × +) (D E ÷) -」 → **「A B C × + D E ÷ -」**.", "details": ["A. Sai vị trí ×, phải nằm sau B C chứ không sau A B C.", "C. Sai vị trí + và ×.", "D. Đó là 中置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 優先順位の混在", "qJa": "「A+B×C-D÷E」を後置記法で表せ。", "optsJa": ["A B C + × D E ÷ -", "**A B C × + D E ÷ -**", "A B + C × D - E ÷", "A + B × C - D ÷ E"], "whyJa": "優先順位: × と ÷ が最初、次に + と -:\n1. B×C → 「B C ×」\n2. A+(B×C)→「A・B・C×+」\n3. D ÷ E → 「D E ÷」\n4. (A+B×C) - (D÷E) → 「(A B C × +) (D E ÷) -」 → **「A B C × + D E ÷ -」**。", "detailsJa": ["A. × の位置が間違っています。A B C の後ではなく、B C の後にある必要があります。", "C. + と × の位置が間違っています。", "D. それが中置記法です。"]}, {"d": "hard", "q": "Chuyển 「**A × B + C × D**」 sang 逆ポーランド?", "jp": "「A×B+C×D」を後置記法で表せ。", "opts": ["A B × C D + ×", "**A B × C D × +**", "A B + C D × ×", "A B C D × × +"], "ans": 1, "why": "Vì × ưu tiên hơn +, tính 2 phép × trước:\n1. A × B → 「A B ×」\n2. C × D → 「C D ×」\n3. (A×B) + (C×D) → **「A B × C D × +」**.", "details": ["A. Sai — phải là 「A B × C D ×」 cho 2 phép nhân riêng biệt; cuối cùng là +.", "C. Sai vị trí + (phải cuối cùng) và × (phải sau từng cặp).", "D. Sai cú pháp — không thể có 2 × liền nhau."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 同じ優先度", "qJa": "「A×B+C×D」を後置記法で表せ。", "optsJa": ["A B × C D + ×", "**A B × C D × +**", "A B + C D × ×", "A B C D × × +"], "whyJa": "× は + より優先されるため、最初に × 演算の 2 を計算します。\n1. A×B → 「A・B×」\n2. C×D→「C・D×」\n3. (A×B) + (C×D) → **「A B × C D × +」**。", "detailsJa": ["A. 不正解 — 2 離散乗算の場合は「A B × C D ×」である必要があります。最後に+。", "C. + (右最後) と × (各ペアの右) の位置が間違っています。", "D. 構文が正しくありません — 連続した 2 × を使用することはできません。"]}, {"d": "med", "q": "Chuyển biểu thức **3 mức ngoặc**: 「**((A + B) × C) - D**」 sang 逆ポーランド?", "jp": "「((A+B)×C)-D」を後置記法で表せ。", "opts": ["**A B + C × D -**", "A + B × C - D", "A B + × C - D", "A B C + × D -"], "ans": 0, "why": "Tính từ trong ra ngoài:\n1. A + B → 「A B +」\n2. (A+B) × C → 「(A B +) C ×」 → 「A B + C ×」\n3. ((A+B)×C) - D → 「(A B + C ×) D -」 → **「A B + C × D -」**.", "details": ["B. Đó là 中置記法.", "C. Sai thứ tự — × phải đứng sau C, không phải sau +.", "D. Sai vị trí + (phải nằm ngay sau A B)."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 多重括弧", "qJa": "式 **3 の括弧**: 「**((A + B) × C) - D**」 を逆ポーランド語に変換しますか?", "optsJa": ["**A B + C × D -**", "A + B × C - D", "A B + × C - D", "A B C + × D -"], "whyJa": "内側から外側へ:\n1. A+B → 「A B+」\n2. (A+B) × C → 「(A B +) C ×」 → 「A B + C ×」\n3. ((A+B)×C) - D → 「(A B + C ×) D -」 → **「A B + C × D -」**。", "detailsJa": ["B. それが中置記法です。", "C. 間違った順序 — × は + の後ではなく、C の後に来る必要があります。", "D. + の位置が間違っています (A B の直後でなければなりません)。"]}, {"d": "easy", "q": "Khi tính biểu thức 逆ポーランド bằng **スタック (stack)**, quy tắc là gì? (theo Yasashii 計算手順)", "jp": "スタックを使った逆ポーランドの計算方法はどれか。", "opts": ["Đọc từ phải sang trái", "**Đọc từ trái sang phải; gặp 数字 → PUSH vào stack; gặp 演算子 → POP 2 số trên cùng, tính, PUSH kết quả lại**", "Tất cả số được push trước, sau đó mới tính", "Sử dụng queue (FIFO) thay vì stack"], "ans": 1, "why": "Yasashii もう少し詳しく - 逆ポーランド表記法での計算手順:\n• Duyệt biểu thức TỪ TRÁI SANG PHẢI.\n• Nếu là 数字 (toán hạng) → **PUSH** vào stack.\n• Nếu là 演算子 → **POP 2 phần tử** trên cùng (số B = top, A = next), tính (A op B), rồi **PUSH** kết quả trở lại stack.\n• Cuối cùng, kết quả còn lại trong stack = giá trị biểu thức.", "details": ["A. Sai — đọc từ TRÁI sang PHẢI.", "C. Sai — push và pop xen kẽ theo thứ tự token.", "D. Sai — stack (LIFO) không phải queue (FIFO)."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / スタック", "qJa": "スタックを使った逆ポーランドの計算方法はどれか。", "optsJa": ["右から左に読んでください", "**左から右に読んでください。数字に遭遇 → スタックにPUSH;演算子と会う → POP 2 トップナンバー、計算、結果を再度PUSH**", "すべての数値が最初にプッシュされてから計算されます", "スタックの代わりにキュー (FIFO) を使用する"], "whyJa": "やさしいもう少し詳しく - 逆ポーランド表記法での計算手順:\n• 式を左から右に参照します。\n• 数字（オペランド）の場合 → **PUSH** をスタックに追加します。\n• 演算子 → **POP 2 最上位**要素 (数値 B = トップ、A = 次) の場合、(A op B) を計算し、結果を **PUSH** してスタックに戻します。\n• 最後に、スタックに残った結果 = 式の値になります。", "detailsJa": ["A. 不正解 — 左から右に読んでください。", "C. 不正解 — トークンの順序でプッシュとポップが交互に行われます。", "D. 不正解 — スタック (LIFO) はキュー (FIFO) ではありません。"]}, {"d": "easy", "q": "Khi gặp 演算子 trong 逆ポーランド, **thứ tự pop** 2 số từ stack là gì? Giả sử stack có A (đáy) - B (đỉnh):", "jp": "演算子に出会ったとき、スタックから取り出す順序はどれか。", "opts": ["Pop A trước, pop B sau → tính A op B", "**Pop B trước (top), pop A sau (next-to-top) → tính A op B (số dưới op số trên)**", "Pop cả 2 cùng lúc", "Không pop, chỉ peek"], "ans": 1, "why": "Stack là LIFO — **pop ra phần tử trên cùng trước** (B), rồi pop phần tử kế tiếp (A). Khi tính 「A op B」: A là toán hạng TRƯỚC, B là toán hạng SAU trong biểu thức gốc.\nLý do: trong 逆ポーランド 「A B op」, A được push trước (xuống đáy), B push sau (lên đỉnh). Khi pop, ra B trước, sau đó A. Phép toán chuẩn là 「A op B」 (theo thứ tự xuất hiện gốc).", "details": ["A. Sai — không thể pop A trước vì A nằm dưới B trong stack.", "C. Sai — stack pop từng phần tử một.", "D. Sai — phải pop để có thể tính rồi push kết quả."], "ref": "FE Syllabus — 基礎理論 / スタック演算 / pop順序", "qJa": "逆ポーランドで演算子に遭遇したとき、**ポップオーダー** 2 単語番号スタックは何ですか?スタックに A (下) - B (上) があるとします。", "optsJa": ["最初に A をポップし、後で B をポップ → A と B を計算します", "**最初に B をポップ (一番上)、次に A をポップ (一番上の次) → A op B (小さい番号と上の番号) を計算します**", "両方の 2 を同時にポップします", "ポップはありません、覗くだけです"], "whyJa": "スタックは LIFO です — **最初に先頭の要素をポップします** (B)、次に次の要素をポップします (A)。 「A op B」を計算する場合、元の式の A が BEFORE オペランド、B が AFTER オペランドになります。\n理由: 逆ポーランド「A B op」では、A が最初に (下に) 押され、B が後で (上に) 押されます。ポップの場合は、最初に B を出力し、次に A を出力します。標準的な動作は「A op B」です（元の出現順）。", "detailsJa": ["A. 不正解 — A はスタック内で B の下にあるため、最初に A をポップできません。", "C. 不正解 — スタックは各要素を 1 つずつポップします。", "D. 間違っています — 計算して結果をプッシュするには、ポップする必要があります。"]}, {"d": "med", "q": "Tính giá trị của biểu thức 逆ポーランド: **「2 3 +」**", "jp": "逆ポーランドの式「2 3 +」の値はいくつか。", "opts": ["**5**", "6", "23", "-1"], "ans": 0, "why": "Trace stack:\n1. 「2」: push 2 → stack [2].\n2. 「3」: push 3 → stack [2, 3].\n3. 「+」: pop 3, pop 2, tính 2+3=5, push 5 → stack [**5**].\nKết quả cuối cùng: **5**.", "details": ["B. 6 không phải tổng của 2 và 3.", "C. 23 là ghép số chứ không phải phép cộng.", "D. -1 sẽ đúng nếu là phép trừ 2-3, không phải cộng."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 基本", "qJa": "逆ポーランドの式「2 3 +」の値はいくつか。", "optsJa": ["**5**", "6", "23", "-1"], "whyJa": "トレーススタック:\n1. 「2」: 2 を押して [2] をスタックします。\n2. 「3」: 3 を押す → [2, 3] をスタックします。\n3. 「+」: 3, ポップ 2, カウント 2+3=5, プッシュ 5 → スタック [**5**]。\n最終結果: **5**。", "detailsJa": ["B. 6 は 2 と 3. の合計ではありません", "C. 23 は加算ではなく、数字の組み合わせです。", "D. 加算ではなく減算 2-3, であれば、-1 が正しいでしょう。"]}, {"d": "med", "q": "Tính giá trị của biểu thức 逆ポーランド: **「6 2 -」**", "jp": "逆ポーランドの式「6 2 -」の値はいくつか。", "opts": ["**4**", "-4", "8", "62"], "ans": 0, "why": "Trace stack:\n1. 「6」: push 6 → [6].\n2. 「2」: push 2 → [6, 2].\n3. 「-」: pop 2 (top), pop 6 (next), tính **6 - 2 = 4**, push → [4].\nQuan trọng: phải tính số DƯỚI trừ số TRÊN (6 - 2), KHÔNG phải số trên trừ số dưới.", "details": ["B. -4 sẽ đúng nếu tính 2-6 (sai thứ tự).", "C. 8 là phép cộng.", "D. 62 là ghép số."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 引き算の順序", "qJa": "逆ポーランドの式「6 2 -」の値はいくつか。", "optsJa": ["**4**", "-4", "8", "62"], "whyJa": "トレーススタック:\n1. 「6」：6→[6]を押します。\n2. 「2」：2→[6, 2]を押します。\n3. 「-」: 2 (先頭) をポップ、6 (次) をポップ、**6 - 2 = 4** を数え、→ [4] を押します。\n重要: 上限の数値から下限の数値を引いた値ではなく、下限の数値から上限の数値を引いた値 (6 ～ 2) を計算する必要があります。", "detailsJa": ["B. 2-6 (間違った順序) を計算すると、-4 が正しくなります。", "C.8は追加です。", "D. 62 は数字の組み合わせです。"]}, {"d": "med", "q": "Tính giá trị của biểu thức 逆ポーランド (theo Yasashii ví dụ): **「1 2 + 3 ×」**", "jp": "逆ポーランドの式「1 2 + 3 ×」の値はいくつか。", "opts": ["**9**", "7", "6", "5"], "ans": 0, "why": "Trace stack (theo Yasashii 計算手順):\n1. 「1」: push 1 → [1].\n2. 「2」: push 2 → [1, 2].\n3. 「+」: pop 2, pop 1, tính 1+2=3, push 3 → [3].\n4. 「3」: push 3 → [3, 3].\n5. 「×」: pop 3, pop 3, tính 3×3=**9**, push 9 → [9].\nĐây tương đương với 中置記法 「(1+2)×3 = 9」.", "details": ["B. 7 = 1+2+3+1, sai phép tính.", "C. 6 = 1×2×3 hoặc 1+2+3, không khớp.", "D. 5 = chỉ tính 2+3, bỏ qua 1."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / Yasashii 計算例", "qJa": "逆ポーランドの式「1 2 + 3 ×」の値はいくつか。", "optsJa": ["**9**", "7", "6", "5"], "whyJa": "トレーススタック (やさしい計算手順による):\n1. 「1」：1→[1]を押します。\n2. 「2」：2→[1, 2]を押します。\n3. 「+」: ポップ 2, ポップ 1, カウント 1+2=3, プッシュ 3 → [3]。\n4. 「3」: 3 → [3, 3] を押します。\n5. 「×」： 3, ポップ 3, 3×3=**9**を計算し、9→[9]を押します。\nこれは中置記法「(1+2)×3 = 9」に相当します。", "detailsJa": ["B. 7 = 1+2+3+1, 計算が間違っています。", "C. 6 = 1×2×3 または 1+2+3, が一致しません。", "D. 5 = 2+3, のみをカウントし、1. を無視します"]}, {"d": "hard", "q": "Tính giá trị của biểu thức 逆ポーランド: **「5 3 2 × +」**", "jp": "逆ポーランドの式「5 3 2 × +」の値はいくつか。", "opts": ["**11**", "16", "13", "30"], "ans": 0, "why": "Trace stack:\n1. 「5」: push → [5].\n2. 「3」: push → [5, 3].\n3. 「2」: push → [5, 3, 2].\n4. 「×」: pop 2, pop 3, tính 3×2=6, push → [5, 6].\n5. 「+」: pop 6, pop 5, tính 5+6=**11**, push → [11].\nTương đương 中置 「5 + 3×2 = 11」.", "details": ["B. 16 = (5+3)×2 — sai vì × phải tính trước.", "C. 13 không khớp phép tính nào.", "D. 30 = 5×3×2 — không có 2 phép ×."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 演算順序", "qJa": "逆ポーランドの式「5 3 2 × +」の値はいくつか。", "optsJa": ["**11**", "16", "13", "30"], "whyJa": "トレーススタック:\n1. 「5」：→「5」を押します。\n2. 「3」：→「5, 3」を押します。\n3. 「2」：→「5, 3, 2」を押します。\n4. 「×」：ポップ 2, ポップ 3, カウント 3×2=6, プッシュ → [5, 6]。\n5. 「+」: ポップ 6, ポップ 5, カウント 5+6=**11**、→ [11] を押します。\n中置「5 + 3×2 = 11」に相当します。", "detailsJa": ["B. 16 = (5+3)×2 — ×を最初に計算する必要があるため、誤りです。", "C. 13 はどの計算にも一致しません。", "D. 30 = 5×3×2 — 2 は許可されません ×。"]}, {"d": "hard", "q": "Tính giá trị của biểu thức 逆ポーランド: **「8 2 ÷ 3 +」**", "jp": "逆ポーランドの式「8 2 ÷ 3 +」の値はいくつか。", "opts": ["**7**", "5", "11", "4"], "ans": 0, "why": "Trace stack:\n1. 「8」: push → [8].\n2. 「2」: push → [8, 2].\n3. 「÷」: pop 2, pop 8, tính **8 ÷ 2 = 4**, push → [4].\n4. 「3」: push → [4, 3].\n5. 「+」: pop 3, pop 4, tính 4+3=**7**, push → [7].\nTương đương 中置 「8÷2 + 3 = 4 + 3 = 7」.", "details": ["B. 5 = 8÷2 - 3 hoặc nhầm phép.", "C. 11 = sai phép.", "D. 4 = chỉ tính 8÷2, bỏ qua + 3."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 割り算", "qJa": "逆ポーランドの式「8 2 ÷ 3 +」の値はいくつか。", "optsJa": ["**7**", "5", "11", "4"], "whyJa": "トレーススタック:\n1. 「8」：→「8」を押します。\n2. 「2」：→「8, 2」を押します。\n3. 「÷」: ポップ 2, ポップ 8, **8 ÷ 2 = 4** を計算し、→ [4] を押します。\n4. 「3」：→「4, 3」を押します。\n5. 「+」: ポップ 3, ポップ 4, カウント 4+3=**7**、→ [7] を押します。\n中置「8÷2 + 3 = 4 + 3 = 7」に相当します。", "detailsJa": ["B. 5 = 8÷2 - 3 または間違ったスペル。", "C. 11 = 許可が間違っています。", "D. 4 = カウントのみ 8÷2, 無視 + 3."]}, {"d": "hard", "q": "Tính giá trị của biểu thức 逆ポーランド: **「4 5 + 6 2 - ×」**", "jp": "逆ポーランドの式「4 5 + 6 2 - ×」の値はいくつか。", "opts": ["**36**", "30", "60", "20"], "ans": 0, "why": "Trace stack:\n1. 「4」: push → [4].\n2. 「5」: push → [4, 5].\n3. 「+」: pop 5, pop 4, 4+5=9, push → [9].\n4. 「6」: push → [9, 6].\n5. 「2」: push → [9, 6, 2].\n6. 「-」: pop 2, pop 6, 6-2=4, push → [9, 4].\n7. 「×」: pop 4, pop 9, **9×4=36**, push → [36].\nTương đương 中置 「(4+5)×(6-2) = 9×4 = 36」.", "details": ["B. 30 = 9+6×2 hoặc tương tự, không khớp.", "C. 60 không khớp.", "D. 20 = 4×5, bỏ qua các phép sau."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 複雑な式", "qJa": "逆ポーランドの式「4 5 + 6 2 - ×」の値はいくつか。", "optsJa": ["**36**", "30", "60", "20"], "whyJa": "トレーススタック:\n1. 「4」：→「4」を押します。\n2. 「5」：→「4, 5」を押します。\n3. 「+」: ポップ 5, ポップ 4, 4+5=9, を押す → [9]。\n4. 「6」：→「9, 6」を押します。\n5. 「2」: → [9, 6, 2]を押します。\n6. 「-」: ポップ 2, ポップ 6, 6-2=4, プッシュ → [9, 4]。\n7. 「×」: ポップ 4, ポップ 9, **9×4=36**、→ [36] を押します。\n中置「(4+5)×(6-2) = 9×4 = 36」と同等。", "detailsJa": ["B. 30 = 9+6×2 など、一致しません。", "C. 60 が一致しません。", "D. 20 = 4×5, 以下の操作をスキップします。"]}, {"d": "hard", "q": "Tính 逆ポーランド: **「10 2 3 + ÷」**", "jp": "逆ポーランドの式「10 2 3 + ÷」の値はいくつか。", "opts": ["**2**", "5", "15", "8"], "ans": 0, "why": "Trace stack:\n1. 「10」: push → [10].\n2. 「2」: push → [10, 2].\n3. 「3」: push → [10, 2, 3].\n4. 「+」: pop 3, pop 2, 2+3=5, push → [10, 5].\n5. 「÷」: pop 5, pop 10, **10÷5=2**, push → [2].\nTương đương 中置 「10 ÷ (2+3) = 10÷5 = 2」.", "details": ["B. 5 = chỉ tính 2+3, bỏ qua phép ÷.", "C. 15 = 10+2+3, sai phép.", "D. 8 = 10-2 hoặc tương tự, không khớp."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 演算結合", "qJa": "逆ポーランドの式「10 2 3 + ÷」の値はいくつか。", "optsJa": ["**2**", "5", "15", "8"], "whyJa": "トレーススタック:\n1. 「10」：→「10」を押します。\n2. 「2」：→「10, 2」を押します。\n3. 「3」：→「10, 2, 3」を押します。\n4. 「+」: ポップ 3, ポップ 2, 2+3=5, プッシュ → [10, 5]。\n5. 「÷」: ポップ 5, ポップ 10, **10÷5=2**、→ [2] を押します。\n中置「10 ÷ (2+3) = 10÷5 = 2」と同等。", "detailsJa": ["B. 5 = ÷ 演算を省略して、2+3, のみを計算します。", "C. 15 = 10+2+3, は違法です。", "D. 8 = 10-2 または同様のもの、一致しません。"]}, {"d": "med", "q": "Biểu thức 逆ポーランド: **「A B + C ×」** tương đương với 中置記法 nào?", "jp": "後置記法「A B + C ×」を中置記法で表すとどれか。", "opts": ["A + B × C", "**(A + B) × C**", "A + (B × C)", "A × (B + C)"], "ans": 1, "why": "Trace:\n1. push A.\n2. push B.\n3. +: pop B, A → tính (A+B), push.\n4. push C.\n5. ×: pop C, (A+B) → tính (A+B)×C, push.\nKết quả: **(A+B)×C**.", "details": ["A. A + B × C = A + (B×C) — sai vì 「+」 thực hiện trước 「×」 trong biểu thức 逆ポーランド trên.", "C. Cùng nghĩa với A.", "D. Sai vị trí — không có (B+C)."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド → 中置 変換", "qJa": "後置記法「A B + C ×」を中置記法で表すとどれか。", "optsJa": ["A + B × C", "**(A + B) × C**", "A + (B × C)", "A × (B + C)"], "whyJa": "トレース:\n1.はAを押します。\n2. Bを押します。\n3. +: ポップ B、A → カウント (A+B)、プッシュ。\n4. Cを押します。\n5. ×：ポップC、(A+B)→カウント(A+B)×C、プッシュ。\n結果: **(A+B)×C**。", "detailsJa": ["A. A + B × C = A + (B×C) — 上記の逆ポーランドの表現では「×」の前に「+」が実行されているため、不正解です。", "C. A と同じ意味。", "D. 間違った位置 — 存在しません (B+C)。"]}, {"d": "med", "q": "**Yasashii 問題2-8 phong cách**: Y = (A - B) × C được viết bằng 後置記法 là 「YAB-C×=」. Tương tự, Y = (A + B) × (C - D ÷ E) được viết là?", "jp": "Y=(A+B)×(C-D÷E)を後置記法で表せ。", "opts": ["Y A B + C - D E ÷ × =", "**Y A B + C D E ÷ - × =**", "Y A B + C × D - E ÷ =", "Y + A B × C - D ÷ E ="], "ans": 1, "why": "Phương pháp Yasashii (cùng 問題2-8): chuyển dần dần, đặt 「=」 cuối cùng:\n• D ÷ E → 「D E ÷」\n• C - (D÷E) → 「C D E ÷ -」\n• A + B → 「A B +」\n• (A+B) × (C-D÷E) → 「A B + C D E ÷ - ×」\n• Y = ... → **「Y A B + C D E ÷ - × =」**.\nNotice: 「=」 cũng được xem như toán tử và đặt SAU.", "details": ["A. Sai vị trí - và DE÷.", "C. Sai cấu trúc — × phải nằm cuối cùng (trước =).", "D. Đó là một dạng 前置記法, không phải 後置."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / Yasashii 問題2-8 平成24年度", "qJa": "**教材「Yasashii」問題2-8風**: Y = (A - B) × Cを後置記法で書くと「YAB-C×=」になります。同様に、Y = (A + B) × (C - D ÷ E) は次のように書きます。", "optsJa": ["Y A B + C - D E ÷ × =", "**Y A B + C D E ÷ - × =**", "Y A B + C × D - E ÷ =", "Y + A B × C - D ÷ E ="], "whyJa": "教材「Yasashii」方法 (問題2-8付き): 徐々に移動し、最後に「=」を置きます:\n• D ÷ E → 「D E ÷」\n• C - (D÷E) → 「C D E ÷ -」\n• A + B → 「A B +」\n• (A+B) × (C-D÷E) → 「A B + C D E ÷ - ×」\n• Y = ... → **「Y A B + C D E ÷ - × =」**。\n注意: 「=」も演算子とみなされ、後に配置されます。", "detailsJa": ["A. 間違った位置 - と DE÷。", "C. 間違った構造 — × は最後 (= の前) に来なければなりません。", "D. それは後置ではなく、前置記法の一種です。"]}, {"d": "med", "q": "Trong 逆ポーランド表記法, **toán tử và toán hạng** xuất hiện theo thứ tự nào trong stack?", "jp": "逆ポーランド表記法における計算では、スタックは何を保持するか。", "opts": ["Stack chỉ chứa toán tử", "Stack chỉ chứa toán hạng (số)", "**Stack chỉ chứa OPERANDS (số / kết quả trung gian). Toán tử KHÔNG được lưu vào stack — chúng được dùng ngay khi gặp**", "Stack chứa cả 2 với label phân biệt"], "ans": 2, "why": "Đặc trưng của thuật toán tính 逆ポーランド bằng stack:\n• Toán hạng (số) → push vào stack.\n• Toán tử → KHÔNG push, mà dùng NGAY để pop 2 toán hạng, tính, push kết quả.\nStack chỉ chứa số (operands hoặc partial results).", "details": ["A. Sai — toán tử không lưu trong stack.", "B. Đúng một phần, nhưng không nêu rõ toán tử dùng ngay.", "D. Quá phức tạp — thực tế stack chỉ chứa số."], "ref": "FE Syllabus — 基礎理論 / スタック / 逆ポーランドのスタック", "qJa": "逆ポーランド表記法における計算では、スタックは何を保持するか。", "optsJa": ["スタックには演算子のみが含まれています", "スタックにはオペランド (数値) のみが含まれています", "**スタックにはオペランド (中間の数値/結果) のみが含まれます。演算子はスタックに保存されません。演算子は見つかるとすぐに使用されます**", "スタックには、独特のラベルが付いた 2 が含まれています"], "whyJa": "スタックによって逆ポーランドを計算するアルゴリズムの特徴:\n• オペランド (数値) → スタックにプッシュします。\n• 演算子 → プッシュはしませんが、2 オペランドをポップし、計算し、結果をプッシュするために使用されます。\nスタックには数値 (オペランドまたは部分的な結果) のみが含まれます。", "detailsJa": ["A. 不正解 — 演算子はスタックに保存されません。", "B. 部分的には正しいですが、即時演算子が指定されていません。", "D. 複雑すぎます — スタックには実際には数字しか含まれていません。"]}, {"d": "easy", "q": "逆ポーランド表記法 có cần dấu **括弧 (ngoặc)** không?", "jp": "逆ポーランド表記法では括弧は必要か。", "opts": ["Có — luôn cần ngoặc để phân biệt thứ tự", "**Không — đây là một MERIT lớn của 逆ポーランド: thứ tự thực hiện đã được xác định rõ chỉ bằng vị trí của toán tử**", "Chỉ cần khi có nhiều phép toán", "Tuỳ thuộc vào máy tính"], "ans": 1, "why": "Lợi ích lớn của 逆ポーランド (và cả ポーランド表記法):\n• KHÔNG cần ngoặc.\n• Thứ tự thực hiện được xác định **DUY NHẤT** bởi vị trí của toán tử.\nVD: 「1 2 + 3 ×」 chắc chắn là (1+2)×3, không thể là 1+(2×3).\nĐây là lý do máy tính ưa dùng cách này.", "details": ["A. Sai — đặc trưng của 中置 (chứ không phải 逆ポーランド).", "C. Sai — ngay cả khi nhiều phép, vẫn không cần ngoặc.", "D. Sai — không phụ thuộc máy tính."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / メリット", "qJa": "逆ポーランド表記法では括弧は必要か。", "optsJa": ["はい — 順序を区別するために常に括弧が必要です", "**いいえ — これは逆ポーランドの大きなメリットです。実行順序は演算子の位置によって明確に定義されます**", "大量の数学演算がある場合にのみ必要", "コンピューターによって異なります"], "whyJa": "逆ポーランド (およびポーランド表記法) の大きな利点:\n• 括弧は必要ありません。\n• 実行順序は、オペレータの立場によって**単独**で決定されます。\n例：「1 2 + 3 ×」は必ず(1+2)×3, となり、1+(2×3)にはなりません。\nこれが、コンピュータがこの方法を好む理由です。", "detailsJa": ["A. 間違っています — 中置の特徴です（逆ポーランドではありません）。", "C. 不正解 — 複数の呪文がある場合でも、括弧は必要ありません。", "D. 不正解 — コンピューターに依存しません。"]}, {"d": "med", "q": "Một biểu thức 逆ポーランド có **N toán hạng** thì cần bao nhiêu **toán tử** (cho phép tính nhị phân)?", "jp": "N個の数字を持つ逆ポーランド式の演算子数はいくつか。", "opts": ["N", "**N - 1**", "N + 1", "2N"], "ans": 1, "why": "Mỗi toán tử nhị phân (+, -, ×, ÷) lấy 2 toán hạng và trả ra 1 kết quả → giảm số toán hạng đi 1. Để từ N toán hạng còn lại 1 kết quả cuối, cần **N - 1** toán tử.\nVD:\n• 「1 2 +」: 2 toán hạng, 1 toán tử ✓\n• 「1 2 + 3 ×」: 3 toán hạng, 2 toán tử ✓\n• 「1 2 3 4 + × -」: 4 toán hạng, 3 toán tử ✓", "details": ["A. N toán tử = N kết quả không ghép thành 1.", "C. N+1 dư — không đủ toán hạng để pop.", "D. 2N — quá nhiều."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 構造", "qJa": "N個の数字を持つ逆ポーランド式の演算子数はいくつか。", "optsJa": ["N", "**N - 1**", "N + 1", "2N"], "whyJa": "各二項演算子 (+、-、​​×、÷) はオペランド 2 を受け取り、結果 1 を返します。 → オペランドの数を 1. だけ減らします。 N 個のオペランドから残りの 1 最終結果を得るには、**N - 1** 演算子が必要です。\nたとえば:\n• 「1 2 +」: 2 オペランド、1 演算子 ✓\n• 「1 2 + 3 ×」: 3 オペランド、2 演算子 ✓\n• 「1 2 3 4 + × -」: 4 オペランド、3 演算子 ✓", "detailsJa": ["A. N 演算子 = N 個のペアになっていない結果 1.", "C. N+1 冗長 — ポップするのに十分なオペランドがありません。", "D. 2N — 多すぎます。"]}, {"d": "hard", "q": "Một biểu thức 逆ポーランド 「**5 1 2 + 4 × + 3 -**」 có giá trị là?", "jp": "「5 1 2 + 4 × + 3 -」の値はいくつか。", "opts": ["**14**", "11", "20", "9"], "ans": 0, "why": "Trace stack từng bước:\n1. 「5」: [5]\n2. 「1」: [5, 1]\n3. 「2」: [5, 1, 2]\n4. 「+」: pop 2, 1 → 1+2=3, push → [5, 3]\n5. 「4」: [5, 3, 4]\n6. 「×」: pop 4, 3 → 3×4=12, push → [5, 12]\n7. 「+」: pop 12, 5 → 5+12=17, push → [17]\n8. 「3」: [17, 3]\n9. 「-」: pop 3, 17 → 17-3=**14**, push → [14].\nKết quả: **14**.\nTương đương 中置: 5 + (1+2)×4 - 3 = 5 + 12 - 3 = 14.", "details": ["B. 11 sai phép tính.", "C. 20 = (5+1+2)×4-... sai.", "D. 9 sai phép tính."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 複雑な式 / 過去問風", "qJa": "「5 1 2 + 4 × + 3 -」の値はいくつか。", "optsJa": ["**14**", "11", "20", "9"], "whyJa": "スタックをステップごとにトレースします。\n1. 「5」: [5]\n2. 「1」: [5, 1]\n3. 「2」: [5, 1, 2]\n4. 「+」: ポップ 2, 1 → 1+2=3, プッシュ → [5, 3]\n5. 「4」: [5, 3, 4]\n6. 「×」：ポップ 4, 3 → 3×4=12, プッシュ → [5, 12]\n7. 「+」: ポップ 12, 5 → 5+12=17, プッシュ → [17]\n8. 「3」: [17, 3]\n9. 「-」: 3, 17 → 17-3=**14** を押し、→ [14] を押します。\n結果: **14**。\n同等の中置: 5 + (1+2)×4 - 3 = 5 + 12 - 3 = 14.", "detailsJa": ["B. 11 の計算が間違っています。", "C. 20 = (5+1+2)×4-... 違います。", "D. 9 の計算が間違っています。"]}, {"d": "med", "q": "Khi tính 「**A B C - +**」 với A=10, B=5, C=2, kết quả là?", "jp": "A=10, B=5, C=2のとき「A B C - +」の値はいくつか。", "opts": ["**13**", "7", "17", "3"], "ans": 0, "why": "Trace:\n1. push 10 → [10]\n2. push 5 → [10, 5]\n3. push 2 → [10, 5, 2]\n4. 「-」: pop 2, 5 → 5-2=3, push → [10, 3]\n5. 「+」: pop 3, 10 → 10+3=**13**, push → [13].\nTương đương 中置: 10 + (5-2) = 10 + 3 = **13**.", "details": ["B. 7 = 10-5+2, sai phép.", "C. 17 = 10+5+2, sai phép.", "D. 3 = chỉ tính (5-2), bỏ qua phép +."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 変数代入計算", "qJa": "A=10, B=5, C=2のとき「A B C - +」の値はいくつか。", "optsJa": ["**13**", "7", "17", "3"], "whyJa": "トレース:\n1. プッシュ 10 → [10]\n2. プッシュ 5 → [10, 5]\n3. プッシュ 2 → [10, 5, 2]\n4. 「-」: ポップ 2, 5 → 5-2=3, プッシュ → [10, 3]\n5. 「+」: 3, 10 → 10+3=**13**をポップ、→ [13]。\n中置に相当します: 10 + (5-2) = 10 + 3 = **13**。", "detailsJa": ["B. 7 = 10-5+2, は違法です。", "C. 17 = 10+5+2, は違法です。", "D. 3 = (5-2) のみを計算し、+ を無視します。"]}, {"d": "hard", "q": "**Yasashii nhấn mạnh** trong 「もう少し詳しく」: lý do FE thi 逆ポーランド là gì?", "jp": "逆ポーランド表記法がコンピュータで使われる理由はどれか。", "opts": ["Vì ngắn gọn hơn 中置記法", "**Vì kết hợp tự nhiên với cơ chế STACK — máy tính dễ dàng tính giá trị mà không cần phân tích cú pháp phức tạp (như xử lý ngoặc)**", "Vì chỉ dùng được số nguyên", "Vì khả năng đọc cao hơn cho người"], "ans": 1, "why": "Yasashii もう少し詳しく: 「コンピュータは、下図のように『逆ポーランド表記法』と『スタックの仕組み』を組み合わせて計算を行っています」.\nLợi ích:\n• Không cần parse ngoặc.\n• Thuật toán đơn giản, O(n).\n• Phù hợp với CPU stack-based.\n→ Compiler thường chuyển 中置 → 逆ポーランド để CPU xử lý.", "details": ["A. Không hẳn ngắn hơn — vd \"1+2\" (3 ký tự) ngắn hơn \"1 2 +\" (5 ký tự với khoảng trắng).", "C. Sai — 逆ポーランド không giới hạn loại số.", "D. Ngược lại — người đọc 中置記法 dễ hơn."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / コンピュータ内部処理", "qJa": "逆ポーランド表記法がコンピュータで使われる理由はどれか。", "optsJa": ["中置記法より簡潔だから", "**STACK メカニズムと自然に関連付けられているため、コンピューターは複雑な解析 (括弧の処理など) を行わずに値を簡単に計算します**", "整数しか使えないので", "人間にとって可読性が高いため"], "whyJa": "やさしくもう少し詳しく: 「コンピュータは、下図のように『逆ポーランド表記法』と『スタックの仕組み』を組み合わせて計算を行っています」。\n利点:\n• 括弧を解析する必要はありません。\n• シンプルなアルゴリズム、O(n)。\n• スタックベースの CPU に適しています。\n→コンパイラは中置→逆ポーランドをCPUに転送して処理することが多いです。", "detailsJa": ["A. 必ずしも短いとは限りません — 例: 「1+2」（3 文字）は、「1 2 +」（スペースを含む 5 文字）より短いです。", "C. Sai — 逆ポーランドには数値の種類に制限がありません。", "D. 逆に、人々にとっては中置記法の方が読みやすいです。"]}, {"d": "med", "q": "Chuyển biểu thức **「A ÷ B ÷ C」** (cùng độ ưu tiên, kết hợp trái) sang 逆ポーランド?", "jp": "「A÷B÷C」（左結合）を後置記法で表せ。", "opts": ["A B ÷ C ÷", "**A B ÷ C ÷**", "A B C ÷ ÷", "A ÷ B C ÷"], "ans": 1, "why": "Phép ÷ kết hợp TRÁI: A÷B÷C = (A÷B)÷C.\n1. A ÷ B → 「A B ÷」.\n2. (A÷B) ÷ C → 「(A B ÷) C ÷」 → **「A B ÷ C ÷」**.\nKhác với: A B C ÷ ÷ = A÷(B÷C) — cách kết hợp PHẢI, không đúng quy ước thông thường.", "details": ["A. Cùng đáp án với B.", "C. Đó là A÷(B÷C), không phải kết hợp trái.", "D. Đó là 中置 hỗn hợp, không phải 逆ポーランド."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 結合性", "qJa": "「A÷B÷C」（左結合）を後置記法で表せ。", "optsJa": ["A B ÷ C ÷", "**A B ÷ C ÷**", "A B C ÷ ÷", "A ÷ B C ÷"], "whyJa": "左の組み合わせ ÷: A÷B÷C = (A÷B)÷C。\n1. A ÷ B → 「A B ÷」。\n2. (A÷B) ÷ C → 「(A B ÷) C ÷」 → **「A B ÷ C ÷」**。\n異なる点: A B C ÷ ÷ = A÷(B÷C) — 通常の規則に従っていない、組み合わせが必須です。", "detailsJa": ["A. B と同じ答えです。", "C. それは左接続詞ではなく、A÷(B÷C)です。", "D. それは逆ポーランドではなく、混合中置です。"]}, {"d": "med", "q": "Một biểu thức 逆ポーランド có thể tính được không **nếu thiếu một toán hạng**, vd: 「**2 +**」?", "jp": "「2 +」は計算できるか。", "opts": ["Có — phép + đơn nhị (unary)", "**Không — phép + cần 2 toán hạng (binary). Khi gặp +, pop chỉ được 1 số → ERROR (stack underflow)**", "Có — kết quả mặc định là 2", "Phụ thuộc vào ngôn ngữ lập trình"], "ans": 1, "why": "Toán tử + trong bối cảnh thông thường là BINARY (cần 2 toán hạng). Trong 逆ポーランド:\n• Push 2 → stack [2].\n• Gặp + → cần pop 2 phần tử, nhưng chỉ có 1 → **stack underflow** → lỗi.\nBiểu thức 逆ポーランド hợp lệ cần **N toán hạng + (N-1) toán tử** đúng vị trí.", "details": ["A. + unary thường viết khác (vd \"+2\"), không phải dạng RPN chuẩn.", "C. Sai — RPN nghiêm ngặt, không có mặc định.", "D. Sai — đây là quy tắc toán học, không phụ thuộc ngôn ngữ."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / エラー処理", "qJa": "「2 +」は計算できるか。", "optsJa": ["はい — 許可 + モノラル (単項)", "**いいえ - 許可 + 2 (バイナリ) オペランドが必要です。 + に遭遇した場合、pop は番号 1 のみを取得します → エラー (スタック アンダーフロー)**", "はい — デフォルトの結果は 2 です", "プログラミング言語に依存"], "whyJa": "通常のコンテキストにおける + 演算子は BINARY です (2 オペランドが必要)。逆ポーランド:\n• 2 → [2] をスタックします。\n• + に遭遇 → 2 要素をポップする必要があるが、1 → **スタックアンダーフロー** → エラーのみ。\n有効な逆ポーランド式には、正しい位置に **N オペランド + (N-1) 演算子** が必要です。", "detailsJa": ["A. + 単項は、標準の RPN 形式ではなく、別の方法で書かれることがよくあります (例: \"+2\")。", "C. 不正解 — 厳密な RPN、デフォルトなし。", "D. 不正解 — これは言語とは独立した数学的な規則です。"]}, {"d": "hard", "q": "Tổng kết: chiến lược tốt nhất để giải bài toán **逆ポーランド** trong kỳ thi FE là gì?", "jp": "FE試験で逆ポーランド問題を解くベスト戦略はどれか。", "opts": ["Học thuộc tất cả công thức chuyển đổi", "**(1) Nắm chắc quy tắc PUSH số / OP toán tử pop 2; (2) VẼ stack thực sự khi giải; (3) Convert có hệ thống: 括弧 > × ÷ > + -, đặt 「=」 cuối cùng nếu có; (4) Luyện 過去問 đa dạng**", "Đoán dựa trên hình thức", "Dùng máy tính bỏ túi"], "ans": 1, "why": "Chiến lược thực hành tốt cho FE:\n1. **Hiểu cơ chế stack** (Yasashii Ch.3 Lesson 03-01).\n2. **Vẽ stack từng bước** khi tính — đừng nhẩm dễ sai.\n3. **Convert có hệ thống**: theo thứ tự ưu tiên 括弧 → × ÷ → + - → =.\n4. **Luyện qua 過去問**: 平成24, 26, 28... có nhiều dạng.\n5. **Kiểm tra ngược**: thử convert ngược 逆ポーランド → 中置 để verify.", "details": ["A. Không có \"công thức\" cố định, chỉ có quy tắc.", "C. Đoán không hiệu quả với bài tính phức tạp.", "D. FE không cho dùng máy tính bỏ túi."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 学習戦略", "qJa": "FE試験で逆ポーランド問題を解くベスト戦略はどれか。", "optsJa": ["変換式をすべて暗記する", "**(1) 数値 PUSH ルール / OP ポップ演算子 2 を理解します。 (2) 解くときに実際のスタックを描画します。 (3) 体系的な変換: 括弧 &gt; × ÷ &gt; + -、「=」がある場合は最後に置きます。 (4) さまざまな過去問を練習してください**", "見た目から推測", "ポケット電卓を使用する"], "whyJa": "FE の優れた実践戦略:\n1. **スタックの仕組みを理解する** (やさしい Ch.3 レッスン 03-01)。\n2. **計算するときはスタックを段階的に描画します**。心の中で間違いを犯さないようにしてください。\n3. **体系的な変換**: 優先順位順に括弧 → × ÷ → + - → =。\n4. **過去問を通して練習する**: 平成 24, 26, 28... にはさまざまな形式があります。\n5. **逆チェック**: 逆ポーランド→中置の逆変換を試して確認してください。", "detailsJa": ["A. 決まった「公式」はなく、ルールがあるだけです。", "C. 複雑な計算では推測は効果的ではありません。", "D. FE では電卓は使用できません。"]}]</script>
