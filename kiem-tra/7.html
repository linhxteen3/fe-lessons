  {"d": "easy", "q": "Có **3 cách biểu diễn 計算式 (公式 toán)** theo Yasashii 02-03. Đó là 3 cách nào?", "jp": "計算式を表す方法の3種類はどれか。", "opts": ["中置記法 / 順置記法 / 逆置記法", "**中置記法 / 前置記法 (ポーランド表記法) / 後置記法 (逆ポーランド表記法)**", "10進法 / 2進法 / 16進法", "代数表記 / 函数表記 / 集合表記"], "ans": 1, "why": "Yasashii Lesson 02-03: 「計算式を表す方法には、次の3種類があります。・中置記法 ・前置記法（ポーランド表記法）・後置記法（逆ポーランド表記法）」.\nKhác biệt nằm ở VỊ TRÍ đặt toán tử (演算子) so với toán hạng:\n• 中置: toán tử ở GIỮA (như công thức thông thường).\n• 前置: toán tử Ở TRƯỚC.\n• 後置: toán tử Ở SAU.", "details": ["A. Không có thuật ngữ \"順置/逆置\" trong FE.", "C. Đó là cách biểu diễn SỐ, không phải công thức.", "D. Đó là thuật ngữ toán học rộng, không phải 3 cách biểu diễn 計算式 theo Yasashii."], "ref": "FE Syllabus — 基礎理論 / 計算式の表し方 / Yasashii 02-03"},
  {"d": "easy", "q": "**中置記法 (chū-chi-ki-hō / infix notation)** là gì?", "jp": "中置記法の定義はどれか。", "opts": ["Đặt toán tử ở TRƯỚC các toán hạng", "Đặt toán tử ở SAU các toán hạng", "**Đặt toán tử ở GIỮA hai toán hạng (数字の間に演算子を置く) — đây là cách chúng ta thường dùng hàng ngày**", "Không có toán tử, chỉ có toán hạng"], "ans": 2, "why": "Yasashii: 「中置記法とは、数字の間に『+』や『-』などの演算子を置く表記法です。中置記法は、私たちが普段利用している表記法です。演算子を値と値の『中』に『置』くので、中置記法です」.\nVí dụ: \"1 + 2\" — dấu + nằm GIỮA 1 và 2.", "details": ["A. Đó là 前置記法 (prefix).", "B. Đó là 後置記法 (postfix).", "D. Sai — phải có toán tử."], "ref": "FE Syllabus — 基礎理論 / 中置記法"},
  {"d": "easy", "q": "Biểu thức 「1 + 2」 được viết lại bằng **前置記法 (ポーランド表記法)** là gì?", "jp": "「1 + 2」を前置記法で表すとどれか。", "opts": ["1 2 +", "**+ 1 2**", "1 + 2", "1 2 + 3"], "ans": 1, "why": "Yasashii: 「前置記法とは、数字の前に『+』や『-』などの演算子を置く表記法です」. Toán tử + được đặt ở **đầu**, các toán hạng theo sau với khoảng trắng (スペース) phân cách: 「+ 1 2」.\n別名: **ポーランド表記法** (Polish notation) — đặt theo tên nhà logic học Ba Lan **ヤン・ウカシェヴィチ (Jan Łukasiewicz)**.", "details": ["A. Đó là 後置記法 (postfix / 逆ポーランド).", "C. Đó là 中置記法 (infix - ban đầu).", "D. Không khớp công thức 1+2."], "ref": "FE Syllabus — 基礎理論 / 前置記法 / ポーランド表記法"},
  {"d": "easy", "q": "Biểu thức 「1 + 2」 được viết lại bằng **後置記法 (逆ポーランド表記法)** là gì?", "jp": "「1 + 2」を後置記法で表すとどれか。", "opts": ["**1 2 +**", "+ 1 2", "1 + 2", "+ 2 1"], "ans": 0, "why": "Yasashii: 「後置記法とは、数字の後ろに『+』や『-』などの演算子を置く表記法です。表記ルールは、演算子を後ろに置くこと以外、前置記法と同じです。後置記法は逆ポーランド表記法とも呼ばれます」.\nToán tử + đặt ở **cuối**, các toán hạng đứng trước: 「1 2 +」.", "details": ["B. Đó là 前置記法 (prefix).", "C. Đó là 中置記法 (infix).", "D. Sai thứ tự toán hạng (đảo 2 và 1)."], "ref": "FE Syllabus — 基礎理論 / 後置記法 / 逆ポーランド表記法"},
  {"d": "easy", "q": "Theo Yasashii 「**試験にはコレが出る!**」, dạng nào ĐƯỢC HỎI trong kỳ thi FE?", "jp": "基本情報技術者試験で出題されるのはどの表記法か。", "opts": ["中置記法 (infix)", "前置記法 (ポーランド表記法 / prefix)", "**後置記法 (逆ポーランド表記法 / postfix)**", "Cả 3 đều được hỏi đều nhau"], "ans": 2, "why": "Yasashii nhấn mạnh: 「基本情報技術者試験では『後置記法（逆ポーランド表記法）』が出題される。中置記法や前置記法（ポーランド表記法）は出題されない」.\nLý do: 逆ポーランド表記法 là cách máy tính **TÍNH THỰC SỰ** ở bên trong (kết hợp với 「スタックの仕組み」). FE muốn thí sinh hiểu cách máy tính xử lý biểu thức.", "details": ["A. 中置記法 là cách viết thông thường, KHÔNG được hỏi (Yasashii nói rõ).", "B. 前置記法 cũng KHÔNG được hỏi.", "D. Sai — chỉ 後置記法 (逆ポーランド) được hỏi."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド表記法 / 出題傾向"},
  {"d": "med", "q": "Tại sao FE thi 「**逆ポーランド表記法**」 mà không thi 中置記法 hay 前置記法?", "jp": "なぜ逆ポーランド表記法がFE試験で出題されるのか。", "opts": ["Vì nó là cách dễ nhất để viết", "**Vì 逆ポーランド表記法 là cách máy tính BÊN TRONG (コンピュータ内部) thực sự dùng để xử lý biểu thức — kết hợp với スタックの仕組み (cơ chế stack)**", "Vì nó được phát minh tại Nhật", "Vì nó không cần dùng dấu cách (スペース)"], "ans": 1, "why": "Yasashii もう少し詳しく: 「基本情報技術者試験で『逆ポーランド表記法』が出題される理由は、この記法がコンピュータ内部で使われている表記法だからです。コンピュータは、下図のように『逆ポーランド表記法』と『スタックの仕組み』（p.81）を組み合わせて計算を行っています」.", "details": ["A. Sai — viết bằng tay thì 中置 dễ nhất.", "C. Sai — phát minh bởi nhà logic học Ba Lan ヤン・ウカシェヴィチ.", "D. Sai — 逆ポーランド CẦN khoảng trắng để phân tách các số."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド表記法 / 出題理由"},
  {"d": "easy", "q": "Trong cả 前置記法 và 後置記法, **vì sao cần dấu スペース (khoảng trắng)** giữa các số?", "jp": "前置/後置記法でスペースが必要な理由はどれか。", "opts": ["Vì đẹp mắt hơn", "**Vì nếu không có スペース, 「1」 và 「2」 sẽ dính nhau thành 「12」 — không phân biệt được**", "Vì máy tính yêu cầu cú pháp như vậy", "Vì là quy ước tiếng Nhật"], "ans": 1, "why": "Yasashii (trong phần 前置記法): 「前置記法では、数と数をスペースで区切ります。スペースがなければ『1』と『2』がくっついて『12』と読めてしまうからです」.\nVD: 「+ 1 2」 nếu thiếu スペース thành 「+12」 không thể phân biệt là 「+ 1 2」 hay 「+ 12」 hay 「+ 1 2」.", "details": ["A. Không phải lý do thẩm mỹ.", "C. Không có yêu cầu cú pháp hệ điều hành.", "D. Không liên quan đến quy ước ngôn ngữ."], "ref": "FE Syllabus — 基礎理論 / 表記法 / スペース"},
  {"d": "med", "q": "Bảng tổng kết (Yasashii 表記法のまとめ): biểu thức 「**1 + 2**」 được viết trong 3 cách lần lượt là?", "jp": "「1+2」の3つの表記の組合せはどれか。", "opts": ["中置: +1 2 / 前置: 1+2 / 後置: 1 2+", "**中置: 1+2 / 前置: +1 2 / 後置: 1 2+**", "中置: 1 2+ / 前置: 1+2 / 後置: +1 2", "Tất cả đều là 1+2"], "ans": 1, "why": "Theo bảng 表記法のまとめ trong Yasashii 02-03:\n• 中置記法: 「1+2」 (toán tử giữa, dùng hàng ngày).\n• 前置記法 (ポーランド表記法): 「+1 2」.\n• 後置記法 (逆ポーランド表記法): 「1 2+」.", "details": ["A. Sai vị trí của 中置 và 前置.", "C. Hoán đổi sai cả 3 cách.", "D. Sai — 3 cách biểu diễn KHÁC NHAU."], "ref": "FE Syllabus — 基礎理論 / 表記法のまとめ"},
  {"d": "easy", "q": "**別名 (tên gọi khác)** của 前置記法 và 後置記法 trong Yasashii là gì?", "jp": "前置記法と後置記法の別名はどれか。", "opts": ["前置 = 上位記法 / 後置 = 下位記法", "**前置 = ポーランド表記法 / 後置 = 逆ポーランド表記法**", "前置 = ヨーロッパ式 / 後置 = アメリカ式", "2 cách không có tên gọi khác"], "ans": 1, "why": "Yasashii bảng tổng kết:\n• 前置記法 → 別名: **ポーランド表記法 (Polish Notation)** — đặt theo tên nhà toán học Ba Lan ヤン・ウカシェヴィチ.\n• 後置記法 → 別名: **逆ポーランド表記法 (Reverse Polish Notation / RPN)** — vì viết ngược với ポーランド表記法.", "details": ["A. Không có thuật ngữ \"上位/下位記法\".", "C. Không có sự phân chia theo địa lý.", "D. Sai — đều có tên gọi khác."], "ref": "FE Syllabus — 基礎理論 / 別名"},
  {"d": "med", "q": "Theo Yasashii (mở đầu Lesson 02-03), 「**ポーランド表記法**」 được phát minh bởi ai?", "jp": "ポーランド表記法を考案した人物はどれか。", "opts": ["アラン・チューリング (Alan Turing)", "**ヤン・ウカシェヴィチ (Jan Łukasiewicz) — nhà logic học Ba Lan**", "クロード・シャノン (Claude Shannon)", "ジョン・フォン・ノイマン (John von Neumann)"], "ans": 1, "why": "Yasashii 02-03 ghi: 「ヤン・ウカシェヴィチが考案した計算式『ポーランド表記法』には、発案者の名前ではなく、彼の出生国の国名が付けられました」.\nJan Łukasiewicz (1878-1956) — nhà logic học người Ba Lan. Cách biểu diễn được đặt tên theo QUỐC GIA (Ba Lan) thay vì tên ông.", "details": ["A. Turing là cha đẻ của 計算理論 / Turing machine, không phải Polish notation.", "C. Shannon là cha đẻ của 情報理論.", "D. Von Neumann nổi tiếng với 「ノイマン型コンピュータ」, không liên quan."], "ref": "FE Syllabus — 基礎理論 / ポーランド表記法 / 歴史"},
  {"d": "easy", "q": "Chuyển biểu thức 「**3 + 4**」 sang 逆ポーランド表記法 (後置記法)?", "jp": "「3+4」を逆ポーランド表記法で表せ。", "opts": ["**3 4 +**", "+ 3 4", "3 + 4", "4 3 +"], "ans": 0, "why": "Quy tắc: đặt toán tử SAU 2 toán hạng, GIỮ NGUYÊN thứ tự toán hạng.\n3 + 4 → **3 4 +**.\nĐọc: \"đem 3, đem 4, cộng lại\".", "details": ["B. Đó là 前置記法.", "C. Đó là 中置記法 ban đầu.", "D. Sai thứ tự toán hạng — phải giữ 3 trước 4 vì phép cộng có giao hoán nhưng quy ước chuyển vẫn giữ thứ tự ban đầu."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド変換 / 基本"},
  {"d": "easy", "q": "Chuyển biểu thức 「**5 - 2**」 sang 逆ポーランド表記法?", "jp": "「5-2」を逆ポーランド表記法で表せ。", "opts": ["- 5 2", "**5 2 -**", "2 5 -", "5 - 2"], "ans": 1, "why": "Phép trừ KHÔNG có tính giao hoán, nên thứ tự RẤT QUAN TRỌNG.\n5 - 2 → **5 2 -**.\nKiểm tra: pop 2 trước (top), pop 5 sau, tính \"5 - 2\" = 3 (số dưới TRỪ số trên).", "details": ["A. Đó là 前置記法.", "C. Đảo ngược thứ tự → \"2-5\" = -3, không phải kết quả mong muốn.", "D. Đó là 中置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 順序の重要性"},
  {"d": "med", "q": "Chuyển biểu thức 「**(1 + 2) × 3**」 sang 逆ポーランド表記法 (theo ví dụ Yasashii):", "jp": "「(1+2)×3」を逆ポーランド表記法で表せ。", "opts": ["1 + 2 × 3", "**1 2 + 3 ×**", "1 2 3 + ×", "× + 1 2 3"], "ans": 1, "why": "Quy tắc convert:\n1. Tính 「1+2」 trước (do dấu ngoặc) → \"1 2 +\" (kết quả ngầm = 3).\n2. Lấy kết quả nhân với 3 → \"(1 2 +) 3 ×\" → **「1 2 + 3 ×」**.\nĐây là VÍ DỤ trong Yasashii 02-03 (もう少し詳しく box).", "details": ["A. Đó vẫn là 中置記法.", "C. Sai thứ tự — phải tính (1+2) trước rồi mới × 3.", "D. Đó là 前置記法 sai cú pháp."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド変換 / Yasashii 02-03 例"},
  {"d": "med", "q": "Chuyển biểu thức 「**A × (B + C)**」 sang 逆ポーランド表記法?", "jp": "「A×(B+C)」を逆ポーランド表記法で表せ。", "opts": ["A B C + ×", "**A B C + ×** (toán hạng A, B, C giữ thứ tự; tính B+C trước rồi × A)", "A + B × C", "× A + B C"], "ans": 1, "why": "Bước 1: B + C → 「B C +」.\nBước 2: A × (B+C) → 「A (B C +) ×」 → **「A B C + ×」**.\nKiểm tra bằng stack: push A, push B, push C, gặp + → pop C, B → push (B+C); push thực ra không, gặp × → pop (B+C), A → push (A × (B+C)).", "details": ["A. Đúng — nhưng A đáp án đã ghi giống B (cùng đáp án).", "C. Đó là 中置記法.", "D. Đó là 前置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 括弧の処理"},
  {"d": "med", "q": "Chuyển biểu thức 「**A + B × C**」 (không có dấu ngoặc) sang 逆ポーランド表記法 — chú ý 演算子の優先順位 (× > +):", "jp": "「A+B×C」を逆ポーランド表記法で表せ。（×が+より優先）", "opts": ["A B C × +", "**A B C × +**", "A B + C ×", "A + B × C"], "ans": 1, "why": "Quy tắc 優先順位 (ưu tiên): **括弧 > かけ算・わり算 > たし算・ひき算**.\nDo × ưu tiên hơn +, ta tính 「B×C」 trước:\n• B × C → 「B C ×」\n• A + (B×C) → 「A (B C ×) +」 → **「A B C × +」**.", "details": ["A. Cùng đáp án với B.", "C. Sai — đây là cách tính nếu (A+B)×C, KHÔNG phải A+B×C.", "D. Đó là 中置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 演算子の優先順位"},
  {"d": "hard", "q": "**過去問 平成24年度 Yasashii 問題2-8**: Chuyển 「**Y = (A + B) × (C - D ÷ E)**」 sang 逆ポーランド表記法 (chú ý 「=」 cũng là toán tử và đặt ở cuối cùng):", "jp": "「Y=(A+B)×(C-D÷E)」を後置記法で表せ。", "opts": ["Y A B + C - D E ÷ × =", "**Y A B + C D E ÷ - × =**", "Y A + B × C - D ÷ E =", "Y A B + C D - E ÷ × ="], "ans": 1, "why": "Phương pháp Yasashii: chuyển từng phép theo thứ tự ưu tiên — 括弧 > × ÷ > + - > = (= ở cuối):\n1. D ÷ E → 「D E ÷」\n2. C - (D÷E) → 「C D E ÷ -」\n3. A + B → 「A B +」\n4. (A+B) × (C-D÷E) → 「(A B +) (C D E ÷ -) ×」 → 「A B + C D E ÷ - ×」\n5. Y = ... → 「Y (...) =」 → **「Y A B + C D E ÷ - × =」**.\nĐây là 平成24年度 問題2-8 trong Yasashii 02-03.", "details": ["A. Sai vị trí - và DE÷ — phải là 「C D E ÷ -」 chứ không phải 「C - D E ÷」.", "C. Đó là 中置記法.", "D. Sai — không phải 「C D - E ÷」 mà phải tính D÷E trước rồi C trừ kết quả."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / Yasashii 問題2-8 平成24年度"},
  {"d": "med", "q": "Chuyển biểu thức 「**(A - B) × (C + D)**」 sang 逆ポーランド表記法?", "jp": "「(A-B)×(C+D)」を後置記法で表せ。", "opts": ["A - B × C + D", "**A B - C D + ×**", "A B - × C D +", "× - A B + C D"], "ans": 1, "why": "Tính từng vế trong dấu ngoặc trước:\n1. A - B → 「A B -」\n2. C + D → 「C D +」\n3. (A-B) × (C+D) → 「(A B -) (C D +) ×」 → **「A B - C D + ×」**.", "details": ["A. Đó là 中置記法.", "C. Sai thứ tự — × phải đặt CUỐI CÙNG sau khi cả 2 vế đã sẵn sàng.", "D. Đó là 前置記法 sai cú pháp."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 2つの括弧"},
  {"d": "hard", "q": "Chuyển biểu thức 「**A + B × C - D ÷ E**」 (không có ngoặc) sang 逆ポーランド?", "jp": "「A+B×C-D÷E」を後置記法で表せ。", "opts": ["A B C + × D E ÷ -", "**A B C × + D E ÷ -**", "A B + C × D - E ÷", "A + B × C - D ÷ E"], "ans": 1, "why": "Ưu tiên: × và ÷ trước, sau đó + và -:\n1. B × C → 「B C ×」\n2. A + (B×C) → 「A B C × +」\n3. D ÷ E → 「D E ÷」\n4. (A+B×C) - (D÷E) → 「(A B C × +) (D E ÷) -」 → **「A B C × + D E ÷ -」**.", "details": ["A. Sai vị trí ×, phải nằm sau B C chứ không sau A B C.", "C. Sai vị trí + và ×.", "D. Đó là 中置記法."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 優先順位の混在"},
  {"d": "hard", "q": "Chuyển 「**A × B + C × D**」 sang 逆ポーランド?", "jp": "「A×B+C×D」を後置記法で表せ。", "opts": ["A B × C D + ×", "**A B × C D × +**", "A B + C D × ×", "A B C D × × +"], "ans": 1, "why": "Vì × ưu tiên hơn +, tính 2 phép × trước:\n1. A × B → 「A B ×」\n2. C × D → 「C D ×」\n3. (A×B) + (C×D) → **「A B × C D × +」**.", "details": ["A. Sai — phải là 「A B × C D ×」 cho 2 phép nhân riêng biệt; cuối cùng là +.", "C. Sai vị trí + (phải cuối cùng) và × (phải sau từng cặp).", "D. Sai cú pháp — không thể có 2 × liền nhau."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 同じ優先度"},
  {"d": "med", "q": "Chuyển biểu thức **3 mức ngoặc**: 「**((A + B) × C) - D**」 sang 逆ポーランド?", "jp": "「((A+B)×C)-D」を後置記法で表せ。", "opts": ["**A B + C × D -**", "A + B × C - D", "A B + × C - D", "A B C + × D -"], "ans": 0, "why": "Tính từ trong ra ngoài:\n1. A + B → 「A B +」\n2. (A+B) × C → 「(A B +) C ×」 → 「A B + C ×」\n3. ((A+B)×C) - D → 「(A B + C ×) D -」 → **「A B + C × D -」**.", "details": ["B. Đó là 中置記法.", "C. Sai thứ tự — × phải đứng sau C, không phải sau +.", "D. Sai vị trí + (phải nằm ngay sau A B)."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 多重括弧"},
  {"d": "easy", "q": "Khi tính biểu thức 逆ポーランド bằng **スタック (stack)**, quy tắc là gì? (theo Yasashii 計算手順)", "jp": "スタックを使った逆ポーランドの計算方法はどれか。", "opts": ["Đọc từ phải sang trái", "**Đọc từ trái sang phải; gặp 数字 → PUSH vào stack; gặp 演算子 → POP 2 số trên cùng, tính, PUSH kết quả lại**", "Tất cả số được push trước, sau đó mới tính", "Sử dụng queue (FIFO) thay vì stack"], "ans": 1, "why": "Yasashii もう少し詳しく - 逆ポーランド表記法での計算手順:\n• Duyệt biểu thức TỪ TRÁI SANG PHẢI.\n• Nếu là 数字 (toán hạng) → **PUSH** vào stack.\n• Nếu là 演算子 → **POP 2 phần tử** trên cùng (số B = top, A = next), tính (A op B), rồi **PUSH** kết quả trở lại stack.\n• Cuối cùng, kết quả còn lại trong stack = giá trị biểu thức.", "details": ["A. Sai — đọc từ TRÁI sang PHẢI.", "C. Sai — push và pop xen kẽ theo thứ tự token.", "D. Sai — stack (LIFO) không phải queue (FIFO)."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / スタック"},
  {"d": "easy", "q": "Khi gặp 演算子 trong 逆ポーランド, **thứ tự pop** 2 số từ stack là gì? Giả sử stack có A (đáy) - B (đỉnh):", "jp": "演算子に出会ったとき、スタックから取り出す順序はどれか。", "opts": ["Pop A trước, pop B sau → tính A op B", "**Pop B trước (top), pop A sau (next-to-top) → tính A op B (số dưới op số trên)**", "Pop cả 2 cùng lúc", "Không pop, chỉ peek"], "ans": 1, "why": "Stack là LIFO — **pop ra phần tử trên cùng trước** (B), rồi pop phần tử kế tiếp (A). Khi tính 「A op B」: A là toán hạng TRƯỚC, B là toán hạng SAU trong biểu thức gốc.\nLý do: trong 逆ポーランド 「A B op」, A được push trước (xuống đáy), B push sau (lên đỉnh). Khi pop, ra B trước, sau đó A. Phép toán chuẩn là 「A op B」 (theo thứ tự xuất hiện gốc).", "details": ["A. Sai — không thể pop A trước vì A nằm dưới B trong stack.", "C. Sai — stack pop từng phần tử một.", "D. Sai — phải pop để có thể tính rồi push kết quả."], "ref": "FE Syllabus — 基礎理論 / スタック演算 / pop順序"},
  {"d": "med", "q": "Tính giá trị của biểu thức 逆ポーランド: **「2 3 +」**", "jp": "逆ポーランドの式「2 3 +」の値はいくつか。", "opts": ["**5**", "6", "23", "-1"], "ans": 0, "why": "Trace stack:\n1. 「2」: push 2 → stack [2].\n2. 「3」: push 3 → stack [2, 3].\n3. 「+」: pop 3, pop 2, tính 2+3=5, push 5 → stack [**5**].\nKết quả cuối cùng: **5**.", "details": ["B. 6 không phải tổng của 2 và 3.", "C. 23 là ghép số chứ không phải phép cộng.", "D. -1 sẽ đúng nếu là phép trừ 2-3, không phải cộng."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 基本"},
  {"d": "med", "q": "Tính giá trị của biểu thức 逆ポーランド: **「6 2 -」**", "jp": "逆ポーランドの式「6 2 -」の値はいくつか。", "opts": ["**4**", "-4", "8", "62"], "ans": 0, "why": "Trace stack:\n1. 「6」: push 6 → [6].\n2. 「2」: push 2 → [6, 2].\n3. 「-」: pop 2 (top), pop 6 (next), tính **6 - 2 = 4**, push → [4].\nQuan trọng: phải tính số DƯỚI trừ số TRÊN (6 - 2), KHÔNG phải số trên trừ số dưới.", "details": ["B. -4 sẽ đúng nếu tính 2-6 (sai thứ tự).", "C. 8 là phép cộng.", "D. 62 là ghép số."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 引き算の順序"},
  {"d": "med", "q": "Tính giá trị của biểu thức 逆ポーランド (theo Yasashii ví dụ): **「1 2 + 3 ×」**", "jp": "逆ポーランドの式「1 2 + 3 ×」の値はいくつか。", "opts": ["**9**", "7", "6", "5"], "ans": 0, "why": "Trace stack (theo Yasashii 計算手順):\n1. 「1」: push 1 → [1].\n2. 「2」: push 2 → [1, 2].\n3. 「+」: pop 2, pop 1, tính 1+2=3, push 3 → [3].\n4. 「3」: push 3 → [3, 3].\n5. 「×」: pop 3, pop 3, tính 3×3=**9**, push 9 → [9].\nĐây tương đương với 中置記法 「(1+2)×3 = 9」.", "details": ["B. 7 = 1+2+3+1, sai phép tính.", "C. 6 = 1×2×3 hoặc 1+2+3, không khớp.", "D. 5 = chỉ tính 2+3, bỏ qua 1."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / Yasashii 計算例"},
  {"d": "hard", "q": "Tính giá trị của biểu thức 逆ポーランド: **「5 3 2 × +」**", "jp": "逆ポーランドの式「5 3 2 × +」の値はいくつか。", "opts": ["**11**", "16", "13", "30"], "ans": 0, "why": "Trace stack:\n1. 「5」: push → [5].\n2. 「3」: push → [5, 3].\n3. 「2」: push → [5, 3, 2].\n4. 「×」: pop 2, pop 3, tính 3×2=6, push → [5, 6].\n5. 「+」: pop 6, pop 5, tính 5+6=**11**, push → [11].\nTương đương 中置 「5 + 3×2 = 11」.", "details": ["B. 16 = (5+3)×2 — sai vì × phải tính trước.", "C. 13 không khớp phép tính nào.", "D. 30 = 5×3×2 — không có 2 phép ×."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 演算順序"},
  {"d": "hard", "q": "Tính giá trị của biểu thức 逆ポーランド: **「8 2 ÷ 3 +」**", "jp": "逆ポーランドの式「8 2 ÷ 3 +」の値はいくつか。", "opts": ["**7**", "5", "11", "4"], "ans": 0, "why": "Trace stack:\n1. 「8」: push → [8].\n2. 「2」: push → [8, 2].\n3. 「÷」: pop 2, pop 8, tính **8 ÷ 2 = 4**, push → [4].\n4. 「3」: push → [4, 3].\n5. 「+」: pop 3, pop 4, tính 4+3=**7**, push → [7].\nTương đương 中置 「8÷2 + 3 = 4 + 3 = 7」.", "details": ["B. 5 = 8÷2 - 3 hoặc nhầm phép.", "C. 11 = sai phép.", "D. 4 = chỉ tính 8÷2, bỏ qua + 3."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 割り算"},
  {"d": "hard", "q": "Tính giá trị của biểu thức 逆ポーランド: **「4 5 + 6 2 - ×」**", "jp": "逆ポーランドの式「4 5 + 6 2 - ×」の値はいくつか。", "opts": ["**36**", "30", "60", "20"], "ans": 0, "why": "Trace stack:\n1. 「4」: push → [4].\n2. 「5」: push → [4, 5].\n3. 「+」: pop 5, pop 4, 4+5=9, push → [9].\n4. 「6」: push → [9, 6].\n5. 「2」: push → [9, 6, 2].\n6. 「-」: pop 2, pop 6, 6-2=4, push → [9, 4].\n7. 「×」: pop 4, pop 9, **9×4=36**, push → [36].\nTương đương 中置 「(4+5)×(6-2) = 9×4 = 36」.", "details": ["B. 30 = 9+6×2 hoặc tương tự, không khớp.", "C. 60 không khớp.", "D. 20 = 4×5, bỏ qua các phép sau."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 複雑な式"},
  {"d": "hard", "q": "Tính 逆ポーランド: **「10 2 3 + ÷」**", "jp": "逆ポーランドの式「10 2 3 + ÷」の値はいくつか。", "opts": ["**2**", "5", "15", "8"], "ans": 0, "why": "Trace stack:\n1. 「10」: push → [10].\n2. 「2」: push → [10, 2].\n3. 「3」: push → [10, 2, 3].\n4. 「+」: pop 3, pop 2, 2+3=5, push → [10, 5].\n5. 「÷」: pop 5, pop 10, **10÷5=2**, push → [2].\nTương đương 中置 「10 ÷ (2+3) = 10÷5 = 2」.", "details": ["B. 5 = chỉ tính 2+3, bỏ qua phép ÷.", "C. 15 = 10+2+3, sai phép.", "D. 8 = 10-2 hoặc tương tự, không khớp."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 演算結合"},
  {"d": "med", "q": "Biểu thức 逆ポーランド: **「A B + C ×」** tương đương với 中置記法 nào?", "jp": "後置記法「A B + C ×」を中置記法で表すとどれか。", "opts": ["A + B × C", "**(A + B) × C**", "A + (B × C)", "A × (B + C)"], "ans": 1, "why": "Trace:\n1. push A.\n2. push B.\n3. +: pop B, A → tính (A+B), push.\n4. push C.\n5. ×: pop C, (A+B) → tính (A+B)×C, push.\nKết quả: **(A+B)×C**.", "details": ["A. A + B × C = A + (B×C) — sai vì 「+」 thực hiện trước 「×」 trong biểu thức 逆ポーランド trên.", "C. Cùng nghĩa với A.", "D. Sai vị trí — không có (B+C)."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド → 中置 変換"},
  {"d": "med", "q": "**Yasashii 問題2-8 phong cách**: Y = (A - B) × C được viết bằng 後置記法 là 「YAB-C×=」. Tương tự, Y = (A + B) × (C - D ÷ E) được viết là?", "jp": "Y=(A+B)×(C-D÷E)を後置記法で表せ。", "opts": ["Y A B + C - D E ÷ × =", "**Y A B + C D E ÷ - × =**", "Y A B + C × D - E ÷ =", "Y + A B × C - D ÷ E ="], "ans": 1, "why": "Phương pháp Yasashii (cùng 問題2-8): chuyển dần dần, đặt 「=」 cuối cùng:\n• D ÷ E → 「D E ÷」\n• C - (D÷E) → 「C D E ÷ -」\n• A + B → 「A B +」\n• (A+B) × (C-D÷E) → 「A B + C D E ÷ - ×」\n• Y = ... → **「Y A B + C D E ÷ - × =」**.\nNotice: 「=」 cũng được xem như toán tử và đặt SAU.", "details": ["A. Sai vị trí - và DE÷.", "C. Sai cấu trúc — × phải nằm cuối cùng (trước =).", "D. Đó là một dạng 前置記法, không phải 後置."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / Yasashii 問題2-8 平成24年度"},
  {"d": "med", "q": "Trong 逆ポーランド表記法, **toán tử và toán hạng** xuất hiện theo thứ tự nào trong stack?", "jp": "逆ポーランド表記法における計算では、スタックは何を保持するか。", "opts": ["Stack chỉ chứa toán tử", "Stack chỉ chứa toán hạng (số)", "**Stack chỉ chứa OPERANDS (số / kết quả trung gian). Toán tử KHÔNG được lưu vào stack — chúng được dùng ngay khi gặp**", "Stack chứa cả 2 với label phân biệt"], "ans": 2, "why": "Đặc trưng của thuật toán tính 逆ポーランド bằng stack:\n• Toán hạng (số) → push vào stack.\n• Toán tử → KHÔNG push, mà dùng NGAY để pop 2 toán hạng, tính, push kết quả.\nStack chỉ chứa số (operands hoặc partial results).", "details": ["A. Sai — toán tử không lưu trong stack.", "B. Đúng một phần, nhưng không nêu rõ toán tử dùng ngay.", "D. Quá phức tạp — thực tế stack chỉ chứa số."], "ref": "FE Syllabus — 基礎理論 / スタック / 逆ポーランドのスタック"},
  {"d": "easy", "q": "逆ポーランド表記法 có cần dấu **括弧 (ngoặc)** không?", "jp": "逆ポーランド表記法では括弧は必要か。", "opts": ["Có — luôn cần ngoặc để phân biệt thứ tự", "**Không — đây là một MERIT lớn của 逆ポーランド: thứ tự thực hiện đã được xác định rõ chỉ bằng vị trí của toán tử**", "Chỉ cần khi có nhiều phép toán", "Tuỳ thuộc vào máy tính"], "ans": 1, "why": "Lợi ích lớn của 逆ポーランド (và cả ポーランド表記法):\n• KHÔNG cần ngoặc.\n• Thứ tự thực hiện được xác định **DUY NHẤT** bởi vị trí của toán tử.\nVD: 「1 2 + 3 ×」 chắc chắn là (1+2)×3, không thể là 1+(2×3).\nĐây là lý do máy tính ưa dùng cách này.", "details": ["A. Sai — đặc trưng của 中置 (chứ không phải 逆ポーランド).", "C. Sai — ngay cả khi nhiều phép, vẫn không cần ngoặc.", "D. Sai — không phụ thuộc máy tính."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / メリット"},
  {"d": "med", "q": "Một biểu thức 逆ポーランド có **N toán hạng** thì cần bao nhiêu **toán tử** (cho phép tính nhị phân)?", "jp": "N個の数字を持つ逆ポーランド式の演算子数はいくつか。", "opts": ["N", "**N - 1**", "N + 1", "2N"], "ans": 1, "why": "Mỗi toán tử nhị phân (+, -, ×, ÷) lấy 2 toán hạng và trả ra 1 kết quả → giảm số toán hạng đi 1. Để từ N toán hạng còn lại 1 kết quả cuối, cần **N - 1** toán tử.\nVD:\n• 「1 2 +」: 2 toán hạng, 1 toán tử ✓\n• 「1 2 + 3 ×」: 3 toán hạng, 2 toán tử ✓\n• 「1 2 3 4 + × -」: 4 toán hạng, 3 toán tử ✓", "details": ["A. N toán tử = N kết quả không ghép thành 1.", "C. N+1 dư — không đủ toán hạng để pop.", "D. 2N — quá nhiều."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 構造"},
  {"d": "hard", "q": "Một biểu thức 逆ポーランド 「**5 1 2 + 4 × + 3 -**」 có giá trị là?", "jp": "「5 1 2 + 4 × + 3 -」の値はいくつか。", "opts": ["**14**", "11", "20", "9"], "ans": 0, "why": "Trace stack từng bước:\n1. 「5」: [5]\n2. 「1」: [5, 1]\n3. 「2」: [5, 1, 2]\n4. 「+」: pop 2, 1 → 1+2=3, push → [5, 3]\n5. 「4」: [5, 3, 4]\n6. 「×」: pop 4, 3 → 3×4=12, push → [5, 12]\n7. 「+」: pop 12, 5 → 5+12=17, push → [17]\n8. 「3」: [17, 3]\n9. 「-」: pop 3, 17 → 17-3=**14**, push → [14].\nKết quả: **14**.\nTương đương 中置: 5 + (1+2)×4 - 3 = 5 + 12 - 3 = 14.", "details": ["B. 11 sai phép tính.", "C. 20 = (5+1+2)×4-... sai.", "D. 9 sai phép tính."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド計算 / 複雑な式 / 過去問風"},
  {"d": "med", "q": "Khi tính 「**A B C - +**」 với A=10, B=5, C=2, kết quả là?", "jp": "A=10, B=5, C=2のとき「A B C - +」の値はいくつか。", "opts": ["**13**", "7", "17", "3"], "ans": 0, "why": "Trace:\n1. push 10 → [10]\n2. push 5 → [10, 5]\n3. push 2 → [10, 5, 2]\n4. 「-」: pop 2, 5 → 5-2=3, push → [10, 3]\n5. 「+」: pop 3, 10 → 10+3=**13**, push → [13].\nTương đương 中置: 10 + (5-2) = 10 + 3 = **13**.", "details": ["B. 7 = 10-5+2, sai phép.", "C. 17 = 10+5+2, sai phép.", "D. 3 = chỉ tính (5-2), bỏ qua phép +."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 変数代入計算"},
  {"d": "hard", "q": "**Yasashii nhấn mạnh** trong 「もう少し詳しく」: lý do FE thi 逆ポーランド là gì?", "jp": "逆ポーランド表記法がコンピュータで使われる理由はどれか。", "opts": ["Vì ngắn gọn hơn 中置記法", "**Vì kết hợp tự nhiên với cơ chế STACK — máy tính dễ dàng tính giá trị mà không cần phân tích cú pháp phức tạp (như xử lý ngoặc)**", "Vì chỉ dùng được số nguyên", "Vì khả năng đọc cao hơn cho người"], "ans": 1, "why": "Yasashii もう少し詳しく: 「コンピュータは、下図のように『逆ポーランド表記法』と『スタックの仕組み』を組み合わせて計算を行っています」.\nLợi ích:\n• Không cần parse ngoặc.\n• Thuật toán đơn giản, O(n).\n• Phù hợp với CPU stack-based.\n→ Compiler thường chuyển 中置 → 逆ポーランド để CPU xử lý.", "details": ["A. Không hẳn ngắn hơn — vd \"1+2\" (3 ký tự) ngắn hơn \"1 2 +\" (5 ký tự với khoảng trắng).", "C. Sai — 逆ポーランド không giới hạn loại số.", "D. Ngược lại — người đọc 中置記法 dễ hơn."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / コンピュータ内部処理"},
  {"d": "med", "q": "Chuyển biểu thức **「A ÷ B ÷ C」** (cùng độ ưu tiên, kết hợp trái) sang 逆ポーランド?", "jp": "「A÷B÷C」（左結合）を後置記法で表せ。", "opts": ["A B ÷ C ÷", "**A B ÷ C ÷**", "A B C ÷ ÷", "A ÷ B C ÷"], "ans": 1, "why": "Phép ÷ kết hợp TRÁI: A÷B÷C = (A÷B)÷C.\n1. A ÷ B → 「A B ÷」.\n2. (A÷B) ÷ C → 「(A B ÷) C ÷」 → **「A B ÷ C ÷」**.\nKhác với: A B C ÷ ÷ = A÷(B÷C) — cách kết hợp PHẢI, không đúng quy ước thông thường.", "details": ["A. Cùng đáp án với B.", "C. Đó là A÷(B÷C), không phải kết hợp trái.", "D. Đó là 中置 hỗn hợp, không phải 逆ポーランド."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 結合性"},
  {"d": "med", "q": "Một biểu thức 逆ポーランド có thể tính được không **nếu thiếu một toán hạng**, vd: 「**2 +**」?", "jp": "「2 +」は計算できるか。", "opts": ["Có — phép + đơn nhị (unary)", "**Không — phép + cần 2 toán hạng (binary). Khi gặp +, pop chỉ được 1 số → ERROR (stack underflow)**", "Có — kết quả mặc định là 2", "Phụ thuộc vào ngôn ngữ lập trình"], "ans": 1, "why": "Toán tử + trong bối cảnh thông thường là BINARY (cần 2 toán hạng). Trong 逆ポーランド:\n• Push 2 → stack [2].\n• Gặp + → cần pop 2 phần tử, nhưng chỉ có 1 → **stack underflow** → lỗi.\nBiểu thức 逆ポーランド hợp lệ cần **N toán hạng + (N-1) toán tử** đúng vị trí.", "details": ["A. + unary thường viết khác (vd \"+2\"), không phải dạng RPN chuẩn.", "C. Sai — RPN nghiêm ngặt, không có mặc định.", "D. Sai — đây là quy tắc toán học, không phụ thuộc ngôn ngữ."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / エラー処理"},
  {"d": "hard", "q": "Tổng kết: chiến lược tốt nhất để giải bài toán **逆ポーランド** trong kỳ thi FE là gì?", "jp": "FE試験で逆ポーランド問題を解くベスト戦略はどれか。", "opts": ["Học thuộc tất cả công thức chuyển đổi", "**(1) Nắm chắc quy tắc PUSH số / OP toán tử pop 2; (2) VẼ stack thực sự khi giải; (3) Convert có hệ thống: 括弧 > × ÷ > + -, đặt 「=」 cuối cùng nếu có; (4) Luyện 過去問 đa dạng**", "Đoán dựa trên hình thức", "Dùng máy tính bỏ túi"], "ans": 1, "why": "Chiến lược thực hành tốt cho FE:\n1. **Hiểu cơ chế stack** (Yasashii Ch.3 Lesson 03-01).\n2. **Vẽ stack từng bước** khi tính — đừng nhẩm dễ sai.\n3. **Convert có hệ thống**: theo thứ tự ưu tiên 括弧 → × ÷ → + - → =.\n4. **Luyện qua 過去問**: 平成24, 26, 28... có nhiều dạng.\n5. **Kiểm tra ngược**: thử convert ngược 逆ポーランド → 中置 để verify.", "details": ["A. Không có \"công thức\" cố định, chỉ có quy tắc.", "C. Đoán không hiệu quả với bài tính phức tạp.", "D. FE không cho dùng máy tính bỏ túi."], "ref": "FE Syllabus — 基礎理論 / 逆ポーランド / 学習戦略"}
