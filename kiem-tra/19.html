  {"d": "hard", "q": "稼働率=0.95, MTTR=5h. MTBF = ?", "jp": "あるシステムの稼働率が0.95、MTTRが5時間のとき、MTBFはいくらか。", "opts": ["95 時間<br>95 giờ", "100 時間<br>", "19 時間<br>", "5 時間<br>"], "ans": 0, "details": ["A. 正解 — 0.95 = MTBF/(MTBF+5) → 0.95(MTBF+5) = MTBF → 0.05 MTBF = 4.75 → MTBF = 95。<br>Đúng — Giải phương trình.", "B. 誤り（計算ミス）。<br>Sai.", "C. 誤り。<br>Sai.", "D. それはMTTR。<br>Là MTTR."]},
