abus — 基礎理論 / オートマトン / Yasashii 02-04", "qJa": "オートマトンの定義として最も適切なものはどれか。", "optsJa": ["自動車工場で使用される産業用ロボット", "オブジェクト指向プログラミング言語の一種", "**3コンポーネントを使用した機能を表すシステムモデル：「入力（input）・状態（state）・出力（output）」**", "ビジネス プロセス オートメーション (RPA) ソフトウェア"], "whyJa": "教材「Yasashii」02-04: 「オートマトンとは、機能を『入力』『状態』『出力』の3つで表すシステムのモデルです。」これは、入力に応じて状態が変化するシステムを記述するために使用される数学モデル/計算理論です。", "detailsJa": ["A. FE理論における産業用ロボット≠オートマトン。", "B. プログラミング言語ではありません。", "D. RPA は別の技術であり、オートマトンの概念ではありません。"]}, {"d": "easy", "q": "Trong từ điển Hy Lạp, **オートマトン** có nghĩa gốc là gì? (Yasashii ghi chú này)", "jp": "オートマトンのギリシャ語の本来の意味はどれか。", "opts": ["「数字を計算するもの」 (vật tính toán số)", "**「自らの意思で動くもの」 (vật tự vận động theo ý chí riêng)**", "「電気で動くもの」 (vật chạy bằng điện)", "「人間を真似るもの」 (vật bắt chước con người)"], "ans": 1, "why": "Yasashii 02-04 もう少し詳しく: 「オートマトンとは、ギリシャ語で『自らの意思で動くもの』という意味です」. Nguồn gốc từ Hy Lạp 「αὐτόματον」 — tự động vận hành dựa trên trạng thái nội tại + input.", "details": ["A. Không phải ý nghĩa gốc.", "C. Không liên quan đến nguồn gốc thuật ngữ.", "D. Cũng không phải nghĩa gốc tiếng Hy Lạp."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 語源", "qJa": "オートマトンのギリシャ語の本来の意味はどれか。", "optsJa": ["「数字を計算するもの」 (数字を計算するオブジェクト)", "**「自らの意思で動くもの」**", "「電気で動くもの」", "「人間を模したもの」"], "whyJa": "教材「Yasashii」 02-04 もう少し詳しく: 「オートマトンとは、ギリシャ語で『自らの意思で動くもの』という意味です」。ギリシャ語「αὐτόματον」に由来 — 内部状態 + 入力に基づいて自動的に動作します。", "detailsJa": ["A. 本来の意味ではありません。", "C. 用語の由来とは関係ありません。", "D. また、元のギリシャ語の意味ではありません。"]}, {"d": "easy", "q": "Trong ví dụ Yasashii về **máy bán hàng tự động (自動販売機)** — cấu thành オートマトン như thế nào?", "jp": "自動販売機をオートマトンとしてモデル化する際、3要素の対応はどれか。", "opts": ["**入力 = お金 (tiền nhập vào) / 状態 = 入れたお金の合計金額 (tổng tiền đã đưa vào) / 出力 = 商品 (sản phẩm đẩy ra)**", "入力 = 商品 / 状態 = お金 / 出力 = ボタン", "入力 = ボタン / 状態 = 商品 / 出力 = お金", "入力 = 電力 / 状態 = 重さ / 出力 = 音"], "ans": 0, "why": "Yasashii Lesson 02-04 ví dụ cụ thể: 「自動販売機のオートマトンの『入力』『状態』『出力』は以下のとおりです。\n・入力 → 自動販売機に入れるお金\n・状態 → 入れたお金の合計金額\n・出力 → 自動販売機から出てくる商品」.", "details": ["B. Đảo vai trò — sai cách hiểu input/output.", "C. Lẫn lộn các thành phần.", "D. Hoàn toàn sai — không phải mô hình hoá automaton."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 自動販売機の例", "qJa": "自動販売機をオートマトンとしてモデル化する際、3要素の対応はどれか。", "optsJa": ["**入力 = お金 (持ち込まれたお金) / 状態 = 入れたお金の合計金額 (投入されたお金の合計) / 出力 = 商品 (押し出された商品) **", "状態 = お金 / 出力 = ボタン", "状態 = 商品 / 出力 = お金", "状態 = 重さ / 出力 = 音"], "whyJa": "やさしいレッスン 02-04 具体例: 「自動販売機のオートマトンの『入力』『状態』『出力』は以下のとおりです。\n・入力 → 自動販売機にお金を入れる\n・状態 → 入れたお金の合計金額\n・出力 → 自動販売機から出てくる商品」。", "detailsJa": ["B. 役割の逆転 — 入力/出力を理解する間違った方法。", "C. 材料を混ぜる。", "D. 完全に間違っています - オートマトンのモデリングではありません。"]}, {"d": "easy", "q": "Lợi ích chính của việc mô hình hoá hệ thống thành **オートマトン** là gì?", "jp": "オートマトンでモデル化することのメリットはどれか。", "opts": ["Hệ thống chạy nhanh hơn", "Hệ thống tốn ít điện năng hơn", "**「複雑なシステムを単純化して表すことができる」 — biểu diễn hệ thống phức tạp dưới dạng đơn giản, dễ phân tích**", "Hệ thống không bao giờ bị lỗi"], "ans": 2, "why": "Yasashii: 「システムの本質的な機能を『入力』『状態』『出力』に分けて考えて、オートマトンとしてモデル化すると、複雑なシステムを単純化して表すことができます」. Lợi ích là về MẶT MÔ HÌNH/PHÂN TÍCH, không phải về hiệu năng vận hành.", "details": ["A. Mô hình hoá không trực tiếp làm hệ thống chạy nhanh hơn.", "B. Không liên quan đến năng lượng.", "D. Sai — mô hình hoá không ngăn lỗi xảy ra."], "ref": "FE Syllabus — 基礎理論 / オートマトン / メリット", "qJa": "オートマトンでモデル化することのメリットはどれか。", "optsJa": ["システムの動作が速くなりました", "システムの消費電力が少なくなります", "**「複雑なシステムを単純化して表現できる」 — 複雑なシステムをシンプルで分析しやすい形で表現します**", "システムは決して故障しない"], "whyJa": "教材「Yasashii」: 「システムの本質的な機能を『入力』『状態』『出力』に分けて考えて、オートマトンとしてモデル化すると、複雑なシステムを単純化して表現できます。」メリットは、運用パフォーマンスではなく、モデル/分析側にあります。", "detailsJa": ["A. モデリングによってシステムの動作が直接的に高速化されるわけではありません。", "B. エネルギーとは関係ありません。", "D. 不正解 — モデリングではエラーの発生を防ぐことはできません。"]}, {"d": "med", "q": "Trong オートマトン, 「**受理状態 (受理状態 / accepting state)**」 là gì?", "jp": "オートマトンにおける受理状態とは何か。", "opts": ["Trạng thái khởi đầu (初期状態) của automaton", "Trạng thái khi automaton bị lỗi và dừng", "**Trạng thái CUỐI CÙNG mà automaton đạt tới sau khi thực hiện chuỗi chuyển trạng thái — biểu thị bằng vòng tròn KÉP (二重丸)**", "Trạng thái trung gian được sử dụng nhiều nhất"], "ans": 2, "why": "Yasashii: 「オートマトンにおける『状態』は、時間や動作によって、初期状態からいくつかの状態を遷移して、最終的な状態に行き着きます。この最終的な状態を『受理状態』と呼びます」. Trong 状態遷移図, 受理状態 được biểu diễn bằng VÒNG TRÒN KÉP (二重丸).", "details": ["A. Đó là 初期状態 (initial state), được biểu thị bằng mũi tên đậm chỉ vào.", "B. Không phải khái niệm 受理状態 — có thể là 「停止状態」 hoặc lỗi.", "D. Tần suất sử dụng không liên quan đến định nghĩa 受理状態."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 受理状態", "qJa": "オートマトンにおける受理状態とは何か。", "optsJa": ["オートマトンの初期状態(初期状態)", "オートマトンが故障して停止した場合のステータス", "**オートマトンが一連の状態遷移を実行した後に到達する最終状態 — 二重丸で示されます**", "最もよく使用される中間状態"], "whyJa": "教材「Yasashii」: 「オートマトンにおける『状態』は、時間や動作によって、初期状態からいくつかの状態を移行して、最終的な状態に行きます。この最終的な状態を『受理状態』と呼びます。」状態遷移図では、受理状態はDOUBLE CIRCLE（二重丸）で表されます。", "detailsJa": ["A. それは初期状態 (初期状態) であり、太字の矢印で示されています。", "B. 受理状態という概念ではなく、「停止状態」またはエラーの可能性があります。", "D. 使用頻度は受理状態の定義とは無関係です。"]}, {"d": "med", "q": "Trong 状態遷移図, các ký hiệu chuẩn được dùng như thế nào (theo bảng ký hiệu Yasashii)?", "jp": "状態遷移図の記号と意味の組合せとして正しいものはどれか。", "opts": ["○ (vòng tròn đơn) = 受理状態; →→ (mũi tên đậm) = chuyển trạng thái", "**○ (vòng tròn) = 状態 (二重丸 ⊙ = 受理状態); ➡ (mũi tên đậm) = 初期状態; → (mũi tên thường) = 遷移**", "□ (hình vuông) = 状態; ◇ (hình thoi) = chuyển trạng thái", "Mọi trạng thái được vẽ bằng hình thoi"], "ans": 1, "why": "Theo Yasashii bảng ký hiệu:\n• ○ vòng tròn: 状態 (state) — 二重丸 ⊙ = 受理状態.\n• ➡ mũi tên đậm: chỉ 初期状態 (initial state).\n• → mũi tên thường: 遷移 (transition).\n• Nhãn trên mũi tên: 入力/出力 (input/output).", "details": ["A. ○ đơn là 状態 thường, không phải 受理状態 (受理状態 cần 二重丸).", "C. Sai — flowchart dùng hình thoi/vuông, automaton dùng vòng tròn.", "D. Hoàn toàn sai — ký hiệu của 状態遷移図 là vòng tròn."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図の記号", "qJa": "状態遷移図の記号と意味の組合せとして正しいものはどれか。", "optsJa": ["○ (一重丸) = 受理状態; →→ (太字矢印) = 状態遷移", "**○ (丸) = 状態 (二重丸 ⊙ = 受理状態); ➡ (太字の矢印) = 初期状態。 → (通常の矢印) = 遷移**", "□ (四角) = 状態; ◇（ひし形）＝状態遷移", "すべての州はダイヤモンドで描かれています"], "whyJa": "やさしいシンボル表によると：\n• ○丸：状態（状態） — 二重丸 ⊙ = 受理状態。\n• ➡ 太字矢印: 初期状態 (初期状態) を示します。\n• → 通常の矢印: 遷移 (遷移)。\n• 矢印のラベル: 入力/出力 (input/output)。", "detailsJa": ["A. ○は通常、受理状態ではなく状態です（受理状態には二重丸が必要です）。", "C. 不正解 — フローチャートではひし形/四角形が使用され、オートマトンでは円が使用されます。", "D. 完全に間違っています。状態遷移図の記号は丸です。"]}, {"d": "med", "q": "Sự khác biệt giữa **状態遷移表 (bảng chuyển trạng thái)** và **状態遷移図 (sơ đồ chuyển trạng thái)** là gì?", "jp": "状態遷移表と状態遷移図の違いはどれか。", "opts": ["状態遷移表 dành cho hệ thống nhỏ; 状態遷移図 dành cho hệ thống lớn", "**Cả 2 cùng mô tả 状態の変化 (sự thay đổi trạng thái); 状態遷移表 dùng BẢNG (表), 状態遷移図 dùng SƠ ĐỒ (図)**", "状態遷移表 chỉ áp dụng cho hệ thống số; 状態遷移図 cho hệ thống tương tự", "状態遷移表 ngược lại với 状態遷移図 về nghĩa"], "ans": 1, "why": "Yasashii: 「このような状態の遷移を表で表したものを状態遷移表、図で表したものを状態遷移図といいます」. Cả 2 cùng biểu diễn cùng một thông tin (chuyển trạng thái), chỉ khác hình thức trình bày: bảng vs sơ đồ.", "details": ["A. Không có giới hạn theo kích thước hệ thống.", "C. Sai — không có phân chia theo loại tín hiệu.", "D. Sai — 2 cách biểu diễn này tương đương về nghĩa, không phải ngược nhau."], "ref": "FE Syllabus — 基礎理論 / 状態遷移表 vs 状態遷移図", "qJa": "状態遷移表と状態遷移図の違いはどれか。", "optsJa": ["状態遷移表は小規模システム向けです。 状態遷移図は大規模システム向けです", "**2 はどちらも状態の変化 (状態の変化) を表します。 状態遷移表はTABLE (表)を使用し、状態遷移図はDIAGRAM (図)を使用します**", "状態遷移表は数値体系にのみ適用されます。 同様のシステムの状態遷移図", "状態遷移表は状態遷移図の逆の意味です"], "whyJa": "教材「Yasashii」: 「このような状態の遷移を表で表したものを状態遷移表、図で表したものを状態遷移図といいます」。両方の 2 は同じ情報 (状態遷移) を表しますが、表示形式が異なるだけです (表と図)。", "detailsJa": ["A. システム規模による制限はありません。", "C. 不正解 — 信号タイプによる区分がありません。", "D. 不正解 — 2 この表現は意味においては同等であり、反対ではありません。"]}, {"d": "med", "q": "Cho hệ thống nhận input 0 hoặc 1, **đếm tổng** và phân loại tổng là **偶数 (chẵn) hay 奇数 (lẻ)**. 状態遷移表 nào ĐÚNG?", "jp": "0か1を入力値に取り、合計が偶数か奇数かを表すシステムの状態遷移表はどれか。", "opts": ["<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>奇数<\/td><td>偶数<\/td><\/tr><tr><td>奇数<\/td><td>偶数<\/td><td>奇数<\/td><\/tr><\/table>", "<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>偶数<\/td><td>奇数<\/td><\/tr><tr><td>奇数<\/td><td>奇数<\/td><td>偶数<\/td><\/tr><\/table>", "<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>偶数<\/td><td>偶数<\/td><\/tr><tr><td>奇数<\/td><td>奇数<\/td><td>奇数<\/td><\/tr><\/table>", "<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>奇数<\/td><td>奇数<\/td><\/tr><tr><td>奇数<\/td><td>偶数<\/td><td>偶数<\/td><\/tr><\/table>"], "ans": 1, "why": "Phân tích từng ô:\n• 偶数 + 0 = 偶数 (chẵn + 0 = chẵn) ✓\n• 偶数 + 1 = 奇数 (chẵn + 1 = lẻ) ✓\n• 奇数 + 0 = 奇数 (lẻ + 0 = lẻ) ✓\n• 奇数 + 1 = 偶数 (lẻ + 1 = chẵn) ✓\nĐây là bảng tiêu chuẩn trong Yasashii 02-04.", "details": ["A. Sai logic — chẵn + 0 phải vẫn là chẵn, không phải lẻ.", "C. Sai — thêm 1 phải đổi chẵn↔lẻ.", "D. Đảo ngược — chẵn + 0 vẫn là chẵn, không phải lẻ."], "ref": "FE Syllabus — 基礎理論 / 状態遷移表 / 偶数・奇数の例", "qJa": "0か1を入力値に取り、合計が偶数か奇数かを表すシステムの状態遷移表はどれか。", "optsJa": ["<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>奇数<\/td><td>偶数<\/td><\/tr><tr><td>奇数<\/td><td>偶数<\/td><td>奇数<\/td><\/tr><\/table>", "<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>偶数<\/td><td>奇数<\/td><\/tr><tr><td>奇数<\/td><td>奇数<\/td><td>偶数<\/td><\/tr><\/table>", "<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>偶数<\/td><td>偶数<\/td><\/tr><tr><td>奇数<\/td><td>奇数<\/td><td>奇数<\/td><\/tr><\/table>", "<table class=\"stt-table\"><tr><th>現在の状態<\/th><th>0をたす<\/th><th>1をたす<\/th><\/tr><tr><td>偶数<\/td><td>奇数<\/td><td>奇数<\/td><\/tr><tr><td>奇数<\/td><td>偶数<\/td><td>偶数<\/td><\/tr><\/table>"], "whyJa": "細胞ごとの分析:\n• 偶数 + 0 = 偶数 (偶数 + 0 = 偶数) ✓\n• 偶数 + 1 = 奇数 (偶数 + 1 = 奇数) ✓\n• 奇数 + 0 = 奇数 (奇数 + 0 = 奇数) ✓\n• 奇数 + 1 = 偶数 (奇数 + 1 = 偶数) ✓\n教材「Yasashii」定番ボードです 02-04.", "detailsJa": ["A. 間違ったロジック — 偶数 + 0 は奇数ではなく偶数である必要があります。", "C. 不正解 — 1 を追加すると、偶数↔奇数に変更する必要があります。", "D. 逆 — 偶数 + 0 は依然として偶数であり、奇数ではありません。"]}, {"d": "hard", "q": "Theo 「**試験にはコレが出る!**」 trong Yasashii 02-04, dạng câu hỏi nào thường xuất hiện trong FE?", "jp": "オートマトンに関するFE試験での頻出問題はどれか。", "opts": ["Tính độ phức tạp thời gian của automaton", "**Cho 状態遷移表 hoặc 状態遷移図, hỏi 「最終的な状態（受理状態）が何になるか」 (trạng thái cuối/受理状態 sẽ là gì) khi nhập một chuỗi input cụ thể**", "Vẽ lại 状態遷移図 từ mô tả ngôn ngữ tự nhiên", "Chứng minh tính đúng đắn của automaton"], "ans": 1, "why": "Yasashii nhấn mạnh: 「基本情報技術者試験では『状態遷移表』もしくは『状態遷移図』が示され、オートマトンの最終的な状態（受理状態）が何になるかが問われる」. Dạng phổ biến: cho input string → trace qua sơ đồ → tìm trạng thái cuối.", "details": ["A. Đó là chủ đề thuật toán, không phải automaton ở mức FE.", "C. FE chủ yếu hỏi đọc hiểu, không phải vẽ.", "D. Chứng minh formal automaton không có trong FE."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 出題傾向", "qJa": "やさしい02-04,の「**試験にはコレが出る!**」による FEでよく出る質問は何ですか？", "optsJa": ["オートマトンの時間計算量を計算する", "**状態遷移表または状態遷移図の場合、特定の入力文字列を入力するときに「最終的な状態（受理状態）が何になるか」と尋ねます**", "自然言語記述子から状態遷移図を再描画", "オートマトンの正しさを証明してください"], "whyJa": "優しくは「基本情報技術者試験では『状態遷移表』あるいは『状態遷移図』が示され、オートマトンの最終的な状態（受理状態）が何になるかが問われる」と強調した。一般的な形式: 入力文字列を与える → 図をトレースする → 最終状態を見つける。", "detailsJa": ["A. それはアルゴリズムの話であり、FE レベルのオートマトンの話ではありません。", "C. FEは主に読解力を問うものであり、作図ではありません。", "D. 正式なオートマトンが FE に存在しないことを証明する。"]}, {"d": "easy", "q": "Trong 状態遷移図, 「**現在の状態と入力によって出力が決定される機械**」 là mô tả của khái niệm nào?", "jp": "現在の状態と入力によって出力が決定される機械をモデル化したものは何か。", "opts": ["フローチャート (flowchart)", "**状態遷移図 (state transition diagram)**", "E-R図 (Entity-Relationship)", "クラス図 (UML class diagram)"], "ans": 1, "why": "Slide 1 第9回 định nghĩa: 「状態遷移図とは現在の状態と入力によって出力が決定される機械をモデル化したもの」. Đầu vào (入力) + trạng thái hiện tại → quyết định đầu ra (出力) và trạng thái tiếp theo.", "details": ["A. Flowchart biểu diễn luồng xử lý, không có khái niệm 「状態」.", "C. E-R図 mô tả thực thể + quan hệ trong CSDL.", "D. Class diagram mô tả class trong OOP."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / 定義", "qJa": "現在の状態と入力によって出力が決定される機械をモデル化したものは何か。", "optsJa": ["フローチャート (flowchart)", "**状態遷移図 (state transition diagram)**", "E-R図 (Entity-Relationship)", "クラス図 (UML class diagram)"], "whyJa": "スライド 1 第 9 回 定義: 「状態遷移図とは現在の状態と入力によって出力が決定される機械をモデル化したもの」。入力 (入力) + 現在の状態 → 出力 (出力) と次の状態が決まります。", "detailsJa": ["A. フローチャートは「状態」という概念を持たずに処理の流れを表したものです。", "C. E-R図はデータベース内のエンティティと関係を記述します。", "D. クラス図は OOP のクラスを説明します。"]}, {"d": "easy", "q": "Ý nghĩa của các phần tử trong 状態遷移図 (theo Slide 1 第9回) là gì?", "jp": "状態遷移図の要素の意味として正しいものはどれか。", "opts": ["○ = 入力, → = 状態, label = 出力", "**○ = 状態 (S₁, S₂, S₃...) / → = 状態の移り変わり (chuyển trạng thái) / label trên mũi tên = 入力/出力値**", "○ = 出力, → = 入力, label = 状態", "○ = node bộ nhớ, → = tín hiệu điện, label = tốc độ"], "ans": 1, "why": "Slide 1 第9回: 「状態を○で表現。状態の移り変わりを矢印で表現。矢印の上の数字: 入力/出力値」. Ví dụ: S₁ →(0/1)→ S₂ nghĩa là từ trạng thái S₁, gặp input 0, output 1, chuyển sang S₂.", "details": ["A. Sai — ○ là 状態, không phải input.", "C. Đảo ngược ý nghĩa.", "D. Hoàn toàn vô lý — không phải mạch điện."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / 要素の意味", "qJa": "状態遷移図（スライド 1 第 9 回による）の要素の意味は何ですか?", "optsJa": ["○ = 入力, → = 状態, label = 出力", "**○ = 状態 (S₁, S₂, S₃...) / → = 状態の変わり(状態遷移) / 矢印のラベル = 入力/出力値**", "○ = 出力, → = 入力, label = 状態", "○ = メモリノード、→ = 電気信号、ラベル = 速度"], "whyJa": "スライド 1 第 9 回: 「状態を○で表現。状態の進み変わりを矢印で表現。矢印の上の数字: 入力/出力値」。例: S₁ →(0/1)→ S₂ は、状態 S₁ から、入力 0, 出力 1, が S₂ に切り替わることを意味します。", "detailsJa": ["A. 間違い — ○は入力ではなく状態です。", "C. 意味の逆転。", "D. まったく不条理 — 回路ではありません。"]}, {"d": "easy", "q": "「**絶対的なルールがある分けでは無いので問題文の指示に従って読み解く**」 — câu này (Slide 1 第9回) ám chỉ điều gì?", "jp": "状態遷移図の読み解きにおいて重要なことはどれか。", "opts": ["Phải nhớ thuộc lòng tất cả quy tắc chuẩn", "**Không có quy ước tuyệt đối — phải đọc kỹ ĐỀ BÀI để hiểu cách quy ước (label nào là input/output, ký hiệu nào là 初期/受理状態...)**", "Luôn luôn đi từ trái sang phải", "Trạng thái đầu tiên trong bảng là 受理状態"], "ans": 1, "why": "Slide 1 第9回 nhấn mạnh: 「絶対的なルールがある分けでは無いので問題文の指示に従って読み解く」. Tuy có ký hiệu thông dụng (○, ➡, ⊙), nhưng cách dùng label có thể khác nhau theo đề. Phải đọc đề kỹ.", "details": ["A. Sai — không cần thuộc lòng, mà cần đọc đề.", "C. Sai — không có quy tắc chiều đọc cố định.", "D. Sai — 受理状態 được chỉ rõ bằng 二重丸, không phải vị trí."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / 読み解き原則", "qJa": "「**絶対的なルールがある分けではないので問題文の指示に従って読み解く**」 — この文 (スライド 1 第 9 回) は何を指していますか?", "optsJa": ["標準ルールをすべて暗記する必要があります", "**絶対的な規則はありません。規則 (どのラベルが入力/出力であり、どのシンボルが初期/受理状態であるか...) を理解するには、TOPIC を注意深く読む必要があります。**", "常に左から右に進みます", "表の最初のステータスは受理状態です"], "whyJa": "スライド 1 第 9 回は、「絶対的なルールがあるでは分けないので問題文の指示に従って読み解く」と強調しています。共通の記号（○、➡、⊙）はありますが、ラベルの使用方法はトピックによって異なります。トピックを注意深く読む必要があります。", "detailsJa": ["A. 不正解 — 暗記する必要はありませんが、質問を読む必要があります。", "C. 不正解 — 固定された読み取り方向のルールはありません。", "D. 間違っています — 受理状態は場所ではなく二重丸で示されています。"]}, {"d": "med", "q": "Cho 状態遷移図 (Slide 1 第9回 - bài luyện tập): có 3 trạng thái S₁, S₂, S₃; S₁ là 初期状態; với input 0 từ S₁ → S₁ (output 0); với input 1 từ S₁ → S₂ (output 0). Nếu input là 「0」 từ S₁, kết quả là?", "jp": "S₁から0を入力したときの状態と出力はどれか。", "opts": ["**状態 = S₁, 出力値 = 0**", "状態 = S₂, 出力値 = 0", "状態 = S₃, 出力値 = 1", "状態 = S₂, 出力値 = 1"], "ans": 0, "why": "Theo Slide 1 第9回 - 過去問練習: 「0が入力: 状態はS₁、出力値は0」. Đây là vòng lặp self-loop tại S₁ khi gặp input 0.", "details": ["B. S₂ chỉ đến khi input là 1, không phải 0.", "C. S₃ không phải mục tiêu từ S₁ với input 0.", "D. Output cho input 0 là 0, không phải 1."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / Slide 第9回 過去問練習", "qJa": "状態遷移図 (Slide 1 第 9 回 - 練習問題): 3 ステータスは S₁、S₂、S₃ です。 S₁ は初期状態です。入力 0 で S₁ → S₁ (出力 0)。入力 1 で S₁ → S₂ (出力 0)。 S₁から「0」と入力すると結果は？", "optsJa": ["**状態 = S₁, 出力値 = 0**", "状態 = S₂, 出力値 = 0", "状態 = S₃, 出力値 = 1", "状態 = S₂, 出力値 = 1"], "whyJa": "スライド 1 第 9 回 - 過去問練習: 「0 が入力: 状態は S₁、出力値は 0」 によると。これは、入力 0. に遭遇したときの S₁ での自己ループです。", "detailsJa": ["B. S₂ は、入力が 0. ではなく 1, の場合にのみ発生します", "C. S₃ は入力 0. の S1 からのターゲットではありません", "D. 入力 0 の出力は 1. ではなく 0, です"]}, {"d": "med", "q": "Tiếp câu trên: Nếu input là 「1」 từ S₁, kết quả là?", "jp": "S₁から1を入力したときの状態と出力はどれか。", "opts": ["状態 = S₁, 出力値 = 0", "**状態 = S₂, 出力値 = 0**", "状態 = S₃, 出力値 = 1", "状態 = S₂, 出力値 = 1"], "ans": 1, "why": "Slide 1 第9回 過去問練習: 「1が入力: 状態はS₂、出力値は0」. Từ S₁, input 1 đưa sang S₂, output là 0.", "details": ["A. S₁ tự lặp khi input là 0, không phải 1.", "C. S₃ không đến từ S₁ với input 1.", "D. Output là 0, không phải 1."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / Slide 第9回 過去問練習", "qJa": "S₁から1を入力したときの状態と出力はどれか。", "optsJa": ["状態 = S₁, 出力値 = 0", "**状態 = S₂, 出力値 = 0**", "状態 = S₃, 出力値 = 1", "状態 = S₂, 出力値 = 1"], "whyJa": "スライド 1 第 9 回過去問練習: 「1 が入力: 状態は S₂、出力値は 0」。 S₁から、入力1がS₂に変換され、出力は0.になります", "detailsJa": ["A. 入力が 1. ではなく 0, の場合、S₁ が繰り返されます。", "C. S₃ は入力 1. の S₁ から来ていません", "D. 出力は 1. ではなく 0, です"]}, {"d": "hard", "q": "Cho 状態遷移図 nhận chuỗi bit, **受理状態 = S₃** (二重丸). Trạng thái khởi đầu = S₁. Luật chuyển: S₁→1→S₂ (vẫn S₁ nếu input=0); S₂→0→S₃ (S₂→1→S₂); S₃→{0,1}→S₃ (vòng lặp). Chuỗi nào dưới đây được **受理** (cuối cùng đến S₃)?", "jp": "オートマトンで受理されるビット列はどれか。", "opts": ["「0000」", "「0111」", "**「1010」**", "「1111」"], "ans": 2, "why": "Trace từng chuỗi từ S₁:\n• 0000: S₁→0→S₁→0→S₁→0→S₁→0→S₁ ❌ (kết thúc tại S₁).\n• 0111: S₁→0→S₁→1→S₂→1→S₂→1→S₂ ❌ (kết thúc tại S₂).\n• 1010: S₁→1→S₂→0→S₃→1→S₃→0→S₃ ✓ (đến S₃, 受理).\n• 1111: S₁→1→S₂→1→S₂→1→S₂→1→S₂ ❌ (kẹt ở S₂).\nĐây là dạng câu hỏi 平成28年度 問題2-10 trong Yasashii.", "details": ["A. Không có 1 → không bao giờ rời S₁.", "B. Sau 1 đầu tiên đến S₂, nhưng không có 0 tiếp theo để sang S₃.", "D. 4 số 1 liên tiếp giữ ở S₂, không chuyển sang S₃."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 受理状態の判定 / 平成28年度風", "qJa": "状態遷移図にビット列 **受理状態 = S₃** (二重丸) を受信させます。初期状態 = S₁。転送ルール: S₁→1→S₂ (input=0 の場合は S₁ のまま); S₂→0→S₃ (S₂→1→S₂); S₃→{0,1}→S₃（ループ）。次の文字列のうち **受理** (最終的に S₃ に到達) はどれですか?", "optsJa": ["「0000」", "「0111」", "**「1010」**", "「1111」"], "whyJa": "S₁ から各文字列をトレースします。\n• 0000: S₁→0→S₁→0→S₁→0→S₁→0→S₁ ❌ (S₁ で終了)。\n• 0111: S₁→0→S₁→1→S₂→1→S₂→1→S₂ ❌ (S₂ で終了)。\n• 1010: S₁→1→S₂→0→S₃→1→S₃→0→S₃ ✓ (S₃ へ、受理)。\n• 1111: S₁→1→S₂→1→S₂→1→S₂→1→S₂ ❌ (S₂ でスタック)。\nこれはやさしいの質問フォーム平成28年度問題2-10です。", "detailsJa": ["A. 1 なし → S₁ を決して離れないでください。", "B. 最初の 1 の後に S₂ が来ますが、S₃ に進む次の 0 はありません。", "D. 4 番号 1 は S₂ のままで、S₃ に切り替わりません。"]}, {"d": "med", "q": "Một 状態遷移図 đơn giản: 2 trạng thái A (初期) và B (受理). Quy tắc: A→0→A, A→1→B, B→0→B, B→1→A. Hỏi chuỗi 「1010」 có được **受理** không?", "jp": "2状態のオートマトンで「1010」は受理されるか。", "opts": ["Có — kết thúc tại B (受理状態)", "**Không — kết thúc tại A (không phải 受理状態)**", "Không — không đủ ký tự", "Không xác định được"], "ans": 1, "why": "Trace chuỗi 「1010」 từ A:\n• '1': A → B (quy tắc A→1→B).\n• '0': B → B (B→0→B, self-loop).\n• '1': B → A (B→1→A).\n• '0': A → A (A→0→A, self-loop).\nKết thúc tại **A** ≠ B → **KHÔNG được 受理**.\nLogic chung: automaton này đếm số ký tự '1' theo mod 2 — chuỗi 「1010」 có 2 số 1 (chẵn) → quay về A.", "details": ["A. Sai — trace cuối cùng đến A, không phải B. Chuỗi 「1010」 có 2 số 1 (chẵn) nên quay về A.", "C. 4 ký tự đủ để trace, không phải lý do từ chối.", "D. Có thể xác định được rõ ràng bằng cách trace từng ký tự."], "ref": "FE Syllabus — 基礎理論 / オートマトン / トレース問題", "qJa": "簡単な状態移行図: 2 には A (初期) と B (受理) が記載されています。ルール: A→0→A、A→1→B、B→0→B、B→1→A。 「1010」という文字列を尋ねるのは**受理**ですか?", "optsJa": ["はい — B (受理状態) で終わります", "**いいえ — A で終わります (受理状態ではありません)**", "いいえ — 文字が足りません", "未定"], "whyJa": "A から文字列「1010」をトレースします。\n• '1': A → B (ルール A→1→B)。\n• '0': B → B (B→0→B、自己ループ)。\n• 「1」: B → A (B→1→A)。\n• '0': A → A (A→0→A、自己ループ)。\n**A** ≠ B → **非受理**で終了します。\n一般ロジック: このオートマトンは、mod 2 に従って文字 '1' の数をカウントします — 文字列「1010」には 2 番号 1 (偶数) があります → A に戻ります。", "detailsJa": ["A. 不正解 — 最後のトレースは B ではなく A に行きます。文字列「1010」には 2 があり、数値 1 (偶数) は A に返されるはずです。", "C. 4 文字はトレースするには十分であり、拒否する理由にはなりません。", "D. 各文字をなぞると明確に識別できます。"]}, {"d": "hard", "q": "Cho 状態遷移図 đếm '1' theo modulo 3 — 3 trạng thái q0 (初期, 受理), q1, q2. Quy tắc: q0→1→q1→1→q2→1→q0; input 0 luôn giữ nguyên trạng thái. Chuỗi nào dưới đây được **受理**?", "jp": "1の個数が3の倍数のとき受理するオートマトンで、受理される列はどれか。", "opts": ["「11」 (2 số 1)", "「1111」 (4 số 1)", "**「111000」 (3 số 1)**", "「11111」 (5 số 1)"], "ans": 2, "why": "Quy tắc: input 0 không đổi state; chỉ input 1 mới làm xoay vòng q0→q1→q2→q0.\nNumber of '1's cần là bội số của 3 để về q0 (受理):\n• 「11」: 2 số 1 → q2 ❌\n• 「1111」: 4 số 1 → q1 (4 mod 3 = 1) ❌\n• 「111000」: 3 số 1 → q0 ✓ (3 mod 3 = 0)\n• 「11111」: 5 số 1 → q2 (5 mod 3 = 2) ❌", "details": ["A. 2 không chia hết cho 3.", "B. 4 mod 3 = 1, vẫn ở q1.", "D. 5 mod 3 = 2, ở q2."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 剰余系オートマトン", "qJa": "状態遷移図で '1' を法 3 — 3 で q0 (初期、受理)、q1、q2 と表現します。ルール: q0→1→q1→1→q2→1→q0;入力 0 は常に同じ状態を保ちます。 **受理**は次のどの文字列ですか?", "optsJa": ["「11」 (2 番号 1)", "「1111」 (4 番号 1)", "**「111000」 (3 番号 1)**", "「11111」 (5 番号 1)"], "whyJa": "ルール: 入力 0 は状態を変更しません。 1を入力した場合のみq0→q1→q2→q0と回転します。\nq0 に到達するには、「1」の数が 3 の倍数である必要があります (受理):\n• 「11」: 2 番号 1 → q2 ❌\n• 「1111」: 4 番号 1 → q1 (4 mod 3 = 1) ❌\n• 「111000」: 3 番号 1 → q0 ✓ (3 mod 3 = 0)\n• 「11111」: 5 番号 1 → q2 (5 mod 3 = 2) ❌", "detailsJa": ["A. 2 は 3. で割り切れません", "B. 4 mod 3 = 1, はまだ q1 です。", "D. q2 の 5 mod 3 = 2,。"]}, {"d": "med", "q": "状態遷移表 có 3 cột: 「現在の状態」「入力」「次の状態」「出力」. Cho bảng (theo Slide 1 第9回 練習問題):\n| 現在 | 入力 | 次 | 出力 |\n|---|---|---|---|\n| S₁ | 0 | S₁ | 0 |\n| S₁ | 1 | S₂ | 0 |\n| S₂ | 0 | S₃ | 0 |\n| S₂ | 1 | S₂ | 1 |\nTại S₂, input là 「1」, kết quả là?", "jp": "S₂に1を入力した場合の次の状態と出力はどれか。", "opts": ["次の状態 = S₃, 出力 = 0", "次の状態 = S₁, 出力 = 1", "**次の状態 = S₂, 出力 = 1**", "次の状態 = S₃, 出力 = 1"], "ans": 2, "why": "Tra bảng dòng (S₂, 1): 次の状態 = S₂, 出力 = 1. Đây là self-loop tại S₂ với input 1.", "details": ["A. Đó là dòng (S₂, 0), không phải (S₂, 1).", "B. S₁ không xuất hiện trong các transition từ S₂.", "D. Cột 次の状態 ghi S₂, không phải S₃."], "ref": "FE Syllabus — 基礎理論 / 状態遷移表 / 読み解き", "qJa": "状態遷移表には 3 列「現在の状態」「入力」「次の状態」「出力」があります。表については (スライド 1 第 9 回練習問題による):\n| 現在 | 入力 | 次 | 出力 |\n|---|---|---|---|\n| S₁ | 0 | S₁ | 0 |\n| S₁ | 1 | S₂ | 0 |\n| S₂ | 0 | S₃ | 0 |\n| S₂ | 1 | S₂ | 1 |\nS₂では「1」と入力しましたが、結果はどうなるのでしょうか？", "optsJa": ["次の状態 = S₃, 出力 = 0", "次の状態 = S₁, 出力 = 1", "**次の状態 = S₂, 出力 = 1**", "次の状態 = S₃, 出力 = 1"], "whyJa": "ラインテーブル (S₂, 1) を調べます: 次の状態 = S₂, 出力 = 1. これは、入力 1. を持つ S₂ での自己ループです。", "detailsJa": ["A. それは (S₂, 1) ではなく、(S₂, 0) の行です。", "B. S₁ は S₂ からの遷移では表示されません。", "D. 次の状態の列には S₃ ではなく S₂ と書かれています。"]}, {"d": "hard", "q": "Cho automaton dùng phát hiện 「**ít nhất một số 1 trong chuỗi**」: q0 (初期), q1 (受理 - 二重丸). q0→0→q0; q0→1→q1; q1→{0,1}→q1. Chuỗi nào sau đây KHÔNG được **受理**?", "jp": "「少なくとも1つの1を含む」を受理するオートマトンで、受理されない列はどれか。", "opts": ["「1」", "「100」", "**「000」**", "「001」"], "ans": 2, "why": "Trace:\n• 「1」: q0→1→q1 ✓ 受理.\n• 「100」: q0→1→q1→0→q1→0→q1 ✓ 受理.\n• 「000」: q0→0→q0→0→q0→0→q0 ❌ kết thúc tại q0 (không phải 受理).\n• 「001」: q0→0→q0→0→q0→1→q1 ✓ 受理.\nChỉ「000」 không có số 1 nào → không bao giờ chuyển sang q1.", "details": ["A. Một số 1 → ngay lập tức 受理.", "B. Có số 1 → q1 → giữ ở q1.", "D. Số 1 ở cuối vẫn đưa vào q1."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 受理判定", "qJa": "オートマトンに「**文字列内の少なくとも一部の 1**」を検出させます: q0 (初期)、q1 (受理 - 二重丸)。 q0→0→q0; q0→1→q1; q1→{0,1}→q1。 **受理**ではない文字列は次のうちどれですか?", "optsJa": ["「1」", "「100」", "**「000」**", "「001」"], "whyJa": "トレース:\n• 「1」: q0→1→q1 ✓ 受理。\n• 「100」: q0→1→q1→0→q1→0→q1 ✓ 受理。\n• 「000」：q0→0→q0→0→q0→0→q0 ❌はq0で終了します（受理ではありません）。\n• 「001」: q0→0→q0→0→q0→1→q1 ✓ 受理。\n「000」のみ1の番号がありません → q1に進みません。", "detailsJa": ["A. 一部の1→即受付致します。", "B. 番号 1 がある → q1 → q1 を維持します。", "D. 末尾の番号 1 は引き続き q1 に含まれます。"]}, {"d": "easy", "q": "Theo Slide 1 第9回, ví dụ điển hình của 状態遷移図 trong thực tế là gì?", "jp": "状態遷移図の代表的な例はどれか。", "opts": ["Sơ đồ mạch điện", "**Máy bán hàng tự động (自動販売機) — input = tiền, state = tổng tiền, output = sản phẩm**", "Sơ đồ ER cho CSDL", "Biểu đồ Gantt"], "ans": 1, "why": "Slide 1 第9回: 「状態遷移図の例（自動販売機）」 — đây cũng là ví dụ song hành với Yasashii. Self-service vending machine là minh hoạ kinh điển của automaton: input = đồng xu/tiền giấy, state = tổng tiền đã nhập, output = sản phẩm khi đủ giá.", "details": ["A. Sơ đồ mạch điện thuộc 電気回路.", "C. ER diagram thuộc CSDL.", "D. Gantt chart thuộc プロジェクト管理."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / 自動販売機例", "qJa": "Slide 1 第9回によると、実際の状態遷移図の典型的な例は何ですか?", "optsJa": ["回路図", "**自動販売機 - 入力 = お金、状態 = 合計金額、出力 = 製品**", "データベースのER図", "ガントチャート"], "whyJa": "スライド 1 第 9 回: 「状態遷移図の例（自動販売機）」 — これも教材「Yasashii」例と同じです。セルフサービス自動販売機は、オートマトンの典型的な図です。入力 = 硬貨/紙幣、状態 = 入力された合計金額、出力 = 正規価格の場合の製品です。", "detailsJa": ["A. 回路図は電気回路に属します。", "C. ER 図はデータベースに属します。", "D. ガントチャートはプロジェクト管理に属します。"]}, {"d": "med", "q": "Một 状態遷移図 đơn giản: q0 (初期) → input '0' → q1; q0 → '1' → q0; q1 → '0' → q1; q1 → '1' → q0. **受理状態 = q1**. Chuỗi 「**1010**」 có được受理 không?", "jp": "「1010」は受理されるか。", "opts": ["Có — kết thúc tại q1", "**Có — trace: q0→1→q0→0→q1→1→q0→0→q1, kết thúc tại q1**", "Không — kết thúc tại q0", "Không xác định"], "ans": 1, "why": "Trace cẩn thận từ q0:\n• '1': q0 → q0 (vì q0→'1'→q0).\n• '0': q0 → q1 (vì q0→'0'→q1).\n• '1': q1 → q0 (vì q1→'1'→q0).\n• '0': q0 → q1 (vì q0→'0'→q1).\nKết thúc tại **q1** = 受理. → 受理.", "details": ["A. Đúng kết luận nhưng thiếu giải thích trace; đáp án B chi tiết hơn.", "C. Sai — trace cuối cùng đến q1, không phải q0.", "D. Có thể xác định được bằng cách trace."], "ref": "FE Syllabus — 基礎理論 / オートマトン / トレース", "qJa": "簡単な状態遷移図: q0 (初期) → '0' を入力 → q1; q0 → '1' → q0; q1 → 「0」 → q1; q1→「1」→q0。 **受理状態 = q1**。 「**1010**」という文字列は機能しますか？", "optsJa": ["はい — q1 で終了", "**はい — トレース: q0→1→q0→0→q1→1→q0→0→q1、q1 で終了**", "いいえ — q0 で終了", "不明"], "whyJa": "q0 から注意深くトレースします。\n• '1': q0 → q0 (q0→'1'→q0 のため)。\n• '0': q0 → q1 (q0→'0'→q1 のため)。\n• '1': q1 → q0 (q1→'1'→q0 のため)。\n• '0': q0 → q1 (q0→'0'→q1 のため)。\n**q1** = 受理で終了。 →受理。", "detailsJa": ["A. 結論は正しいが、トレースの説明が欠落している。回答 B の方が詳しいです。", "C. 不正解 — 最後のトレースは q0 ではなく q1 に行きます。", "D. トレースすることで特定できます。"]}, {"d": "hard", "q": "**過去問風 平成26年度**: 状態遷移表 dùng để 検査 chuỗi ký tự. 初期状態 = a; nếu trong khi 検査 trạng thái chuyển sang e thì 不合格. 文字 phân loại: 空白, 数字, 符号, 小数点, その他. Bảng (rút gọn): a + 空白→a; a + 数字→b; a + 符号→c; a + 小数点→d; a + その他→e. b + 数字→b; b + 小数点→e. (Yasashii 問題2-9 風). Chuỗi 「12.2」 có 合格 không?", "jp": "「12.2」は合格か不合格か。", "opts": ["合格 (kết thúc trạng thái không phải e)", "**不合格 — trace: a→1→b→2→b→.→e (kết thúc tại e)**", "合格 — chuỗi không có ký tự đặc biệt", "Không xác định được"], "ans": 1, "why": "Bám sát Yasashii 平成26年度 問題2-9:\n• Bắt đầu a.\n• '1' (数字): a → b.\n• '2' (数字): b → b.\n• '.' (小数点): b → **e** ❌ → **不合格**.\nLưu ý: trong bảng này, b + 小数点 → e (vì sau dấu chấm thập phân ở trạng thái b không hợp lệ, có thể là cấu hình kiểm tra dạng số).", "details": ["A. Sai — kết thúc tại e, là 不合格.", "C. \"không ký tự đặc biệt\" không có nghĩa — '.' là 小数点.", "D. Đề bài đủ thông tin, xác định được."], "ref": "FE Syllabus — 基礎理論 / 状態遷移表 / Yasashii 問題2-9 風", "qJa": "**過去問風平成26年度**: 状態遷移表は文字列を検査するために使用されます。 初期状態 = a;検査中に状態が e に変化した場合は不合格です。 文字分類：空白、数字、記号、小数点、その他。表 (短縮): a + 空白→a; a + 数字→ b; a + 記号→c; a + 小数点→d; a + その他→e。 b + 数字→ b; b + 小数点→e。 (教材「Yasashii」問題2-9 風)。 「12.2」という文字列は成功していますか?", "optsJa": ["合格 (終了状態が e ではない)", "**不合格 — トレース: a→1→b→2→b→.→e (e で終わる)**", "合格 — 特殊文字を含まない文字列", "未定"], "whyJa": "やさしい平成26年度問題2-9をフォローしてください:\n• aを開始します。\n• 「1」 (数字): a → b。\n• 「2」（数字）: b → b。\n•「。」 (小数点): b → **e** ❌ → **不合格**。\n注: この表では、 b + 小数点 → e (b 状態の小数点以降は無効であるため、数値チェック構成である可能性があります)。", "detailsJa": ["A. 不合格 — e で終わるものは不合格です。", "C. 「特殊文字なし」は、「.」を意味するものではありません。は小数点です。", "D. トピックには十分な情報があり、決定することができます。"]}, {"d": "hard", "q": "Tiếp theo: Chuỗi 「**-1**」 (gồm '-' là 符号, '1' là 数字) trong cùng bảng trên. Có 合格 không? (a + 符号 → c; c + 数字 = ?)", "jp": "「-1」は合格か。", "opts": ["**Phụ thuộc vào cấu hình c + 数字 — nếu c + 数字 → b thì 合格 (kết thúc tại b ≠ e)**", "合格 chắc chắn (kết thúc tại c)", "不合格 (kết thúc tại e)", "Không xác định"], "ans": 0, "why": "Bám sát Yasashii 問題2-9 dạng thiết kế: bảng đầy đủ thường có (c, 数字) → b để chấp nhận số có dấu (vd '-1', '+5'). Nếu vậy:\n• Bắt đầu a.\n• '-' (符号): a → c.\n• '1' (数字): c → b.\nKết thúc tại b, KHÔNG phải e → 合格.\nLưu ý: đáp án phụ thuộc vào ô (c, 数字) — nếu bảng cấu hình khác (vd c+数字→e), kết quả khác.", "details": ["B. Không thể kết thúc tại c vì còn ký tự '1' chưa xử lý.", "C. Chỉ đúng nếu c + 数字 → e, đề mặc định không vậy.", "D. Có thể xác định nếu giả thiết cấu hình chuẩn."], "ref": "FE Syllabus — 基礎理論 / 状態遷移表 / Yasashii 問題2-9 風", "qJa": "「-1」は合格か。", "optsJa": ["**構成に応じて c + 数字 — c + 数字 → b の場合は合格 (b ≠ e で終了)**", "必ず合格します (c で終わります)", "不合格 (eで終わる)", "不明"], "whyJa": "教材「Yasashii」問題 2-9 のデザインフォームに固執する: 完全なテーブルには通常 (c, 数字) → b があり、符号付きの数字を受け入れます (例: '-1'、'+5')。その場合:\n• aを開始します。\n• 「-」（記号）: a → c。\n• 「1」（数字）: c → b。\ne→合格ではなく、bで終了します。\n注: 答えはセル (c, 数字) によって異なります。構成テーブルが異なる場合 (例: c+数字→e)、結果は異なります。", "detailsJa": ["B. 文字「1」がまだ未解決であるため、c で終了できません。", "C. c + 数字 → e の場合のみ true。デフォルトはそうではありません。", "D. 標準構成が想定されているかどうかを判断できます。"]}, {"d": "med", "q": "Khi đọc 状態遷移図, **mũi tên đậm (➡)** không có ký hiệu trên đó thường biểu thị gì?", "jp": "状態遷移図の太い矢印（ラベル無し）が示すものはどれか。", "opts": ["受理状態 cuối cùng", "**初期状態 (initial state) — chỉ vào trạng thái khởi đầu của automaton**", "Lỗi trong sơ đồ", "Sự chuyển trạng thái có ưu tiên cao"], "ans": 1, "why": "Theo Yasashii bảng ký hiệu: 「矢印 (太い): 初期状態を指し示す」. Mũi tên đậm KHÔNG có label dùng để chỉ trạng thái khởi đầu — không phải transition giữa các trạng thái.", "details": ["A. 受理状態 dùng 二重丸 (vòng tròn kép).", "C. Lỗi không có ký hiệu chuẩn riêng.", "D. Không có khái niệm 「ưu tiên」 trong automaton chuẩn."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / 記号", "qJa": "状態遷移図の太い矢印（ラベル無し）が示すものはどれか。", "optsJa": ["ついに受理状態", "**初期状態 (初期状態) — オートマトンの初期状態を指します**", "図の誤り", "高優先度の状態遷移"], "whyJa": "やさしいさんのシンボルマークは「矢印（一瞬）：初期状態を考える」です。 NO ラベルの付いた太字の矢印は、状態間の遷移ではなく、開始状態を示すために使用されます。", "detailsJa": ["A. 受理状態は二重丸を使います。", "C. エラーには独自の標準シンボルがありません。", "D. 標準的なオートマトンには「優先度」という概念がありません。"]}, {"d": "easy", "q": "Trong notation 「**入力/出力**」 trên mũi tên giữa 2 trạng thái, ký hiệu 「**1/0**」 nghĩa là gì?", "jp": "矢印に書かれた「1/0」の意味はどれか。", "opts": ["**Khi input là 1, output là 0**", "Khi input là 0, output là 1", "1 chia 0 (lỗi)", "1 và 0 là tên 2 trạng thái"], "ans": 0, "why": "Trong 状態遷移図, label trên mũi tên thường viết theo dạng 「入力/出力」 (cách bởi dấu /):\n• Bên trái dấu / = INPUT.\n• Bên phải dấu / = OUTPUT.\nVậy 「1/0」 = nhận input '1', tạo output '0', đồng thời chuyển sang trạng thái mà mũi tên chỉ tới.", "details": ["B. Đảo ngược thứ tự.", "C. Không phải phép chia.", "D. Trạng thái thường được đánh tên S₁, S₂, q₀..., không phải '1' '0'."], "ref": "FE Syllabus — 基礎理論 / 状態遷移図 / 入力/出力表記", "qJa": "2のステータス中矢印の「**入力/出力**」という表記の「**1/0**」という記号は何を意味しますか？", "optsJa": ["**入力が 1, の場合、出力は 0**", "入力が0,の場合、出力は1となります", "1 除算 0 (エラー)", "1 と 0 はステータス名 2 です"], "whyJa": "状態遷移図では、矢印のラベルは通常「入力/出力」の形式で書かれます（/で区切られます）。\n• / = INPUT 記号の左側。\n• / = OUTPUT 記号の右側。\nしたがって、「1/0」 = 入力「1」を受け取り、出力「0」を生成し、矢印が指す状態に遷移します。", "detailsJa": ["B. 順序を逆にします。", "C. 除算ではありません。", "D. ステータスには通常、「1」「0」ではなく、S₁、S₂、q₀... という名前が付けられます。"]}, {"d": "med", "q": "Một automaton **Mealy machine** so với **Moore machine** khác nhau như thế nào? (Kiến thức mở rộng FE)", "jp": "MealyマシンとMooreマシンの違いはどれか。", "opts": ["Mealy chỉ có 1 trạng thái; Moore có nhiều", "**Mealy: output phụ thuộc cả 状態 và 入力 (label trên mũi tên); Moore: output chỉ phụ thuộc 状態 (label trong vòng tròn)**", "Cả 2 hoàn toàn giống nhau", "Mealy dùng cho 受理問題; Moore dùng cho 変換問題"], "ans": 1, "why": "Hai loại finite state machine chính:\n• **Mealy machine**: output gắn với TRANSITION (cạnh) → output phụ thuộc cả (state, input). Label: 「入力/出力」 trên mũi tên.\n• **Moore machine**: output gắn với STATE (đỉnh) → output chỉ phụ thuộc state. Label output viết trong vòng tròn.\nTheo Slide 1 第9回, dạng dùng 「入力/出力」 trên mũi tên = Mealy.", "details": ["A. Số trạng thái không phải tiêu chí phân biệt.", "C. Sai — 2 loại có cách biểu diễn output khác nhau.", "D. Cả 2 đều có thể dùng cho cả 2 mục đích."], "ref": "FE Syllabus — 基礎理論 / オートマトン / Mealy vs Moore", "qJa": "MealyマシンとMooreマシンの違いはどれか。", "optsJa": ["Mealy のステータスは 1 のみです。ムーアにはたくさんの", "**Mealy: 出力は状態と入力の両方に依存します (矢印のラベル)。ムーア: 出力は状態にのみ依存します (丸内のラベル)**", "2 はどちらも全く同じです", "Mealy は受理問題に使用されます。ムーアは変換問題に使用されました"], "whyJa": "有限状態マシンには主に 2 つのタイプがあります。\n• **Mealy machine**: 出力は TRANSITION (エッジ) に関連付けられています → 出力は両方 (状態、入力) に依存します。ラベル: 矢印の「入力/出力」。\n• **ムーア マシン**: 出力は状態に関連付けられます (上) → 出力は状態にのみ依存します。丸の中に書かれたラベル出力。\nスライド 1 第 9 回によると、矢印に「入力/出力」を使用したフォーム = Mealy とあります。", "detailsJa": ["A. 状態の数は区別基準ではありません。", "C. 不正解 — 2 タイプは出力表現が異なります。", "D. 2 は 2 の両方の目的で使用できます。"]}, {"d": "hard", "q": "**過去問 平成28年度 問題2-10**: Trong automaton 3 trạng thái nhận chuỗi bit, **受理状態** ở trạng thái cuối có self-loop {0,1}. Trace nào dưới đây cho chuỗi 「**1010**」 phản ánh đúng quy tắc 「S₁→1→S₂, S₂→0→S₃, S₃→{0,1}→S₃」 (S₁ khởi đầu, S₃ 受理)?", "jp": "「1010」を入力したときの遷移経路はどれか。", "opts": ["S₁ → S₁ → S₂ → S₃ → S₃ (không, sai bước đầu)", "**S₁ → S₂ → S₃ → S₃ → S₃ (đúng: từ S₁ thấy 1→S₂; thấy 0→S₃; sau đó vòng tại S₃)**", "S₁ → S₂ → S₂ → S₃ → S₃", "S₁ → S₁ → S₁ → S₂ → S₃"], "ans": 1, "why": "Trace 「1010」 với quy tắc:\n• Bắt đầu S₁.\n• '1': S₁ → S₂.\n• '0': S₂ → S₃.\n• '1': S₃ → S₃ (self-loop).\n• '0': S₃ → S₃ (self-loop).\nĐường đi: S₁ → S₂ → S₃ → S₃ → S₃. Kết thúc tại S₃ = 受理.", "details": ["A. Bước đầu '1' phải từ S₁ → S₂, không phải tự lặp S₁.", "C. Bước thứ 2 phải sang S₃ (do gặp '0'), không phải lặp S₂.", "D. Hai '1' đầu mà cứ ở S₁ là sai — '1' đầu tiên phải sang S₂ ngay."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 平成28年度 問題2-10", "qJa": "**過去問平成28年度問題2-10**: オートマトン3ではビット列受信状態、**受理状態**の最終状態には自己ループ{0,1}があります。文字列「**1010**」の次のトレースは、ルール「S₁→1→S₂, S₂→0→S₃, S₃→{0,1}→S₃」 (頭文字 S₁, S₃受理) を正しく反映しているものはどれですか?", "optsJa": ["S₁ → S₁ → S₂ → S₃ → S₃ (いいえ、ステップが間違っています)", "**S₁ → S₂ → S₃ → S₃ → S₃ (正解: S₁ からは 1→S₂ を参照。0→S₃ を参照。その後、S₃ でループします)**", "S₁ → S₂ → S₂ → S₃ → S₃", "S₁ → S₁ → S₁ → S₂ → S₃"], "whyJa": "「1010」をルールでトレースします:\n• S₁ を開始します。\n• 「1」: S₁ → S₂。\n• 「0」: S₂ → S₃。\n• '1': S₃ → S₃ (自己ループ)。\n• '0': S₃ → S₃ (自己ループ)。\nパス: S₁ → S₂ → S₃ → S₃ → S₃。 S₃ = 受理で終わります。", "detailsJa": ["A. 最初のステップ「1」は S₁ → S₂ でなければならず、S₁ 自体を繰り返す必要はありません。", "C. ステップ 2 は S₃ に進む必要があり (「0」のため)、S₂ を繰り返す必要はありません。", "D. S₁ にある最初の 2 つの「1」が間違っている場合、最初の「1」は直ちに S₂ に移動する必要があります。"]}, {"d": "med", "q": "Một automaton được dùng để mô hình hoá **đèn giao thông 3 màu** (赤→青→黄→赤...). Đây là loại automaton nào?", "jp": "信号機（赤→青→黄→赤の周期）をモデル化するオートマトンはどれか。", "opts": ["**Cyclic automaton (周期的) — 3 trạng thái 赤, 青, 黄 chuyển vòng theo tín hiệu thời gian**", "Linear automaton — không có vòng lặp", "Tree-structured automaton", "Đây không phải automaton vì không có input"], "ans": 0, "why": "Đèn giao thông là ví dụ kinh điển: 3 trạng thái {赤, 青, 黄} chuyển vòng tròn theo input (thường là timer / xung clock). 状態遷移図:\n赤 →(timer)→ 青 →(timer)→ 黄 →(timer)→ 赤.\nĐây là **cyclic** (周期的) automaton.", "details": ["B. Linear (không vòng) không phù hợp — đèn quay lại sau khi hết chu kỳ.", "C. Tree không có chu kỳ, không hợp.", "D. Sai — timer/xung clock chính là input."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 信号機の例", "qJa": "オートマトンを使用して、**色の 3 信号機** (赤→青→黄→赤...) をモデル化します。これは何の種類のオートマトンですか?", "optsJa": ["**サイクリックオートマトン (周期的) — 3 は時報に従って赤、青、黄のサイクルを表示します**", "線形オートマトン — ループなし", "ツリー構造のオートマトン", "入力がないのでこれはオートマトンではありません"], "whyJa": "信号機は典型的な例です。3 状態は入力 (通常はタイマー/クロック パルス) に従って {赤、青、黄} サイクルになります。 状態遷移図:\n赤→(タイマー)→青→(タイマー)→黄→(タイマー)→赤。\nこれは **周期的** (周期的) オートマトンです。", "detailsJa": ["B. リニア (リングなし) は適切ではありません — サイクルが終了すると光が戻ります。", "C. ツリーにはサイクルがなく、互換性がありません。", "D. 不正解 — タイマー/クロックが入力です。"]}, {"d": "med", "q": "Khi giải bài 状態遷移図 trong FE, chiến lược hiệu quả nhất là gì?", "jp": "状態遷移図の問題を解くベストプラクティスはどれか。", "opts": ["Học thuộc lòng tất cả các bài 過去問", "**Trace TỪNG ký tự của input string theo thứ tự, ghi lại trạng thái sau mỗi bước, đến cuối chuỗi xem có ở 受理状態 không**", "Tính tổng số trạng thái và so sánh với độ dài chuỗi", "Đoán dựa vào mẫu (pattern)"], "ans": 1, "why": "Phương pháp chuẩn cho IPA FE:\n1. Xác định 初期状態 (mũi tên đậm) và 受理状態 (二重丸).\n2. Đọc đề kỹ về cách label.\n3. Bắt đầu từ initial state, đọc TỪNG ký tự input.\n4. Áp dụng quy tắc transition, ghi state sau mỗi bước.\n5. Kết thúc chuỗi: kiểm tra state cuối = 受理状態?\nSlide 1 第9回 dùng phương pháp này trong 過去問練習.", "details": ["A. Học thuộc không hiệu quả — các bài luôn có biến thể.", "C. Sai — không có quan hệ giữa số trạng thái và độ dài chuỗi.", "D. Sai — không có pattern đảm bảo."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 解法戦略", "qJa": "状態遷移図の問題を解くベストプラクティスはどれか。", "optsJa": ["過去の問レッスンをすべて暗記する", "**入力文字列の各文字を順番にトレースし、各ステップ後のステータスを記録し、文字列の末尾に到達して受理状態かどうかを確認します**", "状態の総数を計算し、チェーンの長さと比較します", "パターンに基づいて推測する"], "whyJa": "IPA FEの標準的な方法:\n1. 初期状態 (太字の矢印) と受理状態 (二重丸) を識別します。\n2. ラベルについてよくお読みください。\n3. 初期状態から各入力文字を読み込みます。\n4. 遷移ルール​​を適用し、各ステップ後の状態を記録します。\n5. 文字列の終わり: 最後の状態を確認 = 受理状態?\nスライド 1 第 9 回では、過去問練習でこの方法を使用しています。", "detailsJa": ["A. 暗記は効果的ではありません。レッスンには常にバリエーションがあります。", "C. 不正解 — 状態の数とチェーンの長さの間には関係がありません。", "D. 不正解 — 保証されたパターンはありません。"]}, {"d": "med", "q": "Trong OS, **タスクの状態遷移 (task state transition)** có 3 trạng thái cơ bản nào? (Slide 4 ソフトウェア / Slide 1 第9回 mở rộng)", "jp": "タスクの状態遷移の3つの状態はどれか。", "opts": ["起動 / 動作 / 終了", "**実行可能状態 / 実行状態 / 待機状態 (ready / running / waiting)**", "初期 / 中間 / 終了", "開始 / 一時停止 / 完了"], "ans": 1, "why": "Theo Slide 4 ソフトウェア (mở rộng từ 状態遷移): 「タスクは実行可能状態・実行状態・待機状態の3つの状態を遷移しながら処理される」.\n• 実行可能 (ready): chờ CPU.\n• 実行 (running): đang được CPU xử lý.\n• 待機 (waiting): chờ I/O hoàn thành.", "details": ["A. Tên gọi sai chuẩn FE.", "C. Quá chung chung, không đúng thuật ngữ.", "D. Không khớp thuật ngữ OS chuẩn."], "ref": "FE Syllabus — テクノロジ系 / ソフトウェア / タスク状態遷移", "qJa": "OSの**タスクの状態遷移**の3はどのような基本状態ですか? (スライド 4 ソフトウェア / スライド 1 第 9 回展開)", "optsJa": ["動作 / 終了", "実行状態 / 待機状態 (ready / running / waiting)**", "中間 / 終了", "一時停止 / 完了"], "whyJa": "スライド 4 ソフトウェア (状態遷移から拡張) によると、「タスクは実行可能状態・実行状態・待機状態の3つの状態を遷移しながら処理される」となります。\n• 実行可能 (準備完了): CPU を待機しています。\n• 実行 (running): CPU によって処理されています。\n• 待機 (待機中): I/O が完了するまで待ちます。", "detailsJa": ["A. FE 規格に準拠していない名前です。", "C. 一般的すぎて、適切な用語ではありません。", "D. OS の標準用語と一致しません。"]}, {"d": "med", "q": "Trong sơ đồ trạng thái task (Slide 4): 「**実行状態 → 待機状態**」 xảy ra khi nào?", "jp": "タスクが実行状態から待機状態へ遷移するきっかけは何か。", "opts": ["Khi CPU sai cấu hình", "**Khi task phát sinh nhu cầu I/O (vd: đọc file) và phải chờ thiết bị ngoại vi hoàn thành**", "Khi task vượt quá thời gian cho phép", "Khi user nhấn nút stop"], "ans": 1, "why": "Transition 「実行 → 待機」 = task đang chạy phát sinh yêu cầu I/O (input/output) → giải phóng CPU và chuyển sang trạng thái chờ I/O hoàn thành. Sau khi I/O xong, task chuyển 「待機 → 実行可能」 (lại vào hàng đợi chờ CPU).", "details": ["A. Lỗi hệ thống không phải transition chuẩn.", "C. Đó là 「実行→実行可能」 trong cơ chế round-robin (time slice hết).", "D. User stop làm task chuyển trực tiếp sang 「タスク消滅」, không qua 待機."], "ref": "FE Syllabus — テクノロジ系 / ソフトウェア / タスク状態遷移", "qJa": "タスク状態図 (スライド 4): 「**実行状態 → 待機状態**」はいつ発生しますか?", "optsJa": ["CPUの設定が間違っている場合", "**タスクが I/O ニーズ (ファイルの読み取りなど) を生成し、周辺デバイスが完了するまで待機する必要がある場合**", "タスクが許容時間を超えた場合", "ユーザーが停止ボタンを押したとき"], "whyJa": "遷移 「実行 → 待機」 = 実行中のタスクが I/O 要求 (入出力) を生成 → CPU を解放し、I/O の完了を待つ状態に切り替わります。 I/O完了後、タスクは「待機→実行可能」（CPUキューに戻ります）に移行します。", "detailsJa": ["A. システムエラーは標準的な遷移ではありません。", "C. 総当りで「実行→実行可能」（タイムスライス終了）です。", "D. ユーザーは、タスクを待機を経由せずに直接「タスク消滅」に移行させるのをやめます。"]}, {"d": "med", "q": "Mối liên hệ giữa **オートマトン** và **タスクの状態遷移** trong OS là gì?", "jp": "オートマトンとタスク状態遷移の関係はどれか。", "opts": ["Hai khái niệm hoàn toàn độc lập, không liên quan", "**タスクの状態遷移 là một ỨNG DỤNG cụ thể của khái niệm 状態遷移 (オートマトン) — task được mô hình hoá như automaton với 3 trạng thái và các transition do sự kiện hệ thống**", "オートマトン là mô hình con của タスク状態遷移", "Hai khái niệm cùng nghĩa, chỉ khác ngôn ngữ"], "ans": 1, "why": "状態遷移 (chuyển trạng thái) là khái niệm TRỪU TƯỢNG — có thể áp dụng cho nhiều bối cảnh:\n• Automaton lý thuyết (Slide 1 第9回)\n• Task scheduling trong OS (Slide 4)\n• UI state (loading/loaded/error)\n• Network protocol (TCP: SYN, ESTABLISHED, FIN_WAIT...)\nTask state machine là CASE STUDY của ý tưởng automaton.", "details": ["A. Sai — có quan hệ rõ ràng.", "C. Đảo ngược: オートマトン rộng hơn.", "D. Khác cụ thể: automaton chung, task state là instance."], "ref": "FE Syllabus — 基礎理論 / 状態遷移の応用", "qJa": "オートマトンとタスク状態遷移の関係はどれか。", "optsJa": ["2 つの完全に独立した関連性のない概念", "**タスクの状態遷移は、状態遷移 (オートマトン) の概念の特定のアプリケーションです — タスクは、3 状態とシステム イベントによる遷移を備えたオートマトンとしてモデル化されています**", "オートマトンはタスク状態遷移のサブモジュールです", "同じ意味を持つ 2 つの概念、言語が異なるだけ"], "whyJa": "状態遷移 (状態遷移) は抽象的な概念であり、多くのコンテキストに適用できます。\n• 理論的オートマトン (スライド 1 第 9 回)\n• OS でのタスクのスケジューリング (スライド 4)\n• UI 状態 (読み込み中/読み込み済み/エラー)\n• ネットワークプロトコル (TCP: SYN、ESTABLISHED、FIN_WAIT...)\nタスク ステート マシンは、オートマトンのアイデアのケース スタディです。", "detailsJa": ["A. 間違い — 明確な関係があります。", "C. 逆：オートマトンの方が幅が広いです。", "D. その他の詳細: 一般的なオートマトン、タスクの状態はインスタンスです。"]}, {"d": "hard", "q": "Một **数当てゲーム** (đoán số) được mô hình bằng automaton: trạng thái = 「正解との差」. Player nhập một số → output \"高い\" / \"低い\" / \"正解\". Đây là dạng automaton nào?", "jp": "数当てゲームをモデル化するオートマトンの特徴はどれか。", "opts": ["Có hữu hạn trạng thái cố định trước (deterministic finite)", "**Có vô hạn (hoặc rất nhiều) trạng thái tiềm năng tuỳ vào dải số; output (高い/低い/正解) phụ thuộc cả 状態 và 入力 → là dạng Mealy machine**", "Chỉ có 1 trạng thái", "Không phải automaton vì có output"], "ans": 1, "why": "Phân tích:\n• Trạng thái = 「正解との差」 → nếu dải số là 1-1000, có 1000 trạng thái tiềm năng.\n• Output phụ thuộc cả state (số đúng) và input (số đoán) → MEALY type.\n• Khi input = 正解, chuyển sang trạng thái 「終了」 (受理).\nĐây là minh hoạ automaton với nhiều state.", "details": ["A. Sai — số trạng thái rất lớn, không cố định trước.", "C. Sai — cần nhiều trạng thái để track sự khác biệt.", "D. Sai — automaton có thể có output (Mealy/Moore)."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 応用例", "qJa": "数当てゲームをモデル化するオートマトンの特徴はどれか。", "optsJa": ["有限の事前固定状態が存在します (決定論的有限)", "**数値の範囲に応じて無限 (または多数) の潜在的な状態が存在します。出力 (高い/低い/正解) は状態と入力の両方に依存します → は Mealy マシン形式です**", "ステータスは 1 のみです", "出力があるためオートマトンではありません"], "whyJa": "分析:\n• 状態 = 「正解と差」 → 数値範囲が 1-1000, の場合、潜在的な状態は 1000 になります。\n• 出力は状態 (正しい数値) と入力 (推測された数値) の両方に依存します → MEALY タイプ。\n• 入力 = 正解の場合、状態「終了」(受理) に切り替わります。\nこれは複数の状態を持つオートマトンの図です。", "detailsJa": ["A. 不正解 — 状態の数は非常に多く、事前に固定されていません。", "C. 不正解 — 違いを追跡するには複数の状態が必要です。", "D. 不正解 — オートマトンは出力を持つことができます (Mealy/Moore)。"]}, {"d": "hard", "q": "Một automaton chấp nhận biểu thức chính quy 「**0\\*1\\***」 (zero hoặc nhiều số 0, theo sau là zero hoặc nhiều số 1). Có bao nhiêu trạng thái TỐI THIỂU cần thiết?", "jp": "正規表現「0*1*」を受理するオートマトンの最小状態数はいくつか。", "opts": ["1", "**2 (q0: đang ở phần '0*' / q1: đã sang '1*', cả 2 đều 受理 vì biểu thức cho phép rỗng)**", "3", "4"], "ans": 1, "why": "Phân tích 「0*1*」:\n• Chuỗi rỗng \"\" ✓\n• 「000」 ✓ (toàn '0')\n• 「111」 ✓ (toàn '1')\n• 「0011」 ✓\n• 「10」 ❌ ('1' xong rồi '0')\nAutomaton tối thiểu:\n• q0 (受理): nhận 0 → q0 (self), nhận 1 → q1.\n• q1 (受理): nhận 1 → q1 (self), nhận 0 → trap (hoặc không có chuyển).\nVậy 2 trạng thái 受理 đủ.", "details": ["A. 1 trạng thái không phân biệt được khi đã 'sang' phần 1.", "C. Có thể có thêm trap state nhưng không bắt buộc.", "D. Quá nhiều."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 正規表現", "qJa": "正規表現「0*1*」を受理するオートマトンの最小状態数はいくつか。", "optsJa": ["1", "**2 (q0: 現在 '0*' にあります / q1: '1*' に移動しました。式が空であるため、両方の 2 が受理されます)**", "3", "4"], "whyJa": "「0*1*」の分析:\n• 空の文字列 \"\" ✓\n• 「000」 ✓ (すべて「0」)\n• 「111」 ✓ (すべて「1」)\n• 「0011」 ✓\n• 「10」 ❌ (「1」の次に「0」)\n最小オートマトン:\n• q0（受理）：0受信→q0（自分）、1受信→q1。\n• q1 (受理): 1 受信 → q1 (自分)、0 受信 → トラップ (または転送なし)。\nしたがって、2 受理ステータスで十分です。", "detailsJa": ["A. セクション 1. に「切り替え」たときの 1 の状態は区別できません", "C. 追加のトラップ状態も可能ですが、必須ではありません。", "D. 多すぎます。"]}, {"d": "med", "q": "Quan sát automaton 「**điện thoại di động hoạt động**」: trạng thái có thể bao gồm gì?", "jp": "スマートフォンの動作をモデル化したときの状態の例はどれか。", "opts": ["Chỉ 「電源ON」 và 「電源OFF」", "**Có nhiều trạng thái: 「電源OFF」「ロック画面」「ホーム画面」「アプリ実行中」「通話中」「充電中」 v.v. — input là user action hoặc system event**", "Không có trạng thái — smartphone là stateless", "Chỉ trạng thái phần cứng, không có trạng thái phần mềm"], "ans": 1, "why": "Smartphone là ví dụ hệ thống phức tạp được mô hình hoá tốt bằng automaton:\n• States: OFF, locked, home, in-app, in-call, charging, sleep...\n• Inputs: power button, swipe, app launch, incoming call, charger plug...\n• Transitions: vd 「ロック画面 + swipe up → ホーム画面」.\nĐây minh hoạ giá trị của automaton trong thiết kế hệ thống thực tế.", "details": ["A. Quá đơn giản — bỏ qua nhiều trạng thái thực.", "C. Sai — smartphone rõ ràng có trạng thái.", "D. Trạng thái phần mềm (lock, foreground app...) là yếu tố chính."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 実世界応用", "qJa": "スマートフォンの動作をモデル化したときの状態の例はどれか。", "optsJa": ["「電源ON」と「電源OFF」のみ", "**多くの状態があります:「電源OFF」「ロック画面」「ホーム画面」「アプリ実行中」「通話中」「充電中」など — 入力はユーザーアクションまたはシステムイベントです**", "ステートレス — スマートフォンはステートレスです", "ハードウェア ステータスのみ、ソフトウェア ステータスなし"], "whyJa": "スマートフォンは、オートマトンで適切にモデル化された複雑なシステムの一例です。\n• 状態: オフ、ロック、ホーム、アプリ内、通話中、充電中、スリープ...\n• 入力: 電源ボタン、スワイプ、アプリ起動、着信、充電プラグ...\n• トランジション: 例: 「ロック画面 + 上にスワイプ → ホーム画面」。\nこれは、実際のシステム設計におけるオートマトンの価値を示しています。", "detailsJa": ["A. 単純すぎる - 多くの実際の状態を無視します。", "C. 不正解 – スマートフォンには明らかに状態があります。", "D. ソフトウェアのステータス (ロック、フォアグラウンド アプリなど) が主な要因です。"]}, {"d": "hard", "q": "Khái niệm **DFA (Deterministic Finite Automaton)** khác **NFA (Non-deterministic FA)** ở điểm gì? (Kiến thức mở rộng — FE chỉ test DFA)", "jp": "DFAとNFAの違いはどれか。", "opts": ["DFA dùng cho FE, NFA dùng cho ứng dụng AI", "**DFA: với mỗi (state, input), CÓ ĐÚNG 1 trạng thái kế tiếp; NFA: có thể có 0, 1, hoặc nhiều trạng thái kế tiếp (\"đoán\" đường đi)**", "DFA chậm hơn NFA", "DFA chỉ có 2 trạng thái, NFA có vô hạn"], "ans": 1, "why": "• **DFA (Deterministic)**: hàm chuyển δ(state, input) → đúng 1 next state. Đường đi cho mỗi input là DUY NHẤT.\n• **NFA (Nondeterministic)**: có thể có nhiều next state, cho phép ε-transitions (không cần input). Có thể \"đoán\" để chấp nhận.\nĐịnh lý: NFA và DFA tương đương về khả năng diễn đạt (cùng nhận regular language).\nFE chỉ test DFA dạng đơn giản.", "details": ["A. Sai — DFA/NFA dùng trong nhiều lĩnh vực.", "C. Tốc độ không phải tiêu chí phân biệt.", "D. Sai hoàn toàn."], "ref": "FE Syllabus — 基礎理論 / オートマトン / DFA vs NFA", "qJa": "DFAとNFAの違いはどれか。", "optsJa": ["DFA は FE に使用され、NFA は AI アプリケーションに使用されます", "**DFA: 各 (状態、入力) に対して、次の状態は正確に 1 です。 NFA: 0, 1, または複数の次の状態を持つことができます (パスを「推測」します)**", "DFA は NFA より遅い", "DFA には状態 2 のみがあり、NFA には無限があります"], "whyJa": "• **DFA (決定的)**: 伝達関数 δ(状態、入力) → 正しい 1 次の状態。各入力のパスは一意です。\n• **NFA (非決定的)**: 複数の次の状態を持つことができ、ε 遷移が可能になります (入力は必要ありません)。 「推測」して受け入れることができます。\n定理: NFA と DFA は表現という点では同等です (どちらも正規言語を受け入れます)。\nFE は単純な DFA のみをテストします。", "detailsJa": ["A. 不正解 — DFA/NFA は多くの分野で使用されています。", "C. 速度は区別の基準ではありません。", "D. 完全に間違っています。"]}, {"d": "easy", "q": "Một automaton có thể có **bao nhiêu 初期状態** (initial state)?", "jp": "オートマトンの初期状態の数はいくつか。", "opts": ["**Đúng 1 trạng thái khởi đầu (cho DFA)**", "Có thể có nhiều khởi đầu", "Không có", "Tuỳ thuộc vào ngôn ngữ được nhận"], "ans": 0, "why": "Định nghĩa chuẩn DFA: phải có **DUY NHẤT 1 初期状態**. Ký hiệu bằng mũi tên đậm chỉ vào (➡). Đây là điểm khởi đầu xác định để trace input.\n(Trong NFA mở rộng có thể có nhiều initial state, nhưng FE chỉ test DFA.)", "details": ["B. Chỉ đúng với NFA mở rộng, không phải DFA chuẩn.", "C. Không có initial state thì không thể bắt đầu trace.", "D. Số initial state là đặc trưng định nghĩa, không phụ thuộc ngôn ngữ."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 初期状態", "qJa": "オートマトンの初期状態の数はいくつか。", "optsJa": ["**1 の初期状態を修正 (DFA 用)**", "始まりはたくさんあります", "該当なし", "受信した言語に応じて異なります"], "whyJa": "DFA 標準定義: **1 初期状態** のみが必要です。 (➡) を指す太字の矢印で表されます。これは、トレース入力の指定された開始点です。\n(拡張 NFA では複数の初期状態が存在する可能性がありますが、FE は DFA のみをテストします。)", "detailsJa": ["B. 標準 DFA ではなく、拡張 NFA にのみ当てはまります。", "C. 初期状態がないとトレースを開始できません。", "D. 初期状態番号は、言語に依存しない定義機能です。"]}, {"d": "med", "q": "Một automaton có thể có **bao nhiêu 受理状態** (accepting state)?", "jp": "オートマトンの受理状態の数の制限はどれか。", "opts": ["Chỉ duy nhất 1 受理状態", "**0, 1, hoặc nhiều 受理状態 — tuỳ vào ngôn ngữ được nhận**", "Đúng bằng số 初期状態", "Phải là số chẵn"], "ans": 1, "why": "Số lượng 受理状態 không cố định:\n• Có thể có 0 (automaton không nhận chuỗi nào — trống).\n• Có thể có 1 (vd: \"chứa đúng pattern X\").\n• Có thể có nhiều (vd: \"chuỗi có độ dài chia hết cho 2 hoặc 3\").\nDuy nhất 1 初期状態, NHƯNG nhiều 受理状態 được phép.", "details": ["A. Sai — có thể có nhiều.", "C. Không có quan hệ này.", "D. Hoàn toàn vô lý."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 受理状態の数", "qJa": "オートマトンの受理状態の数の制限はどれか。", "optsJa": ["1のみ受理状態", "**0, 1, 以上 受理状態 — 受信している言語に応じて**", "初期状態の数字と全く同じです", "偶数である必要があります"], "whyJa": "受理状態の数量は固定されていません:\n• 0 (オートマトンは文字列を受信しませんでした - 空) の可能性があります。\n• 1 を含めることができます (例: 「正確なパターン X を含む」)。\n• 複数にすることもできます (例: 「長さが 2 または 3 で割り切れる文字列」)。\n1 初期状態のみですが、複数の受理状態が許可されます。", "detailsJa": ["A. 間違い — たくさんある可能性があります。", "C. そのような関係はありません。", "D. 全く不合理です。"]}, {"d": "hard", "q": "Tổng kết: chiến lược tốt nhất để học **オートマトン** cho kỳ thi FE là gì?", "jp": "FE試験でオートマトンを習得するベスト戦略はどれか。", "opts": ["Học thuộc lý thuyết DFA/NFA hình thức", "**(1) Nắm chắc định nghĩa 入力・状態・出力; (2) Hiểu ý nghĩa 初期/受理状態 và ký hiệu (○, 二重丸, mũi tên); (3) Luyện tape trace input string qua nhiều bài 過去問; (4) Tập đọc cả 状態遷移表 và 状態遷移図**", "Chỉ học công thức", "Tự vẽ automaton mới mà không cần đọc đề"], "ans": 1, "why": "Phối hợp 4 yếu tố:\n1. **Khái niệm**: hiểu rõ 入力/状態/出力 (Yasashii 02-04).\n2. **Ký hiệu**: ○ = state, ⊙ = 受理, ➡ = 初期, → = 遷移.\n3. **Trace skill**: thực hành nhiều 過去問 (平成26, 28, 30...) bằng cách trace từng ký tự.\n4. **Cả 2 biểu diễn**: bảng (状態遷移表) và sơ đồ (状態遷移図) — phải đọc được cả 2.\nSlide 1 第9回 và Yasashii 02-04 cung cấp đủ phương pháp này.", "details": ["A. Không cần lý thuyết hình thức cho FE — chỉ cần trace.", "C. Không có \"công thức\" — chỉ có quy tắc đọc/trace.", "D. Vẽ mà không hiểu đề không có giá trị thi."], "ref": "FE Syllabus — 基礎理論 / オートマトン / 学習戦略", "qJa": "FE試験でオートマトンを習得するベスト戦略はどれか。", "optsJa": ["正式な DFA/NFA 理論を暗記する", "**(1) 入力・状態・出力の定義を理解する。 (2) 初期・受理状態と記号（○、二重丸、矢印）の意味を理解する。 (3) 過去問の多くの演習を通じて、テープ トレース入力文字列を練習します。 (4) 状態遷移表と状態遷移図の両方を読む練習をします**", "公式を学ぶだけです", "問題を読まずに自分で新しいオートマトンを描きます"], "whyJa": "座標要素 4:\n1. **コンセプト**: 入力/状態/出力を理解します (教材「Yasashii」 02-04)。\n2. **記号**: ○ = 状態、⊙ = 受理、➡ = 初期、→ = 突破。\n3. **トレース スキル**: 各文字をなぞって過去問 (平成26, 28, 30...) をたくさん練習します。\n4. **どちらも 2 によって実行されます**: 表 (状態遷移表) と図 (状態遷移図) — 2. も読む必要があります\nこの方法については、スライド 1 第 9 回とやさしい 02-04 で十分に説明されています。", "detailsJa": ["A. FE には正式な理論は必要ありません。トレースするだけです。", "C. 「式」はなく、読み取り/トレース ルールのみがあります。", "D. テーマを理解せずに絵を描くことは試験に値しません。"]}]</script>
