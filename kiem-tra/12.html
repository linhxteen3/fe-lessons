  {"d": "hard", "q": "Một bảng băm có 100 ô. Lưu 50 giá trị ngẫu nhiên với hàm `x mod 100`. Xác suất xảy ra ít nhất 1 衝突 sẽ:", "jp": "100ます hash表に50個ランダム格納するとき衝突確率は。", "opts": ["Rất thấp, gần 0%", "Rất cao (gần 100%, theo nguyên lý birthday)", "Đúng 50%", "Bằng 0% nếu hash đều"], "ans": 1, "details": ["A. Sai.", "B. Đúng — theo birthday paradox, với 50 phần tử trên 100 ô, xác suất 衝突 gần như chắc chắn — đây chính là lý do 衝突 luôn là vấn đề thực tế của hash.", "C. Sai.", "D. Hash đều cũng không tránh được nếu input ngẫu nhiên — đây là bản chất xác suất."]},

  {"d": "hard", "q": "Theo bảng オーダー記法 của 第2-3回 slide, khi n = 10000, lần lượt số lượng thao tác xấp xỉ cho 線形, 2分, hash là:", "jp": "n=10000のとき、線形/2分/ハッシュの操作回数は。", "opts": ["10000 / ≒14 / 1", "10000 / 100 / 1", "100 / 10 / 1", "10000 / 10000 / 10000"], "ans": 0, "details": ["A. Đúng — O(n)=10000, O(log₂10000)≒13.3 ≒14, O(1)=1.", "B. Sai — log₂10000 ≠ 100.", "C. Sai.", "D. Sai."]},
