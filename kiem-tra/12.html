20", "100", "1000"], "whyJa": "", "detailsJa": ["A. 誤り — log₂10⁶ ≒ 19.9 は 10. より大きい", "B. 正解 — log₂(10⁶) ≒ 19.93, から 20 までの比較倍。", "C. 違います。", "D. 違います。"]}, {"d": "hard", "q": "Khi xảy ra 衝突 trong ハッシュ法, hậu quả là gì?", "jp": "ハッシュ法で衝突が起こるとどうなるか。", "opts": ["Dữ liệu bị mất", "Hiệu quả thuật toán giảm vì phải dùng phương pháp khác để giải quyết", "Hash table tự động mở rộng", "Phải dùng 2分探索法 thay thế"], "ans": 1, "details": ["A. Không bị mất — cần xử lý đặc biệt.", "B. Đúng — Yasashii: 「別の方法で衝突を解決しないといけないので、アルゴリズムの効率が落ちます」.", "C. Không tự động.", "D. Không liên quan."], "qJa": "ハッシュ法で衝突が起こるとどうなるか。", "optsJa": ["データが失われました", "問題を解決するには別の方法を使用する必要があるため、アルゴリズムの効率が低下します", "ハッシュテーブルは自動的に拡張されます", "代わりに 2 分探索法を使用する必要があります"], "whyJa": "", "detailsJa": ["A. 紛失していません – 特別な取り扱いが必要です。", "B. 正解 — 教材「Yasashii」: 「別の方法で衝突を解決しないのでいけないので、アルゴリズムの効率が落ちます」。", "C. 自動ではありません。", "D. 関係ありません。"]}, {"d": "hard", "q": "Trong các nhận định sau về 2分探索法, nhận định nào ĐÚNG?", "jp": "2分探索法について正しい記述は。", "opts": ["Có thể dùng trực tiếp trên mảng chưa sắp xếp", "Mỗi vòng lặp giảm phạm vi tìm kiếm xuống còn một nửa", "Hiệu quả thấp hơn 線形探索法", "Cần hash function"], "ans": 1, "details": ["A. Cần sắp xếp trước.", "B. Đúng — chia đôi mỗi bước → O(log₂n).", "C. Ngược lại — 2分 hiệu quả hơn 線形.", "D. Không cần."], "qJa": "2分探索法について正しい記述は。", "optsJa": ["ソートされていない配列に直接使用できます", "ループごとに検索範囲が半分に減ります", "低効率線形探索法", "ハッシュ関数が必要です"], "whyJa": "", "detailsJa": ["A. 事前に手配が必要です。", "B. 正解 — 各ステップを半分にします → O(log₂n)。", "C. 逆に、線形よりも 2 分の方が効果的です。", "D. 必要ありません。"]}, {"d": "hard", "q": "Mảng có 16 phần tử đã sắp xếp. Nếu dữ liệu tăng gấp đôi (32 phần tử), số lần so sánh tối đa của 2分探索法 sẽ:", "jp": "データが2倍になると2分探索法の最大比較回数は。", "opts": ["Tăng gấp đôi", "Tăng thêm 1 lần", "Không đổi", "Tăng gấp 4"], "ans": 1, "details": ["A. Đó là 線形.", "B. Đúng — log₂16 = 4, log₂32 = 5 → chỉ tăng 1.", "C. Sai — vẫn tăng nhẹ.", "D. Sai."], "qJa": "配列には 16 要素がすでに整列されています。データが 2 倍になる場合 (32 要素)、2 分探索法の最大比較回数は次のようになります。", "optsJa": ["2倍", "1倍増加", "変わらない", "倍増 4"], "whyJa": "", "detailsJa": ["A. 線形です。", "B. 正解 — log₂16 = 4, log₂32 = 5 → 1. のみ増加します", "C. 間違っています — まだわずかに増加しています。", "D. 違います。"]}, {"d": "hard", "q": "Trong tình huống nào việc dùng ハッシュ法 KHÔNG có lợi so với 線形探索法?", "jp": "ハッシュ法が線形探索法より有利でない状況は。", "opts": ["Khi cần tra cứu nhanh nhiều lần", "Khi dữ liệu rất nhỏ và xung đột thường xuyên", "Khi dữ liệu có thể chuyển thành hash value", "Khi cần truy cập O(1) trung bình"], "ans": 1, "details": ["A. Đó là điểm mạnh hash.", "B. Đúng — với dữ liệu nhỏ và 衝突 (collision) nhiều, chi phí giải quyết xung đột làm giảm hiệu quả, có thể không tốt hơn linear.", "C. Đó là tiền đề tốt cho hash.", "D. Đó là điểm mạnh hash."], "qJa": "ハッシュ法が線形探索法より有利でない状況は。", "optsJa": ["何度も素早く調べたいとき", "データが非常に小さく、頻繁に競合する場合", "データをハッシュ値に変換できる場合", "平均 O(1) にアクセスする必要がある場合"], "whyJa": "", "detailsJa": ["A. それがハッシュの強みです。", "B. 正解 — データが小さく、衝突が多い場合、競合解決のコストにより効率が低下します。これは線形より良いとは言えないかもしれません。", "C. これはハッシュ化の良い前提です。", "D. それがハッシュの強みです。"]}, {"d": "hard", "q": "Cho mảng đã sắp xếp [3, 5, 7, 9, 11, 13, 15, 17, 19]. Khi dùng 2分探索法 tìm 11, sau lần so sánh đầu tiên với phần tử giữa, phạm vi tìm kiếm tiếp theo là?", "jp": "[3,5,7,9,11,13,15,17,19]で11を2分探索。1回目比較後の範囲は。", "opts": ["[3,5,7,9]", "[13,15,17,19]", "Tìm thấy ngay (11 nằm ở giữa)", "[7,9,11,13]"], "ans": 2, "details": ["A. Sai.", "B. Sai.", "C. Đúng — (1+9)÷2=5, phần tử thứ 5 là 11 = khoá → 発見! ngay lần đầu.", "D. Sai."], "qJa": "配列に整列 [3, 5, 7, 9, 11, 13, 15, 17, 19] があるようにします。中央要素との最初の比較後に 2 分探索法を使用して 11, を見つける場合、次の検索範囲は?", "optsJa": ["[3,5,7,9]", "[13,15,17,19]", "現在見つかりました（11が真ん中）", "[7,9,11,13]"], "whyJa": "", "detailsJa": ["A. 違います。", "B. 違います。", "C. 正解 — (1+9)÷2=5, 5 番目の要素は 11 = キー → 発見!初めて。", "D. 違います。"]}, {"d": "hard", "q": "Một bảng băm có 100 ô. Lưu 50 giá trị ngẫu nhiên với hàm `x mod 100`. Xác suất xảy ra ít nhất 1 衝突 sẽ:", "jp": "100ます hash表に50個ランダム格納するとき衝突確率は。", "opts": ["Rất thấp, gần 0%", "Rất cao (gần 100%, theo nguyên lý birthday)", "Đúng 50%", "Bằng 0% nếu hash đều"], "ans": 1, "details": ["A. Sai.", "B. Đúng — theo birthday paradox, với 50 phần tử trên 100 ô, xác suất 衝突 gần như chắc chắn — đây chính là lý do 衝突 luôn là vấn đề thực tế của hash.", "C. Sai.", "D. Hash đều cũng không tránh được nếu input ngẫu nhiên — đây là bản chất xác suất."], "qJa": "100 セルを含むハッシュ テーブル。関数 `x mod 100` を使用して、50 のランダム値を保存します。少なくとも 1 衝突の発生確率は次のようになります。", "optsJa": ["非常に低く、0% に近い", "非常に高い (誕生日の原則によるとほぼ 100%)", "はい 50%", "均等にハッシュされた場合は 0% に等しい"], "whyJa": "", "detailsJa": ["A. 違います。", "B. 正解 — 誕生日のパラドックスによれば、100 セルに 50 要素がある場合、衝突の確率はほぼ確実です — これが、衝突が常に実際のハッシュ問題となる理由です。", "C. 違います。", "D. 入力がランダムな場合、均一ハッシュを回避することはできません。これが確率の性質です。"]}, {"d": "hard", "q": "Nhận định nào về tài liệu Yasashii là CHÍNH XÁC?", "jp": "Yasashiiの記述で正しいのは。", "opts": ["FE試験 yêu cầu thí sinh phải trình bày cách giải quyết 衝突 chi tiết", "FE試験 chỉ hỏi điểm: hash có khả năng xảy ra 衝突, không hỏi cách giải quyết cụ thể", "2分探索法 ít được FE hỏi hơn 線形探索法", "ハッシュ法 không có nhược điểm"], "ans": 1, "details": ["A. Sai.", "B. Đúng — Yasashii: 「衝突を回避するための具体的な方法が問われることはありません」.", "C. Sai — Yasashii nói 2分 và hash được hỏi nhiều nhất.", "D. Sai — có 衝突."], "qJa": "Yasashiiの記述で正しいのは。", "optsJa": ["FE試験では、受験者は衝突に対する詳細な解決策を提示する必要があります", "FE試験はハッシュが衝突しやすいという点を問うだけで、具体的な解決策は求めない", "2分探索法 FE線形探索法未満", "ハッシュ法にはデメリットはない"], "whyJa": "", "detailsJa": ["A. 違います。", "B. 正解 — 教材「Yasashii」: 「衝突を回避するための具体的な方法が問われることはありません」。", "C. 間違っています — 教材「Yasashii」人は、2分と最もよく聞かれるハッシュを言いました。", "D. 間違っています — 衝突があります。"]}, {"d": "hard", "q": "Theo bảng オーダー記法 của 第2-3回 slide, khi n = 10000, lần lượt số lượng thao tác xấp xỉ cho 線形, 2分, hash là:", "jp": "n=10000のとき、線形/2分/ハッシュの操作回数は。", "opts": ["10000 / ≒14 / 1", "10000 / 100 / 1", "100 / 10 / 1", "10000 / 10000 / 10000"], "ans": 0, "details": ["A. Đúng — O(n)=10000, O(log₂10000)≒13.3 ≒14, O(1)=1.", "B. Sai — log₂10000 ≠ 100.", "C. Sai.", "D. Sai."], "qJa": "第2-3回スライドの表オーダー記法によると、n = 10000,の場合、線形、2分、ハッシュのおおよその操作数は次のようになります。", "optsJa": ["10000 / ≒14 / 1", "10000 / 100 / 1", "100 / 10 / 1", "10000 / 10000 / 10000"], "whyJa": "", "detailsJa": ["A. 正解 — O(n)=10000, O(log₂10000)≒13.3 ≒14, O(1)=1.", "B. 不正解 — log₂10000 ≠ 100.", "C. 違います。", "D. 違います。"]}, {"d": "hard", "q": "Mảng [12, 3, 17, 5, 8, 14, 21, 6, 9, 1, 19] CHƯA sắp xếp. Muốn tìm 14, thuật toán nào áp dụng đúng và hiệu quả NHẤT cho 1 lần tìm?", "jp": "未整列の配列で14を探すのに最適な方法は。", "opts": ["2分探索法 trực tiếp", "線形探索法", "Sắp xếp xong rồi dùng 2分探索法", "Hash với x mod 10"], "ans": 1, "details": ["A. Không thể — 2分 cần sắp xếp trước.", "B. Đúng — chỉ 1 lần tìm, linear duyệt tuần tự là O(n) hiệu quả, không cần tốn O(n log n) để sắp xếp.", "C. Tốn thêm chi phí sắp xếp — không hiệu quả cho 1 lần tìm.", "D. Cần xây hash table trước — không hợp lý cho 1 lần tìm."], "qJa": "配列 [12, 3, 17, 5, 8, 14, 21, 6, 9, 1, 19] 整列ではありません。 14, を見つけたい場合、1 を検索するのに最も正確で効果的なアルゴリズムはどれですか?", "optsJa": ["2分探索法ライブ", "線形探索法", "並べ替え後、2分探索法を使用してください", "x mod 10 を使用したハッシュ"], "whyJa": "", "detailsJa": ["A. 不可能 — 2分は事前に手配する必要があります。", "B. 正解 — 1 検索のみ。順次線形トラバーサルは O(n) 効率的で、ソートに O(n log n) を費やす必要はありません。", "C. ソートコストの増加 — 1 検索には効果的ではありません。", "D. 最初にハッシュ テーブルを構築する必要があります。1 が検索するのは合理的ではありません。"]}, {"d": "hard", "q": "Ưu điểm nổi bật nhất của ハッシュ法 so với 2分探索法 là gì?", "jp": "ハッシュ法が2分探索法より優れている点は。", "opts": ["Không yêu cầu dữ liệu sắp xếp trước, truy cập trung bình O(1)", "Tốn ít bộ nhớ hơn", "Không bao giờ thất bại", "Đơn giản hơn để lập trình"], "ans": 0, "details": ["A. Đúng — hash truy cập trực tiếp qua hash value, không cần sắp xếp; trung bình O(1) so với O(log₂n) của 2分.", "B. Ngược lại — hash thường tốn thêm bộ nhớ cho bảng.", "C. Có thể gặp 衝突.", "D. Tuỳ implementation."], "qJa": "ハッシュ法が2分探索法より優れている点は。", "optsJa": ["事前にソートされたデータは不要、平均アクセス O(1)", "必要なメモリが少なくなります", "絶対に失敗しない", "プログラムが簡単"], "whyJa": "", "detailsJa": ["A. 正解 — ハッシュはハッシュ値を介して直接アクセスされ、並べ替えは必要ありません。 2 分の平均 O(1) と O(log₂n) の比較。", "B. 逆に、ハッシュは通常、テーブルにより多くのメモリを必要とします。", "C. 衝突に会える。", "D. 実装に依存します。"]}, {"d": "hard", "q": "Trong bài thi FE, khi đề cho mảng 1.024 phần tử SORTED và hỏi số lần so sánh tối đa của linear vs binary search để xác định có/không có khoá, đáp án đúng là:", "jp": "1024個のソート済みで線形/2分の最大比較回数は。", "opts": ["線形: 1024, 2分: 10", "線形: 512, 2分: 10", "線形: 1024, 2分: 1024", "線形: 10, 2分: 1024"], "ans": 0, "details": ["A. Đúng — Linear tối đa duyệt hết 1024 phần tử. 2分: log₂1024 = 10 lần.", "B. 512 là trung bình của linear, không phải tối đa.", "C. Sai — 2分 nhanh hơn nhiều.", "D. Đảo ngược — sai."], "qJa": "FE 試験では、SORTED 要素を含む配列 1.024 が与えられ、キーが存在するかどうかを判断するための線形探索と二分探索の比較の最大数を尋ねられたとき、正解は次のとおりです。", "optsJa": ["線形: 1024, 2分: 10", "線形: 512, 2分: 10", "線形: 1024, 2分: 1024", "線形: 10, 2分: 1024"], "whyJa": "", "detailsJa": ["A. 正解 — すべての 1024 要素を横断する最大線形。 2 分: log₂1024 = 10 回。", "B. 512 は最大値ではなく、線形平均です。", "C. 間違っています — 2 分の方がはるかに高速です。", "D. 逆 — 不正解。"]}]</script>
