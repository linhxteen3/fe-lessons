"A. キュー（queue）のイメージです。", "C. スタックの写真ではありません。", "D. それは木構造のイメージです。"]}, {"d": "easy", "q": "Lệnh **「push C」** trong スタック có nghĩa là gì?", "jp": "「push C」の動作はどれか。", "opts": ["Lấy phần tử C ra khỏi stack", "**Đưa dữ liệu C vào stack (đặt lên đỉnh)**", "Tìm kiếm dữ liệu C trong stack", "Xoá tất cả dữ liệu trong stack"], "ans": 1, "why": "Yasashii 03-01: 「スタックにデータを格納することをpush(プッシュ)といいます。例えば『C』というデータをスタックに格納する場合は『push C』と記述します」.\nPush LUÔN cần CHỈ ĐỊNH dữ liệu cần nạp (vd \"push C\", \"push 5\").", "details": ["A. Đó là 「pop」 (取り出す).", "C. Stack không có thao tác tìm kiếm chuẩn.", "D. Không phải thao tác chuẩn của stack."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / push", "qJa": "「push C」の動作はどれか。", "optsJa": ["要素 C をスタックから削除", "**Cデータをスタックに入れる(上に置く)**", "スタック内のCデータを検索", "スタック内の全データを削除"], "whyJa": "教材「Yasashii」 03-01: 「スタックにデータを格納することをpush(推)といいまPush C」と記述します。\nPush では、ロードするデータを常に指定する必要があります (例: \"push C\"、\"push 5\")。", "detailsJa": ["A. それは「ポップ」（取り出す）です。", "C. スタックには標準の検索操作がありません。", "D. スタックの標準動作ではありません。"]}, {"d": "easy", "q": "Lệnh **「pop」** trong スタック có cần chỉ định dữ liệu không (như 「pop C」)?", "jp": "popの記述方法として正しいものはどれか。", "opts": ["Có — phải viết 「pop C」 để chỉ định dữ liệu C cần lấy", "**Không — chỉ viết 「pop」 (không cần chỉ định dữ liệu, vì stack chỉ trả về phần tử trên cùng)**", "Có thể viết cả 2 cách", "Phải viết 「pop ALL」 để lấy tất cả"], "ans": 1, "why": "Yasashii 03-01: 「データをスタックから取り出す場合は『pop』とだけ記述します。スタックでは、最上部に格納されているデータ（最後に格納したデータ）しか取り出せないので、pushのようにデータ名を指定する必要はありません（『pop C』とは記述しません）」.\nĐiểm khác biệt quan trọng: push CHỈ ĐỊNH data, pop KHÔNG chỉ định.", "details": ["A. Sai — Yasashii ghi rõ KHÔNG viết 「pop C」.", "C. Sai — chỉ có 1 cách viết đúng.", "D. Không có lệnh 「pop ALL」 chuẩn."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / pop の記法", "qJa": "popの記述方法として正しいものはどれか。", "optsJa": ["はい — 取得する C データを指定するには「pop C」と記述する必要があります", "**いいえ — 「pop」と書くだけです (スタックは先頭の要素のみを返すため、データを指定する必要はありません)**", "2 とも書くことができます", "すべて取得するには「pop ALL」と書く必要があります"], "whyJa": "教材「Yasashii」 03-01: 「データをスタックから取り出す場合は『pop』とだけ書きます。スタックでは、最上部に格納されているデータ（最後に隠したデータ）しかないので、pus h のようにデータ名を指定する必要はありません（『pop C』とは記述しません）」。\n重要な違い: Push はデータを示しますが、pop はデータを指定しません。", "detailsJa": ["A. 間違っています — 教材「Yasashii」は「pop C」と書かないことを明確に述べました。", "C. 間違っています - 正しいスペルは 1 のみです。", "D. 標準の「pop ALL」コマンドはありません。"]}, {"d": "med", "q": "Cho stack rỗng. Thực hiện: **push A, push B, push C, pop, push D, pop**. Trạng thái stack (đáy → đỉnh) sau cùng là?", "jp": "操作後のスタックの状態（底→頂上）はどれか。", "opts": ["[A, B, C, D]", "**[A, B]**", "[A, C, D]", "[B, C]"], "ans": 1, "why": "Trace:\n1. push A → [A]\n2. push B → [A, B]\n3. push C → [A, B, C]\n4. pop → bỏ C → [A, B]\n5. push D → [A, B, D]\n6. pop → bỏ D → **[A, B]**\nStack cuối cùng còn 2 phần tử A (đáy) và B (đỉnh).", "details": ["A. C và D đã bị pop.", "C. Không đúng — B vẫn còn trong stack.", "D. A vẫn còn ở đáy, không bị xoá."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / トレース", "qJa": "操作後のスタックの状態（底→頂上）はどれか。", "optsJa": ["[A, B, C, D]", "**[A, B]**", "[A, C, D]", "[B, C]"], "whyJa": "トレース:\n1. A→[A]を押す\n2. Bを押す→[A、B]\n3. Cを押す→[A、B、C]\n4. ポップ → ドロップ C → [A, B]\n5. Dを押す→[A、B、D]\n6. ポップ → ドロップ D → **[A, B]**\n最後のスタックには、2 要素 A (下) と B (上) があります。", "detailsJa": ["A.CとDがポップされました。", "C. 不正解 — B はまだスタック上にあります。", "D. A は削除されずに一番下に残ります。"]}, {"d": "med", "q": "Cho stack rỗng. Thực hiện chuỗi: **push 1, push 2, pop, push 3, push 4, pop, pop**. Pop CUỐI CÙNG trả về giá trị gì?", "jp": "最後のpopが返す値はどれか。", "opts": ["1", "2", "3", "**1**"], "ans": 3, "why": "Trace:\n1. push 1 → [1]\n2. push 2 → [1, 2]\n3. pop → trả 2, [1]\n4. push 3 → [1, 3]\n5. push 4 → [1, 3, 4]\n6. pop → trả 4, [1, 3]\n7. pop → trả 3, [1]\nNHƯNG đề hỏi 「pop CUỐI CÙNG」 = pop ở bước 7 → trả về **3**.\n⚠ Em đã ghi sai đáp án ở câu này — đáp án chính xác là **C (3)**, không phải D (1).", "details": ["A. 1 vẫn còn trong stack sau pop cuối, không bị trả về.", "B. 2 đã được pop ở bước 3.", "C. Đáp án này thực sự đúng (3 là pop cuối cùng).", "D. Em đã đánh dấu sai — đáp án này không đúng."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / pop trace", "qJa": "スタックを空にします。次のシーケンスを実行します: **プッシュ 1, プッシュ 2, ポップ、プッシュ 3, プッシュ 4, ポップ、ポップ**。 LAST ポップはどのような値を返しますか?", "optsJa": ["1", "2", "3", "**1**"], "whyJa": "トレース:\n1. プッシュ 1 → [1]\n2. プッシュ 2 → [1, 2]\n3. ポップ→ペイ 2, [1]\n4. プッシュ 3 → [1, 3]\n5. プッシュ 4 → [1, 3, 4]\n6. ポップ→ペイ 4, [1, 3]\n7. ポップ → ペイ 3, [1]\nただし、「FINAL Pop」を要求すると、ステップ 7 でポップ → **3** が返されます。\n⚠ この質問の間違った答えを書き留めました。正解は D (1) ではなく、**C (3)** です。", "detailsJa": ["A. 1 は最後のポップの後、バウンスされずにスタックに残ります。", "B. 2 がステップ 3. でポップされました", "C. この答えは実際には正しいです (3 が最後のポップです)。", "D. あなたはそれを間違ったとマークしました - この答えは間違っています。"]}, {"d": "med", "q": "Trong một stack có dung lượng tối đa 3 phần tử, điều gì xảy ra khi push phần tử thứ 4?", "jp": "容量3のスタックに4個目をpushしたとき、何が起こるか。", "opts": ["Phần tử cũ nhất tự động bị xoá để có chỗ", "**Stack overflow (オーバーフロー) — lỗi tràn stack**", "Stack tự mở rộng dung lượng", "Phần tử mới được lưu vào đáy stack"], "ans": 1, "why": "Stack có dung lượng cố định → khi push vượt quá khả năng chứa, gây ra **スタックオーバーフロー (stack overflow)** — lỗi hệ thống nghiêm trọng.\nNgược lại: pop khi stack rỗng → **スタックアンダーフロー (stack underflow)**.\nĐây là khái niệm quan trọng trong cả CPU stack và program runtime.", "details": ["A. Stack không tự xoá phần tử cũ (khác với circular buffer).", "C. Stack truyền thống không tự mở rộng (chỉ trong dynamic stack mới có).", "D. Sai — push luôn đặt lên ĐỈNH, không phải đáy."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / オーバーフロー", "qJa": "容量3のスタックに4個目をpushしたとき、何が起こるか。", "optsJa": ["スペースを確保するために最も古い要素が自動的に削除されます", "**スタック オーバーフロー (オーバーフロー) — スタック オーバーフロー エラー**", "スタックの容量は自己拡張します", "新しい要素はスタックの一番下に保存されます"], "whyJa": "スタックの容量は固定されています → プッシュすると容量を超え、**スタックオーバーフロー (スタック オーバーフロー)** が発生します。これは重大なシステム エラーです。\nその逆: スタックが空のときにポップ → **スタックアンダーフロー (スタックアンダーフロー)**。\nこれは、CPU スタックとプログラム実行時間の両方において重要な概念です。", "detailsJa": ["A. スタックは古い要素を自動的に削除しません (循環バッファとは異なります)。", "C. 従来のスタックはそれ自体を拡張しません (動的スタックのみが拡張します)。", "D. 間違っています — プッシュは常に下部ではなく上部に配置されます。"]}, {"d": "med", "q": "Tại sao スタック lại phù hợp để lưu **「行った処理の履歴」** (lịch sử thao tác đã thực hiện)?", "jp": "処理履歴の保存にスタックが適している理由はどれか。", "opts": ["Vì stack lưu được nhiều dữ liệu hơn array", "**Vì lịch sử cần được TRUY HỒI THEO THỨ TỰ NGƯỢC (thao tác gần nhất trước) — phù hợp với LIFO; cũng giúp Undo trở lại trạng thái trước đó**", "Vì stack tự xoá dữ liệu cũ tự động", "Vì stack chạy nhanh hơn các cấu trúc khác"], "ans": 1, "why": "Yasashii 03-01: 「スタックというデータ構造を利用して、『行った処理』の過程を保存しておけば、コンピュータはいつでも元の処理に戻ることができます。なぜなら、保存されている処理履歴を1つずつ戻っていけば、元の処理にたどりつくからです。これがスタックというデータ構造の最大の特徴です」.\nỨng dụng thực tế: chức năng Undo (Ctrl+Z), trình duyệt Back button, call stack trong gọi hàm.", "details": ["A. Dung lượng không liên quan đến cơ chế lưu lịch sử.", "C. Stack không tự xoá dữ liệu cũ.", "D. Tốc độ không phải lý do chính."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / 履歴保存", "qJa": "処理履歴の保存にスタックが適している理由はどれか。", "optsJa": ["スタックは配列よりも多くのデータを保存できるため", "**履歴は逆の順序 (最新の操作が最初) で記録される必要があるため、LIFO と一貫性があります。また、Undo で前の状態に戻るのにも役立ちます**", "スタックは古いデータを自動的に削除するため", "スタックは他の構造物よりも速く実行されるため"], "whyJa": "教材「Yasashii」 03-01: 「スタックというデータ構造を利用して、『行った処理』の過程を保存しておけば、コンピュータはいつでも元の処理に戻ることができます。なぜなら、保存されている処理履歴を 1 つずつ戻っていけば、元の処理にたどりつくからです。これがスタックというデータ構造の最大の特徴です。」\n実際のアプリケーション: 元に戻す機能 (Ctrl+Z)、ブラウザの戻るボタン、関数呼び出しのスタック呼び出し。", "detailsJa": ["A. 容量は履歴保存メカニズムとは関係ありません。", "C. スタックは古いデータを自動的に削除しません。", "D. 速度は主な理由ではありません。"]}, {"d": "med", "q": "Trong văn học cổ điển 「ヘンゼルとグレーテル」 (Hansel và Gretel), việc Hansel **rải vụn bánh mì (パンくず)** để tìm đường về có thể được mô hình bằng cấu trúc nào?", "jp": "パンくずを目印にして来た道を戻る行為はどのデータ構造に近いか。", "opts": ["Queue (キュー)", "**Stack (スタック)** — vụn bánh được nhặt theo thứ tự NGƯỢC với thứ tự rải", "Array", "Linked List"], "ans": 1, "why": "Yasashii 03-01 dùng đúng ví dụ này: 「ヘンゼルとグレーテルという童話の中で、ヘンゼルがパンくずを落としながら森の中を歩くシーンがあります。パンくずを目印にすれば、いつでも元の場所に戻ることができます。これと同じです」.\nGiải thích kỹ thuật: rải (push) vụn theo đường đi, nhặt (pop) theo thứ tự ngược → tìm về điểm xuất phát. Đây chính là LIFO.", "details": ["A. Queue lấy ra theo thứ tự ĐẾN TRƯỚC, không phù hợp với việc đi ngược.", "C. Array có thể làm được nhưng không tự nhiên như stack.", "D. Linked list cũng có thể, nhưng không phải mô hình tự nhiên cho LIFO."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / 実生活例", "qJa": "パンくずを目印にして来た道を戻る行為はどのデータ構造に近いか。", "optsJa": ["Queue (キュー)", "**スタック (スタック)** — パンくずは散乱の逆の順序で収集されます", "配列", "リンクリスト"], "whyJa": "教材「Yasashii」 03-01 はこの例を正しく使用しています: 「ヘンゼルとグレーテルという童話の中で、ヘンゼルがパンくずを落としながら森を歩くシーンがあります。パンくずを目印にすれば、いつでも元の場所に戻ることができます。これと同じです。」\n技術的な説明: パン粉をパスに沿って広げて (押して)、逆の順序で拾い上げて (ポップして) → 開始点を見つけます。これがLIFOです。", "detailsJa": ["A. キューは COME FIRST の順序で取得されるため、後戻りには適していません。", "C. 配列でも実行できますが、スタックほど自然ではありません。", "D. リンクされたリストも可能ですが、LIFO の自然なモデルではありません。"]}, {"d": "hard", "q": "Cho 4 dữ liệu A, B, C, D đến lần lượt. Dùng **một stack duy nhất**, dãy đầu ra **「B, A, D, C」** có khả thi không?", "jp": "スタック1つを使って出力列「B,A,D,C」は実現可能か。", "opts": ["**Có — khả thi**", "Không — không thể tạo dãy này", "Không xác định", "Chỉ với 2 stack mới được"], "ans": 0, "why": "Trace:\n1. push A → [A]\n2. push B → [A, B]\n3. pop → trả **B**, [A]\n4. pop → trả **A**, []\n5. push C → [C]\n6. push D → [C, D]\n7. pop → trả **D**, [C]\n8. pop → trả **C**, []\nDãy đầu ra: **B, A, D, C** ✓ KHẢ THI.", "details": ["B. Đáp án này sai — dãy là khả thi như trace trên.", "C. Có thể xác định được rõ ràng.", "D. Sai — chỉ cần 1 stack."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / 出力可能列", "qJa": "4 の場合、データ A、B、C、D が順に到着します。 **単一スタック**を使用して、出力シーケンス**「B、A、D、C」**は可能ですか?", "optsJa": ["**はい — 可能です**", "いいえ — このシーケンスは作成できません", "不明", "2スタックのみ"], "whyJa": "トレース:\n1. A→[A]を押す\n2. Bを押す→[A、B]\n3. ポップ → 支払い **B**、[A]\n4. ポップ → 支払い **A**、[]\n5. C→[C]を押す\n6. Dを押す→[C、D]\n7. ポップ → 支払い **D**、[C]\n8. ポップ → 支払い **C**、[]\n出力範囲: **B、A、D、C** ✓ 実現可能。", "detailsJa": ["B. この答えは不正確です。上記のトレースに示されているように、シーケンスは可能です。", "C. 明確に識別可能。", "D. 間違っています — 1 スタックだけです。"]}, {"d": "hard", "q": "Cho 4 dữ liệu A, B, C, D đến lần lượt. Dùng **một stack duy nhất**, dãy đầu ra **「A, D, B, C」** có khả thi không?", "jp": "スタック1つを使って出力列「A,D,B,C」は実現可能か。", "opts": ["Có — khả thi", "**Không — không thể tạo dãy này**", "Có với stack có dung lượng vô hạn", "Có nếu thay thứ tự đầu vào"], "ans": 1, "why": "Trace cố gắng:\n1. push A → [A]\n2. pop → trả **A**, [] ✓\n3. Để output D tiếp theo, phải push B, C, D rồi pop D ngay: push B [B], push C [B,C], push D [B,C,D], pop → **D** ✓, [B,C]\n4. Cần output B tiếp theo, nhưng đỉnh stack là **C** không phải B → để lấy B phải pop C TRƯỚC → dãy thành A, D, **C**, B (KHÁC với A, D, B, C).\n→ KHÔNG THỂ tạo dãy A, D, B, C.", "details": ["A. Trace thử thì không thể.", "C. Dung lượng vô hạn cũng không giải quyết được — vấn đề ở thứ tự LIFO.", "D. Đề bài cố định thứ tự đầu vào A,B,C,D."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / 平成29年度 風", "qJa": "4 の場合、データ A、B、C、D が順に到着します。 **単一スタック**を使用して、出力シーケンス**「A、D、B、C」**は可能ですか?", "optsJa": ["はい — 可能です", "**いいえ — このシーケンスは作成できません**", "はい、無限のスタック容量あり", "入力順序が変更された場合ははい"], "whyJa": "トレース試行:\n1. A→[A]を押す\n2. ポップ → 支払い **A**、[] ✓\n3. 次の D を出力するには、B、C、D を押してからすぐに D をポップする必要があります。B [B] を押し、C [B,C] を押し、D [B,C,D] を押し、ポップ → **D** ✓、[B,C]\n4. 次に B を出力する必要がありますが、スタックの先頭は B ではなく **C** です → B を取得するには、最初に C をポップする必要があります → シーケンスは A、D、**C**、B になります (A、D、B、C とは異なります)。\n→ シーケンス A、D、B、C は作成できません。", "detailsJa": ["A. トレースしようとしましたが、できませんでした。", "C. 容量が無限でも問題は解決しません。問題は LIFO 順序です。", "D. この問題により、入力順序 A、B、C、D が修正されます。"]}, {"d": "med", "q": "Trong CPU, **コールスタック (call stack)** được dùng để làm gì?", "jp": "CPUのコールスタックの役割はどれか。", "opts": ["Lưu trữ tất cả biến của chương trình", "**Lưu trữ địa chỉ trả về (return address) và biến cục bộ khi gọi hàm — khi hàm kết thúc, pop ra để trở về điểm gọi**", "Lưu cache CPU", "Lưu dữ liệu đồ hoạ"], "ans": 1, "why": "Call stack là ứng dụng KINH ĐIỂN của stack trong CPU:\n• Khi gọi hàm f() → push địa chỉ trả về + biến cục bộ vào stack.\n• Khi gọi hàm g() lồng trong f() → push frame của g().\n• Khi g() return → pop frame của g(), tiếp tục f().\n• Khi gọi đệ quy quá sâu → 「スタックオーバーフロー」 (lỗi stack overflow).", "details": ["A. Biến chương trình lưu trong heap/data segment, không phải call stack.", "C. Cache có cơ chế riêng (LRU...), không dùng stack.", "D. Đồ hoạ dùng cấu trúc khác."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / コールスタック", "qJa": "CPUのコールスタックの役割はどれか。", "optsJa": ["すべてのプログラム変数を保存します", "**関数呼び出し時に戻りアドレスとローカル変数を保存します — 関数が終了すると、ポップアウトして呼び出しポイントに戻ります**", "CPUキャッシュを保存", "グラフィックデータの保存"], "whyJa": "コール スタックは、CPU のスタックの古典的なアプリケーションです。\n• 関数 f() を呼び出す場合 → 戻りアドレス + ローカル変数をスタックにプッシュします。\n• f() にネストされた関数 g() を呼び出す場合 → g() のフレームをプッシュします。\n• g() が戻ると → g() のフレームをポップし、f() を続行します。\n• 再帰が深すぎる場合 → 「スタックオーバーフロー」（スタックオーバーフローエラー）。", "detailsJa": ["A. プログラム変数はコールスタックではなくヒープ/データセグメントに保存されます。", "C. キャッシュは独自のメカニズム (LRU...) を持ち、スタックを使用しません。", "D. グラフィックスは異なる構造を使用します。"]}, {"d": "hard", "q": "Tại sao **逆ポーランド表記法 (RPN)** lại được tính bằng STACK chứ không phải QUEUE?", "jp": "逆ポーランド計算でスタックを使う理由はどれか。", "opts": ["Vì stack nhanh hơn queue", "**Vì khi gặp toán tử, cần 2 toán hạng GẦN NHẤT vừa push — chính là 2 phần tử trên đỉnh stack (LIFO). Queue (FIFO) sẽ lấy 2 phần tử ĐẦU TIÊN, sai logic**", "Vì RPN bắt buộc phải dùng stack theo quy định IPA", "Vì queue không thể chứa số"], "ans": 1, "why": "Phân tích cơ chế tính RPN:\n• Push các toán hạng theo thứ tự.\n• Khi gặp toán tử (vd +) → cần 2 số GẦN NHẤT vừa được push → đây là 2 phần tử ở ĐỈNH stack.\n• Stack LIFO trả về đúng 2 số đó.\n• Nếu dùng queue, sẽ lấy 2 số ĐẦU TIÊN (cũ nhất) — không liên quan đến toán tử hiện tại.\n→ Stack là cấu trúc TỰ NHIÊN cho RPN.", "details": ["A. Tốc độ không phải lý do bản chất.", "C. Không phải quy định IPA — đây là logic toán học.", "D. Queue cũng chứa được số nhưng sai logic."], "ref": "FE Syllabus — 基礎理論 / データ構造 / スタック / 逆ポーランドとの関係", "qJa": "逆ポーランド計算でスタックを使う理由はどれか。", "optsJa": ["スタックはキューよりも速いため", "**演算子に遭遇した場合、プッシュされたばかりの NEAREST オペランドである 2 が必要になるためです。これは、スタック (LIFO) の最上位の要素である 2 です。キュー (FIFO) は 2 FIRST 要素を受け取ります、間違ったロジック**", "IPAの規定によりRPNはスタックを使用する必要があるため", "キューに数字を含めることはできないため"], "whyJa": "RPN 計算メカニズムの分析:\n• オペランドを順番にプッシュします。\n• 演算子 (例: +) に遭遇した場合 → 押されたばかりの 2 最も近い番号が必要 → これはスタックの先頭にある 2 要素です。\n• スタック LIFO は正しい番号 2 を返します。\n• キューを使用する場合、2 の最初 (最も古い) 番号が使用されます。現在のオペレーターとは関係ありません。\n→ スタックは RPN の自然な構造です。", "detailsJa": ["A. スピードは本質的な理由ではありません。", "C. IPA 規制ではありません。これは数学的論理です。", "D. キューには数字を含めることもできますが、ロジックが正しくありません。"]}, {"d": "easy", "q": "Trong キュー, hành động 「**最初に格納したデータを最初に取り出す**」 được gọi là gì?", "jp": "キューのデータ処理方式はどれか。", "opts": ["**FIFO (First In First Out) — 先入れ先出し**", "LIFO (Last In First Out)", "Random Access", "Stack 順"], "ans": 0, "why": "Yasashii 03-01: 「キューのような、先に入れたデータを先に出すアルゴリズムのことを先入れ先出し（FIFO: First In First Out）といいます」.\nVD: hàng người xếp tại quầy thu ngân — ai đến trước thì được phục vụ trước.", "details": ["B. LIFO là cơ chế của スタック.", "C. Truy cập ngẫu nhiên là đặc trưng của 配列 (array).", "D. Không có thuật ngữ chính thức 「Stack 順」."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / FIFO", "qJa": "キューのデータ処理方式はどれか。", "optsJa": ["**FIFO (First In First Out) — 先入れ先出し**", "LIFO (後入れ先出し)", "ランダムアクセス", "Stack 順"], "whyJa": "教材「Yasashii」 03-01: 「キューのような、先に入れたデータを先に出すFIFO: 先入れ先出し）といいます」。\n例: レジカウンターの列 — 先着順です。", "detailsJa": ["B. LIFO はスタックのメカニズムです。", "C. ランダムアクセスは配列 (array) の特徴です。", "D. 「スタック順」という正式な用語はありません。"]}, {"d": "easy", "q": "Tên gọi khác (別名) của キュー trong Yasashii là gì?", "jp": "キューの別名はどれか。", "opts": ["**待ち行列 (machi-gyōretsu / hàng đợi)**", "積み上げ", "ポインタリスト", "ハッシュテーブル"], "ans": 0, "why": "Yasashii 03-01: 「キューとは、データを1列に並べて、最初に格納したデータを最初に取り出すデータ構造です。キューは『待ち行列』とも呼ばれます」.\n「待ち行列」 nghĩa là 「hàng đợi」 — chính xác mô tả bản chất của queue.", "details": ["B. 「積み上げ」 (xếp chồng) là hình ảnh của スタック.", "C. Không phải thuật ngữ chuẩn.", "D. Hash table là cấu trúc dữ liệu khác."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / 別名", "qJa": "キューの別名はどれか。", "optsJa": ["**待ち行列(まちぎょうれつ/行列)**", "積み上げ", "ポインタリスト", "ハッシュテーブル"], "whyJa": "教材「Yasashii」03-01: 「キューとは、データを1列に並べて、最初に格納したデータを最初に取り出すデータ構造です。キューは『待ち行列』とも呼ばれます。」\n「待ち行列」は「キュー」を意味し、キューの性質を正確に表しています。", "detailsJa": ["B. 「積み上げる」は積み重ねのイメージです。", "C. 標準用語ではありません。", "D. ハッシュ テーブルは別のデータ構造です。"]}, {"d": "easy", "q": "Lệnh **「enqueue D」** trong キュー có nghĩa là gì?", "jp": "「enqueue D」の動作はどれか。", "opts": ["Lấy phần tử D ra khỏi queue", "**Đưa dữ liệu D vào CUỐI queue (hàng đợi)**", "Đưa dữ liệu D vào ĐẦU queue", "Xoá tất cả phần tử D"], "ans": 1, "why": "Yasashii 03-01: 「キューにデータを入れることをenqueue(エンキュー)といいます。例えば『D』というデータをキューに入れる場合は『enqueue D』と記述します」.\nQuy ước: ai đến sau → đứng ở CUỐI hàng (như xếp hàng ở quầy thu ngân).", "details": ["A. Đó là 「dequeue」 (取り出す).", "C. Sai — enqueue đặt vào CUỐI, không phải đầu.", "D. Không phải thao tác chuẩn của queue."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / enqueue", "qJa": "「enqueue D」の動作はどれか。", "optsJa": ["要素 D をキューから削除します", "**データ D をキューの最後に配置します**", "データ D をキューの HEAD に入れます", "すべての D 要素を削除"], "whyJa": "教材「Yasashii」 03-01: 「キューにデータを入れることをenqueue(エンキュー)といいます。例えば『D』というデータをキューに入れる場合は『enqueue D』と書きます。」\n慣例: 後から来た人が列​​の最後尾に立つ (レジで並ぶのと同じ)。", "detailsJa": ["A. それは「デキュー」（取り出す）です。", "C. 間違っています — エンキューは先頭ではなく最後に配置されます。", "D. 標準のキュー操作ではありません。"]}, {"d": "easy", "q": "Lệnh **「dequeue」** trong キュー có cần chỉ định dữ liệu không (như 「dequeue D」)?", "jp": "dequeueの記述方法はどれか。", "opts": ["Có — phải viết 「dequeue D」", "**Không — chỉ viết 「dequeue」 (vì queue luôn lấy phần tử ĐẦU hàng đợi)**", "Có thể viết cả 2 cách", "Phải viết kèm số thứ tự"], "ans": 1, "why": "Yasashii 03-01: 「データをキューから取り出す場合は『dequeue』と記述します。キューでは、最初に格納したデータしか取り出せないので、enqueueのようにデータ名を指定する必要はありません（『dequeue D』とは記述しません）」.\nGiống pop của stack — không cần chỉ định.", "details": ["A. Sai — Yasashii ghi rõ không viết 「dequeue D」.", "C. Chỉ có 1 cách đúng.", "D. Không có quy ước này."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / dequeue 記法", "qJa": "dequeueの記述方法はどれか。", "optsJa": ["はい — 「dequeue D」と書く必要があります", "**いいえ — 「dequeue」と書くだけです (queue は常にキューの最初の要素を取るため)**", "2 とも書くことができます", "シリアル番号を記入する必要があります"], "whyJa": "教材「Yasashii」 03-01: 「データをから取り出す場合は『dequeu e』と記述します。キューでは、最初に格納したデーDequeue D」とは記述しません）。\nポップのスタックの種類 — 指定する必要はありません。", "detailsJa": ["A. 間違っています — 教材「Yasashii」さんは「dequeue D」を書かないと明言しました。", "C. 正しい方法は 1 だけです。", "D. そのような慣例はありません。"]}, {"d": "med", "q": "Cho queue rỗng. Thực hiện: **ENQ 5, ENQ 3, ENQ 7, DEQ, ENQ 2**. Trạng thái queue (đầu → cuối) là?", "jp": "操作後のキューの状態（先頭→末尾）はどれか。", "opts": ["[5, 3, 7, 2]", "**[3, 7, 2]**", "[7, 3, 2]", "[2, 7, 3]"], "ans": 1, "why": "Trace queue (đầu → cuối):\n1. ENQ 5 → [5]\n2. ENQ 3 → [5, 3]\n3. ENQ 7 → [5, 3, 7]\n4. DEQ → lấy 5 (đầu), → [3, 7]\n5. ENQ 2 → [3, 7, 2]\nKết quả: **[3, 7, 2]** (đầu=3, cuối=2).", "details": ["A. 5 đã bị DEQ.", "C. Sai thứ tự — 3 ở đầu (vào trước), 7 sau, 2 cuối.", "D. Đảo ngược thứ tự."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / トレース", "qJa": "キューを空にします。 **ENQ 5, ENQ 3, ENQ 7, DEQ、ENQ 2** を実行します。キューの状態(最初→最後)は何ですか?", "optsJa": ["[5, 3, 7, 2]", "**[3, 7, 2]**", "[7, 3, 2]", "[2, 7, 3]"], "whyJa": "トレースキュー (先頭→末尾):\n1. ENQ 5 → [5]\n2. ENQ 3 → [5, 3]\n3. ENQ 7 → [5, 3, 7]\n4. DEQ → 5 (頭) を取得、→ [3, 7]\n5. ENQ 2 → [3, 7, 2]\n結果: **[3, 7, 2]** (最初=3, 最後=2)。", "detailsJa": ["A. 5 は DEQ されました。", "C. 間違った順序 — 先頭 (最初) が 3、後が 7、最後が 2。", "D. 順序を逆にします。"]}, {"d": "med", "q": "Cho queue rỗng. Chuỗi thao tác: **ENQ A, ENQ B, ENQ C, DEQ, ENQ D, DEQ, ENQ E, DEQ**. DEQ cuối cùng trả về giá trị gì?", "jp": "最後のDEQが取り出す値はどれか。", "opts": ["A", "B", "**C**", "D"], "ans": 2, "why": "Trace từng bước (đầu trái, cuối phải):\n1. ENQ A → [A]\n2. ENQ B → [A, B]\n3. ENQ C → [A, B, C]\n4. DEQ → trả **A**, [B, C]\n5. ENQ D → [B, C, D]\n6. DEQ → trả **B**, [C, D]\n7. ENQ E → [C, D, E]\n8. DEQ → trả **C**, [D, E]\nDEQ cuối cùng trả về **C**.", "details": ["A. A là DEQ thứ nhất.", "B. B là DEQ thứ hai.", "D. D vẫn còn trong queue sau DEQ cuối."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / DEQ trace", "qJa": "最後のDEQが取り出す値はどれか。", "optsJa": ["A", "B", "**C**", "D"], "whyJa": "ステップバイステップでトレースします (左に開始し、右に終了):\n1. ENQ A → [A]\n2. ENQ B → [A、B]\n3. ENQ C → [A、B、C]\n4. DEQ → **A**、[B、C] を支払います\n5. ENQ D → [B、C、D]\n6. DEQ → **B**、[C、D] を支払います\n7. ENQ E → [C、D、E]\n8. DEQ → **C**、[D、E] を支払います\n最後の DEQ は **C** を返します。", "detailsJa": ["A. A は最初の DEQ です。", "B. B は 2 番目の DEQ です。", "D. D は最後の DEQ の後もキュー内にあります。"]}, {"d": "easy", "q": "Tại sao キュー lại phù hợp để xử lý các tác vụ theo **「命令を入力した順番」** (thứ tự lệnh nhập vào)?", "jp": "キューが入力順処理に適している理由はどれか。", "opts": ["Vì queue truy cập nhanh hơn stack", "**Vì queue đảm bảo FIFO — lệnh nào enqueue trước sẽ được dequeue/xử lý trước, đúng thứ tự nhập vào**", "Vì queue có thể chứa nhiều dữ liệu hơn", "Vì queue tự sắp xếp dữ liệu theo độ ưu tiên"], "ans": 1, "why": "Yasashii 03-01: 「キューというデータ構造を使うメリットは、命令を入力した順番どおりに処理できることです」.\nỨng dụng thực tế: print queue (in tài liệu), task queue (xử lý batch), message queue (gửi tin nhắn), keyboard buffer (đệm bàn phím).", "details": ["A. Tốc độ truy cập không phải lý do.", "C. Dung lượng không liên quan.", "D. Đó là 優先度付きキュー (priority queue) — biến thể khác của queue."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / メリット", "qJa": "キューが入力順処理に適している理由はどれか。", "optsJa": ["キューアクセスが早いのでスタック", "**キューは FIFO を保証するため、最初にキューに入れられたコマンドが、正しい入力順序で最初にデキュー/処理されます**", "キューにはより多くのデータを保持できるため", "キューが優先度に従ってデータを自動的に配置するため"], "whyJa": "教材「Yasashii」 03-01: 「キューというデータ構造を使うメリットは、コマンドを入力して順番に処理できることです」。\n実際のアプリケーション: プリント キュー (ドキュメントの印刷)、タスク キュー (バッチ処理)、メッセージ キュー (メッセージの送信)、キーボード バッファ (キーボード バッファ)。", "detailsJa": ["A. アクセス速度が理由ではありません。", "C. 容量は関係ありません。", "D. それは優先度付きキュー (priority queue) — キューの別のバリエーションです。"]}, {"d": "med", "q": "Trong queue, có thể chen ngang giữa hàng đợi (vd: chen giữa các phần tử) không?", "jp": "キューの途中に新しいデータを割り込ませることはできるか。", "opts": ["Có — có thể chen ngang vào bất kỳ vị trí", "**Không — Yasashii ghi rõ 「列の途中に割り込むことはできません」 — chỉ enqueue vào CUỐI và dequeue từ ĐẦU**", "Chỉ có thể chen vào đầu", "Chỉ có thể chen vào giữa"], "ans": 1, "why": "Yasashii 03-01: 「お客さんはデータです。お客さんは列の最後に並びます。最初に並んだ人が、最初に会計をすませることができます。列の途中に割り込むことはできません」.\nNguyên tắc cứng: chỉ thêm vào CUỐI (enqueue) và chỉ lấy ra từ ĐẦU (dequeue). Đây là quy tắc cốt lõi của queue chuẩn.", "details": ["A. Sai — chen ngang vi phạm nguyên tắc FIFO.", "C. Không thể chen vào đầu (đó là enqueue vào đầu, không phải queue).", "D. Không thể chen vào giữa."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / 制約", "qJa": "キューの途中に新しいデータを割り込ませることはできるか。", "optsJa": ["はい — 任意の位置に割り込むことができます", "**いいえ — やさしくは「列の途中に割り込むことはできません」と指定しています — END でのみエンキューし、FIRST からデキューします**", "頭を押し込むことしかできない", "間に挟むことしかできない"], "whyJa": "教材「Yasashii」 03-01: 「客さんはデータです。客さんは列の最後に並びます。最初に並ぶだ人が、最初に会計を消すことができます。列の途中に割り込むことはできません。」\n厳密なルール: END (エンキュー) にのみ追加し、FIRST (デキュー) からのみ削除します。これは標準キューの中核となるルールです。", "detailsJa": ["A. 不正解 — 割り込みは FIFO 原則に違反します。", "C. ヘッドにエンキューできません (つまり、キューではなくヘッドにエンキューです)。", "D. 真ん中に入れない。"]}, {"d": "med", "q": "Khi gọi **「dequeue」** trên một queue **rỗng**, điều gì xảy ra?", "jp": "空のキューにdequeueを実行したときの結果はどれか。", "opts": ["Trả về giá trị mặc định 0", "Queue tự tạo phần tử mới", "**Lỗi 「キューアンダーフロー」 (queue underflow) — không có dữ liệu để lấy ra**", "Trả về phần tử cuối cùng đã từng có"], "ans": 2, "why": "Tương tự stack underflow, queue cũng có **キューアンダーフロー** khi dequeue trên queue rỗng. Đây là lỗi cần kiểm tra trong code (vd: `if not queue.empty()` trước khi dequeue).\nNgược lại: enqueue vào queue đầy → **キューオーバーフロー**.", "details": ["A. Sai — không có giá trị mặc định.", "B. Queue không tự tạo phần tử.", "D. Sai — sau dequeue dữ liệu bị xoá khỏi queue."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / アンダーフロー", "qJa": "空のキューにdequeueを実行したときの結果はどれか。", "optsJa": ["デフォルト値 0 を返します", "キューは新しい要素を自動的に作成します", "**エラー「キューアンダーフロー」 (キューアンダーフロー) — 取得するデータがありません**", "存在した最後の要素を返します。"], "whyJa": "スタックアンダーフローと同様に、キューのデキューが空の場合、キューにも **キューアンダーフロー** が発生します。これはコード内でチェックする必要があるエラーです (例: デキュー前の `if not queue.empty()`)。\nその逆: 満杯のキューにエンキュー → **キューオーバーフロー**。", "detailsJa": ["A. 不正解 — デフォルト値はありません。", "B. キューは独自に要素を作成しません。", "D. 不正解 — デキュー後、データはキューから削除されます。"]}, {"d": "med", "q": "Trong OS, hệ thống **印刷キュー (print queue)** trên máy in dùng cấu trúc gì? Tại sao?", "jp": "プリンタの印刷キューに使われるデータ構造とその理由はどれか。", "opts": ["Stack — để in tài liệu mới nhất trước", "**Queue — để in theo đúng thứ tự gửi lệnh (FIFO), công bằng cho mọi người**", "Tree — để in theo cấu trúc phân cấp", "Hash table — để tìm tài liệu nhanh"], "ans": 1, "why": "Print queue là ứng dụng KINH ĐIỂN của queue:\n• Ai gửi lệnh in trước → in trước.\n• Đảm bảo công bằng (fairness) giữa các user.\n• Không bị 「chen ngang」.\nTương tự: keyboard buffer, mouse event queue, message queue trong network.", "details": ["A. Sai — stack sẽ in tài liệu mới nhất trước, gây bất công.", "C. Tree không phù hợp cho hàng đợi tuyến tính.", "D. Hash table dùng cho tìm kiếm, không phải hàng đợi."], "ref": "FE Syllabus — 基礎理論 / データ構造 / キュー / 印刷キュー", "qJa": "プリンタの印刷キューに使われるデータ構造とその理由はどれか。", "optsJa": ["スタック — 最新のドキュメントを最初に印刷します", "**キュー — コマンドが送信された正しい順序 (FIFO) で印刷し、誰にとっても公平です**", "ツリー — 階層構造で印刷します", "ハッシュ テーブル — ドキュメントを素早く見つけるため"], "whyJa": "印刷キューは、キューの古典的なアプリケーションです。\n• 最初に印刷注文を送信した人が最初に印刷します。\n• ユーザー間の公平性を確保します。\n• 邪魔をしないでください。\n同様: ネットワーク内のキーボード バッファ、マウス イベント キュー、メッセージ キュー。", "detailsJa": ["A. 不正解 — スタックは最新のドキュメントを最初に印刷するため、不公平が生じます。", "C. ツリーは線形キューには適していません。", "D. ハッシュ テーブルはキューではなく検索に使用されます。"]}, {"d": "hard", "q": "**循環キュー (circular queue / ring buffer)** là gì?", "jp": "循環キューの定義はどれか。", "opts": ["Queue có dữ liệu tự lặp lại", "**Queue cố định kích thước, sử dụng mảng và 2 con trỏ (front/rear) di chuyển vòng tròn — khi rear đến cuối mảng, quay về đầu (modular)**", "Queue có 2 đầu để enqueue cùng lúc", "Queue dùng cho dữ liệu hình tròn"], "ans": 1, "why": "Circular queue tối ưu hoá việc dùng mảng cho queue:\n• Có 2 con trỏ: **front** (đầu) và **rear** (cuối).\n• Khi rear chạm cuối mảng → wrap về index 0 (modular arithmetic).\n• Tránh lãng phí ô nhớ khi dequeue thông thường.\nỨng dụng: keyboard buffer, audio streaming, networking packet buffer.", "details": ["A. Không phải tự lặp lại dữ liệu.", "C. Đó là **デック (deque)** — Double-Ended Queue.", "D. Sai — không liên quan đến dữ liệu hình học."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 循環キュー", "qJa": "循環キューの定義はどれか。", "optsJa": ["キューに繰り返されるデータがあります", "**キュー固定サイズ、配列を使用し、2 ポインター (前/後) が円形に移動します - 後が配列の最後に達すると、先頭に戻ります (モジュラー)**", "キューには同時にエンキューする 2 ヘッダーがあります", "キューは循環データに使用されます"], "whyJa": "循環キューは、キューの配列の使用を最適化します。\n• 2 ポインターは、**前** (開始) と **後** (終了) です。\n• 後部が配列の最後に達すると、→ インデックス 0 (剰余算術) にラップされます。\n• 通常のデキュー時にメモリ セルを無駄にしないようにします。\nアプリケーション: キーボード バッファ、オーディオ ストリーミング、ネットワーク パケット バッファ。", "detailsJa": ["A. 自分でデータを繰り返す必要はありません。", "C. それは **デック (deque)** — 両端キューです。", "D. 不正解 — 幾何学的データが含まれていません。"]}, {"d": "hard", "q": "**デック (deque / 両端キュー)** khác với queue thông thường ở điểm gì?", "jp": "両端キュー（deque）と通常キューの違いはどれか。", "opts": ["Deque chỉ có 1 đầu, queue có 2 đầu", "**Deque cho phép enqueue/dequeue ở CẢ HAI ĐẦU (đầu và cuối); queue chỉ enqueue ở cuối, dequeue ở đầu**", "Deque chứa được nhiều dữ liệu hơn", "Deque và queue hoàn toàn giống nhau"], "ans": 1, "why": "**Deque (Double-Ended Queue)** = queue mở rộng:\n• `push_front` / `pop_front`: thao tác ở đầu.\n• `push_back` / `pop_back`: thao tác ở cuối.\n→ Deque có thể được dùng làm **cả stack và queue**.\nỨng dụng: undo/redo, sliding window algorithm, palindrome check.", "details": ["A. Đảo ngược — queue 1 hướng thao tác mỗi đầu, deque 2 hướng.", "C. Dung lượng không phải khác biệt.", "D. Khác nhau rõ ràng về số đầu thao tác."], "ref": "FE Syllabus — 基礎理論 / データ構造 / デック", "qJa": "両端キュー（deque）と通常キューの違いはどれか。", "optsJa": ["Deque の先頭には 1 のみがあり、Queue の先頭には 2 があります", "**Deque では、両方のヘッド (最初と最後) でのエンキュー/デキューが可能です。キューのみ最後にエンキューし、最初にデキューします**", "Deque はより多くのデータを保持します", "Deque と queue はまったく同じです"], "whyJa": "**デキュー (両端キュー)** = 拡張キュー:\n• `push_front` / `pop_front`: トップ操作。\n• `push_back` / `pop_back`: 最後の操作。\n→ Deque は **スタックとキューの両方**として使用できます。\nアプリケーション: 元に戻す/やり直し、スライディング ウィンドウ アルゴリズム、回文チェック。", "detailsJa": ["A. リバース — エンド操作方向ごとに 1 をキュー、2 方向をデキューします。", "C. 容量は違いません。", "D. 操作番号の明確な違い。"]}, {"d": "hard", "q": "**Priority Queue (優先度付きキュー)** khác queue thông thường ở điểm gì?", "jp": "優先度付きキューと通常キューの違いはどれか。", "opts": ["Priority queue nhanh hơn", "**Trong priority queue, mỗi phần tử có một 「優先度」; dequeue lấy phần tử có ưu tiên CAO NHẤT, không theo FIFO**", "Priority queue có dung lượng vô hạn", "Priority queue chỉ chứa số nguyên"], "ans": 1, "why": "**優先度付きキュー (Priority Queue)**:\n• Mỗi phần tử có 「優先度 (priority)」.\n• Dequeue lấy phần tử ƯU TIÊN CAO NHẤT (không phải FIFO).\n• Thường được hiện thực bằng **ヒープ (heap)** — cây nhị phân đặc biệt.\nỨng dụng: lập lịch CPU (process priority), thuật toán Dijkstra, A* pathfinding, hệ thống cấp cứu bệnh viện (triage).", "details": ["A. Tốc độ không phải khác biệt cơ bản.", "C. Dung lượng không liên quan.", "D. Có thể chứa bất kỳ loại dữ liệu nào."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 優先度付きキュー", "qJa": "優先度付きキューと通常キューの違いはどれか。", "optsJa": ["優先キューの方が速い", "**優先キューでは、各要素に「優先度」があります。デキューは、FIFO** に従ってではなく、最高の優先順位で要素を取得します。", "優先キューの容量は無制限です", "優先キューには整数のみが含まれています"], "whyJa": "**優先度付きキュー (Priority Queue)**:\n• 各要素には「優先度（優先度）」があります。\n• デキューは、(FIFO ではなく) HIGHEST PRIORITY 要素を取得します。\n• 通常、**ヒープ (ヒープ)** — 特別なバイナリ ツリーを使用して実装されます。\nアプリケーション: CPU スケジューリング (プロセス優先度)、ダイクストラ アルゴリズム、A* 経路探索、病院緊急システム (トリアージ)。", "detailsJa": ["A. 速度は根本的な違いではありません。", "C. 容量は関係ありません。", "D. あらゆる種類のデータを含めることができます。"]}, {"d": "easy", "q": "**木構造 (cây / tree)** được Yasashii mô tả như thế nào?", "jp": "木構造の特徴はどれか。", "opts": ["Cấu trúc dữ liệu xếp tuyến tính như chuỗi", "**Cấu trúc dữ liệu có 「階層構造」 (hierarchical structure) — hình dáng giống cây thực vật bị LẬT NGƯỢC**", "Cấu trúc lưu dữ liệu theo bảng 2 chiều", "Cấu trúc chỉ dùng cho dữ liệu kiểu chuỗi"], "ans": 1, "why": "Yasashii 03-01: 「木構造とは、階層構造を持つデータ構造です。木構造は植物の木を逆さにしたような形をしています」.\nGốc (根) ở trên cùng, lá (葉) ở dưới — giống như cây thực vật bị lật ngược 180°. Cấu trúc phân cấp tự nhiên (folder, hệ thống tổ chức, DOM trong HTML...).", "details": ["A. Sai — đó là array hoặc linked list.", "C. Đó là 配列 2 chiều (2D array).", "D. Sai — tree lưu được bất kỳ loại dữ liệu."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 木構造", "qJa": "木構造の特徴はどれか。", "optsJa": ["文字列のような線形データ構造", "**データ構造は「階層構造」、つまり植物のような形を反転させたものです**", "テーブル 2 の寸法に従ったデータストレージ構造", "構造体は文字列データにのみ使用されます"], "whyJa": "教材「Yasashii」03-01: 「木構造とは、壊れ構造を持つデータ構造です。木構造は植物の木を逆さにしたような形をしています。」\n根 (根) が上部にあり、葉 (葉) が下部にあります。植物 180° をひっくり返したようなものです。自然な階層構造 (フォルダー、組織システム、HTML の DOM など)。", "detailsJa": ["A. 不正解 — これは配列またはリンク リストです。", "C. それは、配列 2 次元 (2D 配列) です。", "D. 不正解 — ツリーはあらゆる種類のデータを保存できます。"]}, {"d": "easy", "q": "Trong 木構造, node nào được gọi là **「根 (root)」**?", "jp": "木構造の「根」はどれか。", "opts": ["Node có nhiều con nhất", "**Node ở vị trí cao nhất / trên cùng (最上位の節)**", "Node không có con (末端)", "Node ở giữa cây"], "ans": 1, "why": "Yasashii 03-01 bảng thuật ngữ:\n• **根 (root)**: 「節の中でも最上位の節」 — node CAO NHẤT trong cây.\n• **節 (node)**: 「枝分かれする箇所」 — điểm phân nhánh, lưu dữ liệu.\n• **葉 (leaf)**: 「末端の節」 — node ở cuối (không có con).\nTree luôn có ĐÚNG 1 root.", "details": ["A. Số con không xác định node nào là root.", "C. Đó là **葉 (leaf)**.", "D. Node giữa cây là 節 (internal node), không phải root."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 木構造 / 根・節・葉", "qJa": "木構造の「根」はどれか。", "optsJa": ["ノードに最も多くの子がいます", "**最上位のノード/最上位の節(最上位の節)**", "ノードには子がありません (末端)", "ノードはツリーの中央にあります"], "whyJa": "やさしい03-01用語解説：\n• **根 (ルート)**: 「節の中でも最上位の節」 — ツリー内の最上位のノード。\n• **節 (ノード)**: 「枝分かれする箇所」 — 分岐点、データストレージ。\n• **葉 (leaf)**: 「末端の節」 — 末端のノード (子なし)。\nツリーには常に正しいルート 1 があります。", "detailsJa": ["A. 子の数によってどのノードがルートになるかは決まりません。", "C. それは **葉 (leaf)** です。", "D. ツリーの真ん中にあるノードはルートではなく節（内部ノード）です。"]}, {"d": "easy", "q": "Trong 木構造, **「葉 (leaf)」** là node như thế nào?", "jp": "木構造の「葉」はどれか。", "opts": ["Node ở vị trí cao nhất", "Node có ít nhất 1 con", "**Node ở末端 (cuối cây) — không có con nào**", "Node lưu dữ liệu lớn nhất"], "ans": 2, "why": "Yasashii: 「末端の節を『葉』と呼びます」.\nLeaf (葉) = node KHÔNG CÓ CON. Trong tree, leaves là nodes tận cùng — không có nhánh dưới. Tree có thể có nhiều leaves.\nVí dụ: trong cây nhị phân cân bằng có 2^h leaves (h là chiều cao).", "details": ["A. Đó là 根 (root).", "B. Đó là internal node (節 ở giữa).", "D. Giá trị không liên quan đến vị trí node."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 木構造 / 葉", "qJa": "木構造の「葉」はどれか。", "optsJa": ["ノードが最上位にあります", "ノードには少なくとも 1 の子があります", "**末端ノード (ツリーの端) — 子なし**", "ノードは最大のデータを保存します"], "whyJa": "教材「Yasashii」: 「末端の節を『葉』と呼びます」。\n葉 (葉) = 子のないノード。木では葉が最下位のノードであり、下位の枝はありません。木にはたくさんの葉が生えることがあります。\nたとえば、バランスのとれた二分木には、2^h 個の葉があります (h は高さです)。", "detailsJa": ["A. 根（ルート）です。", "B. それが内部ノードです (真ん中の節)。", "D. ノードの位置に関係のない値。"]}, {"d": "easy", "q": "Quan hệ **親子 (cha-con)** giữa 2 node trong 木構造 được định nghĩa như thế nào?", "jp": "木構造の親子関係はどれか。", "opts": ["Node nào lớn hơn là 親, nhỏ hơn là 子", "**分岐元 (node phát ra nhánh) là 親; 分岐先 (node nhánh chỉ tới) là 子**", "Node bên trái là 親, bên phải là 子", "Node nào lưu nhiều dữ liệu hơn là 親"], "ans": 1, "why": "Yasashii 03-01: 「木構造の節同士には親子関係があります。分岐元を『親』、分岐先を『子』といいます」.\nQuan hệ là về CẤU TRÚC (hướng phân nhánh từ trên xuống), không phải về giá trị. Một node có thể có 「親」 (cha của nó) và đồng thời là 「親」 của nhiều con.", "details": ["A. Giá trị không liên quan đến quan hệ親子.", "C. Sai — vị trí trái/phải dùng để phân biệt 2 con trong 2分木, không phải để xác định 親子.", "D. Dung lượng dữ liệu không liên quan."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 木構造 / 親子関係", "qJa": "木構造における2ノード間の**親子(父-子)**関係はどのように定義されますか?", "optsJa": ["大きいノードが親、小さいノードが子です", "**分岐元（分岐放出ノード）は親です。 分岐先（分岐ノードが指す）は子**です", "左のノードが親、右のノードが子", "より多くのデータを保存するノードが親になります"], "whyJa": "教材「Yasashii」 03-01: 「木構造の節同士には親子関係があります。分岐元を『親』、分岐先を『子』といいます。」\n関係は構造 (上から下への分岐方向) に関するものであり、価値に関するものではありません。ノードは「親」を持つことができると同時に、多くの子の「親」になることができます。", "detailsJa": ["A. 価値は親子関係とは関係ありません。", "C. 不正解 — 左右の位置は、親子を決定するためではなく、2 と 2 分木を区別するために使用されます。", "D. データ容量は関係ありません。"]}, {"d": "med", "q": "**Yasashii ví dụ** cho cây dưới đây:\n<pre class=\"tree-art\">      A\n     / \\\n    B   C\n   / \\\n  D   E<\/pre>\nVới node B, các quan hệ đúng là?", "jp": "上の木構造において、節Bに関する正しい記述はどれか。", "opts": ["B là 葉 (leaf)", "**B là 親 của D, E; B là 子 của A; B không phải 根 cũng không phải 葉**", "B là 根 của cây", "B là 子 của D"], "ans": 1, "why": "Phân tích cây:\n• A là **根 (root)** — cao nhất.\n• B là 子 của A.\n• B là 親 của D, E.\n• D, E, C là **葉 (leaves)** — không có con.\nVậy B đồng thời là 子 (của A) VÀ 親 (của D, E). Trong tree, một node có thể vừa là 子 vừa là 親.", "details": ["A. B có 2 con (D, E) nên không phải leaf.", "C. A là root, không phải B.", "D. Đảo ngược — D là 子 của B."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 木構造 / 関係分析", "qJa": "**下の木のわかりやすい例**:\n<pre class=\"tree-art\">      A\n     / \\\n    B   C\n   / \\\n  D   E<\/pre>\nノード B の場合、正しい関係は何ですか?", "optsJa": ["Bは葉です", "**B は D、E の親です。 B は A の子です。 Bは根でも葉でもない**", "B は木の根です", "B は D の子です"], "whyJa": "ツリー分析:\n• A は **根 (根)** — 最高です。\n• B は A の子です。\n• B は D、E の親です。\n• D、E、C は **葉 (leaves)** — 子はありません。\nしたがって、B は同時に (A の) 子であり、(D、E の) 親でもあります。ツリーでは、ノードは子と親の両方になることができます。", "detailsJa": ["A. B には 2 の子 (D、E) があるため、リーフではありません。", "C. A はルートであり、B ではありません。", "D. 逆さ — D は B の子です。"]}, {"d": "easy", "q": "**n分木 (n-ary tree)** trong Yasashii được định nghĩa như thế nào?", "jp": "n分木の定義はどれか。", "opts": ["Cây có chính xác n node", "Cây có chính xác n lá", "**Cây mà mỗi 親 có TỐI ĐA n con (0~n個の子を持つ) — tức 「節が最大でいくつの子に分かれるのか」**", "Cây có chiều cao n"], "ans": 2, "why": "Yasashii: 「親が0〜n個の子を持つ木構造を『n分木』といいます。つまり、n分木とは、節が最大でいくつの子に分かれるのかを表しています」.\n• 2分木 (binary tree): mỗi node có TỐI ĐA 2 con (0, 1, hoặc 2).\n• 3分木 (ternary tree): tối đa 3 con.\n• n分木: tối đa n con.", "details": ["A. Số node không liên quan đến định nghĩa n分木.", "B. Số lá cũng không liên quan.", "D. Chiều cao là khái niệm khác."], "ref": "FE Syllabus — 基礎理論 / データ構造 / n分木", "qJa": "n分木の定義はどれか。", "optsJa": ["ツリーにはちょうど n 個のノードがあります", "この木にはちょうど n 枚の葉があります", "**各親に少なくとも n 人の子供を持つ木 (0~n 個の子を持つ) — つまり、「節が最大で女の子に分かれるのか」**", "木の高さは n です"], "whyJa": "教材「Yasashii」: 「親が0〜n個の子を持つ木構造を『n分木』といいます。つまり、n分木とは、節が最大で妹の子に分かれるのかを表しています。」\n• 2 分木 (バイナリ ツリー): 各ノードには最大の 2 の子 (0, 1, または 2) があります。\n• 3 分木 (三分木): 最大の 3 の子。\n• n分木: 最大n個の子。", "detailsJa": ["A. ノード数はn分木の定義には関係ありません。", "B. 葉の数も関係ありません。", "D. 身長は別の概念です。"]}, {"d": "med", "q": "Trong **2分探索木 (binary search tree)**, điều kiện chính xác là gì?", "jp": "2分探索木の正確な条件はどれか。", "opts": ["左の子 < 親 < 右の子 (chỉ con trực tiếp)", "**左の子孫 < 親 < 右の子孫 (TẤT CẢ con cháu — bao gồm con, cháu, chắt...) — Yasashii nhấn mạnh là 子孫 chứ không phải 子**", "Cây cân bằng hoàn hảo", "Mọi node đều có 2 con"], "ans": 1, "why": "Yasashii 03-01 「試験にはコレが出る!」: 「2分探索木の条件は『左の子孫 < 親 < 右の子孫』」.\n「学習のポイント」: 「2分探索木については、値の制約が『子』ではなく『子孫』である点に注意が必要です」.\nNghĩa là: KHÔNG CHỈ con trực tiếp, mà TOÀN BỘ subtree bên trái phải nhỏ hơn parent, và subtree bên phải phải lớn hơn parent.", "details": ["A. SAI — Yasashii rất nhấn mạnh là 子孫 chứ không phải 子.", "C. Cân bằng là khái niệm khác (AVL tree, Red-Black tree).", "D. Đó là full binary tree, không phải BST."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 2分探索木 / 条件", "qJa": "2分探索木の正確な条件はどれか。", "optsJa": ["左の子 &lt; 親 &lt; 右の子 (直系の子)", "**左の子孫 &lt; 親 &lt; 右の子孫 (すべての子孫 — 子供、孫、曾孫を含む...) — やさしくは子ではなく子孫を強調します**", "完璧にバランスのとれた木", "すべてのノードには子 2 があります"], "whyJa": "教材「Yasashii」 03-01 「試験にはコレが出る!」: 「2分探索木の条件は『左の子孫 &lt; 親 &lt; 右の子孫』」。\n「学習のポイント」: 「2分探索木については、値の保留が『子』ではなく『子孫』である点に注意が必要です」。\n意味: 直接の子だけでなく、左のサブツリー全体が親より小さく、右のサブツリーが親より大きくなければなりません。", "detailsJa": ["A. 間違い — 教材「Yasashii」は子ではなく子孫を強調します。", "C. バランスは別の概念です (AVL ツリー、赤黒ツリー)。", "D. BST ではなく、完全なバイナリ ツリーです。"]}, {"d": "med", "q": "Cho cây nhị phân sau, đây có phải là **2分探索木** không?\n<pre class=\"tree-art\">     8\n    / \\\n   3   10\n  / \\    \\\n 1   6    14<\/pre>", "jp": "次の木は2分探索木か。", "opts": ["**Có — thoả mãn 左の子孫 < 親 < 右の子孫 ở mọi node**", "Không — vì 6 > 3", "Không — vì 14 không có con phải", "Không xác định"], "ans": 0, "why": "Kiểm tra từng node:\n• Node 8: trái = {3, 1, 6} (max=6 < 8) ✓; phải = {10, 14} (min=10 > 8) ✓\n• Node 3: trái = {1} (1 < 3) ✓; phải = {6} (6 > 3) ✓\n• Node 10: phải = {14} (14 > 10) ✓\n• Các leaves: không cần kiểm tra.\nTẤT CẢ điều kiện đều thoả → **đây LÀ 2分探索木**.", "details": ["B. 6 > 3 là ĐÚNG quy tắc (con phải của 3 phải > 3).", "C. Không bắt buộc mọi node phải có 2 con.", "D. Có thể xác định rõ ràng."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 2分探索木 / 判定", "qJa": "次の二分木があるとすると、これは **2分探索木** ですか?\n<pre class=\"tree-art\">     8\n    / \\\n   3   10\n  / \\    \\\n 1   6    14<\/pre>", "optsJa": ["**はい — すべてのノードで左の子孫 &lt; 親 &lt; 右の子孫を満たします**", "いいえ — 6 &gt; 3 のため", "いいえ — 14 には子供がいないため", "不明"], "whyJa": "各ノードを確認します。\n• ノード 8: 左 = {3, 1, 6} (最大 = 6 &lt; 8) ✓;右 = {10, 14} (最小=10 &gt; 8) ✓\n• ノード 3: 左 = {1} (1 &lt; 3) ✓;右 = {6} (6 &gt; 3) ✓\n• ノード 10: 右 = {14} (14 &gt; 10) ✓\n• 葉: チェックする必要はありません。\nすべての条件が満たされています → **これは 2 分探索木です**。", "detailsJa": ["B. 6 &gt; 3 は TRUE ルールです (3 の右の子は &gt; 3 でなければなりません)。", "C. すべてのノードに 2 の子が必要なわけではありません。", "D. 明確に識別可能。"]}, {"d": "hard", "q": "Cho cây nhị phân sau, đây có phải là **2分探索木** không?\n<pre class=\"tree-art\">     8\n    / \\\n   3   10\n  / \\    \\\n 1   12   14<\/pre>", "jp": "次の木は2分探索木か。", "opts": ["Có", "**Không — vì 12 nằm trong subtree TRÁI của 8 (qua node 3), nhưng 12 > 8 → vi phạm 「左の子孫 < 親」**", "Không — vì 14 quá lớn", "Có nếu xét theo định nghĩa khác"], "ans": 1, "why": "Kiểm tra node 8:\n• Subtree TRÁI của 8 = {3, 1, 12}.\n• Theo điều kiện BST: TẤT CẢ con cháu bên TRÁI phải NHỎ HƠN 8.\n• Nhưng **12 > 8** → vi phạm.\nNếu chỉ kiểm tra 子 (con trực tiếp), 12 là con của 3 (12 > 3 ✓), tưởng đúng. Nhưng kiểm tra 子孫 thì sai → **KHÔNG phải BST**.\nĐây chính là 「ダメな例」 mà Yasashii cảnh báo về 子 vs 子孫.", "details": ["A. Sai — vi phạm điều kiện 子孫.", "C. 14 ở subtree phải của 8 và 10, không vi phạm.", "D. Định nghĩa BST chuẩn nhất quán."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 2分探索木 / ダメな例 / 子孫違反", "qJa": "次の二分木があるとすると、これは **2分探索木** ですか?\n<pre class=\"tree-art\">     8\n    / \\\n   3   10\n  / \\    \\\n 1   12   14<\/pre>", "optsJa": ["はい", "**いいえ — 12 は 8 の左側のサブツリー (ノード 3 経由) にありますが、12 &gt; 8 → 「左の子孫 &lt; 親」に違反します**", "いいえ — 14 は大きすぎるためです", "別の定義に従って考慮するとはい"], "whyJa": "ノード 8 を確認してください:\n• 8 = {3, 1, 12} の左サブツリー。\n• BST 条件によると、左側のすべての子孫は 8. より小さくなければなりません。\n• ただし、**12 &gt; 8** → 違反。\n子（直系の子）のみを確認すると、12 は 3 の子になります (12 &gt; 3 ✓) が正しいです。しかし、子孫のチェックが間違っている → **NOT BST**。\nこれは教材「Yasashii」が子と子孫について警告する「ダメな例」です。", "detailsJa": ["A. 間違っています — 子孫の条件に違反しています。", "C. 8 と 10, の右側のサブツリーの 14 は違反しません。", "D. 一貫した標準コレクションの定義。"]}, {"d": "med", "q": "Tại sao **2分探索木** lại hiệu quả cho **検索 (tìm kiếm)**?", "jp": "2分探索木が検索に効率的な理由はどれか。", "opts": ["Vì nó luôn tự cân bằng", "**Tại mỗi node, ta chỉ cần so sánh giá trị tìm kiếm với node hiện tại để biết đi sang trái hay phải — loại bỏ MỘT NỬA cây mỗi bước → chi phí khoảng 「根から葉までの階層の数」 (O(log n))**", "Vì cây luôn chứa ít dữ liệu", "Vì cây dùng nhiều bộ nhớ"], "ans": 1, "why": "Yasashii: 「2分探索木では、根から葉までの階層の数だけ値を調べれば、目的のデータを見つけ出すことができます。一方、親子が無関係につながった木構造では、節を1つずつ調べる必要があります」.\nMỗi so sánh loại đi 1 nửa cây → log₂(n) bước cho cây có n node (nếu cân bằng).\nVí dụ: 1.000.000 node → chỉ ~20 bước (log₂10⁶ ≈ 20).", "details": ["A. BST cơ bản KHÔNG tự cân bằng (AVL, Red-Black mới có).", "C. Không liên quan đến lượng dữ liệu.", "D. Sai — BST hiệu quả cả về thời gian và bộ nhớ."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 2分探索木 / メリット", "qJa": "2分探索木が検索に効率的な理由はどれか。", "optsJa": ["常にバランスを保っているから", "**各ノードで、検索値を現在のノードと比較して、左に行くか右に行くかを知るだけで済みます。各ステップでツリーの半分を削除します → 「根から葉までの到達の数」 (O(log n)) 程度のコストがかかります**", "ツリーには常に少量のデータが含まれるため", "ツリーは大量のメモリを使用するため"], "whyJa": "教材「Yasashii」: 「2分探索木では、根から葉までの決意の数だけ値を調べれば、目的のデータを見つけることができます。一方、親子が無関係に続くた木構造では、節を1つずつ繰り返し必要があります。」\n各比較では、n 個のノードを持つツリーのハーフツリー 1 → log₂(n) ステップが削除されます (バランスが取れている場合)。\n例: 1.000.000 ノード → ~20 ステップのみ (log₂10⁶ ≈ 20)。", "detailsJa": ["A. 基本コレクションは自動バランス機能を備えていません (AVL、レッド/ブラックのみにあります)。", "C. データ量とは関係ありません。", "D. False — BST は時間とメモリの両方を効率的にします。"]}, {"d": "hard", "q": "Trong 2分探索木 với root = 50, làm thế nào để tìm giá trị **35**? (假设 35 tồn tại trong cây)", "jp": "2分探索木で値35を検索する手順はどれか。", "opts": ["Duyệt toàn bộ cây từ root đến lá", "**So sánh 35 với root (50): 35 < 50 → đi SANG TRÁI; tại node con, so sánh tiếp; lặp lại cho đến khi tìm thấy hoặc đến lá**", "Chỉ kiểm tra root", "Đi từ lá lên root"], "ans": 1, "why": "Thuật toán tìm kiếm trên BST:\n1. Bắt đầu từ root.\n2. So sánh giá trị target với node hiện tại:\n   - Nếu **bằng** → tìm thấy.\n   - Nếu **nhỏ hơn** → đi sang TRÁI.\n   - Nếu **lớn hơn** → đi sang PHẢI.\n3. Nếu đến `null` (vượt quá lá) → không tìm thấy.\nVD: 35 vs 50 → trái; tiếp tục cho đến khi gặp 35 hoặc null.", "details": ["A. Duyệt toàn bộ là cách của linear search, không tận dụng BST.", "C. Chỉ kiểm tra root không đủ.", "D. BST duyệt từ root XUỐNG, không phải ngược lại."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 2分探索木 / 検索アルゴリズム", "qJa": "ルート = 50, の 2 分探索木で値 **35** を見つけるにはどうすればよいですか? (假设 35 は木に存在します)", "optsJa": ["根から葉まで植物全体を観察", "**35 とルート (50) を比較: 35 &lt; 50 → 左へ進みます。子ノードで比較を続けます。見つかるか離れるまで繰り返します**", "root のみをチェックします", "葉から根へ"], "whyJa": "BST 検索アルゴリズム:\n1. ルートから開始します。\n2. ターゲット値と現在のノードを比較します:\n   - **等しい**場合 → 見つかりました。\n   - **未満**の場合 → 左へ進みます。\n   - **より大きい**場合 → 右に進みます。\n3. `null`（葉を超える）に達した場合→見つからない。\n例: 35 対 50 → 左; 35 または null に達するまで続行します。", "detailsJa": ["A. フル ブラウジングは線形検索の方法であり、BST を利用しません。", "C. root をチェックするだけでは十分ではありません。", "D. BST はルート DOWN から参照します。その逆はありません。"]}, {"d": "med", "q": "**Bài toán ứng dụng**: Bạn cần chọn cấu trúc dữ liệu cho:\n(1) Lưu thông tin **folder hệ thống** (folder cha có nhiều subfolder)\n(2) **Game lịch sử nước đi** trong cờ vua (cho phép Undo)\n(3) Hệ thống **gọi món tại quầy** (ai đặt trước ăn trước)\nGhép nào ĐÚNG?", "jp": "次の用途に最適なデータ構造の組合せはどれか。", "opts": ["(1)スタック (2)キュー (3)木構造", "**(1)木構造 (2)スタック (3)キュー**", "(1)キュー (2)木構造 (3)スタック", "(1)配列 (2)連結リスト (3)2分探索木"], "ans": 1, "why": "(1) Folder hệ thống = phân cấp → **木構造** (mỗi folder có nhiều subfolder).\n(2) Undo lịch sử = lùi theo thứ tự ngược → **スタック** (LIFO, pop nước cuối cùng).\n(3) Gọi món FIFO = ai đặt trước ăn trước → **キュー** (FIFO, fair queue).\n→ Đáp án **B**.", "details": ["A. Sai (1) — folder không phải stack.", "C. Sai cả 3 mục.", "D. Sai — không phù hợp với 3 yêu cầu."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 総合応用", "qJa": "**アプリケーションの問題**: 次のデータ構造を選択する必要があります。\n(1) **システム フォルダー** に情報を保存します (親フォルダーには多くのサブフォルダーがあります)\n(2) チェスの **履歴ゲームを移動** (元に戻すことが可能)\n(3) **カウンター注文**制（先着順）\nどの組み合わせが正しいでしょうか?", "optsJa": ["(1)スタック (2)キュー (3)木構造", "**(1)木構造 (2)スタック (3)キュー**", "(1)キュー (2)木構造 (3)スタック", "(1)配列 (2)連結リスト (3)2分探索木"], "whyJa": "(1) システム フォルダー = 階層 → **木構造** (各フォルダーには多数のサブフォルダーがあります)。\n(2) 元に戻す履歴 = 逆順に元に戻す → **スタック** (LIFO、最後のポップ)。\n(3) オーダー FIFO = 先に注文した人が先に食べる → **キュー** (FIFO、フェアキュー)。\n→**B**と答えます。", "detailsJa": ["A. 間違っています (1) — フォルダーはスタックではありません。", "C. 3 の入力が間違っています。", "D. 不正解 — 要求 3 に準拠していません。"]}, {"d": "hard", "q": "Trong 2分探索木 cân bằng có 1.000.000 node, **số bước tối đa** để tìm 1 giá trị là khoảng bao nhiêu?", "jp": "100万ノードの平衡2分探索木で検索の最大ステップ数は約いくつか。", "opts": ["1.000.000 bước (toàn bộ)", "1.000 bước", "100 bước", "**20 bước (≈ log₂ 1.000.000)**"], "ans": 3, "why": "Trong BST cân bằng, mỗi bước loại đi 1 nửa → chi phí O(log₂ n).\nlog₂ 1.000.000 = log₂ 10⁶ ≈ 19.93 → **khoảng 20 bước**.\nSo với linear search O(n) = 1.000.000 bước → BST nhanh hơn 50.000 LẦN!\nĐây là lý do BST cân bằng cực kỳ quan trọng trong CSDL, file system, AI search...", "details": ["A. Đó là linear search, không phải BST.", "B. 1.000 quá nhiều — log₂ 1.000.000 << 1.000.", "C. 100 vẫn quá nhiều — đáp án chính xác là ~20."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 2分探索木 / O(log n)", "qJa": "バランスの取れた 2 分探索木には 1.000.000 ノードがあります。1 の値を見つけるための **最大ステップ数**は何ですか?", "optsJa": ["1.000.000 ステップ (全体)", "1.000 歩数", "100歩数", "**20 歩数 (≈ log₂ 1.000.000)**"], "whyJa": "バランス型 BST では、各ステップで 1 の半分が削除されます → コストは O(log₂ n) です。\nlog₂ 1.000.000 = log₂ 10⁶ ≈ 19.93 → **約 20 ステップ**。\n線形探索 O(n) = 1.000.000 ステップと比較すると、→ BST は 50.000 よりも 1 倍高速です。\nこのため、データベース、ファイル システム、AI 検索では、バランスの取れた収集が非常に重要です。", "detailsJa": ["A. それは BST ではなく線形検索です。", "B. 1.000 多すぎます — log₂ 1.000.000 &lt;&lt; 1.000.", "C. 100 はまだ多すぎます — 正解は ~20. です"]}, {"d": "hard", "q": "Tổng kết: chiến lược học **Stack/Queue/Tree** cho FE là gì?", "jp": "FE試験でStack/Queue/Treeをマスターするベスト戦略はどれか。", "opts": ["Chỉ học định nghĩa, không cần luyện trace", "**(1) Nắm chắc TỪ KHOÁ: LIFO/Stack/push/pop, FIFO/Queue/enqueue/dequeue, 根/節/葉/親/子/子孫; (2) Luyện TRACE từng bước với pen-and-paper; (3) Hiểu MERIT từng cấu trúc; (4) Học 子 vs 子孫 trong BST**", "Đoán đáp án dựa vào hình", "Chỉ học bài tập tính toán"], "ans": 1, "why": "Chiến lược toàn diện cho IPA FE:\n1. **Thuật ngữ**: nắm chắc tên tiếng Nhật (LIFO=後入れ先出し, FIFO=先入れ先出し, 根/節/葉).\n2. **Luyện trace**: vẽ stack/queue trên giấy khi giải, không nhẩm.\n3. **Hiểu MERIT**: stack=履歴/undo, queue=順番処理, tree=階層/検索.\n4. **Điểm tinh tế**: 子 vs 子孫 trong BST (Yasashii nhấn mạnh!).\n5. **Luyện過去問**: 平成27, 29, 30...\n6. **Vẽ minh hoạ**: 配列とリストの違い, BST良い例/ダメな例.", "details": ["A. Không luyện trace = không thi tốt phần tính toán.", "C. Đoán không bao giờ là chiến lược tốt.", "D. Cần cân bằng cả lý thuyết và bài tập."], "ref": "FE Syllabus — 基礎理論 / データ構造 / 学習戦略", "qJa": "FE試験でStack/Queue/Treeをマスターするベスト戦略はどれか。", "optsJa": ["定義を学ぶだけで、トレースの練習は必要ありません", "**(1) キーワードの把握: LIFO/スタック/プッシュ/ポップ、FIFO/キュー/エンキュー/デキュー、根/節/葉/親/子/子孫; (2) 紙とペンを使って、TRACE を段階的に練習します。 (3) 各構造のMERITを理解する。 (4) BST で子と子孫を学ぶ**", "写真に基づいて答えを推測してください", "計算演習だけを勉強する"], "whyJa": "IPA FEの総合戦略:\n1. **用語**: マスター日本語名 (LIFO=後入れ先出し、FIFO=先入れ先出し、根/節/葉)。\n2. **トレースの練習**: 解くときにスタック/キューを紙に描きます。暗算は行わないでください。\n3. **MERIT を理解してください**: stack= 履歴/元に戻す、queue= 順番処理、tree= 渡る/検索。\n4. **微妙な点**: コレクション内の子と子孫 (教材「Yasashii」! が強調)。\n5. **Train過去問**: 平成 27, 29, 30...\n6. **イラスト**: 配列とリストの違い、BST良い例/ダメな例。", "detailsJa": ["A. トレースの練習をしていない＝計算セクションの成績が良くありません。", "C. 推測することは決して良い戦略ではありません。", "D. 理論と演習の両方のバランスをとる必要があります。"]}]</script>
