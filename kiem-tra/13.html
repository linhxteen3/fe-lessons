. Sai — 5 > 4 nên phải tách riêng."], "qJa": "[3,5,4,2,1]で pivot=4 のとき2グループは。", "optsJa": ["[3,2,1] および [5]", "[3,5] および [2,1]", "[5,3,2,1] と空", "[3,2,1,5] は空です"], "whyJa": "", "detailsJa": ["A. 正解 — グループ &lt;4: {3,2,1};グループ &gt;4: {5};真ん中の4をピボットします。", "B. 違います。", "C. 違います。", "D. Sai — 5 &gt; 4 はありません。"]}, {"d": "med", "q": "Bậc độ phức tạp của các thuật toán 基本3手法 (基本交換/選択/挿入) là gì?", "jp": "基本3手法（基本交換/選択/挿入）のオーダー記法は。", "opts": ["O(1)", "O(log₂ n)", "O(n)", "O(n²)"], "ans": 3, "details": ["A. Đó là hash.", "B. Đó là 2分探索.", "C. Đó là linear search.", "D. Đúng — slide第3回: 基本交換/基本選択/基本挿入 đều là O(n²)."], "qJa": "基本3手法（基本交換/選択/挿入）のオーダー記法は。", "optsJa": ["O(1)", "O(log₂ n)", "O(n)", "O(n²)"], "whyJa": "", "detailsJa": ["A. ドゥラハッシュ。", "B. それは 2 分探索です。", "C. それは線形検索です。", "D. 正解 — スライド第3回:基本交換/基本選択/基本挿入は両方ともO(n²)です。"]}, {"d": "med", "q": "Bậc độ phức tạp của クイックソート (trung bình) là gì?", "jp": "クイックソートのオーダー記法は。", "opts": ["O(n)", "O(n²)", "O(n log₂ n)", "O(log₂ n)"], "ans": 2, "details": ["A. Sai.", "B. Đó là worst case, nhưng FE coi trung bình.", "C. Đúng — slide第3回 và Yasashii解説: クイックソート là O(n log n) (※暗記不要).", "D. Sai."], "qJa": "クイックソートのオーダー記法は。", "optsJa": ["O(n)", "O(n²)", "O(n log₂ n)", "O(log₂ n)"], "whyJa": "", "detailsJa": ["A. 違います。", "B. これは最悪のケースですが、FE では平均を考慮します。", "C. 正解 — スライド第3回とやさしい解説: クイックソートはO(n log n) (※暗記不要)。", "D. 違います。"]}, {"d": "med", "q": "Bậc độ phức tạp của シェルソート theo slide第3回 là gì?", "jp": "シェルソートのオーダー記法は。", "opts": ["O(n)", "O(n^1.3)", "O(n²)", "O(log₂ n)"], "ans": 1, "details": ["A. Sai.", "B. Đúng — slide ghi rõ シェルソート là O(n^1.3) (※暗記不要).", "C. Đó là 基本3手法.", "D. Sai."], "qJa": "スライド第3回によると、シェルソートの複雑さのレベルはどれくらいですか?", "optsJa": ["O(n)", "O(n^1.3)", "O(n²)", "O(log₂ n)"], "whyJa": "", "detailsJa": ["A. 違います。", "B. 正解 — スライドにはシェルソートが O(n^1.3) (※暗記不要) と明記されています。", "C. それは基本3手法です。", "D. 違います。"]}, {"d": "med", "q": "シェルソート theo slide第3回 hoạt động thế nào?", "jp": "シェルソートのアルゴリズムは。", "opts": ["Lấy dữ liệu cách nhau khoảng nhất định, sắp xếp, rồi thu nhỏ khoảng lặp lại cho đến khi khoảng = 1", "Chọn min/max rồi đổi chỗ", "Chia mảng theo pivot", "So sánh kề nhau"], "ans": 0, "details": ["A. Đúng — slide: 「データを一定間隔ごとに取り出し、そのデータ内で並び替えて元に戻す。次に、間隔を狭めて再度データを取り出し...これを間隔が1になるまで繰り返す」.", "B. Đó là 選択ソート.", "C. Đó là クイックソート.", "D. Đó là バブル."], "qJa": "スライド第3回によるシェルソートはどのように機能しますか?", "optsJa": ["一定の間隔で区切られたデータを取得し、整列し、間隔 = 1 になるまで繰り返し間隔を縮小します。", "最小/最大を選択してから入れ替えます", "ピボットによる配列の分割", "ソーサンクニャウ"], "whyJa": "", "detailsJa": ["A. 正解 — スライド: 「データを一定間隔ごとに取り出し、そのデータ内で並び替えて元に戻ります。次に、間隔を狭めてもう一度データを取り出し...これを確保が1になるまで並べてください。」", "B. それが選択ソートです。", "C. それがクイックソートです。", "D. ドゥラバブル。"]}, {"d": "med", "q": "Bậc độ phức tạp của ヒープソート theo slide第3回 là gì?", "jp": "ヒープソートのオーダー記法は。", "opts": ["O(n)", "O(n²)", "O(n log₂ n)", "O(1)"], "ans": 2, "details": ["A. Sai.", "B. Đó là 基本3手法.", "C. Đúng — slide第3回 xếp ヒープソート cùng nhóm với クイック với オーダー O(n log₂ n) (※暗記不要).", "D. Sai."], "qJa": "スライド第3回によると、ヒープソートの複雑さのレベルはどれくらいですか?", "optsJa": ["O(n)", "O(n²)", "O(n log₂ n)", "O(1)"], "whyJa": "", "detailsJa": ["A. 違います。", "B. それは基本3手法です。", "C. 正解 — スライド第3回は、ヒープソートをオーダーO(n log₂ n)のクイックと同じグループに入れます(※暗記不要)。", "D. 違います。"]}, {"d": "med", "q": "クイックソート là 整列アルゴリズム vì sao? (theo lời giải Yasashii bài 過去問3-11)", "jp": "クイックソートは何の整列アルゴリズムか。", "opts": ["Chèn dữ liệu vào danh sách đã sắp xếp", "Chọn min/max liên tiếp", "Chia dữ liệu thành 2 nhóm (lớn hơn/nhỏ hơn pivot) lặp lại", "So sánh đổi chỗ kề nhau"], "ans": 2, "details": ["A. Là 挿入ソート.", "B. Là 選択ソート.", "C. Đúng — Yasashii giải đề平成30年度: 「クイックソートは、データを2つのグループに分割する整列アルゴリズムです」.", "D. Là バブルソート."], "qJa": "クイックソートはなぜ整列アルゴリズムなのですか? (教材「Yasashii」さんの過去問3-11の説明による)", "optsJa": ["整列済みのリストにデータを挿入します", "最小/最大リエンティップ", "データを 2 グループ (ピボットより大きい/小さい) に分割する繰り返し", "隣接する場所を比較して交換する"], "whyJa": "", "detailsJa": ["A. インサートソートです。", "B. 選択ソートです。", "C. 正解 — やさしく解決した問題 平成30年度: 「クイックソートは、データを2のグループに分割する整列アルゴリズムです」。", "D. バブルソートです。"]}, {"d": "med", "q": "Trong 過去問 平成30年度 (Yasashii 3-11), mô tả 「隣り合ったデータの比較と入替えを繰り返すことによって、小さな値のデータを次第に端の方に移していく」 là thuật toán nào?", "jp": "「隣り合ったデータの比較と入替えを繰り返す...」は何ソートか。", "opts": ["挿入ソート", "選択ソート", "クイックソート", "バブルソート"], "ans": 3, "details": ["A. Là chèn vào vị trí thích hợp.", "B. Là chọn min/max.", "C. Là chia pivot.", "D. Đúng — Yasashii解説 3-11 エ: バブルソートの説明."], "qJa": "過去問平成 30 年度 (教材「Yasashii」 3-11) の「隣り合ったデータの比較と入替えを入れることによって、小さな値のデータを漸端の方に移していく」というアルゴリズムはどれですか?", "optsJa": ["挿入ソート", "選択ソート", "クイックソート", "バブルソート"], "whyJa": "", "detailsJa": ["A. 適切な位置に挿入されています。", "B. 最小/最大の選択です。", "C. ピボット部門です。", "D. 正解 — やさしい解説 3-11 エ: バブルソートの説明。"]}, {"d": "med", "q": "Mô tả 「既に整列済みのデータ列の正しい位置に、データを追加する操作を繰り返していく方法」 là thuật toán nào?", "jp": "「整列済の列に正しい位置にデータを追加する」は何ソートか。", "opts": ["挿入ソート", "選択ソート", "クイックソート", "バブルソート"], "ans": 0, "details": ["A. Đúng — Yasashii解説 3-11 ア: 挿入ソートの説明.", "B. Là chọn min.", "C. Là pivot.", "D. Là đổi chỗ kề nhau."], "qJa": "「整列済の列に正しい位置にデータを追加する」は何ソートか。", "optsJa": ["挿入ソート", "選択ソート", "クイックソート", "バブルソート"], "whyJa": "", "detailsJa": ["A. 正しい — やさしい解説 3-11 A: インサートソートの説明。", "B. 最小選択です。", "C. ピボットです。", "D. 隣接する場所を交換することを意味します。"]}, {"d": "med", "q": "Mô tả 「データ中の最小値を求め、次にそれを除いた部分の中から最小値を求める。この操作を繰り返していく方法」 là thuật toán nào?", "jp": "「最小値を求めて除き、残りから最小値を求める」は何ソートか。", "opts": ["挿入ソート", "選択ソート", "クイックソート", "シェルソート"], "ans": 1, "details": ["A. Sai.", "B. Đúng — Yasashii解説 3-11 イ: 選択ソートの説明.", "C. Sai.", "D. Sai."], "qJa": "「最小値を求めて除き、残りから最小値を求める」は何ソートか。", "optsJa": ["挿入ソート", "選択ソート", "クイックソート", "シェルソート"], "whyJa": "", "detailsJa": ["A. 違います。", "B. 正解 — やさしい解説 3-11 イ: 選択ソートの説明。", "C. 違います。", "D. 違います。"]}, {"d": "med", "q": "クイックソート theo Yasashii dừng khi nào?", "jp": "クイックソートはいつ終了するか。", "opts": ["Khi mảng có đúng 1 phần tử", "Khi pivot bằng max", "Khi không thể chia tiếp được nữa (これ以上分割できない)", "Khi đã chạy 10 lần"], "ans": 2, "details": ["A. Sai — vẫn cần lặp đến tận cùng.", "B. Không có quy ước này.", "C. Đúng — Yasashii: 「『これ以上分割できない』というところまで手順を進めると数字が昇順に整列します」.", "D. Không có quy ước này."], "qJa": "クイックソートはいつ終了するか。", "optsJa": ["配列にちょうど 1 要素がある場合", "ピボットが最大値に等しい場合", "もう分割できないとき (これ以上分割できない)", "10を1回実行した場合"], "whyJa": "", "detailsJa": ["A. 不正解 — 最後まで繰り返す必要があります。", "B. そのような慣例はありません。", "C. はい — 教材「Yasashii」: 「『これ以上分割できない』というところまで手順を進むと数字が昇順に整列します。」", "D. そのような慣例はありません。"]}, {"d": "med", "q": "Khi sắp xếp [12, 3, 17, 5, 8, 14, 9, 2] giảm dần bằng シェルソート với khoảng = 4 (slide第3回), ta lấy ra các cặp phần tử cách nhau 4 vị trí. Cặp đầu tiên (vị trí 1 và 5) là?", "jp": "[12,3,17,5,8,14,9,2]を間隔4でシェルソート、最初の取り出しペアは。", "opts": ["[12, 8]", "[3, 14]", "[17, 9]", "[5, 2]"], "ans": 0, "details": ["A. Đúng — slide第3回 minh hoạ: vị trí 1=12, vị trí 5=8 → cặp [12, 8].", "B. Đó là cặp thứ 2 (vị trí 2 và 6).", "C. Đó là cặp thứ 3.", "D. Đó là cặp thứ 4."], "qJa": "整列 [12, 3, 17, 5, 8, 14, 9, 2] が間隔 = 4 (スライド第 3 回) でシェルソートずつ減少すると、 4 位置離れた要素。最初のペア (位置 1 と 5) は何ですか?", "optsJa": ["[12, 8]", "[3, 14]", "[17, 9]", "[5, 2]"], "whyJa": "", "detailsJa": ["A. 正解です。スライド第 3 回は、位置 1=12, 位置 5=8 → ペア [12, 8] を示しています。", "B. それは 2 番目のペア 2 (位置 2 と 6) です。", "C. それは 2 番目のペア 3. です", "D. それは 2 番目のペア 4. です"]}, {"d": "med", "q": "クイックソート với mảng [3,5,8,7,6,4,2,1,9], sau khi chia → [3,5,4,2,1] | 6 | [8,7,9]. Nhóm [8,7,9] với pivot=7 chia thành?", "jp": "[8,7,9]で pivot=7 のとき2グループは。", "opts": ["[8] và [9]", "[8,9] và rỗng", "Rỗng và [8,9]", "[8] và [7,9]"], "ans": 0, "details": ["A. Đúng — nhóm <7: rỗng... Chờ: thực ra <7=rỗng, >7={8,9}. Theo Yasashii ví dụ: nhóm 「7,8,9」chia tiếp được [7,8,9] sắp xếp ngay vì pivot=8 chia thành <8:{7} và >8:{9}. Phương án A đúng theo cách Yasashii minh hoạ kết quả cuối là [7,8,9].", "B. Sai theo cấu trúc Yasashii minh hoạ.", "C. Sai.", "D. Sai — pivot không nằm trong nhóm."], "qJa": "配列 [3,5,8,7,6,4,2,1,9] のクイックソート、分割後 → [3,5,4,2,1] | 6 | 【8,7,9】。グループ [8,7,9] を pivot=7 で分割しますか?", "optsJa": ["[8] および [9]", "[8,9] および空", "空および [8,9]", "[8] および [7,9]"], "whyJa": "", "detailsJa": ["A. 正解 — グループ &lt;7: 空です... ちょっと待ってください: 実際には &lt;7=空、&gt;7={8,9}。教材「Yasashii」さんの例によると、グループ「7,8,9」は、pivot=8で&lt;8:{7}と&gt;8:{9}に分割されるため、さらに[7,8,9]に分割できます。 Yasashii が最終結果 [7,8,9] を示しているように、選択肢 A は正しいです。", "B. やさしいさんの図解によると不正解。", "C. 違います。", "D. 不正解 — ピボットはグループにありません。"]}, {"d": "hard", "q": "Tại sao クイックソート lại được FE thường xuyên hỏi nhất theo Yasashii?", "jp": "なぜクイックソートが頻繁に出題されるか (Yasashii)。", "opts": ["Vì nó dễ lập trình nhất", "Vì nó là thuật toán cơ bản nhất", "Vì đề thi muốn người học nắm thuật toán nhanh (高速) thay vì thuật toán chậm", "Vì nó không cần điều kiện gì cả"], "ans": 2, "details": ["A. Không phải lý do Yasashii nêu.", "B. Ngược lại — nó là 改良型, không phải basic.", "C. Đúng — Yasashii: 「遅いアルゴリズムよりも、高速なアルゴリズムのほうを学んでもらいたいので、クイックソートを試験に出題するのだと思います」.", "D. Mọi thuật toán đều có điều kiện."], "qJa": "なぜクイックソートが頻繁に出題されるか (Yasashii)。", "optsJa": ["プログラムが一番簡単だから", "最も基本的なアルゴリズムなので", "この試験では、学習者が遅いアルゴリズムではなく、高速なアルゴリズムを理解することを望んでいるからです。", "条件なんていらないから"], "whyJa": "", "detailsJa": ["A. 教材「Yasashii」さんが言った理由ではありません。", "B. 逆に、それは基本ではなく改良型です。", "C. 正解 — 教材「Yasashii」: 「ゆっくりアルゴリズムよりも、高速なアルゴリズムのほうを読んでもらいたいので、クイックソートを試験できる課題だと思います。」", "D. すべてのアルゴリズムには条件があります。"]}, {"d": "hard", "q": "Một mảng có n phần tử. Khi n tăng gấp đôi, số thao tác của 基本3手法 (O(n²)) tăng khoảng bao nhiêu lần?", "jp": "基本3手法でデータが2倍になると処理量は何倍か。", "opts": ["2 lần", "4 lần", "log₂ 2 = 1 lần", "n lần"], "ans": 1, "details": ["A. Sai — đây là O(n).", "B. Đúng — (2n)² = 4n² → tăng 4 lần. Đây là điểm yếu của 基本3手法.", "C. Đó là O(log n).", "D. Sai."], "qJa": "基本3手法でデータが2倍になると処理量は何倍か。", "optsJa": ["2 回", "4 回", "log₂ 2 = 1 回", "n 回"], "whyJa": "", "detailsJa": ["A. 違います — これは O(n) です。", "B. 正解 — (2n)² = 4n² → 4 倍にします。これが基本3手法の弱点です。", "C. つまり O(log n) です。", "D. 違います。"]}, {"d": "hard", "q": "Bậc tổng quát của クイックソート là O(n log n). Với n=1024, số thao tác ước tính là khoảng:", "jp": "n=1024でクイックソートの処理量は約。", "opts": ["1024", "10240", "100", "1048576"], "ans": 1, "details": ["A. Đó là O(n).", "B. Đúng — n log₂ n = 1024 × 10 = 10240. So với O(n²)=1048576, クイックソート nhanh hơn ~100 lần.", "C. Sai.", "D. Đó là O(n²)."], "qJa": "n=1024でクイックソートの処理量は約。", "optsJa": ["1024", "10240", "100", "1048576"], "whyJa": "", "detailsJa": ["A. O(n)です。", "B. 正解 — n log₂ n = 1024 × 10 = 10240。O(n²)=1048576 と比較して、クイックソートは約 100 倍高速です。", "C. 違います。", "D. それは O(n²) です。"]}, {"d": "hard", "q": "Để sắp xếp mảng có 100 phần tử, ước tính số thao tác của 基本選択法 và クイックソート lần lượt là?", "jp": "100個のデータで基本選択法とクイックソートの処理量は約。", "opts": ["10000 và 700", "100 và 100", "10000 và 10000", "700 và 10000"], "ans": 0, "details": ["A. Đúng — 基本選択法 O(n²)=10000; クイックソート O(n log₂ n)=100×log₂100≒100×6.64≒664~700.", "B. Sai — không reflect độ phức tạp khác nhau.", "C. Sai.", "D. Đảo ngược."], "qJa": "100個のデータで基本選択法とクイックソートの処理量は約。", "optsJa": ["10000 および 700", "100 および 100", "10000 および 10000", "700 および 10000"], "whyJa": "", "detailsJa": ["A. 正しい — 基本選択法 O(n²)=10000; クイックソート O(n log₂ n)=100×log₂100≒100×6.64≒664~700.", "B. 不正解 — 異なる複雑さを反映していません。", "C. 違います。", "D. 逆。"]}, {"d": "hard", "q": "Trong tình huống mảng đã gần như sắp xếp, thuật toán nào trong số 基本3手法 hiệu quả NHẤT?", "jp": "ほぼ整列済の配列に最適な基本3手法は。", "opts": ["基本交換法 (バブル)", "基本選択法", "基本挿入法 (挿入ソート)", "Cả 3 đều như nhau"], "ans": 2, "details": ["A. Vẫn cần nhiều lần quét.", "B. Vẫn phải tìm min trên toàn bộ mỗi vòng.", "C. Đúng — insertion sort gần như O(n) cho dữ liệu gần sắp xếp vì mỗi phần tử chỉ cần ít so sánh để chèn đúng vị trí. Đây là kiến thức nâng cao bám sát ý đồ phân loại thuật toán.", "D. Khác nhau theo dữ liệu đầu vào."], "qJa": "ほぼ整列済の配列に最適な基本3手法は。", "optsJa": ["基本交換法 (バブル)", "基本選択法", "基本挿入法 (挿入ソート)", "3はどちらも同じです"], "whyJa": "", "detailsJa": ["A. それでも複数回のスキャンが必要です。", "B. ラウンド全体で最小値を見つける必要があります。", "C. 正解 — 各要素を正しい位置に挿入するために必要な比較は数回だけであるため、整列に近いデータの挿入ソートはほぼ O(n) です。これは、アルゴリズムによる分類の意図に厳密に従っている高度な知識です。", "D. 入力データにより異なります。"]}, {"d": "hard", "q": "Theo Yasashii, クイックソート có một bước quan trọng đầu tiên. Bước đó là gì?", "jp": "クイックソートの最初の手順は。", "opts": ["Sắp xếp mảng tăng dần trước", "Chọn 基準値 (pivot) — có thể ở bất kỳ vị trí nào", "Tìm max của mảng", "Đếm số phần tử"], "ans": 1, "details": ["A. Không cầ
