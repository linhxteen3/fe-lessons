ます。", "C. 正解 — 教材「Yasashii」 p.153: 「一般的なPCでは、キャッシュメモリの容量は主記憶装置の1%にも満たない」。", "D. 明らかに関連しています。"]}, {"d": "med", "q": "Yasashii 過去問 4-13: 「データ書込み命令を実行したときに、キャッシュメモリと主記憶の両方を書き換える方式」 là gì?", "jp": "「キャッシュと主記憶の両方を書き換える方式」は。", "opts": ["ライトスルー方式", "ライトバック方式", "メモリインタリーブ", "パイプライン方式"], "ans": 0, "details": ["A. Đúng — Yasashii解答 4-13: ライトスルー方式の説明.", "B. Đó là chỉ ghi cache trước.", "C. Khác kỹ thuật.", "D. Không liên quan."], "qJa": "教材「Yasashii」過去問 4-13: 「データ書込みコマンドを実行したとき、キャッシュメモリと主記憶の両方を書き換える方式」とは何ですか？", "optsJa": ["ライトスルー方式", "ライトバック方式", "メモリインタリーブ", "パイプライン方式"], "whyJa": "", "detailsJa": ["A. 正解です — やさしい解答 4-13: ライトスルー方式の説明。", "B. 最初にキャッシュを書き込むだけです。", "C. 技術的な違い。", "D. 関係ありません。"]}, {"d": "med", "q": "Yasashii 過去問 4-14: 「各バンクを並列にアクセスする」 là gì?", "jp": "「各バンクを並列にアクセスする」は。", "opts": ["キャッシュメモリ", "メモリインタリーブ", "ライトスルー", "ハーバードアーキテクチャ"], "ans": 1, "details": ["A. Cache khác cơ chế.", "B. Đúng — Yasashii解答 4-14: 「各バンクを並列にアクセス」 = メモリインタリーブ.", "C. Đó là write policy.", "D. Khác kiến trúc CPU."], "qJa": "教材「Yasashii」過去問 4-14: 「各バンクをボーダーにアクセスする」とは何ですか?", "optsJa": ["キャッシュメモリ", "メモリインタリーブ", "ライトスルー", "ハーバードアーキテクチャ"], "whyJa": "", "detailsJa": ["A. キャッシュの仕組みが異なります。", "B. 正解 — やさしい解答 4-14: 「各バンクをボーダーにアクセス」 = メモリインタリーブ。", "C. それは書き込みポリシーです。", "D. CPU アーキテクチャが異なります。"]}, {"d": "med", "q": "Vì sao DRAM cần リフレッシュ định kỳ?", "jp": "DRAMがリフレッシュを必要とする理由は。", "opts": ["Vì virus", "Vì tụ điện rò rỉ điện tích theo thời gian → data biến mất", "Vì luôn ghi đè data", "Vì OS yêu cầu"], "ans": 1, "details": ["A. Không liên quan.", "B. Đúng — slide 第6回: DRAM dùng コンデンサ (tụ điện), điện tích rò rỉ → cần refresh.", "C. Sai.", "D. Sai."], "qJa": "DRAMがリフレッシュを必要とする理由は。", "optsJa": ["ヴィウイルス", "時間が経つとコンデンサが電荷を漏らすため → データが消える", "常にデータを上書きするため", "OSが必要とするため"], "whyJa": "", "detailsJa": ["A. コン・リエン・クアン。", "B. 正解 — スライド第 6 回: DRAM はコンデンサ (コンデンサ) を使用しており、電荷が漏れるのでリフレッシュが必要です。", "C. 違います。", "D. 違います。"]}, {"d": "med", "q": "SRAM khác DRAM ở điểm nào theo slide第6回?", "jp": "SRAMとDRAMの違いで正しいのは。", "opts": ["SRAM dùng フリップフロップ, nhanh, đắt, dung lượng nhỏ; không cần refresh", "SRAM chậm hơn DRAM", "SRAM dùng cho 主記憶, DRAM cho cache", "SRAM lớn hơn DRAM"], "ans": 0, "details": ["A. Đúng — slide第6回 bảng so sánh: SRAM フリップフロップ・高速・高価・小容量・refresh不要 → cache.", "B. Ngược.", "C. Ngược.", "D. Ngược."], "qJa": "スライド第6回によると、SRAMはDRAMとどう違うのですか?", "optsJa": ["SRAM はフリップフロップを使用しており、高速、高価、小容量です。リフレッシュする必要はありません", "SRAM は DRAM より遅い", "メモリ用SRAM、キャッシュ用DRAM", "SRAM は DRAM より大きい"], "whyJa": "", "detailsJa": ["A. 正解 — スライド第6回比較表：SRAMフリップフロップ・高速・高価・小容量・リフレッシュ不要→キャッシュ。", "B. 逆。", "C. 逆。", "D. 逆。"]}, {"d": "med", "q": "Mục đích của 多段キャッシュ (multi-level cache) là gì?", "jp": "多段キャッシュの目的は。", "opts": ["Tăng dung lượng tối đa", "Giảm chi phí", "Đạt tốc độ cao hơn nữa bằng cách phân cấp L1/L2/L3", "Backup"], "ans": 2, "details": ["A. Không phải mục đích chính.", "B. Không phải mục đích chính.", "C. Đúng — Yasashii p.152: 「さらに細かく分類してさらなる高速化を図る」.", "D. Không liên quan."], "qJa": "多段キャッシュの目的は。", "optsJa": ["最大容量を増やす", "コストの削減", "L1/L2/L3階層化でさらなる高速化を実現", "バックアップ"], "whyJa": "", "detailsJa": ["A. 主な目的ではありません。", "B. 主な目的ではありません。", "C. 正解 — 教材「Yasashii」 p.152: 「さらに細かく分類してさらなる高速化を目指す」。", "D. 関係ありません。"]}, {"d": "med", "q": "Mức ヒット率 = 1.0 nghĩa là gì?", "jp": "ヒット率1.0の意味は。", "opts": ["Cache đầy", "Mọi truy cập của CPU đều có sẵn trong cache → không cần xuống 主記憶", "CPU bị lỗi", "Không có cache"], "ans": 1, "details": ["A. Không liên quan.", "B. Đúng — 100% hit, 0% miss. Thực tế không đạt được do dung lượng cache nhỏ.", "C. Sai.", "D. Sai."], "qJa": "ヒット率1.0の意味は。", "optsJa": ["キャッシュがいっぱいです", "すべての CPU アクセスはキャッシュで利用可能 → 主記憶をダウングレードする必要はありません", "CPUエラー", "キャッシュがありません"], "whyJa": "", "detailsJa": ["A. コン・リエン・クアン。", "B. 正解 — 100% がヒット、0% がミス。実際には、キャッシュ容量が小さいため、これを実現することはできません。", "C. 違います。", "D. 違います。"]}, {"d": "med", "q": "Một câu thi tả: 「半導体メモリのアクセス速度の向上は著しいが、CPUの処理速度の向上も著しいので、キャッシュメモリの必要性は減っていない」 — nhận định này ĐÚNG hay SAI? (Yasashii 解答 4-12)", "jp": "上記の記述は正しいか。", "opts": ["Đúng", "Sai", "Không thể đánh giá", "Đúng nửa"], "ans": 0, "details": ["A. Đúng — Yasashii解答 4-12 chính thức: cache vẫn cần thiết vì CPU tăng tốc nhanh, gap vẫn còn.", "B. Sai.", "C. Có thể đánh giá.", "D. Không có nửa đúng."], "qJa": "説明的な詩: 「半導体メモリのアクセス速度の向上は少ないが、CPU の処理速度の向上も少ないので、キャッシュメモリの必要性は減っていない」 — この文は TRUE ですか、それとも FALSE ですか? (教材「Yasashii」解答 4-12)", "optsJa": ["正しい", "誤り", "評価できません", "半分正解"], "whyJa": "", "detailsJa": ["A. 正解 — やさしい解答 公式 4-12: CPU の加速が速いため、キャッシュがまだ必要ですが、ギャップがまだ存在します。", "B. 違います。", "C. 評価可能。", "D. 半分も正しいものはありません。"]}, {"d": "med", "q": "ライトバック方式 nhanh hơn ライトスルー ở điểm nào?", "jp": "ライトバックがライトスルーより速い理由は。", "opts": ["Vì cache lớn hơn", "Vì không phải ghi xuống 主記憶 (chậm) mỗi lần CPU ghi", "Vì có nhiều cache hơn", "Vì không cần CPU"], "ans": 1, "details": ["A. Không liên quan.", "B. Đúng — Yasashii p.156: 「処理速度の遅い主記憶装置へのデータの書き込みを毎回行わなくてよいので、書き込み速度が速い」.", "C. Không phải lý do.", "D. Sai."], "qJa": "ライトバックがライトスルーより速い理由は。", "optsJa": ["キャッシュが大きいため", "CPU が書き込むたびに主記憶 (slow) を書き込む必要がないため", "キャッシュが多いため", "CPUを必要としないため"], "whyJa": "", "detailsJa": ["A. コン・リエン・クアン。", "B. 正解 — 教材「Yasashii」 p.156: 「処理速度の遅い主記憶装置へのデータの書き込みを毎回行わなくてよいので、書き込み速度が速い」。", "C. 理由ではありません。", "D. 違います。"]}, {"d": "med", "q": "Khi không có cache, mỗi truy cập tốn 600ns. Với cache (キャッシュ 20ns, 主記憶 600ns, hit 0.9) thì 実効 = ?", "jp": "キャッシュ20ns、主記憶600ns、ヒット率0.9の実効は。", "opts": ["78 ns", "100 ns", "300 ns", "620 ns"], "ans": 0, "details": ["A. Đúng — 20×0.9 + 600×0.1 = 18 + 60 = 78 ns. Giảm từ 600 → 78, tăng tốc ~7.7 lần.", "B. Sai.", "C. Sai.", "D. Đó là cộng dồn không có ý nghĩa."], "qJa": "キャッシュ20ns、主記憶600ns、ヒット率0.9の実効は。", "optsJa": ["78 ns", "100 ns", "300 ns", "620 ns"], "whyJa": "", "detailsJa": ["A. 正解です — 20×0.9 + 600×0.1 = 18 + 60 = 78 ns。 600 → 78, と減少すると、~7.7 倍の速度になります。", "B. 違います。", "C. 違います。", "D. それは無意味な蓄積です。"]}, {"d": "med", "q": "ヒット率 30% (rất thấp), キャッシュ 10ns, 主記憶 100ns. 実効アクセス時間?", "jp": "ヒット率30%のときの実効アクセス時間は。", "opts": ["27 ns", "73 ns", "55 ns", "100 ns"], "ans": 1, "details": ["A. Đó là khi hit cao.", "B. Đúng — 10×0.3 + 100×0.7 = 3 + 70 = 73 ns. Hit率 thấp làm cache gần như không hiệu quả.", "C. Đó là trung bình.", "D. Khi không có cache."], "qJa": "ヒット率 30% (非常に低い)、キャッシュ 10ns、主記憶 100ns。 実際に有効なアクセス時間?", "optsJa": ["27 ns", "73 ns", "55 ns", "100 ns"], "whyJa": "", "detailsJa": ["A. ヒット率が高いときです。", "B. 正解 — 10×0.3 + 100×0.7 = 3 + 70 = 73 ns。ヒット数が少ないと、キャッシュはほとんど効果がなくなります。", "C. それは平均的です。", "D. キャッシュがない場合。"]}, {"d": "hard", "q": "Khi nào ライトバック方式 ưu thế hơn ライトスルー rõ rệt?", "jp": "ライトバックが優位な場合は。", "opts": ["Khi cache nhỏ", "Khi cùng 1 ô cache bị ghi đè nhiều lần trước khi bị đẩy ra", "Khi không bao giờ ghi", "Khi 主記憶 nhanh hơn cache"], "ans": 1, "details": ["A. Không phải.", "B. Đúng — Nếu cùng địa chỉ ghi nhiều lần, write-back chỉ ghi xuống 主記憶 1 lần khi bị 追い出される; write-through ghi mỗi lần CPU ghi.", "C. Không hợp lý.", "D. Vô lý."], "qJa": "ライトバックが優位な場合は。", "optsJa": ["キャッシュが少ない場合", "同じ 1 キャッシュ セルが排出される前に複数回上書きされた場合", "録音されていないとき", "主記憶がキャッシュより速い場合"], "whyJa": "", "detailsJa": ["A. コン・パイ。", "B. 正解 — 同じアドレスが複数回記録される場合、ライトバックは追い出される場合にのみ主記憶 1 回を書き込みます。ライトスルーは、CPU が書き込むたびに書き込みます。", "C. 合理的ではありません。", "D. ナンセンス。"]}, {"d": "hard", "q": "Khi nào ライトスルー方式 hữu ích hơn ライトバック?", "jp": "ライトスルーが向く場合は。", "opts": ["Khi cần data cache LUÔN đồng bộ với 主記憶 (vd hệ thống đa CPU/DMA)", "Khi muốn tăng tốc tối đa", "Khi cache lớn", "Khi không có 主記憶"], "ans": 0, "details": ["A. Đúng — write-through giữ data trong 主記憶 luôn cập nhật, đơn giản hoá đồng bộ multi-core/DMA. (Mở rộng từ Yasashii: 「制御がシンプル」).", "B. Đó là write-back.", "C. Không liên quan.", "D. Vô lý."], "qJa": "ライトスルーが向く場合は。", "optsJa": ["データキャッシュが必要な場合は、常に主記憶と同期してください (例: マルチ CPU/DMA システム)", "加速を最大限に高めたいとき", "キャッシュが大きい場合", "主記憶がない場合"], "whyJa": "", "detailsJa": ["A. 正解 — ライトスルーは主記憶内のデータを最新の状態に保ち、マルチコア/DMA 同期を簡素化します。 (やさしい:「制御がシンプル」から拡張)。", "B. それはライトバックです。", "C. 関係ありません。", "D. ナンセンス。"]}, {"d": "hard", "q": "キャッシュ 5ns, 主記憶 100ns. Để 実効 ≤ 10 ns, ヒット率 tối thiểu phải là?", "jp": "キャッシュ5ns、主記憶100nsで実効10ns以下にするヒット率は。", "opts": ["≥ 0.95
