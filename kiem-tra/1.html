準シンボルがありません。", "(C) 誤: 10⁶ はメガ (M) です。", "(D) 誤: 10⁹ はギガ (G) です。"]}, {"d": "med", "q": "2 bit biểu diễn được bao nhiêu trạng thái khác nhau?", "jp": "2ビットで表すことができる状態の数はいくつか。", "opts": ["2", "4", "8", "16"], "ans": 1, "why": "Mỗi bit có 2 trạng thái. n bit → 2ⁿ trạng thái. 2 bit → 2² = 4 trạng thái: [00], [01], [10], [11].", "details": ["(A) Sai: 2 là số trạng thái của 1 bit (2¹).", "(C) Sai: 8 là số trạng thái của 3 bit (2³).", "(D) Sai: 16 là số trạng thái của 4 bit (2⁴)."], "ref": "ビットで表せる状態数", "qJa": "2ビットで表すことができる状態の数はいくつか。", "optsJa": ["2", "4", "8", "16"], "whyJa": "各ビットの状態は 2 です。 nビット→2ⁿ状態。 2 ビット → 2² = 4 状態: [00]、[01]、[10]、[11]。", "detailsJa": ["(A) 誤: 2 はビット 1 (2¹) の状態番号です。", "(C) 誤: 8 はビット 3 (2³) の状態番号です。", "(D) 誤: 16 はビット 4 (2⁴) の状態番号です。"]}, {"d": "med", "q": "4 bit biểu diễn được bao nhiêu trạng thái khác nhau?", "jp": "4ビットで表すことができる状態の数はいくつか。", "opts": ["4", "8", "16", "256"], "ans": 2, "why": "4 bit → 2⁴ = 16 trạng thái. Các trạng thái: 0000, 0001, …, 1111.", "details": ["(A) Sai: nhầm với số bit chính nó.", "(B) Sai: 8 là 2³ (3 bit).", "(D) Sai: 256 là 2⁸ (8 bit = 1 byte)."], "ref": "ビットで表せる状態数", "qJa": "4ビットで表すことができる状態の数はいくつか。", "optsJa": ["4", "8", "16", "256"], "whyJa": "4 ビット → 2⁴ = 16 状態。ステータス: 0000, 0001, …、1111.", "detailsJa": ["(A) 誤: ビット番号自体と混同されています。", "(B) 誤: 8 は 2³ (3 ビット) です。", "(D) 不正解: 256 は 2⁸ (8 ビット = 1 バイト)。"]}, {"d": "med", "q": "Trong hệ 16, ký hiệu \"D\" tương đương với số nào trong hệ 10?", "jp": "16進数の \"D\" は10進数でいくつか。", "opts": ["11", "12", "13", "14"], "ans": 2, "why": "Bảng đối chiếu: A=10, B=11, C=12, D=13, E=14, F=15. Vậy D=13.", "details": ["(A) Sai: 11 là B.", "(B) Sai: 12 là C.", "(D) Sai: 14 là E."], "ref": "16進数", "qJa": "16進数の \"D\" は10進数でいくつか。", "optsJa": ["11", "12", "13", "14"], "whyJa": "比較表: A=10, B=11, C=12, D=13, E=14, F=15. つまり D=13.", "detailsJa": ["(A) 誤: 11 は B です。", "(B) 誤: 12 は C です。", "(D) 誤: 14 は E です。"]}, {"d": "med", "q": "Trong hệ 2, số ngay sau \"1011\" là số nào?", "jp": "2進数で \"1011\" の次の数はいくつか。", "opts": ["1012", "1100", "1101", "10010"], "ans": 1, "why": "2進数 không có chữ số ≥2. 1011 + 1: hàng cuối 1+1=10 (carry); hàng tiếp 1+1=10 (carry); hàng tiếp 0+1=1, kết thúc → <b>1100<\/b>.", "details": ["(A) Sai: \"2\" không tồn tại trong 2進数.", "(C) Sai: 1101 = 1011 + 10 (binary) = +2.", "(D) Sai: 10010 quá xa, là 1011 + 111."], "ref": "2進数 đếm/桁上がり", "qJa": "2進数で \"1011\" の次の数はいくつか。", "optsJa": ["1012", "1100", "1101", "10010"], "whyJa": "2進数 桁なし ≥2. 1011 + 1: 最終行 1+1=10 (キャリー);次の行 1+1=10 (キャリー);次の行 0+1=1, 終了 → <b>1100<\/b>.", "detailsJa": ["(A) 誤：2進数に「2」は存在しません。", "(C) 不正解: 1101 = 1011 + 10 (バイナリ) = +2.", "(D) 誤: 10010 は遠すぎます。1011 + 111. です。"]}, {"d": "med", "q": "Trong hệ 16, số ngay sau \"F\" là số nào?", "jp": "16進数で \"F\" の次の数はいくつか。", "opts": ["G", "10", "11", "16"], "ans": 1, "why": "16進数 chỉ có ký hiệu đến F (=15). Sau F là nhảy hàng → \"10\" (= 10進数 16). Không có chữ số mới.", "details": ["(A) Sai: chữ G không có trong 16進数.", "(C) Sai: 11 là 2 bước sau F.", "(D) Sai: 16 là cách viết trong hệ 10, không phải hệ 16."], "ref": "16進数 đếm/桁上がり", "qJa": "16進数で \"F\" の次の数はいくつか。", "optsJa": ["G", "10", "11", "16"], "whyJa": "16進数はF(=15)までの記号のみとなります。 Fの後は行ジャンプ→「10」(=10進数16)です。新しい数字はありません。", "detailsJa": ["(A) 不正解: 16進数に文字Gがありません。", "(C) 誤: 11 は F の 1 つ後の 2 です。", "(D) 誤: 16 は、16. システムではなく、10, システムのスペルです。"]}, {"d": "med", "q": "1 MB bằng bao nhiêu byte?", "jp": "1MBは何バイトに相当するか。", "opts": ["10³ バイト", "10⁶ バイト", "10⁹ バイト", "10¹² バイト"], "ans": 1, "why": "メガ (M) = 10⁶ → 1 MB = 10⁶ byte = 100 万バイト.", "details": ["(A) Sai: 10³ = kB.", "(C) Sai: 10⁹ = GB.", "(D) Sai: 10¹² = TB."], "ref": "データの単位", "qJa": "1MBは何バイトに相当するか。", "optsJa": ["10³ バイト", "10⁶ バイト", "10⁹ バイト", "10¹² バイト"], "whyJa": "メガ (M) = 10⁶ → 1 MB = 10⁶ byte = 100 万バイト.", "detailsJa": ["(A) 不正解: 10³ = kB。", "(C) 不正解: 10⁹ = GB。", "(D) 不正解: 10¹² = TB。"]}, {"d": "med", "q": "Trọng số các hàng của 2進数 \"1101\" (từ TRÁI sang phải) là?", "jp": "2進数 \"1101\" の各桁の重みとして正しいのはどれか。(左の桁から)", "opts": ["1, 2, 4, 8", "8, 4, 2, 1", "2, 4, 8, 16", "0.5, 0.25, 0.125, 0.0625"], "ans": 1, "why": "Phần nguyên 2進数 từ trái sang phải: 2³, 2², 2¹, 2⁰ = 8, 4, 2, 1.", "details": ["(A) Sai: đảo ngược thứ tự (đọc từ phải sang trái).", "(C) Sai: bắt đầu từ 2¹ thay vì 2⁰.", "(D) Sai: đó là trọng số phần thập phân (2⁻¹, 2⁻², 2⁻³, 2⁻⁴)."], "ref": "桁の重み", "qJa": "2進数 \"1101\" の各桁の重みとして正しいのはどれか。(左の桁から)", "optsJa": ["1, 2, 4, 8", "8, 4, 2, 1", "2, 4, 8, 16", "0.5, 0.25, 0.125, 0.0625"], "whyJa": "整数部 2進数 左から右へ: 2³、2²、2¹、2⁰ = 8, 4, 2, 1.", "detailsJa": ["(A) 不正解: 逆の順序 (右から左に読みます)。", "(C) 不正解: 2⁰ ではなく、2¹ から始まります。", "(D) 不正解: 10 進数の重みです (2⁻¹、2⁻²、2⁻³、2⁻⁴)。"]}, {"d": "med", "q": "Số 1÷3 = 0.333… thuộc loại nào?", "jp": "1÷3 = 0.333... の数はどの種類の小数か。", "opts": ["有限小数", "循環小数", "Không phải số thập phân", "2進小数"], "ans": 1, "why": "Cụm \"3\" lặp lại vô hạn → 循環小数 (tuần hoàn). 循環小数 cũng là một dạng 無限小数.", "details": ["(A) Sai: phần thập phân vô hạn nên không phải hữu hạn.", "(C) Sai: 0.333… là số thập phân hợp lệ.", "(D) Sai: đây là 10進数 thập phân, không phải 2進小数."], "ref": "小数の種類", "qJa": "1÷3 = 0.333... の数はどの種類の小数か。", "optsJa": ["有限小数", "循環小数", "10 進数ではありません", "2進小数"], "whyJa": "「3」というフレーズが無限に繰り返されます→循環小数（circular）。 循環小数も無限小数の一種です。", "detailsJa": ["(A) 不正解: 小数部は無限大なので、有限ではありません。", "(C) 誤: 0.333… は有効な 10 進数です。", "(D) 不正解: これは 10 進数の 10 進数であり、2 進小数ではありません。"]}, {"d": "med", "q": "Số π = 3.14159265… thuộc loại nào?", "jp": "π = 3.14159265... はどの種類の小数か。", "opts": ["有限小数", "循環小数", "無限小数 (không tuần hoàn)", "Không phải số thập phân"], "ans": 2, "why": "π có phần thập phân vô hạn và KHÔNG có cụm số lặp đi lặp lại → 無限小数 (vô hạn, không tuần hoàn).", "details": ["(A) Sai: phần thập phân không có điểm dừng.", "(B) Sai: π không lặp lại cụm nào.", "(D) Sai: π là số thực, có biểu diễn thập phân."], "ref": "小数の種類", "qJa": "π = 3.14159265... はどの種類の小数か。", "optsJa": ["有限小数", "循環小数", "無限小数（循環なし）", "10 進数ではありません"], "whyJa": "π には無限小数部があり、繰り返し数クラスターはありません → 無限小数 (無限、非循環)。", "detailsJa": ["(A) 不正解: 小数部にストップがありません。", "(B) 不正解: π はクラスターを繰り返しません。", "(D) 誤: π は 10 進数で表現された実数です。"]}, {"d": "med", "q": "Dãy \"10010011\" gồm các số 0 và 1 được gọi là gì trong FE?", "jp": "\"10010011\" のように0と1で表された数値の並びを何と呼ぶか。", "opts": ["10進数表記", "ビット列 (ビットパターン)", "16進小数", "文字コード duy nhất"], "ans": 1, "why": "Sách Yasashii gọi rõ: dãy 0 và 1 nối tiếp = <b>ビット列<\/b> hay <b>ビットパターン<\/b>.", "details": ["(A) Sai: 10進数 chỉ dùng các chữ số 0–9 (không hạn chế ở 0/1).", "(C) Sai: 16進小数 phải có dấu chấm và ký hiệu 0–F.", "(D) Sai: 文字コード là sự ánh xạ chữ → dãy bit, không phải bản thân dãy."], "ref": "ビットパターン", "qJa": "\"10010011\" のように0と1で表された数値の並びを何と呼ぶか。", "optsJa": ["10進数表記", "ビット列 (ビットパターン)", "16進小数", "文字コード ユニーク"], "whyJa": "教材「Yasashii」本では、0 と 1 を連続して呼び出しています = <b>ビット列<\/b> いいですね <b>ビットパターン<\/b>.", "detailsJa": ["(A) 誤: 10 進数は、0 ～ 9 の数字のみを使用します (0/1 に限定されません)。", "(C) 誤: 16進小数にはピリオドと記号 0–F が必要です。", "(D) 誤: 文字コードは、シーケンスそのものではなく、リテラル マッピング → ビット シーケンスです。"]}, {"d": "med", "q": "Ký hiệu \"m\" (Milli) tương đương với lũy thừa nào của 10?", "jp": "単位 \"m\" (ミリ) は何を表すか。", "opts": ["10⁻¹", "10⁻²", "10⁻³", "10⁻⁶"], "ans": 2, "why": "Theo bảng đơn vị, ミリ (m) = 10⁻³ = 0.001 — cấp đầu tiên về phía nhỏ tính từ điểm gốc.", "details": ["(A) Sai: 10⁻¹ (=0.1) không có ký hiệu chuẩn ở dãy này.", "(B) Sai: 10⁻² (=0.01) không có ký hiệu chuẩn ở dãy này.", "(D) Sai: 10⁻⁶ là マイクロ (μ)."], "ref": "データの単位", "qJa": "記号「m」（ミリ）は、10の何乗に相当しますか？", "optsJa": ["10⁻¹", "10⁻²", "10⁻³", "10⁻⁶"], "whyJa": "単位表によると、ミリ (m) = 10⁻³ = 0.001 — 原点から小さい方の 1 度。", "detailsJa": ["(A) 誤: 10⁻¹ (=0.1) には、この範囲に標準シンボルがありません。", "(B) 誤: 10⁻² (=0.01) には、この範囲に標準シンボルがありません。", "(D) 誤: 10⁻⁶ はマイクロ (μ) です。"]}, {"d": "med", "q": "1 byte biểu diễn được bao nhiêu trạng thái khác nhau?", "jp": "1バイトで表すことのできる状態の数はいくつか。", "opts": ["8", "16", "128", "256"], "ans": 3, "why": "1 byte = 8 bit → 2⁸ = 256 trạng thái.", "details": ["(A) Sai: 8 là số bit, không phải số trạng thái.", "(B) Sai: 16 = 2⁴ (4 bit).", "(C) Sai: 128 = 2⁷ (7 bit)."], "ref": "バイトで表せる状態数", "qJa": "1バイトで表すことのできる状態の数はいくつか。", "optsJa": ["8", "16", "128", "256"], "whyJa": "1 バイト = 8 ビット → 2⁸ = 256 状態。", "detailsJa": ["(A) 不正解: 8 はビット番号であり、状態番号ではありません。", "(B) 不正解: 16 = 2⁴ (4 ビット)。", "(C) 不正解: 128 = 2⁷ (7 ビット)。"]}, {"d": "med", "q": "Trọng số của hàng thập phân thứ nhất (ngay sau dấu chấm) trong 2進数 là?", "jp": "2進数の小数点の右側、最初の桁の重みはいくつか。", "opts": ["0.1", "0.25", "0.5", "0.05"], "ans": 2, "why": "Hàng thập phân thứ nhất sau dấu chấm có trọng số 2⁻¹ = 1/2 = 0.5.", "details": ["(A) Sai: 0.1 là 10⁻¹ — trọng số trong 10進数.", "(B) Sai: 0.25 = 2⁻² là hàng thứ hai sau dấu chấm.", "(D) Sai: không có hàng nào có trọng số 0.05 trong 2進数."], "ref": "桁の重み", "qJa": "2進数の小数点の右側、最初の桁の重みはいくつか。", "optsJa": ["0.1", "0.25", "0.5", "0.05"], "whyJa": "ドット後の小数点第 1 位に重みが付きます 2⁻¹ = 1/2 = 0.5.", "detailsJa": ["(A) 不正解: 0.1 は 10⁻¹ — 10 進数の重量です。", "(B) 誤: 0.25 = 2⁻² はドットの後の 2 行目です。", "(D) 誤: 2 進数に重み 0.05 の行がありません。"]}, {"d": "med", "q": "Trong số \"38.45\", \"38\" và \"45\" tương ứng được gọi là gì?", "jp": "\"38.45\" の \"38\" と \"45\" の部分はそれぞれ何と呼ばれるか。", "opts": ["整数部 và 小数部", "小数部 và 整数部", "基数 và 小数点", "Phần thực và phần ảo"], "ans": 0, "why": "小数点 (.) chia số thành 2 phần: bên TRÁI là <b>整数部<\/b> (phần nguyên = 38), bên PHẢI là <b>小数部<\/b> (phần thập phân = 45).", "details": ["(B) Sai: thứ tự bị đảo.", "(C) Sai: 基数 là khái niệm cơ số (n), 小数点 là dấu chấm.", "(D) Sai: phần thực/ảo là khái niệm trong số phức, không phải số thập phân thông thường."], "ref": "整数部・小数部", "qJa": "\"38.45\" の \"38\" と \"45\" の部分はそれぞれ何と呼ばれるか。", "optsJa": ["整数部と小数部", "小数部と整数部", "基本数と小数点", "実数部と虚数部"], "whyJa": "小数点 (.) は数値を 2 の部分に分割します。左辺は <b>整数部<\/b> (整数部 = 38)、右側は <b>小数部<\/b> (小数部 = 45)。", "detailsJa": ["(B) 不正解: 順序が逆です。", "(C) 誤: 基数は基数 (n) の概念、小数点はドットです。", "(D) 不正解: 実数部/虚数部は複素数における概念であり、通常の 10 進数ではありません。"]}, {"d": "med", "q": "Lý do chính khiến máy tính dùng 2進数 để xử lý dữ liệu là?", "jp": "コンピュータが2進数で処理を行う理由として最も適切なのはどれか。", "opts": ["Hệ 2 ngắn gọn nhất khi viết", "Điện chỉ phân biệt được ON (1) / OFF (0)", "Vì IPA quy định", "Hệ 2 dễ học hơn hệ 10"], "ans": 1, "why": "Sách Yasashii và Slide 第1回 nêu rõ: máy tính dùng điện, mà điện chỉ có 2 trạng thái ON / OFF → ánh xạ thành 1 / 0. Đó là lý do dùng 2進数.", "details": ["(A) Sai: thật ra 2進数 viết DÀI hơn hệ 10 (10進 \"10\" = 2進 \"1010\").", "(C) Sai: nguyên do là kỹ thuật, không phải quy định.", "(D) Sai: không phải lý do thực sự."], "ref": "なぜ2進数を使うか", "qJa": "コンピュータが2進数で処理を行う理由として最も適切なのはどれか。", "optsJa": ["2 システムは最も簡潔に記述されます", "電気はON(1)/OFF(0)しか区別できません", "IPA規制のため", "2 システムは 10 システムよりも習得が簡単です"], "whyJa": "やさしいブックとスライド 第 1 回では、コンピューターは電気を使用しますが、電気には 2 の ON/OFF ステータスしかありません → 1 / 0. にマッピングされる これが、2 進数を使用する理由です。", "detailsJa": ["(A) 間違い: 実際には、2 進数は 10 システムよりも長く書かれています (10 進 \"10\" = 2 進 \"1010\")。", "(C) 不正解: 理由は技術的なものであり、規制上のものではありません。", "(D) 不正解: 本当の理由ではありません。"]}, {"d": "med", "q": "Vì sao cùng chữ \"あ\" nhưng mã trong Shift JIS và Unicode lại khác nhau?", "jp": "同じ文字 \"あ\" でも、Shift JIS と Unicode で値が異なるのはなぜか。", "opts": ["Máy tính cũ và mới khác nhau", "Mỗi 文字コード định nghĩa cách ánh xạ riêng chữ → dãy bit", "Shift JIS dùng 8進数, Unicode dùng 16進数", "Mã là số ngẫu nhiên"], "ans": 1, "why": "文字コード là bộ quy ước gán mỗi chữ thành 1 dãy bit. Mỗi bộ mã (Shift JIS, Unicode…) có quy ước riêng, nên cùng chữ vẫn có thể có dãy bit khác nhau.", "details": ["(A) Sai: không phải vấn đề tuổi của máy tính.", "(C) Sai: cả 2 bộ mã đều biểu diễn cuối cùng dưới dạng 2進数 trên máy.", "(D) Sai: mã không phải ngẫu nhiên — được quy ước chính thức."], "ref": "文字コード", "qJa": "同じ文字 \"あ\" でも、Shift JIS と Unicode で値が異なるのはなぜか。", "optsJa": ["古いコンピューターと新しいコンピューターは異なります", "各文字コードは文字→ビットシーケンスの独自のマッピングを定義します", "シフト JIS は 8 進数を使用し、Unicode は 16 進数を使用します", "コードは乱数です"], "whyJa": "文字コードは、各文字を 1 ビット シーケンスに割り当てる一連の規則です。各コード セット (シフト JIS、Unicode など) には独自の規則があるため、同じ文字でも異なるビット シーケンスを持つことができます。", "detailsJa": ["(A) 不正解: コンピューターの使用年数は関係ありません。", "(C) 不正解: 両方の 2 コード セットは、マシン上では最終的に 2 進数として表されます。", "(D) 不正解: コードはランダムではなく、慣例に従って形式化されています。"]}, {"d": "hard", "q": "Để phân biệt được 100 trạng thái khác nhau, tối thiểu cần bao nhiêu bit?", "jp": "100種類の状態を区別して表現するためには、最低何ビット必要か。", "opts": ["6 bit", "7 bit", "8 bit", "10 bit"], "ans": 1, "why": "n bit biểu diễn 2ⁿ trạng thái. Cần 2ⁿ ≥ 100. 2⁶ = 64 (chưa đủ), 2⁷ = 128 ≥ 100 (đủ). Vậy tối thiểu <b>7 bit<\/b>.", "details": ["(A) Sai: 2⁶ = 64 < 100, không đủ.", "(C) Sai: 8 bit (= 256) là dư, không phải \"tối thiểu\".", "(D) Sai: 10 bit (= 1024) càng dư hơn."], "ref": "ビット数の計算", "qJa": "100種類の状態を区別して表現するためには、最低何ビット必要か。", "optsJa": ["6 ビット", "7 ビット", "8 ビット", "10 ビット"], "whyJa": "n ビットは 2ⁿ 状態を表します。 2ⁿ ≥ 100. 2⁶ = 64 (不足)、2⁷ = 128 ≥ 100 (十分) が必要です。最低限なので <b>7 ビット<\/b>.", "detailsJa": ["(A) 不正解: 2⁶ = 64 &lt; 100, では不十分です。", "(C) 誤: 8 ビット (= 256) は冗長であり、「最小限」ではありません。", "(D) 誤: 10 ビット (= 1024) はより冗長です。"]}, {"d": "hard", "q": "1 GB bằng bao nhiêu bit?", "jp": "1GBは何ビットに相当するか。", "opts": ["10⁹ bit", "8 × 10⁹ bit", "10¹² bit", "8 × 10⁶ bit"], "ans": 1, "why": "1 GB = 10⁹ byte. 1 byte = 8 bit → 1 GB = 10⁹ × 8 = <b>8 × 10⁹ bit = 80 億ビット<\/b>.", "details": ["(A) Sai: thiếu hệ số ×8 cho việc đổi byte→bit.", "(C) Sai: 10¹² bit là cách tính nhầm (× 1000 thay vì ×8).", "(D) Sai: 8 × 10⁶ là 8 MB tính sang bit."], "ref": "単位換算", "qJa": "1GBは何ビットに相当するか。", "optsJa": ["10⁹ ビット", "8 × 10⁹ ビット", "10¹² ビット", "8 × 10⁶ ビット"], "whyJa": "1 GB = 10⁹ バイト。 1 バイト = 8 ビット → 1 GB = 10⁹ × 8 = <b>8 × 10⁹ bit = 80 億ビット<\/b>.", "detailsJa": ["(A) 誤: バイト→ビット変換の係数 ×8 が欠落しています。", "(C) 誤: 10¹² ビットは計算ミスです (×8 の代わりに×1000)。", "(D) 誤: 8 × 10⁶ は、ビット単位の 8 MB です。"]}, {"d": "hard", "q": "Số 2進数 \"1.1\" (= 1.1 trong hệ 2) tương đương số nào trong hệ 10?", "jp": "2進数で表現された \"1.1\" は10進数でいくつか。", "opts": ["1.1", "1.5", "1.25", "2.1"], "ans": 1, "why": "Phần nguyên: 1 × 2⁰ = 1. Phần thập phân: 1 × 2⁻¹ = 0.5. Tổng = <b>1.5<\/b>.", "details": ["(A) Sai: chỉ đúng nếu là hệ 10.", "(C) Sai: 1.25 = 2進 \"1.01\" (= 1 + 0.25).", "(D) Sai: 2.1 không khớp với cách tính trọng số."], "ref": "桁の重み (2進小数)", "qJa": "2進数で表現された \"1.1\" は10進数でいくつか。", "optsJa": ["1.1", "1.5", "1.25", "2.1"], "whyJa": "整数部：1 × 2⁰ = 1. 小数部：1 × 2⁻¹ = 0.5. 合計 = <b>1.5<\/b>.", "detailsJa": ["(A) 不正解: 10. システムの場合のみ正解", "(C) Sai: 1.25 = 2進 \"1.01\" (= 1 + 0.25).", "(D) 不正解: 2.1 は重量計算と一致しません。"]}, {"d": "hard", "q": "Trọng số các hàng của 2進小数 \"0.111\" (từ TRÁI sang phải, sau dấu chấm) là?", "jp": "2進小数 \"0.111\" の各桁の重みは、小数点の右から順にいくつか。", "opts": ["0.1, 0.01, 0.001", "0.5, 0.25, 0.125", "1, 0.5, 0.25", "2, 4, 8"], "ans": 1, "why": "Phần thập phân 2進: 2⁻¹ = 0.5; 2⁻² = 0.25; 2⁻³ = 0.125. Nên 3 hàng đầu sau dấu chấm: <b>0.5, 0.25, 0.125<\/b>.", "details": ["(A) Sai: đó là 10進数 (10⁻¹, 10⁻², 10⁻³).", "(C) Sai: bắt đầu từ 2⁰ (= 1) là phần nguyên, không phải phần thập phân.", "(D) Sai: đó là trọng số phần nguyên 2¹, 2², 2³."], "ref": "桁の重み (2進小数)", "qJa": "2進小数 \"0.111\" の各桁の重みは、小数点の右から順にいくつか。", "optsJa": ["0.1, 0.01, 0.001", "0.5, 0.25, 0.125", "1, 0.5, 0.25", "2, 4, 8"], "whyJa": "小数部 2進: 2⁻¹ = 0.5; 2⁻² = 0.25; 2⁻³ = 0.125. したがって、ドットの後の先頭の 3 は次のようになります。 <b>0.5, 0.25, 0.125<\/b>.", "detailsJa": ["(A) 不正解: 10進数(10⁻¹、10⁻²、10⁻³)です。", "(C) 誤: 2⁰ (= 1) から始まるのは、小数部ではなく整数部です。", "(D) 不正解: 整数の重み 2¹、2²、2³ です。"]}, {"d": "hard", "q": "Số 16進数 \"10\" tương đương với số nào trong hệ 10?", "jp": "16進数の \"10\" は10進数でいくつか。", "opts": ["10", "15", "16", "17"], "ans": 2, "why": "Trong 16進数: 1×16¹ + 0×16⁰ = 16. Theo bảng đối chiếu, sau F (=15) là \"10\" = 10進数 16.", "details": ["(A) Sai: đó là cách đọc theo hệ 10.", "(B) Sai: 15 = ký hiệu F.", "(D) Sai: 17 = 16進数 \"11\"."], "ref": "16進数 đọc giá trị", "qJa": "16進数の \"10\" は10進数でいくつか。", "optsJa": ["10", "15", "16", "17"], "whyJa": "16進数内: 1×16¹ + 0×16⁰ = 16. 比較表によると、F(=15)以降は「10」= 10進数 16.", "detailsJa": ["(A) 不正解: これは、10. システムに従った読み取り値です。", "(B) 誤: 15 = 記号 F。", "(D) Sai: 17 = 16進数 \"11\"."]}, {"d": "hard", "q": "Số 16進数 \"1F\" tương đương với số nào trong hệ 10?", "jp": "16進数の \"1F\" は10進数でいくつか。", "opts": ["19", "25", "31", "100"], "ans": 2, "why": "Áp dụng trọng số: 1 × 16¹ + F × 16⁰ = 16 + 15 = <b>31<\/b>.", "details": ["(A) Sai: nhầm \"1F\" → \"19\" (đọc F như chữ số 9).", "(B) Sai: kết quả không khớp với cách tính nào.", "(D) Sai: 100 quá lớn — 100 trong hệ 10 = 16進 \"64\"."], "ref": "16進数 đọc giá trị", "qJa": "16進数の \"1F\" は10進数でいくつか。", "optsJa": ["19", "25", "31", "100"], "whyJa": "ウェイトの適用: 1 × 16¹ + F × 16⁰ = 16 + 15 = <b>31<\/b>.", "detailsJa": ["(A) 誤: 「1F」→「19」の間違い (F を数字 9 と読みます)。", "(B) 不正解: 結果はどの計算方法にも一致しません。", "(D) 不正解: 100 は大きすぎます — システム 10 = 16 進「64」内の 100。"]}, {"d": "hard", "q": "3 bit có thể tạo ra bao nhiêu ビット列 (bit pattern) khác nhau?", "jp": "3ビットで表せるビット列の総数はいくつか。", "opts": ["4 cái", "6 cái", "8 cái", "16 cái"], "ans": 2, "why": "3 bit → 2³ = 8 patterns. Cụ thể: 000, 001, 010, 011, 100, 101, 110, 111 (theo Yasashii Ch.1 Lesson 01-01).", "details": ["(A) Sai: 4 là 2 bit.", "(B) Sai: 6 không phải lũy thừa của 2.", "(D) Sai: 16 là 4 bit."], "ref": "ビット数とパターン数", "qJa": "3ビットで表せるビット列の総数はいくつか。", "optsJa": ["4 作品", "6 作品", "8 作品", "16 作品"], "whyJa": "3 ビット → 2³ = 8 パターン。具体的には、000, 001, 010, 011, 100, 101, 110, 111 (やさしいCh.1 レッスン 01-01 による)。", "detailsJa": ["(A) 誤: 4 は 2 ビットです。", "(B) 不正解: 6 は 2. の累乗ではありません", "(D) 誤: 16 は 4 ビットです。"]}, {"d": "hard", "q": "10進数 \"10\" đọc là \"じゅう (juu)\". Vậy 2進数 \"(10)₂\" đọc đúng như thế nào?", "jp": "10進数の \"10\" は \"じゅう\" と読むが、2進数の \"10\"₂ の正しい読み方はどれか。", "opts": ["\"Mười\" (juu)", "\"Một không\" (いちぜろ ichi-zero)", "\"Hai\" (ni)", "\"じゅう\" như hệ 10"], "ans": 1, "why": "Sách Yasashii nêu rõ: dù viết giống nhau, 2進数 \"(10)₂\" đọc là <b>「いちぜろ」<\/b> để phân biệt với 10進数. Ghi cơ số dưới ngoặc giúp người đọc biết hệ nào.", "details": ["(A) Sai: \"mười\" là cách đọc của 10進数.", "(C) Sai: \"hai\" là giá trị, không phải cách đọc ký hiệu.", "(D) Sai: cùng cách đọc thì không phân biệt được hệ."], "ref": "数字の読み方", "qJa": "10進数の \"10\" は \"じゅう\" と読むが、2進数の \"10\"₂ の正しい読み方はどれか。", "optsJa": ["「十」（じゅう）", "「いちゼロ」", "「二」（に）", "「じゅう」様系 10"], "whyJa": "やさしい本には、同じように書いてありますが、2進数 \"(10)₂\"と読むと明記されています。 <b>「いちぜろ」<\/b> 10進数と区別するため、となります。括弧の下に基数を書くと、読者がどの系を知るのに役立ちます。", "detailsJa": ["(A) 誤：「十」は10進数の読みです。", "(C) 不正解: 「2」は数値であり、記号的な読み方ではありません。", "(D) 不正解: 同じ読み取り値では、システムを区別できません。"]}, {"d": "hard", "q": "Trong các số sau, số nào KHÔNG phải là 無限小数 (số vô hạn)?", "jp": "次の中で、無限小数に該当しないものはどれか。", "opts": ["π = 3.14159265…", "1 ÷ 7 = 0.142857142857…", "1 ÷ 3 = 0.333…", "0.625"], "ans": 3, "why": "0.625 có 3 chữ số sau dấu chấm và dừng → là 有限小数 (hữu hạn), không phải 無限小数.", "details": ["(A) Sai: π vô hạn, không tuần hoàn → vẫn là 無限小数.", "(B) Sai: 1÷7 vô hạn, có lặp → 循環小数 (cũng thuộc 無限小数).", "(C) Sai: 1÷3 vô hạn, có lặp → 循環小数."], "ref": "小数の種類", "qJa": "次の中で、無限小数に該当しないものはどれか。", "optsJa": ["π = 3.14159265…", "1 ÷ 7 = 0.142857142857…", "1 ÷ 3 = 0.333…", "0.625"], "whyJa": "0.625 のドットとストップの後に 3 の数字があります → は無限小数ではなく有限小数です。", "detailsJa": ["(A) 誤: π は無限、非循環 → は依然として無限小数です。", "(B) 誤: 1÷7 無限、繰り返し→循環小数 (無限小数にも属します)。", "(C) 誤: 1÷3 無限、繰り返し→循環小数。"]}, {"d": "hard", "q": "Hàng có trọng số \"32\" trong 2進数 tương ứng với lũy thừa nào của 2?", "jp": "2進数で重み \"32\" を持つ桁は、左から何桁目か(小数点を基準とする桁の重みは何か)。", "opts": ["2³", "2⁴", "2⁵", "2⁶"], "ans": 2, "why": "32 = 2 × 2 × 2 × 2 × 2 = 2⁵. Bảng trọng số: 1, 2, 4, 8, 16, <b>32<\/b>, 64, … (= 2⁰, 2¹, 2², 2³, 2⁴, 2⁵, 2⁶).", "details": ["(A) Sai: 2³ = 8.", "(B) Sai: 2⁴ = 16.", "(D) Sai: 2⁶ = 64."], "ref": "桁の重み", "qJa": "2進数で重みが32の桁は、2の何乗に対応するか。", "optsJa": ["2³", "2⁴", "2⁵", "2⁶"], "whyJa": "32 = 2 × 2 × 2 × 2 × 2 = 2⁵。重量表: 1, 2, 4, 8, 16, <b>32<\/b>, 64, … (= 2⁰, 2¹, 2², 2³, 2⁴, 2⁵, 2⁶).", "detailsJa": ["(A) 不正解: 2³ = 8.", "(B) 不正解: 2⁴ = 16.", "(D) 不正解: 2⁶ = 64."]}, {"d": "hard", "q": "So sánh giữa 1 GB và 1000 MB, quan hệ nào đúng?", "jp": "1 GB と 1000 MB の関係について正しいのはどれか。", "opts": ["1 GB > 1000 MB", "1 GB = 1000 MB", "1 GB < 1000 MB", "Không thể so sánh"], "ans": 1, "why": "1 GB = 10⁹ byte. 1000 MB = 1000 × 10⁶ = 10⁹ byte. Vậy <b>1 GB = 1000 MB<\/b>.", "details": ["(A) Sai: hai bên bằng nhau, không lớn hơn.", "(C) Sai: hai bên bằng nhau, không nhỏ hơn.", "(D) Sai: cùng đơn vị byte nên hoàn toàn so sánh được."], "ref": "単位換算", "qJa": "1 GB と 1000 MB の関係について正しいのはどれか。", "optsJa": ["1 GB &gt; 1000 MB", "1 GB = 1000 MB", "1 GB &lt; 1000 MB", "比較できません"], "whyJa": "1 GB = 10⁹ バイト。 1000 MB = 1000 × 10⁶ = 10⁹ バイト。それで <b>1 GB = 1000 MB<\/b>.", "detailsJa": ["(A) 不正解: 両辺は等しいですが、大きくはありません。", "(C) 不正解: 両辺は等しいですが、小さくはありません。", "(D) 不正解: 同じバイト単位なので完全に比較できます。"]}, {"d": "hard", "q": "Trong hệ 16, số ngay sau \"1F\" là số nào?", "jp": "16進数で \"1F\" の次の数はいくつか。", "opts": ["1G", "1A", "20", "200"], "ans": 2, "why": "1F (= 10進 31) + 1 = 10進 32 = 16進 <b>20<\/b>. Sau F là carry: hàng cuối F→0, hàng tiếp +1 → 1F → 20.", "details": ["(A) Sai: chữ G không tồn tại trong 16進数.", "(B) Sai: 1A = 10進 26, đi NGƯỢC lại.", "(D) Sai: 200 = 10進 512, nhảy quá xa."], "ref": "16進数 đếm/桁上がり", "qJa": "16進数で \"1F\" の次の数はいくつか。", "optsJa": ["1G", "1A", "20", "200"], "whyJa": "1F (= 10進 31) + 1 = 10進 32 = 16進 <b>20<\/b>。 F キャリー後：最終行 F→0, 次行 +1 → 1F → 20.", "detailsJa": ["(A) 不正解: 16進数には文字Gが存在しません。", "(B) 誤: 1A = 10 進 26, が REVERSE になります。", "(D) 誤: 200 = 10進 512, が飛びすぎました。"]}]</script>
