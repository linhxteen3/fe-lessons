  {"d": "med", "q": "Vì sao cùng chữ \"あ\" nhưng mã trong Shift JIS và Unicode lại khác nhau?", "jp": "同じ文字 \"あ\" でも、Shift JIS と Unicode で値が異なるのはなぜか。", "opts": ["Máy tính cũ và mới khác nhau", "Mỗi 文字コード định nghĩa cách ánh xạ riêng chữ → dãy bit", "Shift JIS dùng 8進数, Unicode dùng 16進数", "Mã là số ngẫu nhiên"], "ans": 1, "why": "文字コード là bộ quy ước gán mỗi chữ thành 1 dãy bit. Mỗi bộ mã (Shift JIS, Unicode…) có quy ước riêng, nên cùng chữ vẫn có thể có dãy bit khác nhau.", "details": ["(A) Sai: không phải vấn đề tuổi của máy tính.", "(C) Sai: cả 2 bộ mã đều biểu diễn cuối cùng dưới dạng 2進数 trên máy.", "(D) Sai: mã không phải ngẫu nhiên — được quy ước chính thức."], "ref": "文字コード"},
  {"d": "hard", "q": "Để phân biệt được 100 trạng thái khác nhau, tối thiểu cần bao nhiêu bit?", "jp": "100種類の状態を区別して表現するためには、最低何ビット必要か。", "opts": ["6 bit", "7 bit", "8 bit", "10 bit"], "ans": 1, "why": "n bit biểu diễn 2ⁿ trạng thái. Cần 2ⁿ ≥ 100. 2⁶ = 64 (chưa đủ), 2⁷ = 128 ≥ 100 (đủ). Vậy tối thiểu <b>7 bit<\/b>.", "details": ["(A) Sai: 2⁶ = 64 < 100, không đủ.", "(C) Sai: 8 bit (= 256) là dư, không phải \"tối thiểu\".", "(D) Sai: 10 bit (= 1024) càng dư hơn."], "ref": "ビット数の計算"},
  {"d": "hard", "q": "1 GB bằng bao nhiêu bit?", "jp": "1GBは何ビットに相当するか。", "opts": ["10⁹ bit", "8 × 10⁹ bit", "10¹² bit", "8 × 10⁶ bit"], "ans": 1, "why": "1 GB = 10⁹ byte. 1 byte = 8 bit → 1 GB = 10⁹ × 8 = <b>8 × 10⁹ bit = 80 億ビット<\/b>.", "details": ["(A) Sai: thiếu hệ số ×8 cho việc đổi byte→bit.", "(C) Sai: 10¹² bit là cách tính nhầm (× 1000 thay vì ×8).", "(D) Sai: 8 × 10⁶ là 8 MB tính sang bit."], "ref": "単位換算"},
  {"d": "hard", "q": "Số 2進数 \"1.1\" (= 1.1 trong hệ 2) tương đương số nào trong hệ 10?", "jp": "2進数で表現された \"1.1\" は10進数でいくつか。", "opts": ["1.1", "1.5", "1.25", "2.1"], "ans": 1, "why": "Phần nguyên: 1 × 2⁰ = 1. Phần thập phân: 1 × 2⁻¹ = 0.5. Tổng = <b>1.5<\/b>.", "details": ["(A) Sai: chỉ đúng nếu là hệ 10.", "(C) Sai: 1.25 = 2進 \"1.01\" (= 1 + 0.25).", "(D) Sai: 2.1 không khớp với cách tính trọng số."], "ref": "桁の重み (2進小数)"},
  {"d": "hard", "q": "Trọng số các hàng của 2進小数 \"0.111\" (từ TRÁI sang phải, sau dấu chấm) là?", "jp": "2進小数 \"0.111\" の各桁の重みは、小数点の右から順にいくつか。", "opts": ["0.1, 0.01, 0.001", "0.5, 0.25, 0.125", "1, 0.5, 0.25", "2, 4, 8"], "ans": 1, "why": "Phần thập phân 2進: 2⁻¹ = 0.5; 2⁻² = 0.25; 2⁻³ = 0.125. Nên 3 hàng đầu sau dấu chấm: <b>0.5, 0.25, 0.125<\/b>.", "details": ["(A) Sai: đó là 10進数 (10⁻¹, 10⁻², 10⁻³).", "(C) Sai: bắt đầu từ 2⁰ (= 1) là phần nguyên, không phải phần thập phân.", "(D) Sai: đó là trọng số phần nguyên 2¹, 2², 2³."], "ref": "桁の重み (2進小数)"},
  {"d": "hard", "q": "Số 16進数 \"10\" tương đương với số nào trong hệ 10?", "jp": "16進数の \"10\" は10進数でいくつか。", "opts": ["10", "15", "16", "17"], "ans": 2, "why": "Trong 16進数: 1×16¹ + 0×16⁰ = 16. Theo bảng đối chiếu, sau F (=15) là \"10\" = 10進数 16.", "details": ["(A) Sai: đó là cách đọc theo hệ 10.", "(B) Sai: 15 = ký hiệu F.", "(D) Sai: 17 = 16進数 \"11\"."], "ref": "16進数 đọc giá trị"},
  {"d": "hard", "q": "Số 16進数 \"1F\" tương đương với số nào trong hệ 10?", "jp": "16進数の \"1F\" は10進数でいくつか。", "opts": ["19", "25", "31", "100"], "ans": 2, "why": "Áp dụng trọng số: 1 × 16¹ + F × 16⁰ = 16 + 15 = <b>31<\/b>.", "details": ["(A) Sai: nhầm \"1F\" → \"19\" (đọc F như chữ số 9).", "(B) Sai: kết quả không khớp với cách tính nào.", "(D) Sai: 100 quá lớn — 100 trong hệ 10 = 16進 \"64\"."], "ref": "16進数 đọc giá trị"},
  {"d": "hard", "q": "3 bit có thể tạo ra bao nhiêu ビット列 (bit pattern) khác nhau?", "jp": "3ビットで表せるビット列の総数はいくつか。", "opts": ["4 cái", "6 cái", "8 cái", "16 cái"], "ans": 2, "why": "3 bit → 2³ = 8 patterns. Cụ thể: 000, 001, 010, 011, 100, 101, 110, 111 (theo Yasashii Ch.1 Lesson 01-01).", "details": ["(A) Sai: 4 là 2 bit.", "(B) Sai: 6 không phải lũy thừa của 2.", "(D) Sai: 16 là 4 bit."], "ref": "ビット数とパターン数"},
  {"d": "hard", "q": "10進数 \"10\" đọc là \"じゅう (juu)\". Vậy 2進数 \"(10)₂\" đọc đúng như thế nào?", "jp": "10進数の \"10\" は \"じゅう\" と読むが、2進数の \"10\"₂ の正しい読み方はどれか。", "opts": ["\"Mười\" (juu)", "\"Một không\" (いちぜろ ichi-zero)", "\"Hai\" (ni)", "\"じゅう\" như hệ 10"], "ans": 1, "why": "Sách Yasashii nêu rõ: dù viết giống nhau, 2進数 \"(10)₂\" đọc là <b>「いちぜろ」<\/b> để phân biệt với 10進数. Ghi cơ số dưới ngoặc giúp người đọc biết hệ nào.", "details": ["(A) Sai: \"mười\" là cách đọc của 10進数.", "(C) Sai: \"hai\" là giá trị, không phải cách đọc ký hiệu.", "(D) Sai: cùng cách đọc thì không phân biệt được hệ."], "ref": "数字の読み方"},
  {"d": "hard", "q": "Trong các số sau, số nào KHÔNG phải là 無限小数 (số vô hạn)?", "jp": "次の中で、無限小数に該当しないものはどれか。", "opts": ["π = 3.14159265…", "1 ÷ 7 = 0.142857142857…", "1 ÷ 3 = 0.333…", "0.625"], "ans": 3, "why": "0.625 có 3 chữ số sau dấu chấm và dừng → là 有限小数 (hữu hạn), không phải 無限小数.", "details": ["(A) Sai: π vô hạn, không tuần hoàn → vẫn là 無限小数.", "(B) Sai: 1÷7 vô hạn, có lặp → 循環小数 (cũng thuộc 無限小数).", "(C) Sai: 1÷3 vô hạn, có lặp → 循環小数."], "ref": "小数の種類"},
  {"d": "hard", "q": "Hàng có trọng số \"32\" trong 2進数 tương ứng với lũy thừa nào của 2?", "jp": "2進数で重み \"32\" を持つ桁は、左から何桁目か(小数点を基準とする桁の重みは何か)。", "opts": ["2³", "2⁴", "2⁵", "2⁶"], "ans": 2, "why": "32 = 2 × 2 × 2 × 2 × 2 = 2⁵. Bảng trọng số: 1, 2, 4, 8, 16, <b>32<\/b>, 64, … (= 2⁰, 2¹, 2², 2³, 2⁴, 2⁵, 2⁶).", "details": ["(A) Sai: 2³ = 8.", "(B) Sai: 2⁴ = 16.", "(D) Sai: 2⁶ = 64."], "ref": "桁の重み"},
  {"d": "hard", "q": "So sánh giữa 1 GB và 1000 MB, quan hệ nào đúng?", "jp": "1 GB と 1000 MB の関係について正しいのはどれか。", "opts": ["1 GB > 1000 MB", "1 GB = 1000 MB", "1 GB < 1000 MB", "Không thể so sánh"], "ans": 1, "why": "1 GB = 10⁹ byte. 1000 MB = 1000 × 10⁶ = 10⁹ byte. Vậy <b>1 GB = 1000 MB<\/b>.", "details": ["(A) Sai: hai bên bằng nhau, không lớn hơn.", "(C) Sai: hai bên bằng nhau, không nhỏ hơn.", "(D) Sai: cùng đơn vị byte nên hoàn toàn so sánh được."], "ref": "単位換算"},
  {"d": "hard", "q": "Trong hệ 16, số ngay sau \"1F\" là số nào?", "jp": "16進数で \"1F\" の次の数はいくつか。", "opts": ["1G", "1A", "20", "200"], "ans": 2, "why": "1F (= 10進 31) + 1 = 10進 32 = 16進 <b>20<\/b>. Sau F là carry: hàng cuối F→0, hàng tiếp +1 → 1F → 20.", "details": ["(A) Sai: chữ G không tồn tại trong 16進数.", "(B) Sai: 1A = 10進 26, đi NGƯỢC lại.", "(D) Sai: 200 = 10進 512, nhảy quá xa."], "ref": "16進数 đếm/桁上がり"}
]
