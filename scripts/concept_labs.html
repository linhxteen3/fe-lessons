<style>
.concept-lab{border-top:4px solid var(--primary,var(--accent))!important;min-width:0}.concept-lab .reading-ja{margin:0;padding:0;border:0}.concept-lab .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0}.concept-lab label{display:flex;flex-direction:column;gap:6px;max-width:100%}.concept-lab input,.concept-lab select,.concept-lab button{font:inherit;color:var(--text);background:var(--card-bg,var(--surface));border:1px solid var(--border,var(--line));border-radius:7px;padding:9px;max-width:100%;box-sizing:border-box}.concept-lab button{cursor:pointer}.concept-lab button:disabled{opacity:.45;cursor:default}.concept-lab :focus-visible{outline:3px solid var(--primary,var(--accent));outline-offset:2px}.concept-lab .scroll{overflow:auto;max-width:100%;margin:16px 0}.concept-lab table{border-collapse:collapse;min-width:350px;width:100%;font-size:14px}.concept-lab th,.concept-lab td{border:1px solid var(--border,var(--line));padding:10px;text-align:left}.concept-lab .note{padding:16px;background:var(--primary-light,var(--tint));border-radius:8px;line-height:1.8;margin:15px 0}.concept-lab .bits{display:flex;flex-wrap:wrap;gap:8px;font-family:monospace;font-size:16px}.concept-lab .net{background:var(--primary-light,var(--tint));text-decoration:underline}.concept-lab .host{border-bottom:2px dashed currentColor}.concept-lab pre{white-space:pre-wrap;overflow-wrap:anywhere}.concept-lab svg{width:100%;height:auto;max-height:260px}.concept-lab [data-error]{color:var(--danger,#dc2626)}.concept-lab .reading-vi,.concept-lab .reading-ja{white-space:normal}
</style>
<article class="card concept-lab" id="concept-lab" aria-labelledby="lesson-__LESSON__-simulation">
<h3 id="lesson-__LESSON__-simulation"></h3>
<div data-intro></div><div class="controls" data-inputs></div><p data-error role="alert"></p>
<div class="controls"><button type="button" data-action="prev"></button><button type="button" data-action="next"></button><button type="button" data-action="reset"></button></div>
<div data-result aria-live="polite" aria-atomic="true"></div>
<p data-source></p>
</article>
<script>
(()=>{
 'use strict';
 const n=__LESSON__,root=document.getElementById('concept-lab'),q=s=>root.querySelector(s);
 const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const tr=(v,j)=>`<span class="reading-vi" lang="vi">${esc(v)}</span><span class="reading-ja" lang="ja">${esc(j)}</span>`;
 const table=(heads,rows)=>`<div class="scroll" tabindex="0" role="region" aria-label="Bảng mô phỏng / シミュレーション表"><table><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 const label=(v,j,control)=>`<label>${tr(v,j)}${control}</label>`;
 let step=0,max=0,render,defaults;
 q('[data-action=prev]').innerHTML=tr('← Bước trước','← 前の段階');q('[data-action=next]').innerHTML=tr('Bước tiếp →','次の段階 →');q('[data-action=reset]').innerHTML=tr('↻ Làm lại','↻ 最初から');
 const note=(v,j)=>`<div class="note">${tr(v,j)}</div>`;
 function draw(){render();q('[data-action=prev]').disabled=step===0;q('[data-action=next]').disabled=step===max;root.dataset.step=step;}
 function setup(v,j,intro,ja,inputs,source){
  const titles={21:['Thử làm việc với bàn chỉ đủ ba tập giấy','体験：書類が3冊だけ置ける机'],31:['Thử tìm quầy bán hàng đạt yêu cầu','体験：条件を満たす売場を探す'],35:['Thử tìm nhóm địa chỉ của một máy tính','体験：PCのアドレス範囲を探す']};
  if(titles[n])[v,j]=titles[n];
  q('h3').innerHTML=tr(v,j);q('h3').dataset.vi=v;q('h3').dataset.ja=j;q('[data-intro]').innerHTML=note(intro,ja);q('[data-inputs]').innerHTML=inputs;q('[data-source]').innerHTML=tr('Ví dụ tự biên soạn theo nguồn đã ghi ở đầu bài. '+source,'冒頭の出典に基づく自作例。'+source);
 }
 if(n===21){
  setup('Thử trực tiếp: FIFO và LRU','体験：FIFOとLRU','Dự đoán: với 1,2,3,1,4 và 3 khung, trang nào bị đẩy ra ở lượt cuối? Bấm từng bước để đối chiếu.','予想：3枠に1,2,3,1,4を参照すると、最後にどのページが追い出されますか。',label('Chuỗi trang (0–99, tối đa 30)','参照列（0～99、最大30個）','<input id="refs" value="1,2,3,1,4,2,5,1,2,3,4,5">')+label('Số khung','枠数','<select id="frames"><option>3</option><option>4</option><option>2</option></select>')+'<button type="button" id="apply">'+tr('Áp dụng','適用')+'</button>','ichibanyashashi 第6章：ページ置換方式 / FE_JP ソフトウェア / FE_VN 2.2.5');
  let refs,capacity;
  defaults=()=>{q('#refs').value='1,2,3,1,4,2,5,1,2,3,4,5';q('#frames').value='3';refs=[1,2,3,1,4,2,5,1,2,3,4,5];capacity=3;max=refs.length;};
  q('#apply').onclick=()=>{const raw=q('#refs').value.trim();if(!/^\d{1,2}(?:[\s,]+\d{1,2})*$/.test(raw)||raw.split(/[\s,]+/).length>30){q('[data-error]').innerHTML=tr('Nhập 1–30 số nguyên từ 0 đến 99, ngăn bởi dấu phẩy hoặc khoảng trắng.','0～99の整数を1～30個、空白かカンマで区切って入力してください。');return;}refs=raw.split(/[\s,]+/).map(Number);capacity=Number(q('#frames').value);max=refs.length;step=0;q('[data-error]').textContent='';draw();};
  function run(policy){const slots=Array(capacity).fill(null),order=[];let faults=0;const rows=[];refs.slice(0,step).forEach((p,i)=>{const hit=slots.includes(p);let victim=null;if(!hit){faults++;let slot=slots.indexOf(null);if(slot<0){victim=order.shift();slot=slots.indexOf(victim);}slots[slot]=p;order.push(p);}else if(policy==='LRU'){order.splice(order.indexOf(p),1);order.push(p);}rows.push([i+1,p,slots.map(x=>x===null?'—':x).join(' | '),hit?'HIT':'FAULT',victim===null?'—':victim]);});return {faults,rows};}
  render=()=>{q('[data-result]').innerHTML=note(`Lượt ${step}/${max}. RAM ban đầu rỗng. HIT không nạp trang; FAULT nạp vào khung trống hoặc thay trang.`,`参照 ${step}/${max}。最初は空です。HITでは読込み不要、FAULTでは空き枠に読み込むか置換します。`)+['FIFO','LRU'].map(policy=>{const r=run(policy);return `<div data-policy="${policy}" data-faults="${r.faults}"><h4>${policy} · FAULT: ${r.faults}</h4>`+note(policy==='FIFO'?'Loại trang được nạp sớm nhất. HIT không đổi thứ tự nạp.':'Loại trang lâu không được tham chiếu nhất. Mỗi HIT làm trang đó trở thành vừa dùng.',policy==='FIFO'?'最初に読み込んだページを置換。HITでも読込み順は変わりません。':'最後の参照が最も古いページを置換。HITも最終参照を更新します。')+table(['#',tr('Trang','ページ'),tr('Các khung RAM','RAMの枠'),'HIT / FAULT',tr('Loại','追出し')],r.rows)+'</div>';}).join('');};
 }
 if(n===31){
  setup('Thử trực tiếp: SQL lọc dòng rồi lọc nhóm','体験：SQLの行選択とグループ選択','Dự đoán tổng nhóm A trước khi bấm tiếp. WHERE loại dòng trước khi tính SUM; HAVING xét tổng sau khi nhóm.','次へ進む前にAの合計を予想しましょう。WHEREは集計前の行、HAVINGは集計後のグループを選びます。',label('WHERE amount ≥','WHERE amount ≥','<select id="where"><option>150</option><option>0</option><option>350</option><option>500</option></select>')+label('HAVING SUM(amount) ≥','HAVING SUM(amount) ≥','<select id="having"><option>400</option><option>200</option><option>800</option></select>'),'ichibanyashashi 第9章 SQL / FE_JP Slide 138–145 / FE_VN GROUP BY・HAVING');
  const data=[[1,'A',100],[2,'A',200],[3,'B',300],[4,'B',400]];max=4;
  defaults=()=>{q('#where').value='150';q('#having').value='400';};
  render=()=>{const w=Number(q('#where').value),h=Number(q('#having').value),filtered=data.filter(r=>r[2]>=w),groups={};filtered.forEach(r=>groups[r[1]]=(groups[r[1]]||0)+r[2]);const grouped=Object.entries(groups),kept=grouped.filter(r=>r[1]>=h),names=['FROM','WHERE','GROUP BY','HAVING','SELECT'],rows=step===0?data:step===1?filtered:step===2?grouped:kept;const vi=['Đọc đủ 4 dòng nguồn.','Chỉ giữ từng dòng amount đạt điều kiện.','Gom các dòng còn lại theo dept và cộng amount. Nhóm không có dòng sẽ không xuất hiện.','Lọc các nhóm theo tổng vừa tính; không đưa lại các dòng đã bị WHERE loại.','Chọn dept và tổng để xuất kết quả. Không có ORDER BY nên thứ tự dòng không được bảo đảm.'],ja=['元の4行を読みます。','amountの条件を満たす行だけを残します。','残った行をdeptでまとめて合計します。行がないグループは作られません。','合計の条件でグループを選びます。WHEREで除いた行は戻りません。','deptと合計を出力します。ORDER BYがないため行順は保証されません。'];q('[data-result]').innerHTML=`<pre>SELECT dept, SUM(amount) AS total\nFROM sales\nWHERE amount &gt;= ${w}\nGROUP BY dept\nHAVING SUM(amount) &gt;= ${h};</pre><h4>${step+1}/5 · ${names[step]}</h4>`+note(vi[step],ja[step])+table(step<2?['id','dept','amount']:['dept','total'],rows)+note(`${rows.length} dòng ở bước này. Dữ liệu minh họa không chứa NULL.`, `この段階は${rows.length}行。例にはNULLを含めません。`);root.dataset.rows=rows.length;};
  q('#where').onchange=q('#having').onchange=()=>{step=0;draw();};
 }
 if(n===35){
  setup('Thử trực tiếp: nhìn các bit của subnet','体験：サブネットのビットを見る','Đổi prefix và dự đoán số host. Mô hình subnet IPv4 thông thường /0–/30: dành địa chỉ đầu cho mạng và cuối cho broadcast. /31 và /32 có quy tắc riêng, không thuộc mô hình này.','プレフィックスを変えてホスト数を予想しましょう。通常のIPv4サブネット /0～/30を扱い、先頭をネットワーク、末尾をブロードキャストに予約します。/31・/32の特例は対象外です。',label('Địa chỉ IPv4','IPv4アドレス','<input id="ip" value="192.168.1.130" inputmode="decimal">')+label('Prefix (0–30)','プレフィックス（0～30）','<input id="prefix" type="number" min="0" max="30" value="26">')+'<button id="apply" type="button">'+tr('Áp dụng','適用')+'</button>','ichibanyashashi 第10章 IP / FE_JP IPアドレスとサブネットマスク / FE_VN Mạng máy tính');
  let ip,prefix;max=3;defaults=()=>{q('#ip').value='192.168.1.130';q('#prefix').value='26';ip=[192,168,1,130];prefix=26;};
  q('#apply').onclick=()=>{const parts=q('#ip').value.trim().split('.'),p=q('#prefix').value;if(parts.length!==4||parts.some(x=>!/^\d{1,3}$/.test(x)||Number(x)>255)||!/^\d{1,2}$/.test(p)||Number(p)>30){q('[data-error]').innerHTML=tr('Cần 4 octet từ 0–255 và prefix nguyên 0–30.','0～255の4オクテットと、0～30の整数プレフィックスが必要です。');return;}ip=parts.map(Number);prefix=Number(p);step=0;q('[data-error]').textContent='';draw();};
  const dotted=value=>[24,16,8,0].map(s=>Math.floor(value/2**s)%256).join('.');
  const bits=(value,split)=>{const b=value.toString(2).padStart(32,'0');return '<div class="bits">'+[0,8,16,24].map(start=>'<span>'+[...b.slice(start,start+8)].map((c,i)=>`<span class="${start+i<split?'net':'host'}">${c}</span>`).join('')+'</span>').join('')+'</div>';};
  render=()=>{const value=ip.reduce((a,b)=>a*256+b,0),block=2**(32-prefix),net=Math.floor(value/block)*block,broadcast=net+block-1,mask=2**32-block;root.dataset.network=dotted(net);root.dataset.hosts=block-2;q('[data-result]').innerHTML=note(`Bước ${step+1}/4. Gạch liền/nền màu: ${prefix} bit mạng. Gạch đứt: ${32-prefix} bit host.`,`段階 ${step+1}/4。背景色と実線：ネットワーク${prefix}ビット。破線：ホスト${32-prefix}ビット。`)+`<h4>IP: ${ip.join('.')} /${prefix}</h4>`+bits(value,prefix)+(step>=1?`<h4>Mask: ${dotted(mask)}</h4>`+bits(mask,prefix):'')+(step>=2?`<h4>IP AND mask = ${dotted(net)}</h4>`+bits(net,prefix)+note('AND giữ bit IP nơi mask là 1, đưa bit host về 0.','ANDではマスクが1の位置を残し、ホスト部を0にします。'):'')+(step>=3?table([tr('Đại lượng','項目'),tr('Kết quả','結果')],[[tr('Mạng','ネットワーク'),dotted(net)],['Broadcast',dotted(broadcast)],[tr('Host dùng được','利用可能ホスト'),`${dotted(net+1)} → ${dotted(broadcast-1)}`],[tr('Số host','ホスト数'),`2^${32-prefix} − 2 = ${block-2}`]])+note(value===net||value===broadcast?'IP đã nhập là địa chỉ mạng hoặc broadcast, không cấp cho host trong mô hình này.':'IP đã nhập nằm trong dải host dùng được.',value===net||value===broadcast?'入力IPはネットワークまたはブロードキャストであり、このモデルではホストに割り当てません。':'入力IPは利用可能なホスト範囲内です。'):'');};
 }
 if(n===53){
  setup('Thử trực tiếp: đường găng thay đổi thế nào?','体験：クリティカルパスの変化','A xong thì B và C chạy song song; D chờ cả B lẫn C. Thử tăng C từ 2 lên 6 ngày rồi dự đoán ngày hoàn tất. Đây là sơ đồ công việc trên nút (AON), cùng quy tắc phụ thuộc như biểu đồ mũi tên trong sách.','Aの後でBとCを並行実行し、Dは両方の完了を待ちます。Cを2日から6日に変え、完了日を予想しましょう。作業を節点で示すAON図で、教材のアローダイアグラムと同じ依存関係を表します。',['A','B','C','D'].map((id,i)=>label(id+' (ngày)',id+'（日）',`<input type="number" id="duration-${id}" min="1" max="20" value="${[3,4,2,2][i]}">`)).join('')+'<button type="button" id="apply">'+tr('Tính lại','再計算')+'</button>','ichibanyashashi 第14章 工程管理 / FE_JP クリティカルパス / FE_VN Tính toán hướng tới・quay lui');
  let d;max=2;defaults=()=>{d=[3,4,2,2];['A','B','C','D'].forEach((id,i)=>q('#duration-'+id).value=d[i]);};
  q('#apply').onclick=()=>{const values=['A','B','C','D'].map(id=>q('#duration-'+id).value);if(values.some(v=>!/^\d{1,2}$/.test(v)||Number(v)<1||Number(v)>20)){q('[data-error]').innerHTML=tr('Mỗi thời lượng phải là số nguyên từ 1 đến 20 ngày.','各作業日数は1～20の整数で入力してください。');return;}d=values.map(Number);step=0;q('[data-error]').textContent='';draw();};
  render=()=>{const [a,b,c,z]=d,total=a+Math.max(b,c)+z,es=[0,a,a,a+Math.max(b,c)],ef=es.map((v,i)=>v+d[i]),lf=[a,total-z,total-z,total],ls=lf.map((v,i)=>v-d[i]),slack=ls.map((v,i)=>v-es[i]),critical=[];if(b>=c)critical.push('A → B → D');if(c>=b)critical.push('A → C → D');root.dataset.duration=total;root.dataset.critical=critical.join(' | ');const nodes=[['A',60,90],['B',240,30],['C',240,150],['D',420,90]];q('[data-result]').innerHTML=`<svg viewBox="0 0 540 230" role="img" aria-label="A → B,C → D"><defs><marker id="cp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#cp-arrow)"><path d="M140 110L240 50"/><path d="M140 110L240 170"/><path d="M320 50L420 110"/><path d="M320 170L420 110"/></g>${nodes.map(([id,x,y],i)=>`<rect x="${x}" y="${y}" width="80" height="45" rx="8" fill="var(--card-bg,var(--surface))" stroke="currentColor" stroke-width="${step===2 && slack[i]===0?4:1}"/><text x="${x+40}" y="${y+28}" text-anchor="middle" fill="currentColor">${step===2 && slack[i]===0?"★ ":""}${id}: ${d[i]}</text>`).join('')}</svg>`+note(step===0?'1/3 · Tính xuôi: ES lấy MAX thời điểm kết thúc các công việc trước; EF = ES + thời lượng. D phải chờ nhánh chậm hơn.':step===1?'2/3 · Tính ngược từ ngày hoàn tất: LF lấy MIN thời điểm bắt đầu muộn của các công việc sau; LS = LF − thời lượng.':'3/3 · Dự trữ = LS − ES. Công việc có dự trữ 0 thuộc đường găng. Hai nhánh bằng nhau có thể tạo hai đường găng.',step===0?'1/3 · 順方向：ESは先行作業のEFの最大値、EF = ES + 日数。Dは遅い方の枝を待ちます。':step===1?'2/3 · 完了日から逆方向：LFは後続作業のLSの最小値、LS = LF − 日数。':'3/3 · 余裕 = LS − ES。余裕0の作業がクリティカルです。枝が同じ長さならクリティカルパスは複数あります。')+table(['Task',tr('Ngày','日数'),'ES','EF',...(step>=1?['LS','LF']:[]),...(step>=2?[tr('Dự trữ','余裕')]:[])],['A','B','C','D'].map((id,i)=>[id,d[i],es[i],ef[i],...(step>=1?[ls[i],lf[i]]:[]),...(step>=2?[slack[i]]:[])]))+note(`Hoàn tất: ngày ${total}. ${step>=2?'Đường găng: '+critical.join(' / '):'So sánh hai đường: A–B–D = '+(a+b+z)+', A–C–D = '+(a+c+z)+'.'}`,`完了：${total}日目。${step>=2?'クリティカルパス：'+critical.join(' / '):'2経路を比較：A–B–D = '+(a+b+z)+'、A–C–D = '+(a+c+z)+'。'}`);};
 }
 q('[data-action=prev]').onclick=()=>{if(step>0)step--;draw();};q('[data-action=next]').onclick=()=>{if(step<max)step++;draw();};q('[data-action=reset]').onclick=()=>{defaults();step=0;q('[data-error]').textContent='';draw();};defaults();draw();
})();
</script>
